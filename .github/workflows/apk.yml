name: Gerar APK

# Roda quando o número em versao.txt muda (ou pelo botão "Run workflow" na aba Actions).
# Se ainda não existe uma versão com esse número, gera o APK e publica na aba Releases.
on:
  push:
    branches: [main]
    paths: ['versao.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \r\n' < versao.txt)"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "versao.txt deve ter o formato 1.2.3 (tem: '$V')"; exit 1; fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A versão v$V já existe. Para lançar outra, aumente o número em versao.txt."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "window.APP_VERSION = '$V';" > www/version.js
          echo "Versão $V (código $CODE)"

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        if: steps.v.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        if: steps.v.outputs.exists == 'false'
        run: npm install

      - name: Criar projeto Android
        if: steps.v.outputs.exists == 'false'
        run: npx cap add android

      - name: Instalador interno de atualizações
        if: steps.v.outputs.exists == 'false'
        run: |
          python3 android-recursos/nativo/aplicar.py
          cat android/app/src/main/AndroidManifest.xml

      - name: Versão, ícone e assinatura
        if: steps.v.outputs.exists == 'false'
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.v.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.v.outputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-recursos/icone/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done

      - name: Sincronizar
        if: steps.v.outputs.exists == 'false'
        run: npx cap sync android

      - name: Assinar com a chave do app
        if: steps.v.outputs.exists == 'false'
        run: |
          # Sem isto o Gradle cria uma chave nova a cada build e o Android recusa a atualização por cima.
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  caderno {
                      storeFile file("$rootDir/../android-recursos/assinatura.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.caderno }
              }
          }
          EOF
          tail -20 android/app/build.gradle

      - name: Compilar APK
        if: steps.v.outputs.exists == 'false'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Conferir a assinatura do APK
        if: steps.v.outputs.exists == 'false'
        run: |
          A=$(keytool -list -v -keystore android-recursos/assinatura.keystore -storepass android | grep 'SHA256:' | head -1 | awk '{print $2}')
          B=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "chave do app: $A"
          echo "chave do APK: $B"
          if [ -z "$A" ] || [ "$A" != "$B" ]; then echo "O APK não foi assinado com a chave do app. Nada será publicado."; exit 1; fi

      - name: Renomear APK
        if: steps.v.outputs.exists == 'false'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Caderno201-v${{ steps.v.outputs.version }}.apk"

      - name: Publicar na aba Releases
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Caderno 201 v${{ steps.v.outputs.version }}
          body: Baixe o arquivo .apk abaixo no celular e toque nele para instalar ou atualizar.
          files: Caderno201-v*.apk
          make_latest: true
