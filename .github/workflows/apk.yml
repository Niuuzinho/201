name: Gerar APK

# Roda quando você cria uma tag de versão (ex.: v1.0.1) ou pelo botão "Run workflow".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Definir versão
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "window.APP_VERSION = '$V';" > www/version.js
          echo "Versão $V (código $CODE)"

      - name: Instalar Capacitor
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Versão, ícone e assinatura
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.v.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.v.outputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-recursos/icone/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done
          mkdir -p ~/.android
          cp android-recursos/assinatura.keystore ~/.android/debug.keystore

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Caderno201-v${{ steps.v.outputs.version }}.apk"

      - name: Publicar na aba Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Caderno 201 v${{ steps.v.outputs.version }}
          files: Caderno201-v*.apk

      - name: Guardar APK de teste
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Caderno201-teste
          path: Caderno201-v*.apk
