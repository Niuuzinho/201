I). Objetivos (art. 11): proposta mais vantajosa (considerando o ciclo de vida do objeto), isonomia e justa competição , evitar sobrepreço e superfaturamento , incentivar a inovação e o desenvolvimento nacional sustentável . Princípios (art. 5): além do LIMPE: planejamento, transparência, segregação de funções, vinculação ao edital, julgamento objetivo, competitividade, celeridade, economicidade e desenvolvimento nacional sustentável , entre outros. Agentes: agente de contratação (servidor, conduz a licitação; no pregão, o pregoeiro ), comissão de contratação , autoridade competente , fiscais e gestores. A lei pede segregação de funções (quem pede não decide, não fiscaliza). Portal Nacional de Contratações Públicas (PNCP): divulgação obrigatória dos atos. A forma eletrônica é a regra. Fases (art. 17), em ordem Preparatória: planejamento, estudo técnico preliminar (ETP) , termo de referência , pesquisa de preços, matriz de riscos Divulgação do edital Apresentação de propostas e lances Julgamento Habilitação (como regra, depois do julgamento; pode vir antes, por decisão motivada) Recursal Homologação (autoridade confirma o procedimento e adjudica o objeto ao vencedor) Macete: \"Preparar, Divulgar, Propor, Julgar, Habilitar, Recorrer, Homologar\". A mudança de ordem em relação à lei antiga: o julgamento vem antes da habilitação . Modalidades (art. 28) Modalidade Quando usar Critério de julgamento Pregão Bens e serviços comuns (inclusive serviços comuns de engenharia) Menor preço ou maior desconto Concorrência Bens e serviços especiais, obras e serviços de engenharia Menor preço, maior desconto, melhor técnica, técnica e preço, maior retorno econômico Concurso Trabalho técnico, científico ou artístico Melhor técnica ou conteúdo artístico (prêmio) Leilão Venda de bens Maior lance Diálogo competitivo Contratações complexas ou inovadoras Definido após o diálogo com os licitantes Tomada de preços e convite não existem mais. É vedado criar outras modalidades ou combinar as existentes. Pregão não se usa para serviços técnicos especializados de natureza predominantemente intelectual nem para obras (salvo serviços comuns de engenharia). Modos de disputa: aberto, fechado ou combinados. Registro de preços (SRP): ata com validade de 1 ano, prorrogável por mais 1; qualquer órgão pode aderir (\"carona\") nos termos da lei. Instrumentos auxiliares: credenciamento, pré-qualificação, procedimento de manifestação de interesse, registro cadastral. Contratação direta Inexigibilidade (art. 74): a competição é inviável . Ex.: fornecedor exclusivo , artista consagrado , serviço técnico de notória especialização , credenciamento. Dispensa (art. 75): a competição é possível , mas a lei libera . Ex.: valores baixos (originalmente até R$ 100 mil para obras e engenharia e R$ 50 mil para os demais, atualizados todo ano por decreto), emergência , licitação deserta , fracassada (nova licitação com os mesmos termos), calamidade. Fracionamento ilegal da despesa para fugir da licitação é proibido (a lei exige somar os valores de mesmo objeto). Contratação direta indevida: o agente e o contratado respondem solidariamente pelo dano ao erário (e o contratado fica impedido). Fim do procedimento Revogação: por interesse público , com fato superveniente. Anulação (invalidação): por ilegalidade . Ambas exigem manifestação prévia dos interessados (contraditório). Desistência: a proposta vincula o licitante. Não manter a proposta sem motivo justo é infração punível. Recursos: em geral 3 dias úteis (pregão e concorrência), com pedido de reconsideração . Impugnação ao edital: por qualquer pessoa, até 3 dias úteis antes da abertura das propostas. Controle e sanções Controle (art. 169), 3 linhas de defesa: 1ª) servidores e agentes de contratação; 2ª) assessoria jurídica e controle interno do órgão; 3ª) órgão central de controle interno (CGU) e tribunal de contas . Sanções: advertência , multa , impedimento de licitar e contratar (até 3 anos, no ente que puniu) e declaração de inidoneidade (3 a 6 anos, em todos os entes). Aplicadas após processo com ampla defesa; a inidoneidade é de competência exclusiva da autoridade máxima do órgão ou entidade. Crimes em licitações passaram a constar do Código Penal (arts. 337-E a 337-P). Cai em prova: serviços comuns e bens comuns = pregão; obras e serviços especiais de engenharia = concorrência; venda de bens = leilão. Tomada de preços e convite foram extintos. A habilitação vem, em regra, depois do julgamento."}], "quiz": [{"q": "A UFBA, quanto à natureza jurídica, é:", "opts": ["Empresa pública", "Órgão da administração direta", "Autarquia federal", "Sociedade de economia mista"], "a": 2, "exp": "Universidades federais como a UFBA são autarquias: pessoas jurídicas de direito público criadas por lei."}, {"q": "O agente age dentro da sua competência, mas para atingir um fim diferente do previsto em lei. Isso é:", "opts": ["Excesso de poder", "Desvio de finalidade", "Poder discricionário", "Autotutela"], "a": 1, "exp": "Desvio de finalidade: competência certa, fim errado. Excesso: agir além da competência."}, {"q": "Qual modalidade de licitação NÃO existe mais na Lei 14.133?", "opts": ["Pregão", "Diálogo competitivo", "Tomada de preços", "Leilão"], "a": 2, "exp": "Tomada de preços e convite foram extintos. É vedado criar novas modalidades."}, {"q": "No pregão, o critério de julgamento é:", "opts": ["Melhor técnica", "Menor preço ou maior desconto", "Maior lance", "Técnica e preço"], "a": 1, "exp": "O pregão serve para bens e serviços comuns e julga por menor preço ou maior desconto."}, {"q": "A responsabilidade civil do Estado por danos causados por seus agentes é, em regra:", "opts": ["Subjetiva", "Objetiva", "Inexistente", "Só criminal"], "a": 1, "exp": "É objetiva (risco administrativo). O Estado depois cobra do agente se houve dolo ou culpa."}, {"q": "A prerrogativa que permite à Administração agir sem ir ao Judiciário é a:", "opts": ["Coercibilidade", "Autoexecutoriedade", "Discricionariedade", "Hierarquia"], "a": 1, "exp": "Autoexecutoriedade: executar a decisão diretamente, sem autorização judicial prévia."}, {"q": "A venda de bens públicos por licitação é feita na modalidade:", "opts": ["Pregão", "Concorrência", "Leilão", "Concurso"], "a": 2, "exp": "O leilão serve para alienar bens, com critério de maior lance."}, {"q": "Na Lei 14.133, como regra, a habilitação ocorre:", "opts": ["Antes do julgamento", "Depois do julgamento", "Só depois da homologação", "Junto com a divulgação do edital"], "a": 1, "exp": "A fase de julgamento vem antes da habilitação (que pode ser invertida por decisão motivada)."}, {"q": "Qual entidade é pessoa jurídica de direito privado, constituída sempre como S.A.?", "opts": ["Autarquia", "Empresa pública", "Sociedade de economia mista", "Fundação pública"], "a": 2, "exp": "A sociedade de economia mista tem forma de S.A. e maioria do capital votante público."}, {"q": "A contratação de artista consagrado, sem licitação, é caso de:", "opts": ["Dispensa", "Inexigibilidade", "Pregão", "Leilão"], "a": 1, "exp": "Inexigibilidade: a competição é inviável (artista consagrado, fornecedor exclusivo, notória especialização)."}, {"q": "Os atributos do poder de polícia são:", "opts": ["Hierarquia, disciplina e regulamento", "Discricionariedade, autoexecutoriedade e coercibilidade", "Legalidade, moralidade e publicidade", "Motivo, objeto e finalidade"], "a": 1, "exp": "Discricionariedade (em regra), autoexecutoriedade e coercibilidade."}, {"q": "São sanções previstas na Lei 14.133, EXCETO:", "opts": ["Advertência", "Multa", "Impedimento de licitar", "Prisão administrativa"], "a": 3, "exp": "As sanções são advertência, multa, impedimento de licitar e declaração de inidoneidade."}]}, {"id": "administracao", "nome": "Noções de Administração", "bloco": "Específico", "lead": "Estruturas, PODC, processos, qualidade e projetos. Decore as classificações: são as mais cobradas.", "topics": [{"num": "1", "title": "Estruturas organizacionais e departamentalização", "html": "<p>A <strong>organização formal<\/strong> é a do organograma (definida, oficial); a <strong>informal<\/strong> surge das relações entre as pessoas, sem constar no desenho oficial.<\/p>\n<h4>Elementos da estrutura<\/h4>\n<ul>\n<li><strong>Hierarquia<\/strong> (níveis de autoridade), <strong>amplitude de controle<\/strong> (quantos subordinados um chefe supervisiona), <strong>centralização × descentralização<\/strong> (onde se decide), <strong>divisão do trabalho<\/strong> e <strong>especialização<\/strong>.<\/li>\n<li><strong>Organograma:<\/strong> representa a estrutura formal. <strong>Fluxograma:<\/strong> o fluxo das atividades. <strong>Manual de organização:<\/strong> descreve atribuições.<\/li>\n<li><strong>Unidade de comando:<\/strong> cada pessoa tem um só chefe (Fayol).<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Estrutura<\/th>\n<th>Característica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Linear<\/td>\n<td>Hierarquia rígida; cada um tem um só chefe (unidade de comando)<\/td>\n<\/tr>\n<tr>\n<td>Funcional<\/td>\n<td>Especialistas mandam na sua área; subordinação a vários chefes<\/td>\n<\/tr>\n<tr>\n<td>Linha-staff<\/td>\n<td>A linha executa e decide; o staff só assessora (sem autoridade de comando)<\/td>\n<\/tr>\n<tr>\n<td>Matricial<\/td>\n<td>Dupla subordinação: chefe da função + chefe do projeto<\/td>\n<\/tr>\n<tr>\n<td>Por projetos<\/td>\n<td>Equipes temporárias montadas por projeto<\/td>\n<\/tr>\n<tr>\n<td>Em rede<\/td>\n<td>Unidades independentes ligadas por parcerias<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Tipos de organização:<\/strong> <strong>mecanicista<\/strong> (rígida, burocrática, ambiente estável) e <strong>orgânica<\/strong> (flexível, decisões descentralizadas, ambiente instável).<\/li>\n<li><strong>Cultura organizacional:<\/strong> valores, crenças e rituais compartilhados. <strong>Clima organizacional:<\/strong> a percepção dos membros sobre o ambiente de trabalho.<\/li>\n<\/ul>\n<h4>Departamentalização<\/h4>\n<p>É o critério para <strong>agrupar atividades<\/strong> em unidades.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Agrupa por<\/th>\n<th>Exemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Funcional<\/td>\n<td>Área de atividade<\/td>\n<td>RH, finanças, compras<\/td>\n<\/tr>\n<tr>\n<td>Por produto ou serviço<\/td>\n<td>O que se entrega<\/td>\n<td>Divisão de graduação, de pós<\/td>\n<\/tr>\n<tr>\n<td>Geográfica (territorial)<\/td>\n<td>Localização<\/td>\n<td>Campus, regional<\/td>\n<\/tr>\n<tr>\n<td>Por clientela<\/td>\n<td>Tipo de cliente<\/td>\n<td>Servidor, aluno, empresa<\/td>\n<\/tr>\n<tr>\n<td>Por processo<\/td>\n<td>Etapas de um fluxo<\/td>\n<td>Recepção, análise, entrega<\/td>\n<\/tr>\n<tr>\n<td>Por projeto<\/td>\n<td>Projetos temporários<\/td>\n<td>Equipe de obra<\/td>\n<\/tr>\n<tr>\n<td>Matricial<\/td>\n<td>Função e projeto ao mesmo tempo<\/td>\n<td>Projeto dentro de área<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> funcional = \"por <strong>que tarefa<\/strong>\"; por produto = \"por <strong>o quê<\/strong>\"; geográfica = \"por <strong>onde<\/strong>\"; clientela = \"para <strong>quem<\/strong>\".<\/p>\n<\/blockquote>", "text": "A organização formal é a do organograma (definida, oficial); a informal surge das relações entre as pessoas, sem constar no desenho oficial. Elementos da estrutura Hierarquia (níveis de autoridade), amplitude de controle (quantos subordinados um chefe supervisiona), centralização × descentralização (onde se decide), divisão do trabalho e especialização . Organograma: representa a estrutura formal. Fluxograma: o fluxo das atividades. Manual de organização: descreve atribuições. Unidade de comando: cada pessoa tem um só chefe (Fayol). Estrutura Característica Linear Hierarquia rígida; cada um tem um só chefe (unidade de comando) Funcional Especialistas mandam na sua área; subordinação a vários chefes Linha-staff A linha executa e decide; o staff só assessora (sem autoridade de comando) Matricial Dupla subordinação: chefe da função + chefe do projeto Por projetos Equipes temporárias montadas por projeto Em rede Unidades independentes ligadas por parcerias Tipos de organização: mecanicista (rígida, burocrática, ambiente estável) e orgânica (flexível, decisões descentralizadas, ambiente instável). Cultura organizacional: valores, crenças e rituais compartilhados. Clima organizacional: a percepção dos membros sobre o ambiente de trabalho. Departamentalização É o critério para agrupar atividades em unidades. Tipo Agrupa por Exemplo Funcional Área de atividade RH, finanças, compras Por produto ou serviço O que se entrega Divisão de graduação, de pós Geográfica (territorial) Localização Campus, regional Por clientela Tipo de cliente Servidor, aluno, empresa Por processo Etapas de um fluxo Recepção, análise, entrega Por projeto Projetos temporários Equipe de obra Matricial Função e projeto ao mesmo tempo Projeto dentro de área Macete: funcional = \"por que tarefa \"; por produto = \"por o quê \"; geográfica = \"por onde \"; clientela = \"para quem \"."}, {"num": "2", "title": "Processo organizacional", "html": "<p>O processo administrativo clássico tem 4 funções, o <strong>PODC<\/strong>:<\/p>\n<ul>\n<li><strong>Planejamento:<\/strong> define objetivos e como alcançá-los. <strong>Estratégico<\/strong> (longo prazo, cúpula, a organização toda), <strong>tático<\/strong> (médio prazo, gerência, por área) e <strong>operacional<\/strong> (curto prazo, execução, por tarefa). Ferramenta: análise <strong>SWOT/FOFA<\/strong> (forças, fraquezas, oportunidades e ameaças).<\/li>\n<li><strong>Organização:<\/strong> distribui tarefas, autoridade e recursos; define a estrutura.<\/li>\n<li><strong>Direção:<\/strong> lidera, comunica e motiva as pessoas, e coordena a execução.<\/li>\n<li><strong>Controle e avaliação:<\/strong> compara o resultado com o padrão e corrige desvios. Tipos: <strong>prévio, concomitante e posterior<\/strong>.<\/li>\n<li><strong>Missão<\/strong> (razão de ser), <strong>visão<\/strong> (o que quer ser) e <strong>valores<\/strong> (princípios) orientam o planejamento. <strong>Objetivo:<\/strong> onde se quer chegar; <strong>meta:<\/strong> objetivo quantificado e com prazo.<\/li>\n<li><strong>Eficiência:<\/strong> fazer certo, com bons recursos. <strong>Eficácia:<\/strong> atingir o resultado. <strong>Efetividade:<\/strong> impacto duradouro. No setor público, o princípio é o da <strong>eficiência<\/strong>.<\/li>\n<li><strong>Teorias clássicas:<\/strong> <strong>Taylor<\/strong> (administração científica: tempo e movimentos, foco na tarefa), <strong>Fayol<\/strong> (administração clássica: foco na estrutura; previsão, organização, comando, coordenação e controle), <strong>Weber<\/strong> (burocracia: impessoalidade, hierarquia, formalismo, profissionalização), <strong>Mayo<\/strong> (relações humanas).<\/li>\n<li><strong>Estilos de decisão:<\/strong> programadas (rotina) e não programadas (situações novas).<\/li>\n<\/ul>", "text": "O processo administrativo clássico tem 4 funções, o PODC : Planejamento: define objetivos e como alcançá-los. Estratégico (longo prazo, cúpula, a organização toda), tático (médio prazo, gerência, por área) e operacional (curto prazo, execução, por tarefa). Ferramenta: análise SWOT/FOFA (forças, fraquezas, oportunidades e ameaças). Organização: distribui tarefas, autoridade e recursos; define a estrutura. Direção: lidera, comunica e motiva as pessoas, e coordena a execução. Controle e avaliação: compara o resultado com o padrão e corrige desvios. Tipos: prévio, concomitante e posterior . Missão (razão de ser), visão (o que quer ser) e valores (princípios) orientam o planejamento. Objetivo: onde se quer chegar; meta: objetivo quantificado e com prazo. Eficiência: fazer certo, com bons recursos. Eficácia: atingir o resultado. Efetividade: impacto duradouro. No setor público, o princípio é o da eficiência . Teorias clássicas: Taylor (administração científica: tempo e movimentos, foco na tarefa), Fayol (administração clássica: foco na estrutura; previsão, organização, comando, coordenação e controle), Weber (burocracia: impessoalidade, hierarquia, formalismo, profissionalização), Mayo (relações humanas). Estilos de decisão: programadas (rotina) e não programadas (situações novas)."}, {"num": "3", "title": "Gestão de processos", "html": "<ul>\n<li><strong>Processo<\/strong> é um conjunto de atividades inter-relacionadas que <strong>transforma entradas em saídas de valor<\/strong> para o cliente. Tem entrada, transformação, saída, cliente, fornecedor e dono do processo.<\/li>\n<li><strong>Mapeamento:<\/strong> representa a situação atual (<strong>AS IS<\/strong>), desenha a ideal (<strong>TO BE<\/strong>) e implanta a melhoria.<\/li>\n<li><strong>Ferramentas:<\/strong> <strong>fluxograma<\/strong>, <strong>BPMN<\/strong> (notação padrão de modelagem), SIPOC (fornecedor, entrada, processo, saída, cliente), indicadores de desempenho.<\/li>\n<li><strong>Ciclo de vida (BPM):<\/strong> planejar, modelar, implantar, monitorar e otimizar.<\/li>\n<li><strong>Cadeia de valor:<\/strong> processos finalísticos (entregam valor ao cidadão) e de apoio (suportam).<\/li>\n<li><strong>Indicadores:<\/strong> de <strong>eficiência<\/strong>, <strong>eficácia<\/strong> e <strong>efetividade<\/strong>; <strong>metas<\/strong> e <strong>benchmarking<\/strong> (comparar-se com os melhores).<\/li>\n<\/ul>", "text": "Processo é um conjunto de atividades inter-relacionadas que transforma entradas em saídas de valor para o cliente. Tem entrada, transformação, saída, cliente, fornecedor e dono do processo. Mapeamento: representa a situação atual ( AS IS ), desenha a ideal ( TO BE ) e implanta a melhoria. Ferramentas: fluxograma , BPMN (notação padrão de modelagem), SIPOC (fornecedor, entrada, processo, saída, cliente), indicadores de desempenho. Ciclo de vida (BPM): planejar, modelar, implantar, monitorar e otimizar. Cadeia de valor: processos finalísticos (entregam valor ao cidadão) e de apoio (suportam). Indicadores: de eficiência , eficácia e efetividade ; metas e benchmarking (comparar-se com os melhores)."}, {"num": "4", "title": "Gestão da qualidade", "html": "<ul>\n<li><strong>PDCA:<\/strong> <strong>P<\/strong>lan (planejar), <strong>D<\/strong>o (executar), <strong>C<\/strong>heck (verificar), <strong>A<\/strong>ct (agir corretivamente). É um ciclo contínuo de melhoria (<strong>Deming<\/strong>).<\/li>\n<li><strong>Diagrama de Ishikawa<\/strong> (espinha de peixe, causa e efeito): organiza as causas de um problema (<strong>6M<\/strong>: método, mão de obra, máquina, material, meio ambiente, medida).<\/li>\n<li><strong>Pareto:<\/strong> 80% dos problemas vêm de 20% das causas; prioriza.<\/li>\n<li><strong>5W2H:<\/strong> What (o quê), Why (por quê), Where (onde), When (quando), Who (quem), How (como), How much (quanto custa). Serve para <strong>plano de ação<\/strong>.<\/li>\n<li><strong>5S:<\/strong> <strong>S<\/strong>eiri (utilização/descarte), <strong>S<\/strong>eiton (organização/ordenação), <strong>S<\/strong>eiso (limpeza), <strong>S<\/strong>eiketsu (padronização/saúde), <strong>S<\/strong>hitsuke (disciplina).<\/li>\n<li><strong>Outras ferramentas:<\/strong> histograma, diagrama de dispersão, gráfico de controle, folha de verificação, brainstorming e <strong>matriz GUT<\/strong> (gravidade, urgência, tendência).<\/li>\n<li><strong>Gurus:<\/strong> <strong>Deming<\/strong> (PDCA, 14 pontos), <strong>Juran<\/strong> (adequação ao uso, trilogia), <strong>Crosby<\/strong> (zero defeito), <strong>Ishikawa<\/strong> (círculos de controle da qualidade), <strong>Feigenbaum<\/strong> (controle total).<\/li>\n<li><strong>ISO 9001:<\/strong> norma de sistema de gestão da qualidade. <strong>Qualidade total (TQM):<\/strong> envolve toda a organização, foco no cliente.<\/li>\n<li><strong>Kaizen:<\/strong> melhoria contínua e gradual. <strong>Seis Sigma:<\/strong> reduz variações e defeitos.<\/li>\n<\/ul>", "text": "PDCA: P lan (planejar), D o (executar), C heck (verificar), A ct (agir corretivamente). É um ciclo contínuo de melhoria ( Deming ). Diagrama de Ishikawa (espinha de peixe, causa e efeito): organiza as causas de um problema ( 6M : método, mão de obra, máquina, material, meio ambiente, medida). Pareto: 80% dos problemas vêm de 20% das causas; prioriza. 5W2H: What (o quê), Why (por quê), Where (onde), When (quando), Who (quem), How (como), How much (quanto custa). Serve para plano de ação . 5S: S eiri (utilização/descarte), S eiton (organização/ordenação), S eiso (limpeza), S eiketsu (padronização/saúde), S hitsuke (disciplina). Outras ferramentas: histograma, diagrama de dispersão, gráfico de controle, folha de verificação, brainstorming e matriz GUT (gravidade, urgência, tendência). Gurus: Deming (PDCA, 14 pontos), Juran (adequação ao uso, trilogia), Crosby (zero defeito), Ishikawa (círculos de controle da qualidade), Feigenbaum (controle total). ISO 9001: norma de sistema de gestão da qualidade. Qualidade total (TQM): envolve toda a organização, foco no cliente. Kaizen: melhoria contínua e gradual. Seis Sigma: reduz variações e defeitos."}, {"num": "5", "title": "Gestão de projetos", "html": "<ul>\n<li><strong>Projeto<\/strong> é <strong>temporário<\/strong> e gera <strong>resultado único<\/strong>; <strong>operação<\/strong> é rotina contínua. Programa é um conjunto de projetos; <strong>portfólio<\/strong> reúne programas e projetos.<\/li>\n<li><strong>Grupos de processos (PMBOK):<\/strong> <strong>iniciação<\/strong>, <strong>planejamento<\/strong>, <strong>execução<\/strong>, <strong>monitoramento e controle<\/strong> e <strong>encerramento<\/strong>.<\/li>\n<li><strong>Restrição tripla:<\/strong> escopo, tempo e custo (afetam a <strong>qualidade<\/strong>). Também recursos e riscos.<\/li>\n<li><strong>Áreas de conhecimento:<\/strong> integração, escopo, cronograma, custos, qualidade, recursos, comunicações, riscos, aquisições e partes interessadas.<\/li>\n<li><strong>EAP (WBS):<\/strong> estrutura analítica do projeto, que decompõe o escopo em pacotes de trabalho. <strong>Cronograma visual:<\/strong> <strong>gráfico de Gantt<\/strong>; <strong>PERT/CPM<\/strong> mostram o caminho crítico (a sequência mais longa, que define o prazo).<\/li>\n<li><strong>Patrocinador<\/strong> financia e apoia; <strong>gerente de projeto<\/strong> é responsável por entregar; <strong>stakeholders<\/strong> são as partes interessadas.<\/li>\n<li><strong>Ágil (Scrum):<\/strong> entregas curtas (sprints), papéis de dono do produto, Scrum Master e equipe.<\/li>\n<\/ul>", "text": "Projeto é temporário e gera resultado único ; operação é rotina contínua. Programa é um conjunto de projetos; portfólio reúne programas e projetos. Grupos de processos (PMBOK): iniciação , planejamento , execução , monitoramento e controle e encerramento . Restrição tripla: escopo, tempo e custo (afetam a qualidade ). Também recursos e riscos. Áreas de conhecimento: integração, escopo, cronograma, custos, qualidade, recursos, comunicações, riscos, aquisições e partes interessadas. EAP (WBS): estrutura analítica do projeto, que decompõe o escopo em pacotes de trabalho. Cronograma visual: gráfico de Gantt ; PERT/CPM mostram o caminho crítico (a sequência mais longa, que define o prazo). Patrocinador financia e apoia; gerente de projeto é responsável por entregar; stakeholders são as partes interessadas. Ágil (Scrum): entregas curtas (sprints), papéis de dono do produto, Scrum Master e equipe."}], "quiz": [{"q": "No ciclo PDCA, a letra C corresponde a:", "opts": ["Controlar", "Corrigir", "Verificar (Check)", "Comunicar"], "a": 2, "exp": "Plan, Do, Check, Act: planejar, executar, verificar e agir corretivamente."}, {"q": "A estrutura organizacional com dupla subordinação (chefe da função e chefe do projeto) é a:", "opts": ["Linear", "Matricial", "Linha-staff", "Em rede"], "a": 1, "exp": "Na matricial, o funcionário responde à área funcional e ao projeto ao mesmo tempo."}, {"q": "O planejamento tático é feito:", "opts": ["Pela cúpula, a longo prazo", "Pela gerência, a médio prazo", "Pela execução, a curto prazo", "Por consultores externos"], "a": 1, "exp": "Estratégico: cúpula, longo prazo. Tático: gerência, médio prazo. Operacional: execução, curto prazo."}, {"q": "A ferramenta 5W2H serve principalmente para:", "opts": ["Mapear causas de um problema", "Montar um plano de ação", "Priorizar problemas pelo 80/20", "Organizar o ambiente de trabalho"], "a": 1, "exp": "5W2H detalha o que, por que, onde, quando, quem, como e quanto custa: é um plano de ação."}, {"q": "A departamentalização por clientela agrupa as atividades:", "opts": ["Pela área de atividade", "Pelo tipo de cliente atendido", "Pelo local", "Pelas etapas do processo"], "a": 1, "exp": "Por clientela: um departamento para cada tipo de cliente (ex.: aluno, servidor)."}, {"q": "Na ferramenta 5S, \"Seiso\" significa:", "opts": ["Descarte", "Organização", "Limpeza", "Disciplina"], "a": 2, "exp": "Seiri (descarte), Seiton (organização), Seiso (limpeza), Seiketsu (padronização), Shitsuke (disciplina)."}, {"q": "O diagrama que organiza as causas de um problema em \"espinha de peixe\" é o de:", "opts": ["Pareto", "Gantt", "Ishikawa", "PERT"], "a": 2, "exp": "Ishikawa (causa e efeito) organiza causas em categorias, como método e máquina."}, {"q": "Em gestão de projetos, o gráfico de Gantt serve para:", "opts": ["Mostrar causas de problemas", "Visualizar o cronograma", "Calcular o estoque", "Mapear riscos"], "a": 1, "exp": "Gantt é um cronograma visual de atividades ao longo do tempo."}, {"q": "A teoria da burocracia, com impessoalidade, hierarquia e formalismo, é de:", "opts": ["Taylor", "Fayol", "Weber", "Mayo"], "a": 2, "exp": "Weber descreveu a burocracia. Taylor: administração científica. Fayol: administração clássica."}]}, {"id": "gestao-pessoas", "nome": "Gestão de Pessoas", "bloco": "Específico", "lead": "Processos de gestão de pessoas e teorias de motivação e liderança. Teorias com nome de autor caem muito.", "topics": [{"num": "1", "title": "Conceitos e relação com outros sistemas", "html": "<ul>\n<li><strong>Evolução:<\/strong> de \"departamento pessoal\" (cumprir a lei e a folha) para <strong>gestão de pessoas<\/strong> e <strong>gestão estratégica de pessoas<\/strong>, em que as pessoas são <strong>parceiras e recurso estratégico<\/strong>, não só custo.<\/li>\n<li><strong>Capital humano:<\/strong> conhecimentos, habilidades e atitudes (<strong>CHA<\/strong>) da equipe. <strong>Competência<\/strong> = conhecimento + habilidade + atitude.<\/li>\n<li><strong>Relação com outros sistemas:<\/strong> a gestão de pessoas se articula com <strong>planejamento, finanças, tecnologia, comunicação, atendimento, orçamento<\/strong> e com todos os demais sistemas da organização; é de <strong>responsabilidade de linha<\/strong> (todos os gestores) e de <strong>função de staff<\/strong> (o órgão de RH apoia).<\/li>\n<li>No <strong>setor público<\/strong>, a gestão de pessoas segue a legislação (concurso, estabilidade, Lei 8.112, plano de cargos) e tem limites: o gestor nem sempre pode premiar ou demitir como no setor privado.<\/li>\n<li><strong>Política nacional de desenvolvimento de pessoas (PNDP):<\/strong> diretriz federal para capacitação por competências.<\/li>\n<\/ul>", "text": "Evolução: de \"departamento pessoal\" (cumprir a lei e a folha) para gestão de pessoas e gestão estratégica de pessoas , em que as pessoas são parceiras e recurso estratégico , não só custo. Capital humano: conhecimentos, habilidades e atitudes ( CHA ) da equipe. Competência = conhecimento + habilidade + atitude. Relação com outros sistemas: a gestão de pessoas se articula com planejamento, finanças, tecnologia, comunicação, atendimento, orçamento e com todos os demais sistemas da organização; é de responsabilidade de linha (todos os gestores) e de função de staff (o órgão de RH apoia). No setor público , a gestão de pessoas segue a legislação (concurso, estabilidade, Lei 8.112, plano de cargos) e tem limites: o gestor nem sempre pode premiar ou demitir como no setor privado. Política nacional de desenvolvimento de pessoas (PNDP): diretriz federal para capacitação por competências."}, {"num": "2", "title": "Função do órgão de gestão de pessoas", "html": "<p>Processos segundo <strong>Chiavenato<\/strong> (os seis):<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Processo<\/th>\n<th>O que inclui<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agregar<\/td>\n<td>Recrutamento e seleção<\/td>\n<\/tr>\n<tr>\n<td>Aplicar<\/td>\n<td>Desenho de cargos, avaliação de desempenho<\/td>\n<\/tr>\n<tr>\n<td>Recompensar<\/td>\n<td>Remuneração, incentivos e benefícios<\/td>\n<\/tr>\n<tr>\n<td>Desenvolver<\/td>\n<td>Treinamento, capacitação e desenvolvimento<\/td>\n<\/tr>\n<tr>\n<td>Manter<\/td>\n<td>Segurança, saúde, qualidade de vida, relações sindicais<\/td>\n<\/tr>\n<tr>\n<td>Monitorar<\/td>\n<td>Banco de dados e sistemas de informações gerenciais (no governo federal: SIAPE, SouGov)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Recrutamento:<\/strong> atrair candidatos (interno ou externo). <strong>Seleção:<\/strong> escolher entre os candidatos. No serviço público, o <strong>concurso<\/strong> faz as duas coisas, sem discricionariedade.<\/li>\n<li><strong>Avaliação de desempenho:<\/strong> mede a atuação do servidor. No setor público federal, é requisito para a <strong>estabilidade<\/strong> e para a <strong>progressão<\/strong>. Tipos: 360 graus, por objetivos, por competências.<\/li>\n<li><strong>Treinamento e desenvolvimento:<\/strong> <strong>levantamento de necessidades<\/strong> (LNT), programação, execução e avaliação.<\/li>\n<li><strong>Cargos:<\/strong> <strong>análise<\/strong> (levantar atribuições) e <strong>descrição<\/strong> de cargos. Qualidade de vida no trabalho (QVT) e <strong>clima organizacional<\/strong>.<\/li>\n<li><strong>Dimensionamento da força de trabalho<\/strong> adequa o número de pessoas às demandas.<\/li>\n<\/ul>", "text": "Processos segundo Chiavenato (os seis): Processo O que inclui Agregar Recrutamento e seleção Aplicar Desenho de cargos, avaliação de desempenho Recompensar Remuneração, incentivos e benefícios Desenvolver Treinamento, capacitação e desenvolvimento Manter Segurança, saúde, qualidade de vida, relações sindicais Monitorar Banco de dados e sistemas de informações gerenciais (no governo federal: SIAPE, SouGov) Recrutamento: atrair candidatos (interno ou externo). Seleção: escolher entre os candidatos. No serviço público, o concurso faz as duas coisas, sem discricionariedade. Avaliação de desempenho: mede a atuação do servidor. No setor público federal, é requisito para a estabilidade e para a progressão . Tipos: 360 graus, por objetivos, por competências. Treinamento e desenvolvimento: levantamento de necessidades (LNT), programação, execução e avaliação. Cargos: análise (levantar atribuições) e descrição de cargos. Qualidade de vida no trabalho (QVT) e clima organizacional . Dimensionamento da força de trabalho adequa o número de pessoas às demandas."}, {"num": "3", "title": "Comportamento organizacional (motivação e liderança)", "html": "<p>A relação entre indivíduo e organização é uma <strong>troca<\/strong>: a pessoa contribui e espera recompensas (<strong>contrato psicológico<\/strong>, expectativas não escritas).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Teoria de motivação<\/th>\n<th>Ideia central<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Maslow<\/td>\n<td>Pirâmide de necessidades: fisiológicas, segurança, sociais, estima, autorrealização<\/td>\n<\/tr>\n<tr>\n<td>Herzberg<\/td>\n<td>Dois fatores. <strong>Higiênicos<\/strong> (salário, ambiente) só evitam insatisfação; <strong>motivacionais<\/strong> (reconhecimento, responsabilidade) geram satisfação<\/td>\n<\/tr>\n<tr>\n<td>McGregor<\/td>\n<td>Teoria X: pessoas evitam trabalho e precisam de controle. Teoria Y: pessoas se motivam e assumem responsabilidade<\/td>\n<\/tr>\n<tr>\n<td>McClelland<\/td>\n<td>Necessidades de <strong>realização, poder e afiliação<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vroom<\/td>\n<td><strong>Expectativa:<\/strong> o esforço leva ao desempenho, que leva a uma recompensa valorizada<\/td>\n<\/tr>\n<tr>\n<td>Adams<\/td>\n<td><strong>Equidade:<\/strong> a pessoa compara o que dá e recebe com o que os outros recebem<\/td>\n<\/tr>\n<tr>\n<td>Alderfer<\/td>\n<td>ERG: existência, relacionamento e crescimento<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Motivação intrínseca<\/strong> (vem da própria atividade) × <strong>extrínseca<\/strong> (recompensas externas).<\/li>\n<\/ul>\n<h4>Liderança<\/h4>\n<ul>\n<li><strong>Estilos clássicos:<\/strong> <strong>autocrático<\/strong> (líder decide sozinho), <strong>democrático<\/strong> (decide com o grupo), <strong>liberal<\/strong> ou <em>laissez-faire<\/em> (grupo decide sozinho, o líder quase não interfere).<\/li>\n<li><strong>Situacional (Hersey-Blanchard):<\/strong> o estilo muda conforme a <strong>maturidade do liderado<\/strong>: <strong>determinar<\/strong> (dizer), <strong>persuadir<\/strong> (vender), <strong>compartilhar<\/strong> (participar), <strong>delegar<\/strong>.<\/li>\n<li><strong>Transacional<\/strong> troca recompensa por desempenho. <strong>Transformacional<\/strong> inspira, motiva e muda valores da equipe. <strong>Carismática<\/strong> envolve o magnetismo do líder.<\/li>\n<li><strong>Grid gerencial (Blake e Mouton):<\/strong> preocupação com <strong>pessoas<\/strong> × preocupação com <strong>produção<\/strong>.<\/li>\n<li><strong>Poder:<\/strong> legítimo (cargo), de recompensa, coercitivo, de especialista e de referência.<\/li>\n<li><strong>Chefe × líder:<\/strong> o chefe tem <strong>poder formal<\/strong>; o líder tem <strong>influência<\/strong> reconhecida pelo grupo.<\/li>\n<li><strong>Equipes de alto desempenho:<\/strong> objetivos comuns, confiança, comunicação aberta. <strong>Conflito<\/strong> pode ser funcional (produtivo) ou disfuncional. <strong>Resistência a mudanças<\/strong> é natural e se reduz com participação e comunicação.<\/li>\n<\/ul>", "text": "A relação entre indivíduo e organização é uma troca : a pessoa contribui e espera recompensas ( contrato psicológico , expectativas não escritas). Teoria de motivação Ideia central Maslow Pirâmide de necessidades: fisiológicas, segurança, sociais, estima, autorrealização Herzberg Dois fatores. Higiênicos (salário, ambiente) só evitam insatisfação; motivacionais (reconhecimento, responsabilidade) geram satisfação McGregor Teoria X: pessoas evitam trabalho e precisam de controle. Teoria Y: pessoas se motivam e assumem responsabilidade McClelland Necessidades de realização, poder e afiliação Vroom Expectativa: o esforço leva ao desempenho, que leva a uma recompensa valorizada Adams Equidade: a pessoa compara o que dá e recebe com o que os outros recebem Alderfer ERG: existência, relacionamento e crescimento Motivação intrínseca (vem da própria atividade) × extrínseca (recompensas externas). Liderança Estilos clássicos: autocrático (líder decide sozinho), democrático (decide com o grupo), liberal ou laissez-faire (grupo decide sozinho, o líder quase não interfere). Situacional (Hersey-Blanchard): o estilo muda conforme a maturidade do liderado : determinar (dizer), persuadir (vender), compartilhar (participar), delegar . Transacional troca recompensa por desempenho. Transformacional inspira, motiva e muda valores da equipe. Carismática envolve o magnetismo do líder. Grid gerencial (Blake e Mouton): preocupação com pessoas × preocupação com produção . Poder: legítimo (cargo), de recompensa, coercitivo, de especialista e de referência. Chefe × líder: o chefe tem poder formal ; o líder tem influência reconhecida pelo grupo. Equipes de alto desempenho: objetivos comuns, confiança, comunicação aberta. Conflito pode ser funcional (produtivo) ou disfuncional. Resistência a mudanças é natural e se reduz com participação e comunicação."}], "quiz": [{"q": "Para Herzberg, o salário é um fator:", "opts": ["Motivacional", "Higiênico", "De autorrealização", "De afiliação"], "a": 1, "exp": "Fatores higiênicos (salário, ambiente) só evitam insatisfação. Os motivacionais geram satisfação."}, {"q": "A Teoria Y de McGregor parte do pressuposto de que as pessoas:", "opts": ["Evitam o trabalho", "Precisam de controle rígido", "Se motivam e assumem responsabilidade", "Só trabalham por dinheiro"], "a": 2, "exp": "Teoria X: pessoas evitam trabalho. Teoria Y: pessoas se motivam e buscam responsabilidade."}, {"q": "Recrutamento e seleção pertencem a qual processo de gestão de pessoas?", "opts": ["Agregar", "Aplicar", "Manter", "Monitorar"], "a": 0, "exp": "Agregar = trazer pessoas para a organização (recrutar e selecionar)."}, {"q": "Na liderança situacional, o estilo do líder varia conforme:", "opts": ["O tamanho da equipe", "A maturidade do liderado", "O orçamento", "O cargo do líder"], "a": 1, "exp": "Hersey-Blanchard: determinar, persuadir, compartilhar ou delegar, conforme a maturidade."}, {"q": "Para Maslow, a necessidade de autorrealização está:", "opts": ["Na base da pirâmide", "No topo da pirâmide", "Entre segurança e fisiologia", "Fora da pirâmide"], "a": 1, "exp": "A autorrealização é o topo; fisiológicas na base, depois segurança, sociais, estima e autorrealização."}, {"q": "Treinamento e desenvolvimento pertencem a qual processo, segundo Chiavenato?", "opts": ["Agregar", "Recompensar", "Desenvolver", "Monitorar"], "a": 2, "exp": "Desenvolver: treinamento, capacitação e desenvolvimento das pessoas."}, {"q": "A liderança que troca recompensas por desempenho é a:", "opts": ["Transformacional", "Transacional", "Liberal", "Carismática"], "a": 1, "exp": "A transacional troca recompensa por resultado; a transformacional inspira mudança de valores."}, {"q": "Para McClelland, as necessidades motivadoras são:", "opts": ["Higiênicas e motivacionais", "Realização, poder e afiliação", "Fisiológicas e de segurança", "Existência e crescimento"], "a": 1, "exp": "McClelland: realização, poder e afiliação."}]}, {"id": "materiais", "nome": "Recursos Materiais", "bloco": "Específico", "lead": "Classificação, estoques, compras e armazenagem. Curva ABC e ponto de pedido são clássicos de prova.", "topics": [{"num": "1-2", "title": "Classificação de materiais", "html": "<p>Classificar é agrupar por características semelhantes, para facilitar o controle. Uma boa classificação é <strong>abrangente, flexível e prática<\/strong>, e <strong>evita duplicidade<\/strong> (um item só em um grupo).<\/p>\n<ul>\n<li><strong>Critérios:<\/strong> por <strong>demanda<\/strong> (de estoque ou não), <strong>criticidade<\/strong> (importância para a operação), <strong>perecibilidade<\/strong>, <strong>periculosidade<\/strong>, <strong>dificuldade de aquisição<\/strong>, possibilidade de <strong>fazer ou comprar<\/strong>, <strong>mercado fornecedor<\/strong>, uso (consumo ou permanente) e valor.<\/li>\n<li><strong>Catalogação:<\/strong> descrição <strong>padronizada<\/strong> e codificação de cada item. A <strong>codificação<\/strong> dá um código único. Identificar o item pelo <strong>código<\/strong> evita duplicidade e erro.<\/li>\n<li><strong>Curva ABC (por valor de consumo):<\/strong> <strong>A<\/strong> = poucos itens (cerca de 20%) que concentram a maior parte do valor (cerca de 80%); <strong>B<\/strong> = intermediário; <strong>C<\/strong> = muitos itens (cerca de 50%) de pouco valor. Itens A recebem controle rigoroso.<\/li>\n<li><strong>XYZ (por criticidade):<\/strong> <strong>Z<\/strong> = imprescindível, sem substituto; <strong>Y<\/strong> = importante, mas substituível; <strong>X<\/strong> = baixa criticidade.<\/li>\n<li><strong>Classificação:<\/strong> material de consumo, permanente, de reposição, matéria-prima, produto acabado, em processo.<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> \"A de Alto valor\" (poucos itens), \"C de Comum e barato\" (muitos itens). Em XYZ, <strong>Z<\/strong> é o de <strong>maior<\/strong> criticidade.<\/p>\n<\/blockquote>", "text": "Classificar é agrupar por características semelhantes, para facilitar o controle. Uma boa classificação é abrangente, flexível e prática , e evita duplicidade (um item só em um grupo). Critérios: por demanda (de estoque ou não), criticidade (importância para a operação), perecibilidade , periculosidade , dificuldade de aquisição , possibilidade de fazer ou comprar , mercado fornecedor , uso (consumo ou permanente) e valor. Catalogação: descrição padronizada e codificação de cada item. A codificação dá um código único. Identificar o item pelo código evita duplicidade e erro. Curva ABC (por valor de consumo): A = poucos itens (cerca de 20%) que concentram a maior parte do valor (cerca de 80%); B = intermediário; C = muitos itens (cerca de 50%) de pouco valor. Itens A recebem controle rigoroso. XYZ (por criticidade): Z = imprescindível, sem substituto; Y = importante, mas substituível; X = baixa criticidade. Classificação: material de consumo, permanente, de reposição, matéria-prima, produto acabado, em processo. Macete: \"A de Alto valor\" (poucos itens), \"C de Comum e barato\" (muitos itens). Em XYZ, Z é o de maior criticidade."}, {"num": "3", "title": "Gestão de estoques", "html": "<ul>\n<li><strong>Objetivo:<\/strong> equilibrar <strong>disponibilidade<\/strong> e <strong>custo<\/strong>: estoque alto imobiliza dinheiro; estoque baixo causa falta.<\/li>\n<li><strong>Estoque mínimo (ou de segurança):<\/strong> reserva contra atrasos e picos de consumo.<\/li>\n<li><strong>Ponto de pedido (ponto de reposição):<\/strong> consumo médio × tempo de reposição + estoque mínimo. Quando o estoque chega a esse nível, faz-se o pedido de compra.<\/li>\n<li><strong>Estoque máximo:<\/strong> estoque mínimo + lote de compra (nível a não ultrapassar).<\/li>\n<li><strong>Lote econômico de compra (LEC):<\/strong> quantidade que minimiza o custo total (pedir e manter).<\/li>\n<li><strong>Giro de estoque:<\/strong> consumo ÷ estoque médio. Quanto <strong>maior<\/strong>, melhor (o material não fica parado). <strong>Cobertura:<\/strong> tempo que o estoque dura.<\/li>\n<li><strong>Avaliação (valoração):<\/strong> <strong>PEPS<\/strong> (primeiro que entra, primeiro que sai), <strong>UEPS<\/strong> (último que entra, primeiro que sai; <strong>não aceito<\/strong> pela legislação fiscal brasileira), <strong>custo médio ponderado<\/strong>.<\/li>\n<li><strong>Inventário:<\/strong> conferência física das quantidades. <strong>Rotativo (cíclico)<\/strong> × <strong>geral<\/strong>.<\/li>\n<li><strong>Sistemas:<\/strong> <strong>Just in time<\/strong> (comprar só quando precisa, estoque perto de zero), <strong>MRP<\/strong> (planejamento de materiais pela demanda), <strong>sistema de duas gavetas<\/strong> (reserva na segunda gaveta).<\/li>\n<li><strong>Almoxarifado:<\/strong> local onde o material é recebido, guardado e distribuído.<\/li>\n<\/ul>", "text": "Objetivo: equilibrar disponibilidade e custo : estoque alto imobiliza dinheiro; estoque baixo causa falta. Estoque mínimo (ou de segurança): reserva contra atrasos e picos de consumo. Ponto de pedido (ponto de reposição): consumo médio × tempo de reposição + estoque mínimo. Quando o estoque chega a esse nível, faz-se o pedido de compra. Estoque máximo: estoque mínimo + lote de compra (nível a não ultrapassar). Lote econômico de compra (LEC): quantidade que minimiza o custo total (pedir e manter). Giro de estoque: consumo ÷ estoque médio. Quanto maior , melhor (o material não fica parado). Cobertura: tempo que o estoque dura. Avaliação (valoração): PEPS (primeiro que entra, primeiro que sai), UEPS (último que entra, primeiro que sai; não aceito pela legislação fiscal brasileira), custo médio ponderado . Inventário: conferência física das quantidades. Rotativo (cíclico) × geral . Sistemas: Just in time (comprar só quando precisa, estoque perto de zero), MRP (planejamento de materiais pela demanda), sistema de duas gavetas (reserva na segunda gaveta). Almoxarifado: local onde o material é recebido, guardado e distribuído."}, {"num": "4-6", "title": "Compras, modalidades de compra e cadastro de fornecedores", "html": "<ul>\n<li><strong>Compras<\/strong> são a aquisição de materiais e serviços. No setor público, seguem a <strong>Lei 14.133<\/strong> (licitação ou contratação direta; veja o item 7 do bloco de Direito Administrativo).<\/li>\n<li><strong>Etapas:<\/strong> <strong>requisição<\/strong> (necessidade), <strong>cotação/pesquisa de preços<\/strong>, <strong>seleção do fornecedor<\/strong>, <strong>pedido de compra ou contrato<\/strong>, <strong>acompanhamento<\/strong> (follow-up) e <strong>recebimento<\/strong>.<\/li>\n<li><strong>Tipos:<\/strong> <strong>centralizada<\/strong> (um setor compra para todos: ganho em escala e padronização) ou <strong>descentralizada<\/strong> (cada unidade compra: mais agilidade); <strong>normal<\/strong>, <strong>de urgência<\/strong> (emergencial); <strong>compras compartilhadas<\/strong> e <strong>registro de preços<\/strong>.<\/li>\n<li><strong>Cadastro de fornecedores:<\/strong> registra empresas habilitadas; no governo federal é o <strong>SICAF<\/strong> (Sistema de Cadastramento Unificado de Fornecedores). Classifica e avalia o histórico do fornecedor (qualidade, prazo, preço).<\/li>\n<li><strong>Avaliação de fornecedores:<\/strong> pontualidade, qualidade, preço e atendimento.<\/li>\n<li><strong>Pesquisa de preços:<\/strong> obrigatória no planejamento da contratação pública, com múltiplas fontes.<\/li>\n<\/ul>", "text": "Compras são a aquisição de materiais e serviços. No setor público, seguem a Lei 14.133 (licitação ou contratação direta; veja o item 7 do bloco de Direito Administrativo). Etapas: requisição (necessidade), cotação/pesquisa de preços , seleção do fornecedor , pedido de compra ou contrato , acompanhamento (follow-up) e recebimento . Tipos: centralizada (um setor compra para todos: ganho em escala e padronização) ou descentralizada (cada unidade compra: mais agilidade); normal , de urgência (emergencial); compras compartilhadas e registro de preços . Cadastro de fornecedores: registra empresas habilitadas; no governo federal é o SICAF (Sistema de Cadastramento Unificado de Fornecedores). Classifica e avalia o histórico do fornecedor (qualidade, prazo, preço). Avaliação de fornecedores: pontualidade, qualidade, preço e atendimento. Pesquisa de preços: obrigatória no planejamento da contratação pública, com múltiplas fontes."}, {"num": "7-10", "title": "Recebimento, entrada, conferência e armazenagem", "html": "<ul>\n<li><strong>Recebimento:<\/strong> confere se o que chegou é o que foi pedido. <strong>Provisório:<\/strong> confere quantidade e aspecto (embalagem). <strong>Definitivo:<\/strong> confere qualidade e especificação, e dá o <strong>aceite<\/strong>.<\/li>\n<li><strong>Entrada:<\/strong> registro no sistema com base na <strong>nota fiscal<\/strong> e na <strong>nota de empenho<\/strong>. Se houver divergência, <strong>recusa<\/strong> ou devolução, com registro.<\/li>\n<li><strong>Conferência:<\/strong> <strong>quantitativa<\/strong> (quanto chegou) e <strong>qualitativa<\/strong> (se está conforme o pedido e a especificação).<\/li>\n<li><strong>Armazenagem:<\/strong> localizar, guardar e proteger o material. <strong>Critérios:<\/strong> respeitar o <strong>PEPS<\/strong>; pesados embaixo; <strong>perigosos e inflamáveis separados<\/strong>; frágeis protegidos; itens de maior saída perto da porta; manter <strong>corredores livres<\/strong>; <strong>sinalizar<\/strong> e identificar.<\/li>\n<li><strong>Layout:<\/strong> deve minimizar a movimentação e ocupar bem o espaço.<\/li>\n<li><strong>Técnicas e equipamentos:<\/strong> carga unitária (<strong>paletes<\/strong>), estantes, <strong>porta-paletes<\/strong>, empilhadeiras, empilhamento, caixas e gavetas, prateleiras.<\/li>\n<li><strong>Segurança e conservação:<\/strong> controle de umidade, temperatura e pragas; prevenção de incêndio; <strong>sistema de endereçamento<\/strong> (localização).<\/li>\n<li><strong>Distribuição (saída):<\/strong> por <strong>requisição<\/strong> (pedido do setor), com registro e baixa no estoque.<\/li>\n<\/ul>", "text": "Recebimento: confere se o que chegou é o que foi pedido. Provisório: confere quantidade e aspecto (embalagem). Definitivo: confere qualidade e especificação, e dá o aceite . Entrada: registro no sistema com base na nota fiscal e na nota de empenho . Se houver divergência, recusa ou devolução, com registro. Conferência: quantitativa (quanto chegou) e qualitativa (se está conforme o pedido e a especificação). Armazenagem: localizar, guardar e proteger o material. Critérios: respeitar o PEPS ; pesados embaixo; perigosos e inflamáveis separados ; frágeis protegidos; itens de maior saída perto da porta; manter corredores livres ; sinalizar e identificar. Layout: deve minimizar a movimentação e ocupar bem o espaço. Técnicas e equipamentos: carga unitária ( paletes ), estantes, porta-paletes , empilhadeiras, empilhamento, caixas e gavetas, prateleiras. Segurança e conservação: controle de umidade, temperatura e pragas; prevenção de incêndio; sistema de endereçamento (localização). Distribuição (saída): por requisição (pedido do setor), com registro e baixa no estoque."}], "quiz": [{"q": "Na curva ABC, os itens da classe A são:", "opts": ["Muitos itens de pouco valor", "Poucos itens que concentram a maior parte do valor", "Itens sem substituto", "Itens perecíveis"], "a": 1, "exp": "Classe A: cerca de 20% dos itens e 80% do valor. Classe C: muitos itens de pouco valor."}, {"q": "O ponto de pedido é calculado por:", "opts": ["Estoque máximo − estoque mínimo", "Consumo médio × tempo de reposição + estoque mínimo", "Consumo ÷ estoque médio", "Estoque mínimo × 2"], "a": 1, "exp": "Quando o estoque cai a esse nível, faz-se o pedido de compra."}, {"q": "PEPS significa:", "opts": ["Primeiro que entra, primeiro que sai", "Primeiro que entra, por último que sai", "Preço de estoque por saída", "Pedido emergencial por solicitação"], "a": 0, "exp": "PEPS: o material mais antigo sai primeiro. UEPS: o último que entra sai primeiro."}, {"q": "No recebimento definitivo de material, verifica-se:", "opts": ["Apenas a quantidade", "Qualidade e especificação, com o aceite", "Somente a nota fiscal", "O preço de mercado"], "a": 1, "exp": "Provisório: quantidade e aspecto. Definitivo: qualidade, especificação e aceite."}, {"q": "O giro de estoque é calculado por:", "opts": ["Consumo ÷ estoque médio", "Estoque médio ÷ consumo", "Estoque máximo − mínimo", "Consumo × prazo"], "a": 0, "exp": "Giro = consumo ÷ estoque médio. Quanto maior, menos tempo o material fica parado."}, {"q": "No governo federal, o cadastro unificado de fornecedores é o:", "opts": ["SIAPE", "SICAF", "SEI", "SIAFI"], "a": 1, "exp": "SICAF: Sistema de Cadastramento Unificado de Fornecedores."}, {"q": "Na curva ABC, os itens de classe C são:", "opts": ["Poucos e de alto valor", "Muitos e de pouco valor", "Os mais críticos", "Os perecíveis"], "a": 1, "exp": "Classe C: grande quantidade de itens que representam pouco valor."}, {"q": "A conferência qualitativa verifica:", "opts": ["Quantidade de volumes", "Se o material está conforme a especificação do pedido", "O preço da nota", "O endereço de entrega"], "a": 1, "exp": "A conferência qualitativa confere qualidade e especificação; a quantitativa, a quantidade."}]}, {"id": "arquivologia", "nome": "Arquivologia", "bloco": "Específico", "lead": "A teoria das três idades e a tabela de temporalidade são o coração da matéria.", "topics": [{"num": "1", "title": "Conceitos fundamentais", "html": "<ul>\n<li><strong>Arquivo<\/strong> é o conjunto de documentos produzidos ou recebidos por um órgão ou pessoa, no exercício de suas atividades, em <strong>qualquer suporte<\/strong>, <strong>organicamente<\/strong> acumulados. <strong>Biblioteca<\/strong> reúne obras por interesse cultural; <strong>arquivo<\/strong> nasce da atividade do órgão. <strong>Museu<\/strong> reúne objetos. <strong>Documento<\/strong> é a informação registrada em um suporte.<\/li>\n<li><strong>Princípios arquivísticos:<\/strong><ul>\n<li><strong>Proveniência (respeito aos fundos):<\/strong> não misturar documentos de origens diferentes.<\/li>\n<li><strong>Organicidade:<\/strong> os documentos refletem a estrutura e as funções de quem os produziu.<\/li>\n<li><strong>Unicidade:<\/strong> cada documento é único no seu contexto, mesmo havendo cópias.<\/li>\n<li><strong>Indivisibilidade (integridade):<\/strong> o fundo não deve ser dividido. <strong>Cumulatividade:<\/strong> o arquivo cresce naturalmente.<\/li>\n<li><strong>Ordem original:<\/strong> manter a ordem dada na produção.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Funções arquivísticas:<\/strong> criação, classificação, avaliação, aquisição, conservação, difusão (descrição).<\/li>\n<li><strong>Classificação dos arquivos:<\/strong> quanto à <strong>entidade mantenedora<\/strong> (público, privado, institucional, familiar), à <strong>fase<\/strong> (corrente, intermediário, permanente), à <strong>natureza<\/strong> (especial: fotos, filmes; especializado: de uma área) e à <strong>extensão<\/strong> (setorial: do setor; central: de toda a organização).<\/li>\n<li><strong>Fundo:<\/strong> conjunto de documentos de uma entidade. <strong>Série:<\/strong> conjunto de documentos de mesma espécie ou assunto. <strong>Dossiê:<\/strong> conjunto de documentos de um mesmo assunto, reunidos para fim específico. <strong>Processo:<\/strong> conjunto de documentos que reúne ações e decisões.<\/li>\n<li><strong>Documento original, cópia e minuta.<\/strong> <strong>Documento de arquivo<\/strong> × documento comum: o primeiro nasce de uma atividade e tem <strong>valor probatório<\/strong>.<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> <strong>proveniência<\/strong> = não misturar fundos; <strong>organicidade<\/strong> = reflete a estrutura do produtor; <strong>unicidade<\/strong> = cada documento é único em seu contexto; <strong>indivisibilidade<\/strong> = não dividir o fundo.<\/p>\n<\/blockquote>", "text": "Arquivo é o conjunto de documentos produzidos ou recebidos por um órgão ou pessoa, no exercício de suas atividades, em qualquer suporte , organicamente acumulados. Biblioteca reúne obras por interesse cultural; arquivo nasce da atividade do órgão. Museu reúne objetos. Documento é a informação registrada em um suporte. Princípios arquivísticos: Proveniência (respeito aos fundos): não misturar documentos de origens diferentes. Organicidade: os documentos refletem a estrutura e as funções de quem os produziu. Unicidade: cada documento é único no seu contexto, mesmo havendo cópias. Indivisibilidade (integridade): o fundo não deve ser dividido. Cumulatividade: o arquivo cresce naturalmente. Ordem original: manter a ordem dada na produção. Funções arquivísticas: criação, classificação, avaliação, aquisição, conservação, difusão (descrição). Classificação dos arquivos: quanto à entidade mantenedora (público, privado, institucional, familiar), à fase (corrente, intermediário, permanente), à natureza (especial: fotos, filmes; especializado: de uma área) e à extensão (setorial: do setor; central: de toda a organização). Fundo: conjunto de documentos de uma entidade. Série: conjunto de documentos de mesma espécie ou assunto. Dossiê: conjunto de documentos de um mesmo assunto, reunidos para fim específico. Processo: conjunto de documentos que reúne ações e decisões. Documento original, cópia e minuta. Documento de arquivo × documento comum: o primeiro nasce de uma atividade e tem valor probatório . Cai em prova: proveniência = não misturar fundos; organicidade = reflete a estrutura do produtor; unicidade = cada documento é único em seu contexto; indivisibilidade = não dividir o fundo."}, {"num": "2", "title": "Gestão de documentos (Lei 8.159/1991)", "html": "<p>É o conjunto de procedimentos e operações de <strong>produção, tramitação, uso, avaliação e arquivamento<\/strong> em fase <strong>corrente e intermediária<\/strong>, visando à <strong>eliminação ou ao recolhimento<\/strong> para guarda permanente. Seu objetivo é eliminar o que não serve e <strong>recolher<\/strong> o que tem valor permanente.<\/p>\n<ul>\n<li><strong>Fases da gestão:<\/strong> <strong>produção<\/strong> (elaboração de documentos), <strong>utilização<\/strong> (tramitação, uso, arquivamento) e <strong>destinação<\/strong> (avaliação, eliminação ou guarda permanente).<\/li>\n<li><strong>Instrumentos:<\/strong> plano ou código de classificação, <strong>tabela de temporalidade e destinação<\/strong>, listas de eliminação.<\/li>\n<li><strong>Documentos públicos:<\/strong> são acessíveis, com ressalvas para sigilo (LAI).<\/li>\n<li><strong>SINAR<\/strong> e <strong>CONARQ:<\/strong> sistema e conselho nacional de arquivos.<\/li>\n<\/ul>", "text": "É o conjunto de procedimentos e operações de produção, tramitação, uso, avaliação e arquivamento em fase corrente e intermediária , visando à eliminação ou ao recolhimento para guarda permanente. Seu objetivo é eliminar o que não serve e recolher o que tem valor permanente. Fases da gestão: produção (elaboração de documentos), utilização (tramitação, uso, arquivamento) e destinação (avaliação, eliminação ou guarda permanente). Instrumentos: plano ou código de classificação, tabela de temporalidade e destinação , listas de eliminação. Documentos públicos: são acessíveis, com ressalvas para sigilo (LAI). SINAR e CONARQ: sistema e conselho nacional de arquivos."}, {"num": "3", "title": "Diagnóstico", "html": "<p>Levantamento da situação dos arquivos <strong>antes<\/strong> de qualquer intervenção: volume, estado de conservação, organização, espaço e condições ambientais, recursos humanos, produção documental. É o <strong>primeiro passo<\/strong> da gestão: sem diagnóstico, não há plano consistente. Em geral, usa-se um <strong>formulário de levantamento<\/strong> e visita <em>in loco<\/em>.<\/p>", "text": "Levantamento da situação dos arquivos antes de qualquer intervenção: volume, estado de conservação, organização, espaço e condições ambientais, recursos humanos, produção documental. É o primeiro passo da gestão: sem diagnóstico, não há plano consistente. Em geral, usa-se um formulário de levantamento e visita in loco ."}, {"num": "4 e 7", "title": "Arquivos corrente, intermediário e permanente (teoria das três idades)", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Idade<\/th>\n<th>Uso<\/th>\n<th>Onde fica<\/th>\n<th>Destino<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Corrente<\/td>\n<td>Frequente, documento em trâmite ou de consulta constante<\/td>\n<td>Perto de quem produziu (setor)<\/td>\n<td><strong>Transferência<\/strong> para o intermediário<\/td>\n<\/tr>\n<tr>\n<td>Intermediário<\/td>\n<td>Esporádico, aguardando prazo legal ou administrativo<\/td>\n<td>Depósito central ou local intermediário<\/td>\n<td><strong>Eliminação<\/strong> ou <strong>recolhimento<\/strong> ao permanente<\/td>\n<\/tr>\n<tr>\n<td>Permanente<\/td>\n<td><strong>Valor histórico ou probatório<\/strong><\/td>\n<td>Arquivo permanente<\/td>\n<td>Guarda definitiva, nunca eliminado<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Valor primário:<\/strong> administrativo, legal, fiscal, jurídico (interessa a quem produziu). <strong>Valor secundário:<\/strong> histórico, probatório e informativo (interessa à sociedade e à pesquisa).<\/li>\n<li><strong>Transferência:<\/strong> corrente → intermediário. <strong>Recolhimento:<\/strong> → permanente. <strong>Eliminação:<\/strong> destruição de documentos sem valor, autorizada e registrada em <strong>listagem<\/strong> e <strong>termo<\/strong>.<\/li>\n<li><strong>Arquivo corrente:<\/strong> documentos de uso frequente. Cuida de <strong>protocolo, classificação, arquivamento<\/strong> e <strong>empréstimo<\/strong> (consulta).<\/li>\n<li><strong>Arquivo intermediário:<\/strong> também chamado \"pré-arquivo\"; espera o fim do prazo de guarda.<\/li>\n<li><strong>Arquivo permanente (custódia):<\/strong> o foco é a <strong>preservação<\/strong>, o <strong>acesso<\/strong> e a <strong>difusão<\/strong>. No permanente fazem-se <strong>arranjo<\/strong> (organização em fundos, séries) e <strong>descrição<\/strong> (instrumentos de pesquisa: <strong>guia, inventário, catálogo, repertório, índice<\/strong>).<\/li>\n<li><strong>Idades × valor:<\/strong> corrente e intermediário têm valor <strong>primário<\/strong>; o permanente tem valor <strong>secundário<\/strong>.<\/li>\n<\/ul>", "text": "Idade Uso Onde fica Destino Corrente Frequente, documento em trâmite ou de consulta constante Perto de quem produziu (setor) Transferência para o intermediário Intermediário Esporádico, aguardando prazo legal ou administrativo Depósito central ou local intermediário Eliminação ou recolhimento ao permanente Permanente Valor histórico ou probatório Arquivo permanente Guarda definitiva, nunca eliminado Valor primário: administrativo, legal, fiscal, jurídico (interessa a quem produziu). Valor secundário: histórico, probatório e informativo (interessa à sociedade e à pesquisa). Transferência: corrente → intermediário. Recolhimento: → permanente. Eliminação: destruição de documentos sem valor, autorizada e registrada em listagem e termo . Arquivo corrente: documentos de uso frequente. Cuida de protocolo, classificação, arquivamento e empréstimo (consulta). Arquivo intermediário: também chamado \"pré-arquivo\"; espera o fim do prazo de guarda. Arquivo permanente (custódia): o foco é a preservação , o acesso e a difusão . No permanente fazem-se arranjo (organização em fundos, séries) e descrição (instrumentos de pesquisa: guia, inventário, catálogo, repertório, índice ). Idades × valor: corrente e intermediário têm valor primário ; o permanente tem valor secundário ."}, {"num": "5", "title": "Protocolo", "html": "<p>Setor que <strong>recebe, registra, classifica, distribui, controla a tramitação e expede<\/strong> documentos. No governo federal, o processo recebe um <strong>Número Único de Protocolo (NUP)<\/strong>.<\/p>\n<ul>\n<li><strong>Atividades:<\/strong> recebimento, <strong>registro<\/strong> (cadastro dos dados), <strong>classificação<\/strong> por assunto, <strong>distribuição<\/strong> ao setor, <strong>tramitação<\/strong> (controle de movimentação) e <strong>expedição<\/strong>.<\/li>\n<li><strong>Documentos sigilosos<\/strong> exigem protocolo e controle próprios.<\/li>\n<li><strong>Autuação:<\/strong> <strong>formar o processo<\/strong> (capa, folhas numeradas). <strong>Juntada:<\/strong> acrescentar documento ao processo. <strong>Apensação:<\/strong> unir processos com mesmo interessado ou assunto. <strong>Desentranhamento:<\/strong> retirada de peça.<\/li>\n<li><strong>Tramitação:<\/strong> o caminho do documento entre os setores. <strong>Controle<\/strong> por sistema (no governo federal, o <strong>SEI<\/strong> é muito usado).<\/li>\n<\/ul>", "text": "Setor que recebe, registra, classifica, distribui, controla a tramitação e expede documentos. No governo federal, o processo recebe um Número Único de Protocolo (NUP) . Atividades: recebimento, registro (cadastro dos dados), classificação por assunto, distribuição ao setor, tramitação (controle de movimentação) e expedição . Documentos sigilosos exigem protocolo e controle próprios. Autuação: formar o processo (capa, folhas numeradas). Juntada: acrescentar documento ao processo. Apensação: unir processos com mesmo interessado ou assunto. Desentranhamento: retirada de peça. Tramitação: o caminho do documento entre os setores. Controle por sistema (no governo federal, o SEI é muito usado)."}, {"num": "6", "title": "Avaliação de documentos", "html": "<p>Analisa os documentos e define <strong>prazos de guarda<\/strong> e <strong>destinação final<\/strong> (eliminação ou guarda permanente), registrados na <strong>Tabela de Temporalidade e Destinação (TTD)<\/strong>. É feita por <strong>comissão<\/strong> (ou <strong>CPAD<\/strong>, Comissão Permanente de Avaliação de Documentos), com participação de arquivistas, gestores e especialistas.<\/p>\n<ul>\n<li>O <strong>plano de classificação<\/strong> (ou código de classificação) organiza os documentos por <strong>função e assunto<\/strong> (estrutura hierárquica). A <strong>TTD<\/strong> sempre depende desse plano: primeiro se <strong>classifica<\/strong>, depois se <strong>avalia<\/strong>.<\/li>\n<li><strong>Métodos de arquivamento:<\/strong><ul>\n<li><strong>Básicos:<\/strong> <strong>alfabético<\/strong> (nomes), <strong>geográfico<\/strong> (lugares), <strong>numérico<\/strong> (números), <strong>por assunto<\/strong>, <strong>cronológico<\/strong>.<\/li>\n<li><strong>Direto<\/strong> (a busca é feita sem índice): alfabético e geográfico. <strong>Indireto<\/strong> (precisa de índice): numérico e por assunto.<\/li>\n<li><strong>Numérico simples<\/strong> (ordem de entrada), <strong>numérico cronológico<\/strong>, <strong>dígito-terminal<\/strong>.<\/li>\n<li><strong>Alfanumérico<\/strong>, <strong>ideográfico<\/strong> (assunto), <strong>decimal<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Equipamentos:<\/strong> arquivos de aço, estantes, armários, <strong>mapotecas<\/strong>, fichários, <strong>pastas suspensas<\/strong>.<\/li>\n<\/ul>", "text": "Analisa os documentos e define prazos de guarda e destinação final (eliminação ou guarda permanente), registrados na Tabela de Temporalidade e Destinação (TTD) . É feita por comissão (ou CPAD , Comissão Permanente de Avaliação de Documentos), com participação de arquivistas, gestores e especialistas. O plano de classificação (ou código de classificação) organiza os documentos por função e assunto (estrutura hierárquica). A TTD sempre depende desse plano: primeiro se classifica , depois se avalia . Métodos de arquivamento: Básicos: alfabético (nomes), geográfico (lugares), numérico (números), por assunto , cronológico . Direto (a busca é feita sem índice): alfabético e geográfico. Indireto (precisa de índice): numérico e por assunto. Numérico simples (ordem de entrada), numérico cronológico , dígito-terminal . Alfanumérico , ideográfico (assunto), decimal . Equipamentos: arquivos de aço, estantes, armários, mapotecas , fichários, pastas suspensas ."}, {"num": "8", "title": "Tipologias documentais e suportes", "html": "<ul>\n<li><strong>Espécie<\/strong> é a forma do documento (ata, ofício, relatório, certidão). <strong>Tipo documental<\/strong> é a espécie + a atividade que a gerou (ata de reunião do Conselho; ofício de convocação).<\/li>\n<li><strong>Suporte:<\/strong> o material em que a informação é registrada: papel, filme, <strong>meio magnético<\/strong>, <strong>óptico<\/strong>, digital.<\/li>\n<li><strong>Formato:<\/strong> configuração física (folha, rolo, microficha).<\/li>\n<li><strong>Gênero:<\/strong> textual (papel escrito), <strong>iconográfico<\/strong> (fotos, desenhos), <strong>cartográfico<\/strong> (mapas, plantas), <strong>sonoro<\/strong> (discos, fitas), <strong>audiovisual<\/strong> (filmes, vídeos), <strong>micrográfico<\/strong> (microfilmes), <strong>digital<\/strong> (arquivos eletrônicos).<\/li>\n<li><strong>Documento digital:<\/strong> exige gestão (preservação digital, <strong>migração<\/strong> de suportes e formatos) para manter acesso e autenticidade.<\/li>\n<\/ul>", "text": "Espécie é a forma do documento (ata, ofício, relatório, certidão). Tipo documental é a espécie + a atividade que a gerou (ata de reunião do Conselho; ofício de convocação). Suporte: o material em que a informação é registrada: papel, filme, meio magnético , óptico , digital. Formato: configuração física (folha, rolo, microficha). Gênero: textual (papel escrito), iconográfico (fotos, desenhos), cartográfico (mapas, plantas), sonoro (discos, fitas), audiovisual (filmes, vídeos), micrográfico (microfilmes), digital (arquivos eletrônicos). Documento digital: exige gestão (preservação digital, migração de suportes e formatos) para manter acesso e autenticidade."}, {"num": "9", "title": "Microfilmagem", "html": "<p><strong>Lei 5.433/1968 e Decreto 1.799/1996:<\/strong> o <strong>microfilme tem valor legal<\/strong> de documento original. O original pode ser <strong>eliminado<\/strong> depois de microfilmado, <strong>exceto<\/strong> os de <strong>valor permanente<\/strong>, que devem ser guardados. Formatos: rolo, <strong>jaqueta<\/strong>, <strong>microficha<\/strong>, cartão-janela.<\/p>\n<ul>\n<li><strong>Vantagens:<\/strong> reduz o espaço, protege os originais do manuseio e permite reprodução. <strong>Desvantagens:<\/strong> custo, necessidade de leitor.<\/li>\n<li><strong>Microfilmagem × digitalização:<\/strong> a primeira é analógica; a segunda gera arquivo digital.<\/li>\n<li><strong>Procedimento:<\/strong> preparação, filmagem, revelação, inspeção e <strong>termo de abertura e encerramento<\/strong>.<\/li>\n<\/ul>", "text": "Lei 5.433/1968 e Decreto 1.799/1996: o microfilme tem valor legal de documento original. O original pode ser eliminado depois de microfilmado, exceto os de valor permanente , que devem ser guardados. Formatos: rolo, jaqueta , microficha , cartão-janela. Vantagens: reduz o espaço, protege os originais do manuseio e permite reprodução. Desvantagens: custo, necessidade de leitor. Microfilmagem × digitalização: a primeira é analógica; a segunda gera arquivo digital. Procedimento: preparação, filmagem, revelação, inspeção e termo de abertura e encerramento ."}, {"num": "10", "title": "Automação", "html": "<ul>\n<li><strong>GED<\/strong> (gerenciamento eletrônico de documentos): controla o ciclo de vida de documentos digitais.<\/li>\n<li><strong>Digitalização<\/strong> com <strong>valor legal<\/strong> (<strong>Lei 12.682/2012<\/strong> e <strong>Decreto 10.278/2020<\/strong>): o documento digitalizado tem valor de original quando segue os requisitos (assinatura com certificado digital, metadados, padrões técnicos).<\/li>\n<li><strong>Sistemas de processo eletrônico<\/strong>, como o <strong>SEI<\/strong> (Sistema Eletrônico de Informações) em muitos órgãos federais. <strong>Assinatura digital<\/strong> garante autenticidade e integridade.<\/li>\n<li><strong>Metadados:<\/strong> dados que descrevem o documento (autor, data, assunto). <strong>OCR<\/strong> reconhece o texto de imagens.<\/li>\n<li><strong>Conceitos:<\/strong> <strong>documento nato digital<\/strong> (já produzido em meio digital) × <strong>digitalizado<\/strong>. <strong>Preservação digital:<\/strong> manter acesso a longo prazo (<strong>backup, migração, emulação<\/strong>).<\/li>\n<li><strong>e-ARQ Brasil:<\/strong> modelo de requisitos para sistemas informatizados de gestão arquivística.<\/li>\n<\/ul>", "text": "GED (gerenciamento eletrônico de documentos): controla o ciclo de vida de documentos digitais. Digitalização com valor legal ( Lei 12.682/2012 e Decreto 10.278/2020 ): o documento digitalizado tem valor de original quando segue os requisitos (assinatura com certificado digital, metadados, padrões técnicos). Sistemas de processo eletrônico , como o SEI (Sistema Eletrônico de Informações) em muitos órgãos federais. Assinatura digital garante autenticidade e integridade. Metadados: dados que descrevem o documento (autor, data, assunto). OCR reconhece o texto de imagens. Conceitos: documento nato digital (já produzido em meio digital) × digitalizado . Preservação digital: manter acesso a longo prazo ( backup, migração, emulação ). e-ARQ Brasil: modelo de requisitos para sistemas informatizados de gestão arquivística."}, {"num": "11", "title": "Preservação, conservação e restauração", "html": "<ul>\n<li><strong>Preservação:<\/strong> conjunto de ações <strong>amplas e preventivas<\/strong> para manter os documentos: política, ambiente com <strong>temperatura e umidade estáveis<\/strong>, pouca luz, controle de pragas, guarda adequada, segurança contra incêndio e roubo.<\/li>\n<li><strong>Conservação:<\/strong> cuidado direto para <strong>estabilizar<\/strong> o documento: higienização (limpeza), acondicionamento em <strong>caixas adequadas<\/strong>, retirada de <strong>clipes metálicos<\/strong> e grampos.<\/li>\n<li><strong>Restauração:<\/strong> <strong>intervenção<\/strong> para recuperar documento já danificado (sem alterar a informação).<\/li>\n<li><strong>Inimigos:<\/strong> <strong>umidade<\/strong> (fungos), <strong>calor<\/strong>, <strong>luz<\/strong> (principalmente ultravioleta), <strong>poeira<\/strong>, <strong>insetos<\/strong> (brocas, cupins, traças), roedores, fungos e <strong>acidez do papel<\/strong>.<\/li>\n<li><strong>Condições ideais<\/strong> (valores típicos): temperatura estável em torno de 20 °C e umidade relativa de cerca de 50%. O mais importante é a <strong>estabilidade<\/strong>, sem oscilações.<\/li>\n<li><strong>Plano de emergência:<\/strong> previne desastres (incêndio, enchente).<\/li>\n<\/ul>", "text": "Preservação: conjunto de ações amplas e preventivas para manter os documentos: política, ambiente com temperatura e umidade estáveis , pouca luz, controle de pragas, guarda adequada, segurança contra incêndio e roubo. Conservação: cuidado direto para estabilizar o documento: higienização (limpeza), acondicionamento em caixas adequadas , retirada de clipes metálicos e grampos. Restauração: intervenção para recuperar documento já danificado (sem alterar a informação). Inimigos: umidade (fungos), calor , luz (principalmente ultravioleta), poeira , insetos (brocas, cupins, traças), roedores, fungos e acidez do papel . Condições ideais (valores típicos): temperatura estável em torno de 20 °C e umidade relativa de cerca de 50%. O mais importante é a estabilidade , sem oscilações. Plano de emergência: previne desastres (incêndio, enchente)."}], "quiz": [{"q": "A passagem de documentos para o arquivo permanente chama-se:", "opts": ["Transferência", "Recolhimento", "Eliminação", "Arranjo"], "a": 1, "exp": "Transferência: corrente para intermediário. Recolhimento: para o permanente."}, {"q": "O instrumento que define prazos de guarda e destinação dos documentos é:", "opts": ["Plano de classificação", "Tabela de Temporalidade e Destinação (TTD)", "Inventário", "Protocolo"], "a": 1, "exp": "A TTD resulta da avaliação e registra prazos de guarda e destinação final."}, {"q": "Documentos de valor permanente:", "opts": ["Podem ser eliminados após microfilmagem", "Nunca são eliminados", "Ficam no arquivo corrente", "São eliminados após 5 anos"], "a": 1, "exp": "Permanentes são guardados para sempre, inclusive depois de microfilmados."}, {"q": "O valor secundário de um documento é:", "opts": ["Administrativo", "Fiscal", "Histórico e informativo", "Legal"], "a": 2, "exp": "Primário interessa a quem produziu; secundário interessa à sociedade (histórico)."}, {"q": "O método alfabético de arquivamento é:", "opts": ["Indireto", "Direto", "Numérico", "Cronológico"], "a": 1, "exp": "Alfabético e geográfico são diretos: dispensam índice para a busca."}, {"q": "O princípio arquivístico que impede misturar documentos de origens diferentes é o da:", "opts": ["Organicidade", "Proveniência", "Unicidade", "Cumulatividade"], "a": 1, "exp": "Proveniência (respeito aos fundos): documentos de um produtor não se misturam com os de outro."}, {"q": "A Lei 8.159/1991 trata:", "opts": ["Da LAI", "Da política nacional de arquivos públicos e privados", "Da digitalização", "Do microfilme"], "a": 1, "exp": "A Lei 8.159 dispõe sobre a política nacional de arquivos públicos e privados."}, {"q": "Os documentos do arquivo corrente são usados:", "opts": ["Raramente", "Com frequência", "Nunca", "Só por historiadores"], "a": 1, "exp": "No corrente o uso é frequente e os documentos ficam perto de quem os produziu."}, {"q": "O microfilme tem:", "opts": ["Valor apenas informativo", "Valor legal de documento original", "Valor só se for permanente", "Nenhum valor probatório"], "a": 1, "exp": "Lei 5.433/1968: o microfilme tem valor legal. O original pode ser eliminado, exceto os permanentes."}, {"q": "O número que identifica de forma única um processo no governo federal é o:", "opts": ["NUP", "CNPJ", "TTD", "GED"], "a": 0, "exp": "NUP: Número Único de Protocolo."}]}, {"id": "atendimento", "nome": "Atendimento ao Público", "bloco": "Específico", "lead": "Mais intuitivo, mas a banca cobra o significado exato de cada atributo.", "topics": [{"num": "1", "title": "Qualidade no atendimento", "html": "<p>Atender bem é <strong>resolver a necessidade do cidadão<\/strong> com respeito. No serviço público, o cidadão é o <strong>usuário<\/strong>, e o servidor representa o órgão.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Atributo<\/th>\n<th>Significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Comunicabilidade<\/td>\n<td>Falar de forma clara, sem gírias ou termos técnicos<\/td>\n<\/tr>\n<tr>\n<td>Apresentação<\/td>\n<td>Postura e aparência adequadas ao ambiente<\/td>\n<\/tr>\n<tr>\n<td>Atenção<\/td>\n<td>Ouvir o cidadão com foco, sem se distrair<\/td>\n<\/tr>\n<tr>\n<td>Cortesia<\/td>\n<td>Educação e respeito<\/td>\n<\/tr>\n<tr>\n<td>Interesse<\/td>\n<td>Mostrar vontade real de resolver<\/td>\n<\/tr>\n<tr>\n<td>Presteza<\/td>\n<td>Disposição e rapidez em ajudar<\/td>\n<\/tr>\n<tr>\n<td>Eficiência<\/td>\n<td>Resolver bem, com o mínimo de recursos e tempo<\/td>\n<\/tr>\n<tr>\n<td>Tolerância<\/td>\n<td>Paciência, inclusive com quem está alterado<\/td>\n<\/tr>\n<tr>\n<td>Discrição<\/td>\n<td>Sigilo e reserva sobre o que ouve<\/td>\n<\/tr>\n<tr>\n<td>Conduta<\/td>\n<td>Comportamento ético e profissional<\/td>\n<\/tr>\n<tr>\n<td>Objetividade<\/td>\n<td>Ir direto ao ponto, sem rodeios<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Atendimento presencial, telefônico e digital:<\/strong> no telefone, atenda rápido, identifique-se (órgão e nome), fale com clareza e <strong>não deixe o cidadão esperando em silêncio<\/strong>. Nos canais digitais, responda com <strong>objetividade e clareza<\/strong>.<\/li>\n<li><strong>Cliente interno<\/strong> (colegas) e <strong>externo<\/strong> (cidadão): o mesmo cuidado vale para ambos.<\/li>\n<li><strong>Reclamações<\/strong> são oportunidade de melhoria: acolher, ouvir, resolver ou encaminhar, <strong>dar retorno<\/strong>.<\/li>\n<li><strong>Lei 13.460/2017:<\/strong> direitos do usuário (veja Administração Pública, item 16).<\/li>\n<li><strong>Inclusão e acessibilidade:<\/strong> atender a todos com igualdade, adaptando o atendimento a pessoas com deficiência. A <strong>Lei 13.146/2015<\/strong> (Estatuto da Pessoa com Deficiência), o <strong>Decreto 5.296/2004<\/strong> (acessibilidade) e a <strong>Lei 10.436/2002<\/strong> (<strong>Libras<\/strong>) são referências. Use linguagem acessível, ofereça cadeira ou ajuda se necessário, <strong>fale com a pessoa<\/strong> (não com o acompanhante) e <strong>pergunte<\/strong> como ajudar.<\/li>\n<\/ul>", "text": "Atender bem é resolver a necessidade do cidadão com respeito. No serviço público, o cidadão é o usuário , e o servidor representa o órgão. Atributo Significa Comunicabilidade Falar de forma clara, sem gírias ou termos técnicos Apresentação Postura e aparência adequadas ao ambiente Atenção Ouvir o cidadão com foco, sem se distrair Cortesia Educação e respeito Interesse Mostrar vontade real de resolver Presteza Disposição e rapidez em ajudar Eficiência Resolver bem, com o mínimo de recursos e tempo Tolerância Paciência, inclusive com quem está alterado Discrição Sigilo e reserva sobre o que ouve Conduta Comportamento ético e profissional Objetividade Ir direto ao ponto, sem rodeios Atendimento presencial, telefônico e digital: no telefone, atenda rápido, identifique-se (órgão e nome), fale com clareza e não deixe o cidadão esperando em silêncio . Nos canais digitais, responda com objetividade e clareza . Cliente interno (colegas) e externo (cidadão): o mesmo cuidado vale para ambos. Reclamações são oportunidade de melhoria: acolher, ouvir, resolver ou encaminha
