<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="version.js"></script>
<title>Caderno do Cargo 201</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('c201.prefs') || '{}'), t = p.theme || 'auto';
    if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    if (p.font) document.documentElement.dataset.font = p.font;
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
<style>
/* Layout: fichário de estudo. Índice com abas coloridas à esquerda, folha de leitura à direita, um tópico por vez. */
:root {
  --paper: #F3F5F8;
  --sheet: #FFFFFF;
  --ink: #18202F;
  --muted: #5A6476;
  --line: #DCE1E9;
  --soft: #E9EDF3;
  --accent: #2446C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FB;
  --hl: rgba(255, 210, 0, .5);
  --ok: #157A4E;
  --ok-soft: #DDF3E7;
  --bad: #B83D12;
  --bad-soft: #FBE6DC;
  --tab-ink: #18202F;
  --t-portugues: #FFD3A6;
  --t-informatica: #A9E4F5;
  --t-adm-publica: #C9BCFF;
  --t-direito-adm: #FFC4C4;
  --t-administracao: #B8EFC6;
  --t-gestao-pessoas: #FDC2DD;
  --t-materiais: #FFE88F;
  --t-arquivologia: #CFE6A0;
  --t-atendimento: #B5D4FF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --read-size: 1.0625rem;
  --read-lh: 1.7;
  --shadow: 0 10px 30px -18px rgba(10, 20, 40, .4);
  --radius: 10px;
}
/* Temas: o JS sempre grava data-theme no <html> (o "automático" vira claro ou escuro conforme o aparelho). */
:root[data-theme="dark"] {
  --paper: #0E121A; --sheet: #161B26; --ink: #E4E8EF; --muted: #9AA3B4; --line: #283041; --soft: #1D2330;
  --accent: #86A2FF; --accent-ink: #0E121A; --accent-soft: #1F2A4A; --hl: rgba(250, 204, 21, .26);
  --ok: #5BD69A; --ok-soft: #12301F; --bad: #FF9A6B; --bad-soft: #3A1E12; color-scheme: dark;
}
:root[data-theme="sepia"] {
  --paper: #F1E7D0; --sheet: #FBF5E6; --ink: #3B2F20; --muted: #7A6A52; --line: #DFD1B1; --soft: #EADDC0;
  --accent: #9A4A12; --accent-ink: #FFF8EA; --accent-soft: #F0DDBB; --hl: rgba(214, 150, 40, .38);
  --ok: #3E7A32; --ok-soft: #E1ECC9; --bad: #A8381A; --bad-soft: #F3D9C6;
}
:root[data-theme="ocean"] {
  --paper: #0A1520; --sheet: #112131; --ink: #DCE8F5; --muted: #8DA5BD; --line: #223649; --soft: #182B3D;
  --accent: #5CC8FF; --accent-ink: #06121C; --accent-soft: #14354D; --hl: rgba(92, 200, 255, .22);
  --ok: #5BD69A; --ok-soft: #123324; --bad: #FF9A6B; --bad-soft: #3A1E12; color-scheme: dark;
}
:root[data-theme="forest"] {
  --paper: #0E1912; --sheet: #15241B; --ink: #E1EEE5; --muted: #94AD9D; --line: #25392D; --soft: #1B2D22;
  --accent: #6EE7A1; --accent-ink: #06150C; --accent-soft: #1C3A29; --hl: rgba(190, 230, 90, .22);
  --ok: #8BE28F; --ok-soft: #173A20; --bad: #FFA17A; --bad-soft: #3A2012; color-scheme: dark;
}
:root[data-theme="amoled"] {
  --paper: #000000; --sheet: #0B0B0C; --ink: #EDEDED; --muted: #9B9B9B; --line: #232325; --soft: #151517;
  --accent: #8AB4FF; --accent-ink: #000; --accent-soft: #14233F; --hl: rgba(250, 204, 21, .26);
  --ok: #5BD69A; --ok-soft: #0D2A1A; --bad: #FF9A6B; --bad-soft: #301810; color-scheme: dark;
}
:root[data-theme="contrast"] {
  --paper: #FFFFFF; --sheet: #FFFFFF; --ink: #000000; --muted: #222222; --line: #000000; --soft: #E7E7E7;
  --accent: #0A2FBF; --accent-ink: #FFFFFF; --accent-soft: #DCE3FF; --hl: rgba(255, 221, 0, .85);
  --ok: #005A2B; --ok-soft: #D4F5E2; --bad: #A21A00; --bad-soft: #FFE1D6;
}
:root[data-font="sans"] { --f-read: "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
:root[data-hl="off"] .read strong { background: none; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-display); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app {
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px;
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}

/* ---------- Índice ---------- */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
.brand small { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand strong { font-weight: 800; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
.search { position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sheet); color: var(--ink); font: inherit; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.navgroup { display: flex; flex-direction: column; gap: 4px; }
.navgroup h3 { margin: 0 0 4px; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.navitem { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.navitem:hover { background: var(--soft); }
.navitem[aria-current="page"] { background: var(--sheet); box-shadow: 0 0 0 1px var(--line); }
.navitem .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--tab); }
.navitem .nm { font-weight: 500; font-size: 14px; line-height: 1.25; }
.navitem .ct { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.navitem .ct.full { color: var(--ok); }
.homebtn { font-weight: 500; }
.sidefoot { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.sync { display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
.sync i { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
.sync[data-state="ok"] i { background: var(--ok); }
.sync[data-state="saving"] i { background: var(--accent); }
.sync[data-state="err"] i { background: var(--bad); }
.account { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius); background: var(--sheet); border: 1px solid var(--line); }
.account .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.account .who > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.account img { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); flex: none; }
.account b { font-size: 15px; overflow-wrap: anywhere; }
.account .sync { font-size: 12.5px; color: var(--muted); }
.account .pitch { margin: 0; font-size: 13.5px; color: var(--muted); }
.account .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.account .btn { padding: 8px 14px; }
.mini { padding: 6px 10px; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
.appbox a { color: var(--accent); }
.appbox { display: flex; flex-direction: column; gap: 8px; }
.appbox .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.code { font-family: var(--f-mono); font-size: clamp(30px, 8vw, 44px); font-weight: 500; letter-spacing: .12em; padding: 14px 18px; border-radius: var(--radius); background: var(--soft); align-self: flex-start; user-select: all; }
.steps { margin: 0; padding-left: 1.3em; font-family: var(--f-read); font-size: var(--read-size); line-height: 1.7; }
.sizectl { display: flex; align-items: center; gap: 6px; }
.sizectl button { width: 32px; height: 28px; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; cursor: pointer; font-weight: 700; }

/* ---------- Barra superior (celular) ---------- */
.topbar { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); max-width: min(92vw, 420px); padding: 12px 16px; border-radius: 10px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.topacts { display: flex; gap: 6px; }
.scrim { display: none; }

/* ---------- Área principal ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h1, h2 { text-wrap: balance; }

/* Início */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.hero h1 { margin: 0; font-weight: 800; font-size: clamp(30px, 4.6vw, 46px); line-height: 1.02; letter-spacing: -.035em; max-width: 18ch; }
.hero p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 16px; }
.meter { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
.meter .big { font-weight: 800; font-size: 28px; letter-spacing: -.02em; }
.bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.continue { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--radius); background: var(--accent-soft); }
.continue div { display: flex; flex-direction: column; min-width: 0; }
.continue b { font-size: 15.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--sheet); border-color: var(--line); color: var(--ink); }
.btn.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn:disabled { opacity: .4; cursor: default; }

.sectionhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 10px; }
.sectionhead h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 16px; }
.folder { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; padding-top: 18px; border-radius: 0 var(--radius) var(--radius) var(--radius); background: var(--sheet); border: 1px solid var(--line); cursor: pointer; text-align: left; margin-top: 14px; transition: transform .15s ease, box-shadow .15s ease; }
.folder::before { content: attr(data-tab); position: absolute; left: -1px; top: -24px; height: 24px; padding: 3px 12px 0; border-radius: 8px 8px 0 0; background: var(--tab); color: var(--tab-ink); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.folder:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -10px rgba(10, 20, 40, .35); }
.folder h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.folder .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.folder .bar { height: 6px; }
.folder .bar > i { background: var(--ink); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.note { padding: 16px 18px; border-radius: var(--radius); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.note h3 { margin: 0; font-size: 15px; font-weight: 700; }
.note p, .note ul { margin: 0; font-family: var(--f-read); font-size: 15px; line-height: 1.6; }
.note ul { padding-left: 18px; }
.note s { color: var(--bad); }
.note ins { text-decoration: none; color: var(--bad); font-weight: 600; }

/* Matéria */
.mhead { display: flex; flex-direction: column; gap: 10px; }
.tabchip { align-self: flex-start; padding: 3px 10px; border-radius: 6px; background: var(--tab); color: var(--tab-ink); font-family: var(--f-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; }
.mhead h1 { margin: 0; font-size: clamp(26px, 3.6vw, 36px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.mhead p { margin: 0; color: var(--muted); max-width: 62ch; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-width: 38px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.pill[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pill.quiz { font-family: var(--f-display); font-weight: 700; }

.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 40px); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sheet .kicker { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sheet h2 { margin: 0; font-size: clamp(22px, 2.8vw, 28px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.read { font-family: var(--f-read); font-size: var(--read-size); line-height: var(--read-lh); max-width: 68ch; min-width: 0; }
.read > * { margin: 0 0 1em; }
.read > *:last-child { margin-bottom: 0; }
.read ul, .read ol { padding-left: 1.3em; }
.read li { margin-bottom: .45em; }
.read li > p { margin: 0; }
.read strong { font-weight: 600; background: linear-gradient(transparent 58%, var(--hl) 58%); padding: 0 1px; }
.read em { font-style: italic; }
.read a { color: var(--accent); }
.read code { font-family: var(--f-mono); font-size: .88em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
.read table { border-collapse: collapse; width: 100%; font-size: .9em; line-height: 1.45; }
.read th { text-align: left; font-family: var(--f-display); font-weight: 700; font-size: .86em; letter-spacing: .02em; background: var(--soft); }
.read th, .read td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.read tr:last-child td { border-bottom: 0; }
.read td:first-child { font-weight: 600; }
.read mark { background: var(--hl); color: inherit; padding: 0 1px; border-radius: 2px; }
.sheetfoot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.sheetfoot .nav { display: flex; gap: 8px; }

/* Quiz */
.qlist { display: flex; flex-direction: column; gap: 22px; }
.q { display: flex; flex-direction: column; gap: 10px; }
.q p.stem { margin: 0; font-family: var(--f-read); font-size: var(--read-size); line-height: 1.55; }
.q p.stem b { font-family: var(--f-mono); font-weight: 500; font-size: .8em; color: var(--muted); margin-right: 6px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 15px; }
.opt span:first-child { font-family: var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.exp { margin: 0; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--soft); }
.exp b.r { color: var(--ok); } .exp b.w { color: var(--bad); }
.score { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }

/* Busca */
.results { display: flex; flex-direction: column; gap: 10px; }
.hit { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--sheet); border: 1px solid var(--line); text-align: left; cursor: pointer; }
.hit:hover { border-color: var(--accent); }
.hit .where { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.hit .where i { width: 10px; height: 10px; border-radius: 3px; background: var(--tab); }
.hit b { font-size: 15.5px; }
.hit p { margin: 0; font-family: var(--f-read); font-size: 14px; color: var(--muted); }
.hit mark { background: var(--hl); color: var(--ink); }
.empty { color: var(--muted); }


/* ---------- Ícones, avisos e destaques ---------- */
.iconbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; cursor: pointer; }
.iconbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot-badge { position: absolute; top: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); border: 2px solid var(--sheet); }
.dot-badge.inline { position: static; display: inline-block; margin-right: 6px; vertical-align: middle; }
.navitem .ct { display: inline-flex; align-items: center; }

/* Caixas dentro do texto (Macete, Cai em prova, Atenção, Exemplo) */
.read blockquote { margin: 0 0 1em; padding: 12px 16px; border-radius: 10px; background: var(--soft); border-left: 4px solid var(--muted); font-size: .96em; line-height: 1.6; }
.read blockquote > *:last-child { margin-bottom: 0; }
.read blockquote p { margin: 0 0 .5em; }
.read blockquote strong:first-child { background: none; font-family: var(--f-display); font-size: .78em; letter-spacing: .07em; text-transform: uppercase; }
.read blockquote.tip { background: var(--ok-soft); border-color: var(--ok); }
.read blockquote.tip strong:first-child { color: var(--ok); }
.read blockquote.exam { background: var(--accent-soft); border-color: var(--accent); }
.read blockquote.exam strong:first-child { color: var(--accent); }
.read blockquote.warn { background: var(--bad-soft); border-color: var(--bad); }
.read blockquote.warn strong:first-child { color: var(--bad); }
.read h4 { font-family: var(--f-display); font-size: 1.02em; font-weight: 800; letter-spacing: -.01em; margin: 1.3em 0 .4em; }
.read h4:first-child { margin-top: 0; }

/* Início renovado */
.hero { position: relative; padding: clamp(20px, 4vw, 34px); border-radius: 18px; background: linear-gradient(135deg, var(--accent-soft), var(--sheet) 70%); border: 1px solid var(--line); box-shadow: var(--shadow); }
.hero h1 { max-width: 20ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--line); }
.stat b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-radius: 14px; background: var(--ink); color: var(--paper); }
.cta div { display: flex; flex-direction: column; min-width: 0; }
.cta b { font-size: 16px; }
.cta span { font-size: 13.5px; opacity: .8; }
.cta .btn { background: var(--paper); color: var(--ink); }
.reviewlist { display: flex; flex-direction: column; gap: 8px; }
.reviewlist .hit b { font-size: 15px; }

/* Cabeçalho de matéria e leitura */
.msub { display: flex; align-items: center; gap: 12px; max-width: 420px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.msub .bar { flex: 1; height: 6px; }
.msub .bar > i { background: var(--tab); }
.sheet { border-radius: 16px; box-shadow: var(--shadow); }
.read-meta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12.5px; }
.btn.fav { background: var(--sheet); border-color: var(--line); color: var(--muted); }
.btn.fav.on { background: var(--hl); color: var(--ink); border-color: transparent; }

/* Configurações */
.cfg { display: flex; flex-direction: column; gap: 16px; max-width: 760px; }
.card { display: flex; flex-direction: column; gap: 14px; padding: clamp(16px, 3vw, 22px); border-radius: 16px; background: var(--sheet); border: 1px solid var(--line); }
.card h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.card h3 { margin: 0; font-size: 12px; font-family: var(--f-mono); font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.themegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.themeopt { display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; border: 2px solid var(--line); background: transparent; cursor: pointer; text-align: left; }
.themeopt[aria-pressed="true"] { border-color: var(--accent); }
.themeopt .sw { display: flex; flex-direction: column; justify-content: space-between; height: 58px; padding: 8px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, .3); }
.themeopt .sw i { display: block; height: 5px; border-radius: 3px; }
.themeopt .sw i:nth-child(1) { width: 70%; } .themeopt .sw i:nth-child(2) { width: 45%; opacity: .55; }
.themeopt .sw b { align-self: flex-start; width: 16px; height: 16px; border-radius: 50%; }
.themeopt span.nm { font-size: 12.5px; font-weight: 600; padding: 0 2px 2px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--sheet); box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.swatch.none { background: var(--soft); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--soft); flex-wrap: wrap; }
.seg button { padding: 7px 12px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
.field { display: flex; flex-direction: column; gap: 8px; }
.row2 { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.row2 > label { flex: 1; min-width: 0; }
.row2 label { font-weight: 600; font-size: 14.5px; }
.row2 small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="date"], textarea.box { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: inherit; }
textarea.box { width: 100%; min-height: 90px; font-family: var(--f-mono); font-size: 12px; }
.toggle { position: relative; width: 46px; height: 28px; flex: none; }
.toggle input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .2s; }
.toggle input:checked + i { background: var(--accent); }
.toggle input:checked + i::after { transform: translateX(18px); }
.preview { padding: 14px 16px; border-radius: 12px; background: var(--paper); border: 1px dashed var(--line); }
.status { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 14px; line-height: 1.45; }
.status[data-k="new"] { background: var(--accent-soft); }
.status[data-k="ok"] { background: var(--ok-soft); }
.status[data-k="err"] { background: var(--bad-soft); }
.status .ic { flex: none; font-size: 18px; line-height: 1.2; }
.status pre { margin: 6px 0 0; white-space: pre-wrap; font-family: var(--f-mono); font-size: 12px; color: var(--muted); max-height: 160px; overflow: auto; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1s linear infinite; }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 40px; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; background: var(--paper); }
  .topbar strong { margin-right: auto; font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
  .menubtn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; cursor: pointer; font-weight: 700; }
  .side { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); max-height: none; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); background: var(--paper); border-right: 1px solid var(--line); transform: translateX(-105%); transition: transform .25s ease; }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgba(8, 12, 20, .45); }
  .scrim.open { display: block; }
  .sheetfoot .nav { width: 100%; }
  .sheetfoot .nav .btn { flex: 1; }
  .sheetfoot > .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = [{"id": "portugues", "nome": "Língua Portuguesa", "bloco": "Comum", "lead": "O foco é gramática aplicada ao texto: entender o sentido, reescrever sem erro e dominar a Redação Oficial. As bancas gostam de cobrar o mesmo ponto em várias formas, então vale entender a regra e o porquê dela, em vez de decorar exemplos soltos.", "topics": [{"num": "1", "title": "Interpretação de textos", "html": "<p>Interpretar é ler o que o texto diz, o que ele sugere e o que ele <strong>não<\/strong> autoriza concluir. A maior parte dos erros vem de responder pela opinião própria em vez de pelo texto.<\/p>\n<h4>Níveis de leitura<\/h4>\n<ul>\n<li><strong>Compreensão (literal):<\/strong> o que está escrito. Localizar informação, identificar o assunto e a ideia central.<\/li>\n<li><strong>Interpretação (inferencial):<\/strong> o que se conclui a partir do que está escrito. Exige ligar partes do texto, perceber ironia, pressupostos e subentendidos.<\/li>\n<li><strong>Extrapolação:<\/strong> ir além do que o texto permite. É <strong>erro<\/strong>: a alternativa pode até ser verdadeira no mundo real, mas o texto não a sustenta.<\/li>\n<\/ul>\n<h4>Conceitos que caem<\/h4>\n<ul>\n<li><strong>Ideia central (tese):<\/strong> o que o texto defende ou informa como um todo. <strong>Ideias secundárias:<\/strong> exemplos, dados e detalhes que sustentam a central.<\/li>\n<li><strong>Pressuposto:<\/strong> informação que o texto dá como já aceita. Em \"Pedro parou de fumar\", pressupõe-se que ele fumava. Ela vale mesmo que a frase seja negada (\"Pedro não parou de fumar\" ainda pressupõe que fumava).<\/li>\n<li><strong>Subentendido:<\/strong> conclusão sugerida, que o autor pode negar ter dito. Em \"Já são 23h\", pode-se subentender \"está na hora de ir embora\".<\/li>\n<li><strong>Intenção comunicativa:<\/strong> informar, convencer, instruir, emocionar, criticar.<\/li>\n<li><strong>Ironia:<\/strong> diz-se o contrário do que se pensa; o contexto revela. <strong>Humor<\/strong> e <strong>crítica<\/strong> costumam aparecer em charges e tirinhas.<\/li>\n<li><strong>Texto verbal e não verbal:<\/strong> em charges, a imagem faz parte do sentido. Leia o desenho, a legenda e o contexto juntos.<\/li>\n<\/ul>\n<h4>Passo a passo para a questão<\/h4>\n<ol>\n<li>Leia o enunciado <strong>antes<\/strong> do texto para saber o que procurar.<\/li>\n<li>Leia o texto inteiro uma vez, marcando conectivos de oposição (mas, porém), que mostram a posição do autor.<\/li>\n<li>Volte ao trecho citado na questão e leia também a frase anterior e a posterior.<\/li>\n<li>Elimine alternativas com excesso de certeza (\"sempre\", \"nunca\", \"todos\", \"somente\", \"exclusivamente\") ou que tragam informação nova.<\/li>\n<\/ol>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> \"Segundo o texto...\" pede <strong>apenas<\/strong> o que está no texto. \"É possível inferir...\" aceita conclusão lógica, mas nunca opinião. Se a alternativa precisa de um \"se\" que o texto não traz, ela está errada.<\/p>\n<\/blockquote>", "text": "Interpretar é ler o que o texto diz, o que ele sugere e o que ele não autoriza concluir. A maior parte dos erros vem de responder pela opinião própria em vez de pelo texto. Níveis de leitura Compreensão (literal): o que está escrito. Localizar informação, identificar o assunto e a ideia central. Interpretação (inferencial): o que se conclui a partir do que está escrito. Exige ligar partes do texto, perceber ironia, pressupostos e subentendidos. Extrapolação: ir além do que o texto permite. É erro : a alternativa pode até ser verdadeira no mundo real, mas o texto não a sustenta. Conceitos que caem Ideia central (tese): o que o texto defende ou informa como um todo. Ideias secundárias: exemplos, dados e detalhes que sustentam a central. Pressuposto: informação que o texto dá como já aceita. Em \"Pedro parou de fumar\", pressupõe-se que ele fumava. Ela vale mesmo que a frase seja negada (\"Pedro não parou de fumar\" ainda pressupõe que fumava). Subentendido: conclusão sugerida, que o autor pode negar ter dito. Em \"Já são 23h\", pode-se subentender \"está na hora de ir embora\". Intenção comunicativa: informar, convencer, instruir, emocionar, criticar. Ironia: diz-se o contrário do que se pensa; o contexto revela. Humor e crítica costumam aparecer em charges e tirinhas. Texto verbal e não verbal: em charges, a imagem faz parte do sentido. Leia o desenho, a legenda e o contexto juntos. Passo a passo para a questão Leia o enunciado antes do texto para saber o que procurar. Leia o texto inteiro uma vez, marcando conectivos de oposição (mas, porém), que mostram a posição do autor. Volte ao trecho citado na questão e leia também a frase anterior e a posterior. Elimine alternativas com excesso de certeza (\"sempre\", \"nunca\", \"todos\", \"somente\", \"exclusivamente\") ou que tragam informação nova. Cai em prova: \"Segundo o texto...\" pede apenas o que está no texto. \"É possível inferir...\" aceita conclusão lógica, mas nunca opinião. Se a alternativa precisa de um \"se\" que o texto não traz, ela está errada."}, {"num": "2", "title": "Tipologia textual", "html": "<p><strong>Tipo<\/strong> é a estrutura que organiza o texto (como ele é construído). <strong>Gênero<\/strong> é a forma social em que o texto circula (item 3). Um mesmo gênero pode misturar tipos.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>O que faz<\/th>\n<th>Marcas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Narração<\/td>\n<td>Conta fatos no tempo<\/td>\n<td>Personagens, tempo, espaço, enredo, verbos no passado<\/td>\n<\/tr>\n<tr>\n<td>Descrição<\/td>\n<td>Retrata seres, lugares, objetos<\/td>\n<td>Adjetivos, verbos de estado, comparações<\/td>\n<\/tr>\n<tr>\n<td>Dissertação-argumentativa<\/td>\n<td>Defende um ponto de vista<\/td>\n<td>Tese, argumentos, conectivos, conclusão<\/td>\n<\/tr>\n<tr>\n<td>Exposição<\/td>\n<td>Explica ou informa sem opinar<\/td>\n<td>Definições, dados, linguagem neutra<\/td>\n<\/tr>\n<tr>\n<td>Injunção (instrucional)<\/td>\n<td>Instrui, manda fazer<\/td>\n<td>Verbos no imperativo ou infinitivo (receitas, manuais, editais)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Dissertação expositiva<\/strong> apresenta o tema sem tomar partido; a <strong>argumentativa<\/strong> defende uma tese com argumentos.<\/li>\n<li><strong>Estrutura da dissertação:<\/strong> introdução (tese), desenvolvimento (argumentos) e conclusão (retomada ou proposta).<\/li>\n<li><strong>Argumentos comuns:<\/strong> de autoridade (cita um especialista), por exemplificação, por dados estatísticos, por comparação, de causa e consequência.<\/li>\n<li><strong>Sequências dentro do texto:<\/strong> uma notícia é predominantemente expositiva, mas pode ter trechos narrativos.<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> pergunte \"o que o texto faz?\". Conta o que aconteceu? Narração. Mostra como é? Descrição. Defende uma ideia? Argumentação. Explica um assunto? Exposição. Manda fazer? Injunção.<\/p>\n<\/blockquote>", "text": "Tipo é a estrutura que organiza o texto (como ele é construído). Gênero é a forma social em que o texto circula (item 3). Um mesmo gênero pode misturar tipos. Tipo O que faz Marcas Narração Conta fatos no tempo Personagens, tempo, espaço, enredo, verbos no passado Descrição Retrata seres, lugares, objetos Adjetivos, verbos de estado, comparações Dissertação-argumentativa Defende um ponto de vista Tese, argumentos, conectivos, conclusão Exposição Explica ou informa sem opinar Definições, dados, linguagem neutra Injunção (instrucional) Instrui, manda fazer Verbos no imperativo ou infinitivo (receitas, manuais, editais) Dissertação expositiva apresenta o tema sem tomar partido; a argumentativa defende uma tese com argumentos. Estrutura da dissertação: introdução (tese), desenvolvimento (argumentos) e conclusão (retomada ou proposta). Argumentos comuns: de autoridade (cita um especialista), por exemplificação, por dados estatísticos, por comparação, de causa e consequência. Sequências dentro do texto: uma notícia é predominantemente expositiva, mas pode ter trechos narrativos. Macete: pergunte \"o que o texto faz?\". Conta o que aconteceu? Narração. Mostra como é? Descrição. Defende uma ideia? Argumentação. Explica um assunto? Exposição. Manda fazer? Injunção."}, {"num": "3", "title": "Gêneros textuais", "html": "<p>Gênero é a forma concreta e reconhecível em que o texto circula: notícia, receita, e-mail, ofício, editorial, bula, crônica, carta do leitor. Cada gênero tem <strong>função social<\/strong>, <strong>suporte<\/strong> (onde circula), <strong>linguagem<\/strong> e <strong>estrutura<\/strong> próprias.<\/p>\n<ul>\n<li><strong>Exemplo:<\/strong> a receita é o gênero; a injunção é o tipo que predomina nela (mas há também descrição dos ingredientes).<\/li>\n<li><strong>Gêneros jornalísticos:<\/strong> notícia (informa fatos, linguagem objetiva), reportagem (aprofunda), editorial (opinião do veículo), artigo de opinião (opinião do autor assinado), crônica (comentário leve do cotidiano), charge (crítica com humor).<\/li>\n<li><strong>Gêneros administrativos:<\/strong> ofício, requerimento, ata, relatório, parecer, portaria, memorando, circular. São formais e seguem padrão (item 11).<\/li>\n<li><strong>Intertextualidade:<\/strong> um texto dialoga com outro (citação, paródia, paráfrase, alusão). <strong>Paráfrase<\/strong> repete a ideia com outras palavras; <strong>paródia<\/strong> subverte o original, geralmente com humor ou crítica.<\/li>\n<\/ul>\n<blockquote class=\"warn\">\n<p><strong>Atenção:<\/strong> não confunda gênero com tipo. \"Qual o gênero?\" pede nomes como notícia, carta, bula. \"Qual o tipo?\" pede narração, descrição, dissertação, exposição ou injunção.<\/p>\n<\/blockquote>", "text": "Gênero é a forma concreta e reconhecível em que o texto circula: notícia, receita, e-mail, ofício, editorial, bula, crônica, carta do leitor. Cada gênero tem função social , suporte (onde circula), linguagem e estrutura próprias. Exemplo: a receita é o gênero; a injunção é o tipo que predomina nela (mas há também descrição dos ingredientes). Gêneros jornalísticos: notícia (informa fatos, linguagem objetiva), reportagem (aprofunda), editorial (opinião do veículo), artigo de opinião (opinião do autor assinado), crônica (comentário leve do cotidiano), charge (crítica com humor). Gêneros administrativos: ofício, requerimento, ata, relatório, parecer, portaria, memorando, circular. São formais e seguem padrão (item 11). Intertextualidade: um texto dialoga com outro (citação, paródia, paráfrase, alusão). Paráfrase repete a ideia com outras palavras; paródia subverte o original, geralmente com humor ou crítica. Atenção: não confunda gênero com tipo. \"Qual o gênero?\" pede nomes como notícia, carta, bula. \"Qual o tipo?\" pede narração, descrição, dissertação, exposição ou injunção."}, {"num": "4", "title": "Ortografia e acentuação", "html": "<h4>Regras de acentuação<\/h4>\n<ul>\n<li><strong>Proparoxítonas:<\/strong> todas acentuadas (lâmpada, público, ônibus).<\/li>\n<li><strong>Paroxítonas:<\/strong> acentuadas quando terminam em l, n, r, x, ps, ã(s), ão(s), i(s), us, um/uns ou ditongo (fácil, hífen, caráter, tórax, bíceps, órfã, órgão, júri, vírus, álbum, história). Não se acentuam as terminadas em a, e, o, em ou ens (casa, jovem, jovens).<\/li>\n<li><strong>Oxítonas:<\/strong> acentuadas quando terminam em a(s), e(s), o(s), em/ens (sofá, café, avô, também, parabéns).<\/li>\n<li><strong>Monossílabos tônicos:<\/strong> acentuam-se os terminados em a(s), e(s), o(s): pá, pé, nós, já, só. Os átonos (me, de, o) não.<\/li>\n<li><strong>Hiato:<\/strong> acentua-se o i e o u tônicos, sozinhos na sílaba ou seguidos de s (saída, baú, país, juízo). Não se acentua se vierem depois de ditongo em paroxítona (feiura, baiuca) ou se forem seguidos de outra consoante na sílaba (ruim, juiz).<\/li>\n<li><strong>Ditongos abertos éi, ói, éu:<\/strong> acentuam-se em oxítonas e monossílabos (papéis, herói, céu). Nas paroxítonas, <strong>não<\/strong> (ideia, heroico, jiboia).<\/li>\n<li><strong>Formas verbais:<\/strong> \"ele tem / eles têm\", \"ele vem / eles vêm\", \"ele mantém / eles mantêm\", \"ele contém / eles contêm\".<\/li>\n<\/ul>\n<h4>O que o Acordo Ortográfico mudou<\/h4>\n<ul>\n<li>Sem trema em palavras portuguesas (frequência, linguiça, cinquenta).<\/li>\n<li>Sem acento em \"eem\" e \"oo\": leem, creem, voo, enjoo.<\/li>\n<li>Sem acento no u tônico de gue/gui/que/qui (averigue, argui).<\/li>\n<li>Sem acento diferencial em para, pela, pelo, pera, polo. <strong>Permanecem:<\/strong> pôr (verbo) × por (preposição); pôde (passado) × pode (presente).<\/li>\n<li>Dias da semana, meses e estações do ano são escritos com letra minúscula (segunda-feira, janeiro, primavera).<\/li>\n<li>Alfabeto: K, W e Y fazem oficialmente parte dele.<\/li>\n<\/ul>\n<h4>Hífen<\/h4>\n<ul>\n<li><strong>Prefixo terminado em vogal + palavra começada pela mesma vogal:<\/strong> hífen (micro-ondas, anti-inflamatório, arqui-inimigo).<\/li>\n<li><strong>Prefixo terminado em vogal + palavra com outra vogal:<\/strong> junta (autoescola, extraescolar, infraestrutura).<\/li>\n<li><strong>Prefixo + r ou s:<\/strong> junta e dobra a consoante (antissocial, contrarregra, ultrassom, minissaia).<\/li>\n<li><strong>Prefixos ex-, vice-, pós-, pré-, pró-, sem-, além-, aquém-, recém-:<\/strong> sempre com hífen (ex-diretor, vice-reitor, pré-escolar, recém-nascido).<\/li>\n<li><strong>Prefixo terminado em consoante:<\/strong> hífen só se a palavra começar pela mesma consoante (inter-regional, sub-bibliotecário) ou por h (sub-hepático).<\/li>\n<\/ul>\n<h4>Grafias que confundem<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Par<\/th>\n<th>Diferença<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>mas / mais<\/td>\n<td>mas = porém; mais = quantidade<\/td>\n<\/tr>\n<tr>\n<td>a fim de / afim<\/td>\n<td>a fim de = para; afim = semelhante<\/td>\n<\/tr>\n<tr>\n<td>há / a<\/td>\n<td>há = tempo passado ou existir; a = tempo futuro ou distância (\"daqui a dois dias\", \"há dois dias\")<\/td>\n<\/tr>\n<tr>\n<td>onde / aonde<\/td>\n<td>onde = lugar em que; aonde = lugar a que (com verbo de movimento)<\/td>\n<\/tr>\n<tr>\n<td>porque / por que / porquê / por quê<\/td>\n<td>porque = resposta ou causa; por que = pergunta no meio da frase; porquê = substantivo (\"o porquê\"); por quê = pergunta no fim da frase<\/td>\n<\/tr>\n<tr>\n<td>sessão / seção / cessão<\/td>\n<td>sessão = reunião; seção = parte, divisão; cessão = ato de ceder<\/td>\n<\/tr>\n<tr>\n<td>acento / assento<\/td>\n<td>acento = sinal gráfico; assento = lugar para sentar<\/td>\n<\/tr>\n<tr>\n<td>concerto / conserto<\/td>\n<td>concerto = espetáculo; conserto = reparo<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Regras de acentuação Proparoxítonas: todas acentuadas (lâmpada, público, ônibus). Paroxítonas: acentuadas quando terminam em l, n, r, x, ps, ã(s), ão(s), i(s), us, um/uns ou ditongo (fácil, hífen, caráter, tórax, bíceps, órfã, órgão, júri, vírus, álbum, história). Não se acentuam as terminadas em a, e, o, em ou ens (casa, jovem, jovens). Oxítonas: acentuadas quando terminam em a(s), e(s), o(s), em/ens (sofá, café, avô, também, parabéns). Monossílabos tônicos: acentuam-se os terminados em a(s), e(s), o(s): pá, pé, nós, já, só. Os átonos (me, de, o) não. Hiato: acentua-se o i e o u tônicos, sozinhos na sílaba ou seguidos de s (saída, baú, país, juízo). Não se acentua se vierem depois de ditongo em paroxítona (feiura, baiuca) ou se forem seguidos de outra consoante na sílaba (ruim, juiz). Ditongos abertos éi, ói, éu: acentuam-se em oxítonas e monossílabos (papéis, herói, céu). Nas paroxítonas, não (ideia, heroico, jiboia). Formas verbais: \"ele tem / eles têm\", \"ele vem / eles vêm\", \"ele mantém / eles mantêm\", \"ele contém / eles contêm\". O que o Acordo Ortográfico mudou Sem trema em palavras portuguesas (frequência, linguiça, cinquenta). Sem acento em \"eem\" e \"oo\": leem, creem, voo, enjoo. Sem acento no u tônico de gue/gui/que/qui (averigue, argui). Sem acento diferencial em para, pela, pelo, pera, polo. Permanecem: pôr (verbo) × por (preposição); pôde (passado) × pode (presente). Dias da semana, meses e estações do ano são escritos com letra minúscula (segunda-feira, janeiro, primavera). Alfabeto: K, W e Y fazem oficialmente parte dele. Hífen Prefixo terminado em vogal + palavra começada pela mesma vogal: hífen (micro-ondas, anti-inflamatório, arqui-inimigo). Prefixo terminado em vogal + palavra com outra vogal: junta (autoescola, extraescolar, infraestrutura). Prefixo + r ou s: junta e dobra a consoante (antissocial, contrarregra, ultrassom, minissaia). Prefixos ex-, vice-, pós-, pré-, pró-, sem-, além-, aquém-, recém-: sempre com hífen (ex-diretor, vice-reitor, pré-escolar, recém-nascido). Prefixo terminado em consoante: hífen só se a palavra começar pela mesma consoante (inter-regional, sub-bibliotecário) ou por h (sub-hepático). Grafias que confundem Par Diferença mas / mais mas = porém; mais = quantidade a fim de / afim a fim de = para; afim = semelhante há / a há = tempo passado ou existir; a = tempo futuro ou distância (\"daqui a dois dias\", \"há dois dias\") onde / aonde onde = lugar em que; aonde = lugar a que (com verbo de movimento) porque / por que / porquê / por quê porque = resposta ou causa; por que = pergunta no meio da frase; porquê = substantivo (\"o porquê\"); por quê = pergunta no fim da frase sessão / seção / cessão sessão = reunião; seção = parte, divisão; cessão = ato de ceder acento / assento acento = sinal gráfico; assento = lugar para sentar concerto / conserto concerto = espetáculo; conserto = reparo"}, {"num": "5", "title": "Coesão e coerência", "html": "<p><strong>Coerência<\/strong> é o sentido lógico do texto: as ideias se encaixam e não se contradizem. <strong>Coesão<\/strong> são os recursos da língua que ligam as partes (pronomes, conectivos, repetição). Um texto pode ter coesão e não ter coerência (frases bem ligadas, mas sem lógica).<\/p>\n<h4>Mecanismos de coesão<\/h4>\n<ul>\n<li><strong>Referencial:<\/strong> retoma ou antecipa. <strong>Anáfora<\/strong> retoma o que já foi dito (\"Maria chegou. <strong>Ela<\/strong> trouxe o bolo.\"). <strong>Catáfora<\/strong> antecipa o que vem depois (\"Ele disse <strong>isto<\/strong>: não volto.\").<\/li>\n<li><strong>Substituição:<\/strong> por sinônimo, pronome ou expressão equivalente (\"o servidor... o profissional... ele\").<\/li>\n<li><strong>Repetição:<\/strong> de palavra-chave, para dar ênfase.<\/li>\n<li><strong>Elipse:<\/strong> omite um termo fácil de recuperar (\"Fui à festa; dancei a noite toda\").<\/li>\n<li><strong>Sequencial:<\/strong> conectivos que indicam a relação entre as partes.<\/li>\n<li><strong>Progressão temática:<\/strong> o texto avança trazendo informação nova sem perder o fio condutor.<\/li>\n<\/ul>\n<h4>Fatores de coerência<\/h4>\n<p>Conhecimento de mundo, não contradição, não tautologia (dizer o óbvio circular: \"subir para cima\"), relevância e continuidade do tema.<\/p>\n<h4>Conectivos e relações de sentido<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Relação<\/th>\n<th>Conectivos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Adição<\/td>\n<td>e, nem, além disso, também, bem como<\/td>\n<\/tr>\n<tr>\n<td>Oposição (adversativa)<\/td>\n<td>mas, porém, contudo, todavia, entretanto, no entanto, não obstante<\/td>\n<\/tr>\n<tr>\n<td>Concessão<\/td>\n<td>embora, ainda que, mesmo que, conquanto, apesar de que, se bem que<\/td>\n<\/tr>\n<tr>\n<td>Causa<\/td>\n<td>porque, visto que, já que, uma vez que, como, pois (antes do verbo)<\/td>\n<\/tr>\n<tr>\n<td>Consequência<\/td>\n<td>de modo que, tanto que, tão... que<\/td>\n<\/tr>\n<tr>\n<td>Conclusão<\/td>\n<td>logo, portanto, por isso, assim, então, pois (depois do verbo)<\/td>\n<\/tr>\n<tr>\n<td>Condição<\/td>\n<td>se, caso, desde que, contanto que, a menos que<\/td>\n<\/tr>\n<tr>\n<td>Finalidade<\/td>\n<td>para que, a fim de que<\/td>\n<\/tr>\n<tr>\n<td>Comparação<\/td>\n<td>como, tal qual, assim como, mais... que<\/td>\n<\/tr>\n<tr>\n<td>Conformidade<\/td>\n<td>conforme, segundo, consoante<\/td>\n<\/tr>\n<tr>\n<td>Tempo<\/td>\n<td>quando, enquanto, assim que, logo que, mal<\/td>\n<\/tr>\n<tr>\n<td>Alternância<\/td>\n<td>ou, ora... ora, quer... quer<\/td>\n<\/tr>\n<tr>\n<td>Explicação<\/td>\n<td>isto é, ou seja, a saber, pois (depois da oração anterior)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> concessão <strong>não<\/strong> é oposição. \"Embora estivesse cansado, terminou\" diz que o fato esperado (parar) <strong>não<\/strong> ocorreu. Troque \"embora\" por \"mas\" e a ordem muda: \"Estava cansado, mas terminou\". Na reescrita, confira sempre o valor do conectivo e o modo do verbo (embora pede subjuntivo).<\/p>\n<\/blockquote>", "text": "Coerência é o sentido lógico do texto: as ideias se encaixam e não se contradizem. Coesão são os recursos da língua que ligam as partes (pronomes, conectivos, repetição). Um texto pode ter coesão e não ter coerência (frases bem ligadas, mas sem lógica). Mecanismos de coesão Referencial: retoma ou antecipa. Anáfora retoma o que já foi dito (\"Maria chegou. Ela trouxe o bolo.\"). Catáfora antecipa o que vem depois (\"Ele disse isto : não volto.\"). Substituição: por sinônimo, pronome ou expressão equivalente (\"o servidor... o profissional... ele\"). Repetição: de palavra-chave, para dar ênfase. Elipse: omite um termo fácil de recuperar (\"Fui à festa; dancei a noite toda\"). Sequencial: conectivos que indicam a relação entre as partes. Progressão temática: o texto avança trazendo informação nova sem perder o fio condutor. Fatores de coerência Conhecimento de mundo, não contradição, não tautologia (dizer o óbvio circular: \"subir para cima\"), relevância e continuidade do tema. Conectivos e relações de sentido Relação Conectivos Adição e, nem, além disso, também, bem como Oposição (adversativa) mas, porém, contudo, todavia, entretanto, no entanto, não obstante Concessão embora, ainda que, mesmo que, conquanto, apesar de que, se bem que Causa porque, visto que, já que, uma vez que, como, pois (antes do verbo) Consequência de modo que, tanto que, tão... que Conclusão logo, portanto, por isso, assim, então, pois (depois do verbo) Condição se, caso, desde que, contanto que, a menos que Finalidade para que, a fim de que Comparação como, tal qual, assim como, mais... que Conformidade conforme, segundo, consoante Tempo quando, enquanto, assim que, logo que, mal Alternância ou, ora... ora, quer... quer Explicação isto é, ou seja, a saber, pois (depois da oração anterior) Cai em prova: concessão não é oposição. \"Embora estivesse cansado, terminou\" diz que o fato esperado (parar) não ocorreu. Troque \"embora\" por \"mas\" e a ordem muda: \"Estava cansado, mas terminou\". Na reescrita, confira sempre o valor do conectivo e o modo do verbo (embora pede subjuntivo)."}, {"num": "6", "title": "Morfossintaxe", "html": "<p>Morfologia estuda as classes de palavras; sintaxe estuda a função delas na frase. Juntas, formam a \"morfossintaxe\".<\/p>\n<h4>Classes de palavras<\/h4>\n<ul>\n<li><strong>Variáveis:<\/strong> substantivo, adjetivo, artigo, numeral, pronome, verbo.<\/li>\n<li><strong>Invariáveis:<\/strong> advérbio, preposição, conjunção, interjeição.<\/li>\n<li><strong>Locução:<\/strong> conjunto de palavras com valor de uma só classe (\"às vezes\" = advérbio).<\/li>\n<\/ul>\n<h4>Formação de palavras<\/h4>\n<ul>\n<li><strong>Derivação:<\/strong> prefixal (infeliz), sufixal (felizmente), parassintética (prefixo <strong>e<\/strong> sufixo ao mesmo tempo: entardecer, anoitecer), regressiva (o choro, a pesca), imprópria (muda de classe: o jantar).<\/li>\n<li><strong>Composição:<\/strong> justaposição (guarda-chuva, girassol) e aglutinação (planalto, embora, fidalgo).<\/li>\n<\/ul>\n<h4>Estrutura da frase<\/h4>\n<ul>\n<li><strong>Frase:<\/strong> enunciado com sentido completo. <strong>Oração:<\/strong> tem verbo. <strong>Período:<\/strong> simples (uma oração) ou composto (duas ou mais).<\/li>\n<li><strong>Termos essenciais:<\/strong> sujeito e predicado. <strong>Integrantes:<\/strong> objeto direto (sem preposição), objeto indireto (com preposição), complemento nominal, agente da passiva. <strong>Acessórios:<\/strong> adjunto adnominal, adjunto adverbial, aposto. <strong>Vocativo<\/strong> é à parte (chama o interlocutor).<\/li>\n<li><strong>Tipos de sujeito:<\/strong> simples, composto, oculto (desinencial), indeterminado (\"Bateram à porta\"; \"Precisa-se de funcionários\") e oração sem sujeito (verbos impessoais: haver existencial, fazer tempo, fenômenos da natureza).<\/li>\n<li><strong>Tipos de predicado:<\/strong> verbal (verbo de ação), nominal (verbo de ligação + predicativo do sujeito: \"Ela está cansada\") e verbo-nominal.<\/li>\n<\/ul>\n<h4>Orações coordenadas e subordinadas<\/h4>\n<ul>\n<li><strong>Coordenadas<\/strong> são independentes: assindéticas (sem conectivo) e sindéticas (aditivas, adversativas, alternativas, conclusivas, explicativas).<\/li>\n<li><strong>Subordinadas<\/strong> dependem de outra: <strong>substantivas<\/strong> (funcionam como substantivo: \"Espero <strong>que você venha<\/strong>\"), <strong>adjetivas<\/strong> (como adjetivo: \"O servidor <strong>que chegou<\/strong> é novo\") e <strong>adverbiais<\/strong> (como advérbio: causa, tempo, concessão...).<\/li>\n<li><strong>Adjetiva restritiva<\/strong> não tem vírgula e restringe (\"Os servidores que faltaram foram punidos\": só alguns). <strong>Explicativa<\/strong> tem vírgula e vale para todos (\"Os servidores, que faltaram, foram punidos\": todos).<\/li>\n<\/ul>\n<h4>Vozes verbais<\/h4>\n<ul>\n<li><strong>Ativa:<\/strong> o sujeito pratica (\"João escreveu a carta\").<\/li>\n<li><strong>Passiva analítica:<\/strong> verbo ser + particípio (\"A carta foi escrita por João\").<\/li>\n<li><strong>Passiva sintética:<\/strong> verbo + \"se\" (\"Escreveu-se a carta\").<\/li>\n<li><strong>Reflexiva:<\/strong> o sujeito pratica e sofre (\"Ele se feriu\").<\/li>\n<\/ul>\n<h4>Pronomes relativos<\/h4>\n<p>Que, quem, o qual, cujo, onde, quanto. \"<strong>Cujo<\/strong>\" indica posse, concorda com o termo que vem depois e não aceita artigo (\"o autor cujo livro li\"). \"<strong>Onde<\/strong>\" só para lugar físico (\"a sala onde trabalho\").<\/p>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> na dúvida entre \"cujo\" e outros relativos, troque por \"de quem / do qual\": \"O autor <strong>de quem<\/strong> o livro li\" → \"cujo livro\".<\/p>\n<\/blockquote>", "text": "Morfologia estuda as classes de palavras; sintaxe estuda a função delas na frase. Juntas, formam a \"morfossintaxe\". Classes de palavras Variáveis: substantivo, adjetivo, artigo, numeral, pronome, verbo. Invariáveis: advérbio, preposição, conjunção, interjeição. Locução: conjunto de palavras com valor de uma só classe (\"às vezes\" = advérbio). Formação de palavras Derivação: prefixal (infeliz), sufixal (felizmente), parassintética (prefixo e sufixo ao mesmo tempo: entardecer, anoitecer), regressiva (o choro, a pesca), imprópria (muda de classe: o jantar). Composição: justaposição (guarda-chuva, girassol) e aglutinação (planalto, embora, fidalgo). Estrutura da frase Frase: enunciado com sentido completo. Oração: tem verbo. Período: simples (uma oração) ou composto (duas ou mais). Termos essenciais: sujeito e predicado. Integrantes: objeto direto (sem preposição), objeto indireto (com preposição), complemento nominal, agente da passiva. Acessórios: adjunto adnominal, adjunto adverbial, aposto. Vocativo é à parte (chama o interlocutor). Tipos de sujeito: simples, composto, oculto (desinencial), indeterminado (\"Bateram à porta\"; \"Precisa-se de funcionários\") e oração sem sujeito (verbos impessoais: haver existencial, fazer tempo, fenômenos da natureza). Tipos de predicado: verbal (verbo de ação), nominal (verbo de ligação + predicativo do sujeito: \"Ela está cansada\") e verbo-nominal. Orações coordenadas e subordinadas Coordenadas são independentes: assindéticas (sem conectivo) e sindéticas (aditivas, adversativas, alternativas, conclusivas, explicativas). Subordinadas dependem de outra: substantivas (funcionam como substantivo: \"Espero que você venha \"), adjetivas (como adjetivo: \"O servidor que chegou é novo\") e adverbiais (como advérbio: causa, tempo, concessão...). Adjetiva restritiva não tem vírgula e restringe (\"Os servidores que faltaram foram punidos\": só alguns). Explicativa tem vírgula e vale para todos (\"Os servidores, que faltaram, foram punidos\": todos). Vozes verbais Ativa: o sujeito pratica (\"João escreveu a carta\"). Passiva analítica: verbo ser + particípio (\"A carta foi escrita por João\"). Passiva sintética: verbo + \"se\" (\"Escreveu-se a carta\"). Reflexiva: o sujeito pratica e sofre (\"Ele se feriu\"). Pronomes relativos Que, quem, o qual, cujo, onde, quanto. \" Cujo \" indica posse, concorda com o termo que vem depois e não aceita artigo (\"o autor cujo livro li\"). \" Onde \" só para lugar físico (\"a sala onde trabalho\"). Macete: na dúvida entre \"cujo\" e outros relativos, troque por \"de quem / do qual\": \"O autor de quem o livro li\" → \"cujo livro\"."}, {"num": "7", "title": "Pontuação, concordância, regência, crase e colocação pronominal", "html": "<h4>Pontuação<\/h4>\n<p><strong>Vírgula.<\/strong> Use em enumerações, aposto, vocativo, adjunto adverbial deslocado (\"Amanhã, o prazo termina\"), oração adjetiva explicativa, antes de \"mas, porém, contudo\", e para isolar conectivos no meio da frase. <strong>Nunca<\/strong> separe sujeito do verbo, verbo do complemento, nome do complemento nominal.<\/p>\n<ul>\n<li><strong>Ponto e vírgula:<\/strong> separa itens longos de enumeração e orações coordenadas mais extensas.<\/li>\n<li><strong>Dois-pontos:<\/strong> anunciam enumeração, explicação ou citação.<\/li>\n<li><strong>Travessão:<\/strong> isola trechos ou marca diálogo. <strong>Aspas:<\/strong> citação, termo estrangeiro, ironia.<\/li>\n<li><strong>Reticências:<\/strong> interrupção, suspense ou dúvida.<\/li>\n<\/ul>\n<h4>Concordância verbal<\/h4>\n<ul>\n<li>O verbo concorda com o sujeito em número e pessoa.<\/li>\n<li><strong>Haver<\/strong> (existir, ocorrer) e <strong>fazer<\/strong> (tempo decorrido) e verbos de fenômeno natural não variam: \"Havia muitas pessoas\", \"Faz dois anos\", \"Choveu muito\".<\/li>\n<li><strong>Passiva sintética<\/strong> concorda com o sujeito paciente: \"Vendem-se casas\". <strong>Índice de indeterminação<\/strong> (verbo sem objeto direto) fica no singular: \"Precisa-se de funcionários\", \"Vive-se bem aqui\".<\/li>\n<li><strong>Sujeito composto<\/strong> antes do verbo: plural (\"Ana e Rui chegaram\"). Depois do verbo, o verbo pode ficar no singular, concordando com o mais próximo.<\/li>\n<li><strong>Coletivo:<\/strong> singular (\"A equipe trabalhou\"). Com \"a maioria de + plural\", admite-se singular ou plural.<\/li>\n<li><strong>Verbo ser:<\/strong> concorda com o predicativo em \"Tudo são flores\", e com o sujeito quando um deles é pessoa. Em indicação de horas e datas, concorda com o número (\"São duas horas\").<\/li>\n<\/ul>\n<h4>Concordância nominal<\/h4>\n<ul>\n<li>Adjetivo e artigo concordam com o substantivo. \"<strong>Anexo<\/strong>\", \"<strong>obrigado<\/strong>\", \"<strong>mesmo<\/strong>\", \"<strong>próprio<\/strong>\", \"<strong>quite<\/strong>\" variam (\"seguem anexas as fotos\"; \"obrigada\", disse ela). \"<strong>Menos<\/strong>\" e \"<strong>alerta<\/strong>\" não variam. \"<strong>Bastante<\/strong>\" varia como adjetivo (\"bastantes dúvidas\") e não como advérbio (\"estou bastante cansada\").<\/li>\n<li>\"<strong>É proibido entrada<\/strong>\" (sentido genérico) × \"<strong>É proibida a entrada<\/strong>\" (com artigo, concorda). Vale para \"é necessário, é bom, é preciso\".<\/li>\n<\/ul>\n<h4>Regência verbal (quem pede preposição)<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Verbo<\/th>\n<th>Sentido e regência<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Assistir<\/td>\n<td>ver: <strong>a<\/strong> (\"assistir <strong>ao<\/strong> filme\"); dar assistência: sem preposição<\/td>\n<\/tr>\n<tr>\n<td>Aspirar<\/td>\n<td>desejar: <strong>a<\/strong>; respirar: sem preposição<\/td>\n<\/tr>\n<tr>\n<td>Visar<\/td>\n<td>objetivar: <strong>a<\/strong>; mirar ou rubricar: sem preposição<\/td>\n<\/tr>\n<tr>\n<td>Obedecer / desobedecer<\/td>\n<td><strong>a<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Chegar / ir<\/td>\n<td><strong>a<\/strong> (não \"em\")<\/td>\n<\/tr>\n<tr>\n<td>Preferir<\/td>\n<td>preferir X <strong>a<\/strong> Y (nunca \"do que\")<\/td>\n<\/tr>\n<tr>\n<td>Implicar<\/td>\n<td>acarretar: sem preposição<\/td>\n<\/tr>\n<tr>\n<td>Informar / avisar<\/td>\n<td>informar alguém <strong>de/sobre<\/strong> algo<\/td>\n<\/tr>\n<tr>\n<td>Esquecer / lembrar<\/td>\n<td>sem preposição; pronominais pedem <strong>de<\/strong> (esqueci-me <strong>de<\/strong> tudo)<\/td>\n<\/tr>\n<tr>\n<td>Namorar, atingir, custar (dificultar)<\/td>\n<td>sem preposição (namorar), com <strong>a<\/strong> (custar <strong>a<\/strong> alguém)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Crase<\/h4>\n<p>Crase é a fusão da preposição <strong>a<\/strong> com o artigo <strong>a<\/strong> (ou com o a inicial de aquele, aquela, aquilo, a qual).<\/p>\n<ul>\n<li><strong>Truque:<\/strong> troque a palavra feminina por uma masculina. Se virar \"ao\", há crase (\"Fui <strong>à<\/strong> escola\" → \"Fui <strong>ao<\/strong> colégio\").<\/li>\n<li><strong>Não ocorre:<\/strong> antes de palavra masculina, de verbo, de pronome pessoal e de tratamento (exceto senhora, senhorita, dona), de expressões com palavras repetidas (cara a cara), de nomes de cidades sem artigo (\"Vou a Salvador\", mas \"Vou à Bahia\").<\/li>\n<li><strong>Ocorre:<\/strong> locuções femininas (\"às vezes\", \"à medida que\", \"à noite\"), indicação de horas (\"às 14h\"), antes de \"moda de\" e \"maneira de\" subentendidos (\"à Machado de Assis\").<\/li>\n<li><strong>Facultativa:<\/strong> antes de nome próprio feminino e de pronome possessivo feminino singular.<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> \"Vou a, volto da → crase há. Vou a, volto de → crase pra quê?\" Se o verbo \"ir\" combinado com \"voltar da\" faz sentido, há crase: vou <strong>à<\/strong> escola, volto <strong>da<\/strong> escola.<\/p>\n<\/blockquote>\n<h4>Colocação pronominal<\/h4>\n<ul>\n<li><strong>Próclise<\/strong> (antes do verbo) com palavra atrativa: negação, pronome relativo/indefinido, advérbio sem vírgula, conjunção subordinativa (\"Não <strong>me<\/strong> disse\", \"Quem <strong>te<\/strong> avisou?\").<\/li>\n<li><strong>Ênclise<\/strong> (depois do verbo) no início da frase e com verbo no infinitivo ou imperativo afirmativo: \"Disse-<strong>me<\/strong>\". Na norma culta, não se começa frase com pronome oblíquo átono.<\/li>\n<li><strong>Mesóclise<\/strong> (no meio) com futuro do presente ou do pretérito, sem atrativo: \"Dir-<strong>te<\/strong>-ei\".<\/li>\n<\/ul>", "text": "Pontuação Vírgula. Use em enumerações, aposto, vocativo, adjunto adverbial deslocado (\"Amanhã, o prazo termina\"), oração adjetiva explicativa, antes de \"mas, porém, contudo\", e para isolar conectivos no meio da frase. Nunca separe sujeito do verbo, verbo do complemento, nome do complemento nominal. Ponto e vírgula: separa itens longos de enumeração e orações coordenadas mais extensas. Dois-pontos: anunciam enumeração, explicação ou citação. Travessão: isola trechos ou marca diálogo. Aspas: citação, termo estrangeiro, ironia. Reticências: interrupção, suspense ou dúvida. Concordância verbal O verbo concorda com o sujeito em número e pessoa. Haver (existir, ocorrer) e fazer (tempo decorrido) e verbos de fenômeno natural não variam: \"Havia muitas pessoas\", \"Faz dois anos\", \"Choveu muito\". Passiva sintética concorda com o sujeito paciente: \"Vendem-se casas\". Índice de indeterminação (verbo sem objeto direto) fica no singular: \"Precisa-se de funcionários\", \"Vive-se bem aqui\". Sujeito composto antes do verbo: plural (\"Ana e Rui chegaram\"). Depois do verbo, o verbo pode ficar no singular, concordando com o mais próximo. Coletivo: singular (\"A equipe trabalhou\"). Com \"a maioria de + plural\", admite-se singular ou plural. Verbo ser: concorda com o predicativo em \"Tudo são flores\", e com o sujeito quando um deles é pessoa. Em indicação de horas e datas, concorda com o número (\"São duas horas\"). Concordância nominal Adjetivo e artigo concordam com o substantivo. \" Anexo \", \" obrigado \", \" mesmo \", \" próprio \", \" quite \" variam (\"seguem anexas as fotos\"; \"obrigada\", disse ela). \" Menos \" e \" alerta \" não variam. \" Bastante \" varia como adjetivo (\"bastantes dúvidas\") e não como advérbio (\"estou bastante cansada\"). \" É proibido entrada \" (sentido genérico) × \" É proibida a entrada \" (com artigo, concorda). Vale para \"é necessário, é bom, é preciso\". Regência verbal (quem pede preposição) Verbo Sentido e regência Assistir ver: a (\"assistir ao filme\"); dar assistência: sem preposição Aspirar desejar: a ; respirar: sem preposição Visar objetivar: a ; mirar ou rubricar: sem preposição Obedecer / desobedecer a Chegar / ir a (não \"em\") Preferir preferir X a Y (nunca \"do que\") Implicar acarretar: sem preposição Informar / avisar informar alguém de/sobre algo Esquecer / lembrar sem preposição; pronominais pedem de (esqueci-me de tudo) Namorar, atingir, custar (dificultar) sem preposição (namorar), com a (custar a alguém) Crase Crase é a fusão da preposição a com o artigo a (ou com o a inicial de aquele, aquela, aquilo, a qual). Truque: troque a palavra feminina por uma masculina. Se virar \"ao\", há crase (\"Fui à escola\" → \"Fui ao colégio\"). Não ocorre: antes de palavra masculina, de verbo, de pronome pessoal e de tratamento (exceto senhora, senhorita, dona), de expressões com palavras repetidas (cara a cara), de nomes de cidades sem artigo (\"Vou a Salvador\", mas \"Vou à Bahia\"). Ocorre: locuções femininas (\"às vezes\", \"à medida que\", \"à noite\"), indicação de horas (\"às 14h\"), antes de \"moda de\" e \"maneira de\" subentendidos (\"à Machado de Assis\"). Facultativa: antes de nome próprio feminino e de pronome possessivo feminino singular. Macete: \"Vou a, volto da → crase há. Vou a, volto de → crase pra quê?\" Se o verbo \"ir\" combinado com \"voltar da\" faz sentido, há crase: vou à escola, volto da escola. Colocação pronominal Próclise (antes do verbo) com palavra atrativa: negação, pronome relativo/indefinido, advérbio sem vírgula, conjunção subordinativa (\"Não me disse\", \"Quem te avisou?\"). Ênclise (depois do verbo) no início da frase e com verbo no infinitivo ou imperativo afirmativo: \"Disse- me \". Na norma culta, não se começa frase com pronome oblíquo átono. Mesóclise (no meio) com futuro do presente ou do pretérito, sem atrativo: \"Dir- te -ei\"."}, {"num": "8", "title": "Semântica", "html": "<p>Semântica estuda o <strong>significado<\/strong> das palavras e das expressões.<\/p>\n<ul>\n<li><strong>Denotação:<\/strong> sentido literal, de dicionário. <strong>Conotação:<\/strong> sentido figurado, que depende do contexto.<\/li>\n<li><strong>Sinônimos:<\/strong> sentidos próximos. <strong>Antônimos:<\/strong> sentidos opostos. <strong>Hiperônimo:<\/strong> mais geral (animal); <strong>hipônimo:<\/strong> mais específico (cachorro).<\/li>\n<li><strong>Polissemia:<\/strong> uma palavra com vários sentidos relacionados (\"manga\" da camisa / da fruta). <strong>Homonímia:<\/strong> palavras diferentes que coincidem na pronúncia ou na escrita (cela/sela; são, são). <strong>Parônimos:<\/strong> parecidos, sentidos diferentes.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Parônimos<\/th>\n<th>Diferença<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>comprimento / cumprimento<\/td>\n<td>tamanho / saudação ou ato de cumprir<\/td>\n<\/tr>\n<tr>\n<td>eminente / iminente<\/td>\n<td>notável / prestes a acontecer<\/td>\n<\/tr>\n<tr>\n<td>ratificar / retificar<\/td>\n<td>confirmar / corrigir<\/td>\n<\/tr>\n<tr>\n<td>descriminar / discriminar<\/td>\n<td>tirar a culpa / separar, tratar diferente<\/td>\n<\/tr>\n<tr>\n<td>infringir / infligir<\/td>\n<td>desrespeitar (lei) / aplicar (pena)<\/td>\n<\/tr>\n<tr>\n<td>emergir / imergir<\/td>\n<td>sair de dentro / entrar<\/td>\n<\/tr>\n<tr>\n<td>deferir / diferir<\/td>\n<td>conceder / adiar ou ser diferente<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Ambiguidade:<\/strong> duplo sentido, geralmente defeito (\"Vi o rapaz correndo\": quem corria?).<\/li>\n<li><strong>Figuras de linguagem:<\/strong> a retificação retirou a lista de exemplos, mas o tópico continua. As principais: <strong>metáfora<\/strong> (comparação implícita: \"o tempo é um rio\"), <strong>comparação<\/strong> (com \"como\"), <strong>metonímia<\/strong> (troca por relação: \"li Machado\", o autor pela obra), <strong>catacrese<\/strong> (metáfora já incorporada: \"pé da mesa\"), <strong>hipérbole<\/strong> (exagero), <strong>ironia<\/strong> (diz o contrário), <strong>antítese<\/strong> (opostos), <strong>paradoxo<\/strong> (contradição aparente), <strong>eufemismo<\/strong> (suaviza), <strong>personificação<\/strong> (humaniza), <strong>gradação<\/strong> (sequência crescente ou decrescente).<\/li>\n<\/ul>", "text": "Semântica estuda o significado das palavras e das expressões. Denotação: sentido literal, de dicionário. Conotação: sentido figurado, que depende do contexto. Sinônimos: sentidos próximos. Antônimos: sentidos opostos. Hiperônimo: mais geral (animal); hipônimo: mais específico (cachorro). Polissemia: uma palavra com vários sentidos relacionados (\"manga\" da camisa / da fruta). Homonímia: palavras diferentes que coincidem na pronúncia ou na escrita (cela/sela; são, são). Parônimos: parecidos, sentidos diferentes. Parônimos Diferença comprimento / cumprimento tamanho / saudação ou ato de cumprir eminente / iminente notável / prestes a acontecer ratificar / retificar confirmar / corrigir descriminar / discriminar tirar a culpa / separar, tratar diferente infringir / infligir desrespeitar (lei) / aplicar (pena) emergir / imergir sair de dentro / entrar deferir / diferir conceder / adiar ou ser diferente Ambiguidade: duplo sentido, geralmente defeito (\"Vi o rapaz correndo\": quem corria?). Figuras de linguagem: a retificação retirou a lista de exemplos, mas o tópico continua. As principais: metáfora (comparação implícita: \"o tempo é um rio\"), comparação (com \"como\"), metonímia (troca por relação: \"li Machado\", o autor pela obra), catacrese (metáfora já incorporada: \"pé da mesa\"), hipérbole (exagero), ironia (diz o contrário), antítese (opostos), paradoxo (contradição aparente), eufemismo (suaviza), personificação (humaniza), gradação (sequência crescente ou decrescente)."}, {"num": "9", "title": "Reescrita de frases e textos", "html": "<p>A questão apresenta uma frase reescrita e pergunta se <strong>manteve o sentido<\/strong> e se <strong>continua correta<\/strong>. Confira, nesta ordem:<\/p>\n<ol>\n<li>O novo conectivo tem o <strong>mesmo valor<\/strong> do antigo (causa, concessão, condição)?<\/li>\n<li><strong>Concordância, regência e crase<\/strong> continuam certas depois da troca?<\/li>\n<li>A <strong>pontuação<\/strong> mudou o sentido (vírgula antes ou depois muda quem faz o quê)?<\/li>\n<li>O <strong>nível de formalidade<\/strong> continua adequado?<\/li>\n<li>A <strong>ordem das palavras<\/strong> mudou o sentido? (\"Só ele comprou\" × \"Ele só comprou\").<\/li>\n<\/ol>\n<h4>Transformações frequentes<\/h4>\n<ul>\n<li><strong>Voz ativa ↔ passiva:<\/strong> \"O diretor assinou o ofício\" ↔ \"O ofício foi assinado pelo diretor\". O sentido se mantém.<\/li>\n<li><strong>Oração ↔ expressão nominal:<\/strong> \"Quando chegou, avisou\" ↔ \"Na chegada, avisou\".<\/li>\n<li><strong>Discurso direto ↔ indireto:<\/strong> muda pessoa, tempo verbal e pronomes.<\/li>\n<li><strong>Deslocar termos<\/strong> é possível, mas a vírgula acompanha o termo deslocado.<\/li>\n<li><strong>Troca de \"mas\" por \"embora\"<\/strong> inverte quem fica em primeiro plano: confira o sentido.<\/li>\n<\/ul>\n<blockquote class=\"warn\">\n<p><strong>Atenção:<\/strong> trocar \"porque\" por \"pois\" é válido quando \"pois\" vem antes do verbo (explicativo). Depois do verbo, \"pois\" vira conclusivo e muda o sentido.<\/p>\n<\/blockquote>", "text": "A questão apresenta uma frase reescrita e pergunta se manteve o sentido e se continua correta . Confira, nesta ordem: O novo conectivo tem o mesmo valor do antigo (causa, concessão, condição)? Concordância, regência e crase continuam certas depois da troca? A pontuação mudou o sentido (vírgula antes ou depois muda quem faz o quê)? O nível de formalidade continua adequado? A ordem das palavras mudou o sentido? (\"Só ele comprou\" × \"Ele só comprou\"). Transformações frequentes Voz ativa ↔ passiva: \"O diretor assinou o ofício\" ↔ \"O ofício foi assinado pelo diretor\". O sentido se mantém. Oração ↔ expressão nominal: \"Quando chegou, avisou\" ↔ \"Na chegada, avisou\". Discurso direto ↔ indireto: muda pessoa, tempo verbal e pronomes. Deslocar termos é possível, mas a vírgula acompanha o termo deslocado. Troca de \"mas\" por \"embora\" inverte quem fica em primeiro plano: confira o sentido. Atenção: trocar \"porque\" por \"pois\" é válido quando \"pois\" vem antes do verbo (explicativo). Depois do verbo, \"pois\" vira conclusivo e muda o sentido."}, {"num": "10", "title": "Variação linguística", "html": "<p>Não existe \"erro\" na variação; existe <strong>adequação<\/strong> ao contexto. A língua muda no espaço, na sociedade, na situação e no tempo.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Variação<\/th>\n<th>Depende de<\/th>\n<th>Exemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Regional (diatópica)<\/td>\n<td>Lugar<\/td>\n<td>\"mandioca / aipim / macaxeira\"<\/td>\n<\/tr>\n<tr>\n<td>Social (diastrática)<\/td>\n<td>Grupo, escolaridade, profissão<\/td>\n<td>Gírias, jargão jurídico<\/td>\n<\/tr>\n<tr>\n<td>Situacional ou de registro (diafásica)<\/td>\n<td>Situação e grau de formalidade<\/td>\n<td>\"Vossa Senhoria\" × \"e aí, beleza?\"<\/td>\n<\/tr>\n<tr>\n<td>Histórica (diacrônica)<\/td>\n<td>Época<\/td>\n<td>\"vosmecê\" → \"você\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Norma-padrão<\/strong> é o modelo prescrito nas gramáticas; <strong>norma culta<\/strong> é o uso real de pessoas escolarizadas; <strong>linguagem coloquial<\/strong> é a do dia a dia. Preconceito linguístico é julgar a fala pela origem de quem fala.<\/li>\n<li><strong>Registro formal<\/strong> para documentos oficiais; <strong>informal<\/strong> entre amigos. <strong>Jargão<\/strong> é a linguagem de uma profissão; <strong>gíria<\/strong>, de um grupo.<\/li>\n<\/ul>", "text": "Não existe \"erro\" na variação; existe adequação ao contexto. A língua muda no espaço, na sociedade, na situação e no tempo. Variação Depende de Exemplo Regional (diatópica) Lugar \"mandioca / aipim / macaxeira\" Social (diastrática) Grupo, escolaridade, profissão Gírias, jargão jurídico Situacional ou de registro (diafásica) Situação e grau de formalidade \"Vossa Senhoria\" × \"e aí, beleza?\" Histórica (diacrônica) Época \"vosmecê\" → \"você\" Norma-padrão é o modelo prescrito nas gramáticas; norma culta é o uso real de pessoas escolarizadas; linguagem coloquial é a do dia a dia. Preconceito linguístico é julgar a fala pela origem de quem fala. Registro formal para documentos oficiais; informal entre amigos. Jargão é a linguagem de uma profissão; gíria , de um grupo."}, {"num": "11", "title": "Redação Oficial (Manual da Presidência, 3ª ed.)", "html": "<p>Comunicação escrita do poder público. Segue o <strong>Manual de Redação da Presidência da República (3ª edição)<\/strong>.<\/p>\n<h4>Atributos (o que um texto oficial precisa ter)<\/h4>\n<p>Clareza, precisão, objetividade, concisão, coesão, coerência, <strong>impessoalidade<\/strong>, <strong>formalidade<\/strong> e <strong>padronização<\/strong> (uso da norma culta). A impessoalidade impede marcas pessoais: o texto fala em nome do órgão, não do servidor. Evite gírias, regionalismos e estrangeirismos desnecessários.<\/p>\n<h4>Padrão ofício<\/h4>\n<p>Na 3ª edição, <strong>aviso<\/strong> e <strong>memorando<\/strong> deixaram de ser espécies separadas. Todos seguem o \"padrão ofício\" e se chamam <strong>ofício<\/strong>. Outras espécies: <strong>mensagem<\/strong>, <strong>telegrama<\/strong>, <strong>e-mail<\/strong>, <strong>exposição de motivos<\/strong>, <strong>portaria<\/strong>, <strong>requerimento<\/strong>, <strong>ata<\/strong>, <strong>relatório<\/strong>, <strong>parecer<\/strong>, <strong>despacho<\/strong>.<\/p>\n<ul>\n<li><strong>Estrutura do ofício:<\/strong> identificação (Ofício nº 123/2026/SIGLA), local e data, destinatário (nome e cargo), assunto (resumo em uma linha), texto (introdução, desenvolvimento, conclusão), fecho, assinatura (nome e cargo).<\/li>\n<li><strong>Texto:<\/strong> a introdução apresenta o motivo; o desenvolvimento detalha; a conclusão fecha. Parágrafos numerados quando longos.<\/li>\n<li><strong>Fechos:<\/strong> apenas dois. \"<strong>Respeitosamente<\/strong>\" para autoridades superiores; \"<strong>Atenciosamente<\/strong>\" para mesma hierarquia ou inferior.<\/li>\n<li><strong>Forma de tratamento no texto:<\/strong> verbo e possessivo na <strong>3ª pessoa<\/strong> (\"Vossa Excelência sabe que seu pedido...\"). O adjetivo concorda com o sexo da pessoa (\"Vossa Excelência está <strong>atento<\/strong>\" para homem, \"<strong>atenta<\/strong>\" para mulher).<\/li>\n<li>A 3ª edição aboliu \"Digníssimo\" e \"Ilustríssimo\". \"Doutor\" <strong>não<\/strong> é pronome de tratamento: é título acadêmico.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Pronome<\/th>\n<th>Para quem<\/th>\n<t
