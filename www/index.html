<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="version.js"></script>
<title>Caderno do Cargo 201</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fichário de estudo. Índice com abas coloridas à esquerda, folha de leitura à direita, um tópico por vez. */
:root {
  --paper: #F3F5F8;
  --sheet: #FFFFFF;
  --ink: #18202F;
  --muted: #5A6476;
  --line: #DCE1E9;
  --soft: #E9EDF3;
  --accent: #2446C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FB;
  --hl: rgba(255, 210, 0, .5);
  --ok: #157A4E;
  --ok-soft: #DDF3E7;
  --bad: #B83D12;
  --bad-soft: #FBE6DC;
  --tab-ink: #18202F;
  --t-portugues: #FFD3A6;
  --t-informatica: #A9E4F5;
  --t-adm-publica: #C9BCFF;
  --t-direito-adm: #FFC4C4;
  --t-administracao: #B8EFC6;
  --t-gestao-pessoas: #FDC2DD;
  --t-materiais: #FFE88F;
  --t-arquivologia: #CFE6A0;
  --t-atendimento: #B5D4FF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --read-size: 1.0625rem;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E121A; --sheet: #161B26; --ink: #E4E8EF; --muted: #9AA3B4; --line: #283041; --soft: #1D2330;
    --accent: #86A2FF; --accent-ink: #0E121A; --accent-soft: #1F2A4A; --hl: rgba(250, 204, 21, .26);
    --ok: #5BD69A; --ok-soft: #12301F; --bad: #FF9A6B; --bad-soft: #3A1E12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E121A; --sheet: #161B26; --ink: #E4E8EF; --muted: #9AA3B4; --line: #283041; --soft: #1D2330;
  --accent: #86A2FF; --accent-ink: #0E121A; --accent-soft: #1F2A4A; --hl: rgba(250, 204, 21, .26);
  --ok: #5BD69A; --ok-soft: #12301F; --bad: #FF9A6B; --bad-soft: #3A1E12; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-display); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app {
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px;
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}

/* ---------- Índice ---------- */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
.brand small { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand strong { font-weight: 800; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
.search { position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sheet); color: var(--ink); font: inherit; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.navgroup { display: flex; flex-direction: column; gap: 4px; }
.navgroup h3 { margin: 0 0 4px; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.navitem { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.navitem:hover { background: var(--soft); }
.navitem[aria-current="page"] { background: var(--sheet); box-shadow: 0 0 0 1px var(--line); }
.navitem .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--tab); }
.navitem .nm { font-weight: 500; font-size: 14px; line-height: 1.25; }
.navitem .ct { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.navitem .ct.full { color: var(--ok); }
.homebtn { font-weight: 500; }
.sidefoot { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.sync { display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
.sync i { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
.sync[data-state="ok"] i { background: var(--ok); }
.sync[data-state="saving"] i { background: var(--accent); }
.sync[data-state="err"] i { background: var(--bad); }
.account { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius); background: var(--sheet); border: 1px solid var(--line); }
.account .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.account .who > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.account img { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); flex: none; }
.account b { font-size: 15px; overflow-wrap: anywhere; }
.account .sync { font-size: 12.5px; color: var(--muted); }
.account .pitch { margin: 0; font-size: 13.5px; color: var(--muted); }
.account .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.account .btn { padding: 8px 14px; }
.mini { padding: 6px 10px; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
.appbox { display: flex; flex-direction: column; gap: 8px; }
.appbox .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.code { font-family: var(--f-mono); font-size: clamp(30px, 8vw, 44px); font-weight: 500; letter-spacing: .12em; padding: 14px 18px; border-radius: var(--radius); background: var(--soft); align-self: flex-start; user-select: all; }
.steps { margin: 0; padding-left: 1.3em; font-family: var(--f-read); font-size: var(--read-size); line-height: 1.7; }
.sizectl { display: flex; align-items: center; gap: 6px; }
.sizectl button { width: 32px; height: 28px; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; cursor: pointer; font-weight: 700; }

/* ---------- Barra superior (celular) ---------- */
.topbar { display: none; }
.scrim { display: none; }

/* ---------- Área principal ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h1, h2 { text-wrap: balance; }

/* Início */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.hero h1 { margin: 0; font-weight: 800; font-size: clamp(30px, 4.6vw, 46px); line-height: 1.02; letter-spacing: -.035em; max-width: 18ch; }
.hero p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 16px; }
.meter { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
.meter .big { font-weight: 800; font-size: 28px; letter-spacing: -.02em; }
.bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.continue { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--radius); background: var(--accent-soft); }
.continue div { display: flex; flex-direction: column; min-width: 0; }
.continue b { font-size: 15.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--sheet); border-color: var(--line); }
.btn.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn:disabled { opacity: .4; cursor: default; }

.sectionhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 10px; }
.sectionhead h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 16px; }
.folder { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; padding-top: 18px; border-radius: 0 var(--radius) var(--radius) var(--radius); background: var(--sheet); border: 1px solid var(--line); cursor: pointer; text-align: left; margin-top: 14px; transition: transform .15s ease, box-shadow .15s ease; }
.folder::before { content: attr(data-tab); position: absolute; left: -1px; top: -24px; height: 24px; padding: 3px 12px 0; border-radius: 8px 8px 0 0; background: var(--tab); color: var(--tab-ink); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.folder:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -10px rgba(10, 20, 40, .35); }
.folder h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.folder .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.folder .bar { height: 6px; }
.folder .bar > i { background: var(--ink); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.note { padding: 16px 18px; border-radius: var(--radius); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.note h3 { margin: 0; font-size: 15px; font-weight: 700; }
.note p, .note ul { margin: 0; font-family: var(--f-read); font-size: 15px; line-height: 1.6; }
.note ul { padding-left: 18px; }
.note s { color: var(--bad); }
.note ins { text-decoration: none; color: var(--bad); font-weight: 600; }

/* Matéria */
.mhead { display: flex; flex-direction: column; gap: 10px; }
.tabchip { align-self: flex-start; padding: 3px 10px; border-radius: 6px; background: var(--tab); color: var(--tab-ink); font-family: var(--f-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; }
.mhead h1 { margin: 0; font-size: clamp(26px, 3.6vw, 36px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.mhead p { margin: 0; color: var(--muted); max-width: 62ch; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-width: 38px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.pill[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pill.quiz { font-family: var(--f-display); font-weight: 700; }

.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 40px); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sheet .kicker { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sheet h2 { margin: 0; font-size: clamp(22px, 2.8vw, 28px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.read { font-family: var(--f-read); font-size: var(--read-size); line-height: 1.7; max-width: 68ch; min-width: 0; }
.read > * { margin: 0 0 1em; }
.read > *:last-child { margin-bottom: 0; }
.read ul, .read ol { padding-left: 1.3em; }
.read li { margin-bottom: .45em; }
.read li > p { margin: 0; }
.read strong { font-weight: 600; background: linear-gradient(transparent 58%, var(--hl) 58%); padding: 0 1px; }
.read em { font-style: italic; }
.read a { color: var(--accent); }
.read code { font-family: var(--f-mono); font-size: .88em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
.read table { border-collapse: collapse; width: 100%; font-size: .9em; line-height: 1.45; }
.read th { text-align: left; font-family: var(--f-display); font-weight: 700; font-size: .86em; letter-spacing: .02em; background: var(--soft); }
.read th, .read td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.read tr:last-child td { border-bottom: 0; }
.read td:first-child { font-weight: 600; }
.read mark { background: var(--hl); color: inherit; padding: 0 1px; border-radius: 2px; }
.sheetfoot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.sheetfoot .nav { display: flex; gap: 8px; }

/* Quiz */
.qlist { display: flex; flex-direction: column; gap: 22px; }
.q { display: flex; flex-direction: column; gap: 10px; }
.q p.stem { margin: 0; font-family: var(--f-read); font-size: var(--read-size); line-height: 1.55; }
.q p.stem b { font-family: var(--f-mono); font-weight: 500; font-size: .8em; color: var(--muted); margin-right: 6px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 15px; }
.opt span:first-child { font-family: var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.exp { margin: 0; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--soft); }
.exp b.r { color: var(--ok); } .exp b.w { color: var(--bad); }
.score { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }

/* Busca */
.results { display: flex; flex-direction: column; gap: 10px; }
.hit { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--sheet); border: 1px solid var(--line); text-align: left; cursor: pointer; }
.hit:hover { border-color: var(--accent); }
.hit .where { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.hit .where i { width: 10px; height: 10px; border-radius: 3px; background: var(--tab); }
.hit b { font-size: 15.5px; }
.hit p { margin: 0; font-family: var(--f-read); font-size: 14px; color: var(--muted); }
.hit mark { background: var(--hl); color: var(--ink); }
.empty { color: var(--muted); }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 40px; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; background: var(--paper); }
  .topbar strong { font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
  .menubtn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; cursor: pointer; font-weight: 700; }
  .side { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); max-height: none; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); background: var(--paper); border-right: 1px solid var(--line); transform: translateX(-105%); transition: transform .25s ease; }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgba(8, 12, 20, .45); }
  .scrim.open { display: block; }
  .sheetfoot .nav { width: 100%; }
  .sheetfoot .nav .btn { flex: 1; }
  .sheetfoot > .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="menubtn" id="menuBtn" aria-controls="side" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Matérias
    </button>
    <strong>Cargo 201</strong>
  </div>
  <div class="scrim" id="scrim"></div>

  <aside class="side" id="side">
    <button class="brand" id="brand" type="button">
      <small>UFBA 2026 · Classe D</small>
      <strong>Caderno do Cargo 201</strong>
    </button>
    <div class="account" id="account">
      <div class="who" id="who" hidden><img id="avatar" alt=""><div><b id="login"></b><span class="sync" id="sync" data-state="wait"><i></i><span id="syncText"></span></span></div></div>
      <p class="pitch" id="pitch">Entre com o GitHub para salvar seu progresso e continuar em qualquer aparelho.</p>
      <div class="acts"><button class="btn primary" type="button" id="loginBtn">Entrar com GitHub</button><button class="mini" type="button" id="syncBtn" hidden>Sincronizar agora</button><button class="mini" type="button" id="logoutBtn" hidden>Sair</button></div>
    </div>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar: crase, LGPD, PEPS…" autocomplete="off" aria-label="Buscar no conteúdo">
    </label>
    <div class="navgroup">
      <button class="navitem homebtn" id="navHome" type="button"><span class="dot" style="--tab: var(--ink)"></span><span class="nm">Visão geral</span><span class="ct" id="navHomeCt"></span></button>
    </div>
    <div class="navgroup" id="navComum"><h3>Conhecimentos comuns</h3></div>
    <div class="navgroup" id="navEsp"><h3>Conhecimentos específicos</h3></div>
    <div class="sidefoot">
      <div class="sizectl"><span>Tamanho do texto</span><button id="fsDown" type="button" aria-label="Diminuir texto">A−</button><button id="fsUp" type="button" aria-label="Aumentar texto">A+</button></div>
      <div class="appbox">
        <div class="row"><span>Versão <b id="appVer">dev</b></span><button class="mini" type="button" id="updBtn">Checar atualização</button></div>
        <span id="updText"></span>
        <button class="btn primary" type="button" id="updGet" hidden>Baixar e instalar</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
const DATA = [{"id": "portugues", "nome": "Língua Portuguesa", "bloco": "Comum", "lead": "O foco é gramática aplicada ao texto: entender o sentido, reescrever sem erro e dominar a Redação Oficial.", "topics": [{"num": "1", "title": "Interpretação de textos", "html": "<ul>\n<li><strong>Ideia central:<\/strong> o que o texto defende ou informa como um todo. <strong>Ideias periféricas:<\/strong> exemplos e detalhes que sustentam a central.<\/li>\n<li><strong>Inferência:<\/strong> conclusão que o texto permite tirar sem dizer com todas as letras. Ir além do que o texto autoriza é extrapolação, e isso é erro.<\/li>\n<li><strong>Intenção comunicativa:<\/strong> informar, convencer, instruir ou emocionar.<\/li>\n<li>Dica de prova: desconfie de alternativas com \"sempre\", \"nunca\", \"todos\", \"somente\".<\/li>\n<\/ul>", "text": "Ideia central: o que o texto defende ou informa como um todo. Ideias periféricas: exemplos e detalhes que sustentam a central. Inferência: conclusão que o texto permite tirar sem dizer com todas as letras. Ir além do que o texto autoriza é extrapolação, e isso é erro. Intenção comunicativa: informar, convencer, instruir ou emocionar. Dica de prova: desconfie de alternativas com \"sempre\", \"nunca\", \"todos\", \"somente\"."}, {"num": "2", "title": "Tipologia textual", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>O que faz<\/th>\n<th>Marcas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Narração<\/td>\n<td>Conta fatos no tempo<\/td>\n<td>Personagens, tempo, verbos no passado<\/td>\n<\/tr>\n<tr>\n<td>Descrição<\/td>\n<td>Retrata seres, lugares, objetos<\/td>\n<td>Adjetivos, verbos de estado<\/td>\n<\/tr>\n<tr>\n<td>Dissertação-argumentativa<\/td>\n<td>Defende um ponto de vista<\/td>\n<td>Tese, argumentos, conectivos<\/td>\n<\/tr>\n<tr>\n<td>Exposição<\/td>\n<td>Explica ou informa sem opinar<\/td>\n<td>Definições, dados, linguagem neutra<\/td>\n<\/tr>\n<tr>\n<td>Injunção<\/td>\n<td>Instrui, manda fazer<\/td>\n<td>Verbos no imperativo (receitas, manuais)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Tipo O que faz Marcas Narração Conta fatos no tempo Personagens, tempo, verbos no passado Descrição Retrata seres, lugares, objetos Adjetivos, verbos de estado Dissertação-argumentativa Defende um ponto de vista Tese, argumentos, conectivos Exposição Explica ou informa sem opinar Definições, dados, linguagem neutra Injunção Instrui, manda fazer Verbos no imperativo (receitas, manuais)"}, {"num": "3", "title": "Gêneros textuais", "html": "<p>Gênero é a forma concreta em que o texto circula: notícia, receita, e-mail, ofício, editorial, bula. Tipo é a sequência que predomina dentro dele. Exemplo: receita é o gênero; injunção é o tipo. Um mesmo gênero pode misturar vários tipos.<\/p>", "text": "Gênero é a forma concreta em que o texto circula: notícia, receita, e-mail, ofício, editorial, bula. Tipo é a sequência que predomina dentro dele. Exemplo: receita é o gênero; injunção é o tipo. Um mesmo gênero pode misturar vários tipos."}, {"num": "4", "title": "Ortografia e acentuação", "html": "<ul>\n<li><strong>Proparoxítonas:<\/strong> todas acentuadas (lâmpada, público).<\/li>\n<li><strong>Paroxítonas:<\/strong> acentuadas quando terminam em l, n, r, x, ps, ã(s), ão(s), i(s), us, um/uns ou ditongo (fácil, hífen, caráter, tórax, órfã, júri, vírus, álbum, história).<\/li>\n<li><strong>Oxítonas:<\/strong> acentuadas quando terminam em a(s), e(s), o(s), em/ens (sofá, café, avô, também).<\/li>\n<li><strong>Monossílabos tônicos:<\/strong> a, e, o (pá, pé, pó).<\/li>\n<li><strong>Hiato com i/u tônico:<\/strong> acentua (saída, baú), mas não depois de ditongo em paroxítona (feiura).<\/li>\n<li><strong>O que o Acordo mudou:<\/strong> sem acento em ditongo aberto ei/oi de paroxítona (ideia, heroico); sem trema (frequência); sem acento em \"eem\" e \"oo\" (leem, voo); fim do diferencial em para, pelo, pera (ficaram pôr e pôde).<\/li>\n<li><strong>Hífen com prefixo:<\/strong> vogal igual separa (micro-ondas); vogal diferente junta (autoescola); antes de r ou s, junta e dobra (antissocial, contrarregra).<\/li>\n<\/ul>", "text": "Proparoxítonas: todas acentuadas (lâmpada, público). Paroxítonas: acentuadas quando terminam em l, n, r, x, ps, ã(s), ão(s), i(s), us, um/uns ou ditongo (fácil, hífen, caráter, tórax, órfã, júri, vírus, álbum, história). Oxítonas: acentuadas quando terminam em a(s), e(s), o(s), em/ens (sofá, café, avô, também). Monossílabos tônicos: a, e, o (pá, pé, pó). Hiato com i/u tônico: acentua (saída, baú), mas não depois de ditongo em paroxítona (feiura). O que o Acordo mudou: sem acento em ditongo aberto ei/oi de paroxítona (ideia, heroico); sem trema (frequência); sem acento em \"eem\" e \"oo\" (leem, voo); fim do diferencial em para, pelo, pera (ficaram pôr e pôde). Hífen com prefixo: vogal igual separa (micro-ondas); vogal diferente junta (autoescola); antes de r ou s, junta e dobra (antissocial, contrarregra)."}, {"num": "5", "title": "Coesão e coerência", "html": "<p>Coerência é o sentido lógico do texto. Coesão são as ligações gramaticais entre as partes.<\/p>\n<ul>\n<li><strong>Anáfora:<\/strong> retoma o que já foi dito (\"Maria chegou. <strong>Ela<\/strong> trouxe o bolo.\").<\/li>\n<li><strong>Catáfora:<\/strong> antecipa o que vem depois (\"Ele disse <strong>isto<\/strong>: não volto.\").<\/li>\n<li><strong>Substituição<\/strong> (sinônimo, pronome), <strong>repetição<\/strong> e <strong>elipse<\/strong> (omitir termo fácil de recuperar: \"Fui à festa; dancei a noite toda\").<\/li>\n<li><strong>Progressão temática:<\/strong> o texto avança trazendo informação nova sem perder o fio.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Relação<\/th>\n<th>Conectivos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Adição<\/td>\n<td>e, além disso, também, nem<\/td>\n<\/tr>\n<tr>\n<td>Oposição (adversativa)<\/td>\n<td>mas, porém, contudo, todavia, entretanto, no entanto<\/td>\n<\/tr>\n<tr>\n<td>Concessão<\/td>\n<td>embora, ainda que, mesmo que, conquanto<\/td>\n<\/tr>\n<tr>\n<td>Causa<\/td>\n<td>porque, visto que, já que, uma vez que<\/td>\n<\/tr>\n<tr>\n<td>Conclusão<\/td>\n<td>logo, portanto, por isso, assim<\/td>\n<\/tr>\n<tr>\n<td>Condição<\/td>\n<td>se, caso, desde que<\/td>\n<\/tr>\n<tr>\n<td>Finalidade<\/td>\n<td>para que, a fim de que<\/td>\n<\/tr>\n<tr>\n<td>Explicação<\/td>\n<td>pois (antes do verbo), porque<\/td>\n<\/tr>\n<tr>\n<td>Conclusão com \"pois\"<\/td>\n<td>pois (depois do verbo, entre vírgulas): \"Estudou; passará, pois.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Coerência é o sentido lógico do texto. Coesão são as ligações gramaticais entre as partes. Anáfora: retoma o que já foi dito (\"Maria chegou. Ela trouxe o bolo.\"). Catáfora: antecipa o que vem depois (\"Ele disse isto : não volto.\"). Substituição (sinônimo, pronome), repetição e elipse (omitir termo fácil de recuperar: \"Fui à festa; dancei a noite toda\"). Progressão temática: o texto avança trazendo informação nova sem perder o fio. Relação Conectivos Adição e, além disso, também, nem Oposição (adversativa) mas, porém, contudo, todavia, entretanto, no entanto Concessão embora, ainda que, mesmo que, conquanto Causa porque, visto que, já que, uma vez que Conclusão logo, portanto, por isso, assim Condição se, caso, desde que Finalidade para que, a fim de que Explicação pois (antes do verbo), porque Conclusão com \"pois\" pois (depois do verbo, entre vírgulas): \"Estudou; passará, pois.\""}, {"num": "6", "title": "Morfossintaxe", "html": "<ul>\n<li><strong>10 classes de palavras:<\/strong> substantivo, adjetivo, artigo, numeral, pronome, verbo, advérbio, preposição, conjunção, interjeição.<\/li>\n<li><strong>Formação:<\/strong> derivação (prefixal: infeliz; sufixal: felizmente; parassintética: entardecer; regressiva: o choro; imprópria: o jantar) e composição (justaposição: guarda-chuva, girassol; aglutinação: planalto, embora).<\/li>\n<li><strong>Frase<\/strong> tem sentido completo; <strong>oração<\/strong> tem verbo; <strong>período<\/strong> simples tem 1 oração, composto tem 2 ou mais.<\/li>\n<li><strong>Termos essenciais:<\/strong> sujeito e predicado. <strong>Integrantes:<\/strong> objeto direto, objeto indireto, complemento nominal, agente da passiva. <strong>Acessórios:<\/strong> adjunto adnominal, adjunto adverbial, aposto. O vocativo fica à parte.<\/li>\n<li><strong>Coordenação:<\/strong> orações independentes (aditivas, adversativas, alternativas, conclusivas, explicativas). <strong>Subordinação:<\/strong> uma depende da outra (substantivas, adjetivas, adverbiais).<\/li>\n<li><strong>Vozes verbais:<\/strong> ativa (\"João escreveu a carta\"); passiva analítica (\"A carta foi escrita por João\"); passiva sintética (\"Escreveu-se a carta\"); reflexiva (\"Ele se feriu\").<\/li>\n<li><strong>Pronomes relativos:<\/strong> que, quem, o qual, cujo, onde. \"Cujo\" indica posse e não aceita artigo depois (\"o autor cujo livro li\"). \"Onde\" só para lugar físico.<\/li>\n<\/ul>", "text": "10 classes de palavras: substantivo, adjetivo, artigo, numeral, pronome, verbo, advérbio, preposição, conjunção, interjeição. Formação: derivação (prefixal: infeliz; sufixal: felizmente; parassintética: entardecer; regressiva: o choro; imprópria: o jantar) e composição (justaposição: guarda-chuva, girassol; aglutinação: planalto, embora). Frase tem sentido completo; oração tem verbo; período simples tem 1 oração, composto tem 2 ou mais. Termos essenciais: sujeito e predicado. Integrantes: objeto direto, objeto indireto, complemento nominal, agente da passiva. Acessórios: adjunto adnominal, adjunto adverbial, aposto. O vocativo fica à parte. Coordenação: orações independentes (aditivas, adversativas, alternativas, conclusivas, explicativas). Subordinação: uma depende da outra (substantivas, adjetivas, adverbiais). Vozes verbais: ativa (\"João escreveu a carta\"); passiva analítica (\"A carta foi escrita por João\"); passiva sintética (\"Escreveu-se a carta\"); reflexiva (\"Ele se feriu\"). Pronomes relativos: que, quem, o qual, cujo, onde. \"Cujo\" indica posse e não aceita artigo depois (\"o autor cujo livro li\"). \"Onde\" só para lugar físico."}, {"num": "7", "title": "Pontuação, concordância, regência, crase e colocação", "html": "<p><strong>Vírgula.<\/strong> Nunca separe sujeito do verbo nem verbo do complemento. Use em enumerações, aposto, vocativo, adjunto adverbial deslocado, oração adjetiva explicativa, antes de \"mas/porém\" e para isolar conectivos no meio da frase.<\/p>\n<p><strong>Concordância verbal.<\/strong><\/p>\n<ul>\n<li>\"Haver\" no sentido de existir e \"fazer\" indicando tempo não variam: \"Havia muitas pessoas\", \"Faz dois anos\".<\/li>\n<li>Passiva sintética concorda: \"Vendem-se casas\". Índice de indeterminação fica no singular: \"Precisa-se de funcionários\".<\/li>\n<\/ul>\n<p><strong>Concordância nominal.<\/strong> \"Anexo\", \"obrigado\", \"mesmo\", \"quite\" variam (\"seguem anexas as fotos\"). \"Menos\" nunca varia. \"É proibido entrada\", mas \"É proibida a entrada\" (com artigo, concorda).<\/p>\n<p><strong>Regência.<\/strong> Assistir (ver) a; aspirar (desejar) a; visar (objetivar) a; obedecer a; chegar a (não \"em\"); preferir X a Y (não \"mais do que\"); implicar (acarretar) sem preposição.<\/p>\n<p><strong>Crase<\/strong> = preposição \"a\" + artigo \"a\". Truque: troque a palavra por uma masculina. Se virar \"ao\", tem crase (\"fui à escola\" → \"fui ao colégio\").<\/p>\n<ul>\n<li>Não tem crase: antes de masculino, de verbo, de pronome pessoal e de tratamento (exceto senhora e dona), entre palavras repetidas (cara a cara).<\/li>\n<li>Tem crase: locuções femininas (às vezes, à medida que) e horas (às 14h).<\/li>\n<\/ul>\n<p><strong>Colocação pronominal.<\/strong><\/p>\n<ul>\n<li><strong>Próclise<\/strong> (antes do verbo) quando há palavra atrativa: negação, pronome relativo, advérbio sem vírgula, conjunção subordinativa (\"Não <strong>me<\/strong> disse\").<\/li>\n<li><strong>Ênclise<\/strong> (depois) no início da frase: \"Disse-<strong>me<\/strong>\". Na norma culta, não se começa frase com pronome oblíquo átono.<\/li>\n<li><strong>Mesóclise<\/strong> com futuro do presente ou do pretérito, sem atrativo: \"Dir-<strong>te<\/strong>-ei\".<\/li>\n<\/ul>", "text": "Vírgula. Nunca separe sujeito do verbo nem verbo do complemento. Use em enumerações, aposto, vocativo, adjunto adverbial deslocado, oração adjetiva explicativa, antes de \"mas/porém\" e para isolar conectivos no meio da frase. Concordância verbal. \"Haver\" no sentido de existir e \"fazer\" indicando tempo não variam: \"Havia muitas pessoas\", \"Faz dois anos\". Passiva sintética concorda: \"Vendem-se casas\". Índice de indeterminação fica no singular: \"Precisa-se de funcionários\". Concordância nominal. \"Anexo\", \"obrigado\", \"mesmo\", \"quite\" variam (\"seguem anexas as fotos\"). \"Menos\" nunca varia. \"É proibido entrada\", mas \"É proibida a entrada\" (com artigo, concorda). Regência. Assistir (ver) a; aspirar (desejar) a; visar (objetivar) a; obedecer a; chegar a (não \"em\"); preferir X a Y (não \"mais do que\"); implicar (acarretar) sem preposição. Crase = preposição \"a\" + artigo \"a\". Truque: troque a palavra por uma masculina. Se virar \"ao\", tem crase (\"fui à escola\" → \"fui ao colégio\"). Não tem crase: antes de masculino, de verbo, de pronome pessoal e de tratamento (exceto senhora e dona), entre palavras repetidas (cara a cara). Tem crase: locuções femininas (às vezes, à medida que) e horas (às 14h). Colocação pronominal. Próclise (antes do verbo) quando há palavra atrativa: negação, pronome relativo, advérbio sem vírgula, conjunção subordinativa (\"Não me disse\"). Ênclise (depois) no início da frase: \"Disse- me \". Na norma culta, não se começa frase com pronome oblíquo átono. Mesóclise com futuro do presente ou do pretérito, sem atrativo: \"Dir- te -ei\"."}, {"num": "8", "title": "Semântica", "html": "<ul>\n<li><strong>Denotação:<\/strong> sentido literal. <strong>Conotação:<\/strong> sentido figurado.<\/li>\n<li><strong>Homônimos:<\/strong> mesma pronúncia ou grafia, sentidos diferentes (cela/sela, são). <strong>Parônimos:<\/strong> parecidos, sentidos diferentes (comprimento/cumprimento, eminente/iminente, ratificar/retificar, descriminar/discriminar).<\/li>\n<li><strong>Ambiguidade:<\/strong> duplo sentido, geralmente um defeito (\"Vi o rapaz correndo\": quem corria?).<\/li>\n<li><strong>Figuras de linguagem:<\/strong> a retificação tirou a lista de exemplos, mas o tópico continua. Saiba as principais: metáfora (comparação implícita), metonímia (troca por relação: \"li Machado\"), hipérbole (exagero), ironia (diz o contrário), antítese (opostos), eufemismo (suavização), personificação.<\/li>\n<\/ul>", "text": "Denotação: sentido literal. Conotação: sentido figurado. Homônimos: mesma pronúncia ou grafia, sentidos diferentes (cela/sela, são). Parônimos: parecidos, sentidos diferentes (comprimento/cumprimento, eminente/iminente, ratificar/retificar, descriminar/discriminar). Ambiguidade: duplo sentido, geralmente um defeito (\"Vi o rapaz correndo\": quem corria?). Figuras de linguagem: a retificação tirou a lista de exemplos, mas o tópico continua. Saiba as principais: metáfora (comparação implícita), metonímia (troca por relação: \"li Machado\"), hipérbole (exagero), ironia (diz o contrário), antítese (opostos), eufemismo (suavização), personificação."}, {"num": "9", "title": "Reescrita", "html": "<p>A questão dá uma frase reescrita e pergunta se manteve sentido e correção. Confira, nesta ordem:<\/p>\n<ol>\n<li>O novo conectivo tem o mesmo valor do antigo?<\/li>\n<li>Concordância, regência e crase continuam certas depois da troca?<\/li>\n<li>A pontuação mudou o sentido?<\/li>\n<li>O nível de formalidade continua adequado?<\/li>\n<\/ol>", "text": "A questão dá uma frase reescrita e pergunta se manteve sentido e correção. Confira, nesta ordem: O novo conectivo tem o mesmo valor do antigo? Concordância, regência e crase continuam certas depois da troca? A pontuação mudou o sentido? O nível de formalidade continua adequado?"}, {"num": "10", "title": "Variação linguística", "html": "<p>Não há \"erro\" na variação, há adequação ao contexto. Tipos: regional (diatópica), social (diastrática), situacional ou de registro (diafásica), histórica (diacrônica). Registro formal para documento oficial; informal entre amigos.<\/p>", "text": "Não há \"erro\" na variação, há adequação ao contexto. Tipos: regional (diatópica), social (diastrática), situacional ou de registro (diafásica), histórica (diacrônica). Registro formal para documento oficial; informal entre amigos."}, {"num": "11", "title": "Redação Oficial (Manual da Presidência, 3ª ed.)", "html": "<ul>\n<li><strong>Atributos:<\/strong> clareza, precisão, objetividade, concisão, coesão, coerência, impessoalidade, formalidade, padronização e norma padrão.<\/li>\n<li><strong>Padrão ofício:<\/strong> na 3ª edição, aviso e memorando deixam de ser tipos separados. Tudo passa a se chamar ofício.<\/li>\n<li><strong>Estrutura do ofício:<\/strong> identificação (Ofício nº 123/2026/SIGLA), local e data, endereçamento, assunto, texto (introdução, desenvolvimento, conclusão), fecho, assinatura com nome e cargo.<\/li>\n<li><strong>Fechos:<\/strong> \"Respeitosamente\" para autoridade superior; \"Atenciosamente\" para mesma hierarquia ou inferior.<\/li>\n<li><strong>Concordância com pronome de tratamento:<\/strong> verbo e possessivo na 3ª pessoa (\"Vossa Excelência sabe que seu...\"); adjetivo concorda com o sexo da pessoa.<\/li>\n<li>A 3ª edição aboliu \"Digníssimo\" e \"Ilustríssimo\". \"Doutor\" não é pronome de tratamento.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Pronome<\/th>\n<th>Para quem<\/th>\n<th>Vocativo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vossa Excelência<\/td>\n<td>Altas autoridades (Presidente, ministros, parlamentares, juízes, governadores)<\/td>\n<td>\"Excelentíssimo Senhor\" só para chefes de Poder; demais: \"Senhor + cargo\"<\/td>\n<\/tr>\n<tr>\n<td>Vossa Magnificência<\/td>\n<td>Reitores de universidade<\/td>\n<td>\"Magnífico Reitor\"<\/td>\n<\/tr>\n<tr>\n<td>Vossa Senhoria<\/td>\n<td>Demais autoridades e particulares<\/td>\n<td>\"Senhor + cargo\" ou \"Senhor + nome\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Atributos: clareza, precisão, objetividade, concisão, coesão, coerência, impessoalidade, formalidade, padronização e norma padrão. Padrão ofício: na 3ª edição, aviso e memorando deixam de ser tipos separados. Tudo passa a se chamar ofício. Estrutura do ofício: identificação (Ofício nº 123/2026/SIGLA), local e data, endereçamento, assunto, texto (introdução, desenvolvimento, conclusão), fecho, assinatura com nome e cargo. Fechos: \"Respeitosamente\" para autoridade superior; \"Atenciosamente\" para mesma hierarquia ou inferior. Concordância com pronome de tratamento: verbo e possessivo na 3ª pessoa (\"Vossa Excelência sabe que seu...\"); adjetivo concorda com o sexo da pessoa. A 3ª edição aboliu \"Digníssimo\" e \"Ilustríssimo\". \"Doutor\" não é pronome de tratamento. Pronome Para quem Vocativo Vossa Excelência Altas autoridades (Presidente, ministros, parlamentares, juízes, governadores) \"Excelentíssimo Senhor\" só para chefes de Poder; demais: \"Senhor + cargo\" Vossa Magnificência Reitores de universidade \"Magnífico Reitor\" Vossa Senhoria Demais autoridades e particulares \"Senhor + cargo\" ou \"Senhor + nome\""}], "quiz": [{"q": "Em \"___ muitas pessoas na fila\", qual forma está de acordo com a norma culta?", "opts": ["Haviam", "Havia", "Houveram", "Haverão"], "a": 1, "exp": "No sentido de existir, \"haver\" é impessoal e fica sempre no singular."}, {"q": "Em qual frase a crase está correta?", "opts": ["Fui à pé até o prédio.", "Refiro-me à você.", "A reunião começa às 14h.", "Ele começou à chover."], "a": 2, "exp": "Há crase na indicação de horas. Não há antes de masculino, de pronome pessoal nem de verbo."}, {"q": "Em \"Embora estivesse cansado, terminou o relatório\", a conjunção \"embora\" expressa:", "opts": ["Causa", "Concessão", "Conclusão", "Condição"], "a": 1, "exp": "Embora, ainda que e mesmo que são conjunções concessivas."}, {"q": "Na Redação Oficial, o fecho para autoridade de hierarquia superior é:", "opts": ["Atenciosamente", "Cordialmente", "Respeitosamente", "Saudações"], "a": 2, "exp": "\"Respeitosamente\" para superiores; \"Atenciosamente\" para mesma hierarquia ou inferior."}, {"q": "O pronome de tratamento usado para reitores de universidade é:", "opts": ["Vossa Excelência", "Vossa Senhoria", "Vossa Magnificência", "Vossa Eminência"], "a": 2, "exp": "Reitores recebem \"Vossa Magnificência\", com o vocativo \"Magnífico Reitor\"."}]}, {"id": "informatica", "nome": "Noções de Informática", "bloco": "Comum", "lead": "A prova cobra uso prático: atalhos, Excel, e-mail e segurança são os pontos que mais caem.", "topics": [{"num": "1", "title": "Conceitos básicos", "html": "<ul>\n<li><strong>Hardware<\/strong> é a parte física; <strong>software<\/strong> são os programas (básico = sistema operacional; aplicativo = Word, navegador; utilitário = antivírus, compactador).<\/li>\n<li><strong>Memória RAM<\/strong> é temporária (apaga ao desligar). <strong>Armazenamento<\/strong> (HD, SSD, pen drive) guarda os arquivos.<\/li>\n<li>Unidades: bit &lt; byte (8 bits) &lt; KB &lt; MB &lt; GB &lt; TB.<\/li>\n<\/ul>", "text": "Hardware é a parte física; software são os programas (básico = sistema operacional; aplicativo = Word, navegador; utilitário = antivírus, compactador). Memória RAM é temporária (apaga ao desligar). Armazenamento (HD, SSD, pen drive) guarda os arquivos. Unidades: bit < byte (8 bits) < KB < MB < GB < TB."}, {"num": "2", "title": "Windows 10 e posteriores", "html": "<ul>\n<li>Partes: área de trabalho, menu Iniciar, barra de tarefas, Explorador de Arquivos, Configurações.<\/li>\n<li><strong>Lixeira:<\/strong> Delete manda para a lixeira; Shift+Delete apaga direto. Arquivos de pen drive e de rede não vão para a lixeira.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Atalho<\/th>\n<th>Função<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Win+E<\/td>\n<td>Abre o Explorador de Arquivos<\/td>\n<\/tr>\n<tr>\n<td>Win+D<\/td>\n<td>Mostra a área de trabalho<\/td>\n<\/tr>\n<tr>\n<td>Win+L<\/td>\n<td>Bloqueia o computador<\/td>\n<\/tr>\n<tr>\n<td>Win+V<\/td>\n<td>Histórico da área de transferência<\/td>\n<\/tr>\n<tr>\n<td>Win+Shift+S<\/td>\n<td>Captura de parte da tela<\/td>\n<\/tr>\n<tr>\n<td>Alt+Tab<\/td>\n<td>Alterna entre janelas<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+Shift+Esc<\/td>\n<td>Gerenciador de Tarefas<\/td>\n<\/tr>\n<tr>\n<td>F2<\/td>\n<td>Renomeia o arquivo selecionado<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+C / X / V / Z<\/td>\n<td>Copiar / recortar / colar / desfazer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Partes: área de trabalho, menu Iniciar, barra de tarefas, Explorador de Arquivos, Configurações. Lixeira: Delete manda para a lixeira; Shift+Delete apaga direto. Arquivos de pen drive e de rede não vão para a lixeira. Atalho Função Win+E Abre o Explorador de Arquivos Win+D Mostra a área de trabalho Win+L Bloqueia o computador Win+V Histórico da área de transferência Win+Shift+S Captura de parte da tela Alt+Tab Alterna entre janelas Ctrl+Shift+Esc Gerenciador de Tarefas F2 Renomeia o arquivo selecionado Ctrl+C / X / V / Z Copiar / recortar / colar / desfazer"}, {"num": "3", "title": "Arquivos e pastas", "html": "<ul>\n<li>Caminho: C:\\Usuários\\Ana\\Documentos\\relatorio.docx.<\/li>\n<li>Extensões: .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .pdf, .txt, .zip (compactado), .exe (executável).<\/li>\n<li>Arrastar para a <strong>mesma unidade<\/strong> move; para <strong>outra unidade<\/strong> copia. Ctrl+arrastar força cópia; Shift+arrastar força mover.<\/li>\n<li>Nome de arquivo não pode ter \\ / : * ? \" &lt; &gt; |.<\/li>\n<\/ul>", "text": "Caminho: C:\\Usuários\\Ana\\Documentos\\relatorio.docx. Extensões: .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .pdf, .txt, .zip (compactado), .exe (executável). Arrastar para a mesma unidade move; para outra unidade copia. Ctrl+arrastar força cópia; Shift+arrastar força mover. Nome de arquivo não pode ter \\ / : * ? \" < > |."}, {"num": "4", "title": "Office 365 ou versões recentes", "html": "<p><strong>Word (versão em português):<\/strong> Ctrl+N negrito, Ctrl+I itálico, Ctrl+S sublinhado, Ctrl+B salvar, Ctrl+O novo documento, Ctrl+A abrir, Ctrl+P imprimir, Ctrl+L localizar, Ctrl+U substituir, Ctrl+T selecionar tudo, Ctrl+E centralizar, Ctrl+J justificar.<\/p>\n<p><strong>Excel:<\/strong><\/p>\n<ul>\n<li>Toda fórmula começa com =. O &amp; junta textos (=A1&amp;B1).<\/li>\n<li>Referência relativa <code>A1<\/code> muda ao copiar; absoluta <code>$A$1<\/code> não muda; mista <code>$A1<\/code> ou <code>A$1<\/code> trava só uma parte.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Função<\/th>\n<th>O que faz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>=SOMA(A1:A5)<\/td>\n<td>Soma o intervalo<\/td>\n<\/tr>\n<tr>\n<td>=MÉDIA(A1:A5)<\/td>\n<td>Média<\/td>\n<\/tr>\n<tr>\n<td>=MÁXIMO / =MÍNIMO<\/td>\n<td>Maior / menor valor<\/td>\n<\/tr>\n<tr>\n<td>=CONT.NÚM<\/td>\n<td>Conta células com número<\/td>\n<\/tr>\n<tr>\n<td>=CONT.VALORES<\/td>\n<td>Conta células não vazias<\/td>\n<\/tr>\n<tr>\n<td>=CONT.SE(A1:A5;\"&gt;10\")<\/td>\n<td>Conta as que atendem à condição<\/td>\n<\/tr>\n<tr>\n<td>=SOMASE<\/td>\n<td>Soma as que atendem à condição<\/td>\n<\/tr>\n<tr>\n<td>=SE(A1&gt;=7;\"Aprovado\";\"Reprovado\")<\/td>\n<td>Testa uma condição<\/td>\n<\/tr>\n<tr>\n<td>=PROCV(valor;tabela;coluna;0)<\/td>\n<td>Busca um valor na vertical<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Erros comuns: #DIV/0! (divisão por zero), #VALOR! (tipo errado), #REF! (célula apagada), #NOME? (função escrita errado), #N/D (valor não encontrado).<\/p>\n<p><strong>PowerPoint:<\/strong> F5 inicia do primeiro slide; Shift+F5 do slide atual. Transição é o efeito entre slides; animação é o efeito em objetos. Slide mestre define o padrão visual de todos.<\/p>", "text": "Word (versão em português): Ctrl+N negrito, Ctrl+I itálico, Ctrl+S sublinhado, Ctrl+B salvar, Ctrl+O novo documento, Ctrl+A abrir, Ctrl+P imprimir, Ctrl+L localizar, Ctrl+U substituir, Ctrl+T selecionar tudo, Ctrl+E centralizar, Ctrl+J justificar. Excel: Toda fórmula começa com =. O & junta textos (=A1&B1). Referência relativa A1 muda ao copiar; absoluta $A$1 não muda; mista $A1 ou A$1 trava só uma parte. Função O que faz =SOMA(A1:A5) Soma o intervalo =MÉDIA(A1:A5) Média =MÁXIMO / =MÍNIMO Maior / menor valor =CONT.NÚM Conta células com número =CONT.VALORES Conta células não vazias =CONT.SE(A1:A5;\">10\") Conta as que atendem à condição =SOMASE Soma as que atendem à condição =SE(A1>=7;\"Aprovado\";\"Reprovado\") Testa uma condição =PROCV(valor;tabela;coluna;0) Busca um valor na vertical Erros comuns: #DIV/0! (divisão por zero), #VALOR! (tipo errado), #REF! (célula apagada), #NOME? (função escrita errado), #N/D (valor não encontrado). PowerPoint: F5 inicia do primeiro slide; Shift+F5 do slide atual. Transição é o efeito entre slides; animação é o efeito em objetos. Slide mestre define o padrão visual de todos."}, {"num": "5", "title": "E-mail e Outlook", "html": "<ul>\n<li><strong>Para:<\/strong> destinatário principal. <strong>Cc:<\/strong> cópia que todos veem. <strong>Cco:<\/strong> cópia oculta.<\/li>\n<li><strong>Responder<\/strong> não leva anexos; <strong>encaminhar<\/strong> leva. <strong>Responder a todos<\/strong> inclui todos do Para e Cc.<\/li>\n<li>Protocolos: SMTP envia; POP3 baixa e tira do servidor; IMAP sincroniza e mantém no servidor.<\/li>\n<li>Outlook também tem calendário, contatos, regras e pastas. Colaboração online: Teams, OneDrive, SharePoint, Google Drive.<\/li>\n<\/ul>", "text": "Para: destinatário principal. Cc: cópia que todos veem. Cco: cópia oculta. Responder não leva anexos; encaminhar leva. Responder a todos inclui todos do Para e Cc. Protocolos: SMTP envia; POP3 baixa e tira do servidor; IMAP sincroniza e mantém no servidor. Outlook também tem calendário, contatos, regras e pastas. Colaboração online: Teams, OneDrive, SharePoint, Google Drive."}, {"num": "6", "title": "Internet e intranet", "html": "<ul>\n<li><strong>Internet:<\/strong> rede pública mundial. <strong>Intranet:<\/strong> rede interna da organização, com as mesmas tecnologias da internet. <strong>Extranet:<\/strong> parte da intranet aberta a parceiros externos.<\/li>\n<li>HTTPS (cadeado) é conexão criptografada; HTTP não.<\/li>\n<li>Navegação anônima não salva histórico nem cookies no computador, mas não esconde você do provedor ou da empresa.<\/li>\n<li>Atalhos de navegador: Ctrl+T nova aba; Ctrl+Shift+T reabre aba fechada; Ctrl+H histórico; Ctrl+D favoritar; Ctrl+Shift+N janela anônima (Chrome e Edge); Ctrl+Shift+P (Firefox).<\/li>\n<\/ul>", "text": "Internet: rede pública mundial. Intranet: rede interna da organização, com as mesmas tecnologias da internet. Extranet: parte da intranet aberta a parceiros externos. HTTPS (cadeado) é conexão criptografada; HTTP não. Navegação anônima não salva histórico nem cookies no computador, mas não esconde você do provedor ou da empresa. Atalhos de navegador: Ctrl+T nova aba; Ctrl+Shift+T reabre aba fechada; Ctrl+H histórico; Ctrl+D favoritar; Ctrl+Shift+N janela anônima (Chrome e Edge); Ctrl+Shift+P (Firefox)."}, {"num": "7", "title": "Ferramentas de busca", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Operador<\/th>\n<th>Exemplo<\/th>\n<th>Efeito<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"aspas\"<\/td>\n<td>\"lei 8.112\"<\/td>\n<td>Frase exata<\/td>\n<\/tr>\n<tr>\n<td>-<\/td>\n<td>concurso -2024<\/td>\n<td>Exclui o termo<\/td>\n<\/tr>\n<tr>\n<td>site:<\/td>\n<td>site:ufba.br edital<\/td>\n<td>Só naquele site<\/td>\n<\/tr>\n<tr>\n<td>filetype:<\/td>\n<td>edital filetype:pdf<\/td>\n<td>Só aquele tipo de arquivo<\/td>\n<\/tr>\n<tr>\n<td>OR<\/td>\n<td>UFBA OR UFRB<\/td>\n<td>Um ou outro<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Operador Exemplo Efeito \"aspas\" \"lei 8.112\" Frase exata - concurso -2024 Exclui o termo site: site:ufba.br edital Só naquele site filetype: edital filetype:pdf Só aquele tipo de arquivo OR UFBA OR UFRB Um ou outro"}, {"num": "8", "title": "Computação em nuvem", "html": "<p>Arquivos e programas ficam em servidores na internet (OneDrive, Google Drive, Dropbox). Vantagens: acesso de qualquer lugar, edição simultânea, compartilhamento com permissão de ver, comentar ou editar. Desvantagem: depende de internet. Modelos: SaaS (software pronto, ex. Gmail), PaaS (plataforma para desenvolver), IaaS (infraestrutura alugada).<\/p>", "text": "Arquivos e programas ficam em servidores na internet (OneDrive, Google Drive, Dropbox). Vantagens: acesso de qualquer lugar, edição simultânea, compartilhamento com permissão de ver, comentar ou editar. Desvantagem: depende de internet. Modelos: SaaS (software pronto, ex. Gmail), PaaS (plataforma para desenvolver), IaaS (infraestrutura alugada)."}, {"num": "9", "title": "Redes", "html": "<ul>\n<li>LAN (local, um prédio), MAN (cidade), WAN (longa distância; a internet é a maior).<\/li>\n<li>Equipamentos: roteador (liga redes e distribui a internet), switch (liga computadores na rede local), modem (converte o sinal da operadora).<\/li>\n<li>Recursos compartilhados: pastas, impressoras, conexão.<\/li>\n<\/ul>", "text": "LAN (local, um prédio), MAN (cidade), WAN (longa distância; a internet é a maior). Equipamentos: roteador (liga redes e distribui a internet), switch (liga computadores na rede local), modem (converte o sinal da operadora). Recursos compartilhados: pastas, impressoras, conexão."}, {"num": "10", "title": "Segurança da informação", "html": "<ul>\n<li>Pilares: <strong>confidencialidade<\/strong> (só quem pode acessa), <strong>integridade<\/strong> (não foi alterado), <strong>disponibilidade<\/strong> (está acessível quando precisa), mais <strong>autenticidade<\/strong>.<\/li>\n<li>Senha forte: longa, misturando letras, números e símbolos, sem dados pessoais e sem reaproveitar.<\/li>\n<li>Autenticação em dois fatores combina algo que você sabe (senha), tem (celular) ou é (digital).<\/li>\n<li><strong>Engenharia social:<\/strong> enganar pessoas para obter dados. <strong>Phishing:<\/strong> e-mail ou site falso que imita um real para roubar dados.<\/li>\n<\/ul>", "text": "Pilares: confidencialidade (só quem pode acessa), integridade (não foi alterado), disponibilidade (está acessível quando precisa), mais autenticidade . Senha forte: longa, misturando letras, números e símbolos, sem dados pessoais e sem reaproveitar. Autenticação em dois fatores combina algo que você sabe (senha), tem (celular) ou é (digital). Engenharia social: enganar pessoas para obter dados. Phishing: e-mail ou site falso que imita um real para roubar dados."}, {"num": "11", "title": "Ameaças", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Praga<\/th>\n<th>Como age<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vírus<\/td>\n<td>Infecta arquivos e precisa ser executado para agir<\/td>\n<\/tr>\n<tr>\n<td>Worm<\/td>\n<td>Se espalha sozinho pela rede, sem precisar de execução<\/td>\n<\/tr>\n<tr>\n<td>Cavalo de Troia<\/td>\n<td>Vem disfarçado de programa legítimo<\/td>\n<\/tr>\n<tr>\n<td>Ransomware<\/td>\n<td>Criptografa os arquivos e pede resgate<\/td>\n<\/tr>\n<tr>\n<td>Spyware / keylogger<\/td>\n<td>Espiona; o keylogger grava o que você digita<\/td>\n<\/tr>\n<tr>\n<td>Adware<\/td>\n<td>Exibe propaganda indesejada<\/td>\n<\/tr>\n<tr>\n<td>Backdoor<\/td>\n<td>Abre porta para acesso remoto do invasor<\/td>\n<\/tr>\n<tr>\n<td>Bot / botnet<\/td>\n<td>Máquina controlada remotamente / rede delas<\/td>\n<\/tr>\n<tr>\n<td>Rootkit<\/td>\n<td>Esconde a presença do invasor no sistema<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Praga Como age Vírus Infecta arquivos e precisa ser executado para agir Worm Se espalha sozinho pela rede, sem precisar de execução Cavalo de Troia Vem disfarçado de programa legítimo Ransomware Criptografa os arquivos e pede resgate Spyware / keylogger Espiona; o keylogger grava o que você digita Adware Exibe propaganda indesejada Backdoor Abre porta para acesso remoto do invasor Bot / botnet Máquina controlada remotamente / rede delas Rootkit Esconde a presença do invasor no sistema"}, {"num": "12", "title": "Ferramentas de segurança e backup", "html": "<ul>\n<li><strong>Antivírus<\/strong> detecta e remove pragas. <strong>Firewall<\/strong> filtra o tráfego da rede; não é antivírus.<\/li>\n<li><strong>Atualizações<\/strong> corrigem falhas de segurança.<\/li>\n<li><strong>Backup completo:<\/strong> copia tudo. <strong>Incremental:<\/strong> só o que mudou desde o último backup de qualquer tipo (rápido de fazer, lento de restaurar). <strong>Diferencial:<\/strong> o que mudou desde o último completo.<\/li>\n<li>Regra 3-2-1: 3 cópias, em 2 mídias diferentes, 1 fora do local.<\/li>\n<\/ul>", "text": "Antivírus detecta e remove pragas. Firewall filtra o tráfego da rede; não é antivírus. Atualizações corrigem falhas de segurança. Backup completo: copia tudo. Incremental: só o que mudou desde o último backup de qualquer tipo (rápido de fazer, lento de restaurar). Diferencial: o que mudou desde o último completo. Regra 3-2-1: 3 cópias, em 2 mídias diferentes, 1 fora do local."}], "quiz": [{"q": "O campo \"Cco\" de um e-mail serve para:", "opts": ["Enviar cópia que todos os destinatários veem", "Enviar cópia oculta", "Encaminhar com anexos", "Confirmar leitura"], "a": 1, "exp": "Cco é cópia oculta: os outros destinatários não veem quem está nesse campo."}, {"q": "No Excel, o que acontece com a referência $A$1 ao copiar a fórmula para outra célula?", "opts": ["Muda a coluna", "Muda a linha", "Não muda", "Vira #REF!"], "a": 2, "exp": "O cifrão trava coluna e linha. $A$1 é referência absoluta."}, {"q": "Qual praga se espalha sozinha pela rede, sem precisar ser executada pelo usuário?", "opts": ["Vírus", "Worm", "Cavalo de Troia", "Adware"], "a": 1, "exp": "O worm se propaga sozinho. O vírus precisa que o arquivo infectado seja executado."}, {"q": "O backup incremental copia:", "opts": ["Todos os arquivos", "O que mudou desde o último backup completo", "O que mudou desde o último backup de qualquer tipo", "Só arquivos do sistema"], "a": 2, "exp": "Incremental: desde o último backup de qualquer tipo. Diferencial: desde o último completo."}, {"q": "O atalho Win+L no Windows:", "opts": ["Abre o Explorador de Arquivos", "Bloqueia o computador", "Mostra a área de trabalho", "Abre o Gerenciador de Tarefas"], "a": 1, "exp": "Win+L bloqueia a tela. Win+E abre o Explorador e Win+D mostra a área de trabalho."}]}, {"id": "adm-publica", "nome": "Administração Pública", "bloco": "Comum", "lead": "É a matéria mais longa do edital. Priorize Lei 8.112, CF/88, Lei 14.133, LAI e LGPD, que costumam render mais questões.", "topics": [{"num": "1", "title": "Administração Pública na CF/88 (arts. 37 a 43)", "html": "<ul>\n<li><strong>Princípios (LIMPE):<\/strong> Legalidade (só faz o que a lei permite), Impessoalidade (sem favorecimento), Moralidade (ética), Publicidade (transparência), Eficiência (resultado com bom uso de recursos).<\/li>\n<li><strong>Concurso público:<\/strong> validade de até 2 anos, prorrogável uma vez por igual período.<\/li>\n<li><strong>Cargo em comissão:<\/strong> livre nomeação e exoneração. <strong>Função de confiança:<\/strong> só para servidor efetivo. Ambos só para direção, chefia e assessoramento.<\/li>\n<li><strong>Acumulação de cargos é proibida<\/strong>, exceto (com horários compatíveis): 2 de professor; 1 de professor + 1 técnico ou científico; 2 de profissional de saúde com profissão regulamentada.<\/li>\n<li><strong>Estabilidade (art. 41):<\/strong> após 3 anos de efetivo exercício, com avaliação especial de desempenho. O estável só perde o cargo por sentença judicial transitada em julgado, processo administrativo com ampla defesa ou avaliação periódica de desempenho.<\/li>\n<li><strong>Responsabilidade objetiva (art. 37, §6º):<\/strong> o Estado indeniza danos causados por seus agentes; depois cobra do servidor se ele agiu com dolo ou culpa.<\/li>\n<\/ul>", "text": "Princípios (LIMPE): Legalidade (só faz o que a lei permite), Impessoalidade (sem favorecimento), Moralidade (ética), Publicidade (transparência), Eficiência (resultado com bom uso de recursos). Concurso público: validade de até 2 anos, prorrogável uma vez por igual período. Cargo em comissão: livre nomeação e exoneração. Função de confiança: só para servidor efetivo. Ambos só para direção, chefia e assessoramento. Acumulação de cargos é proibida , exceto (com horários compatíveis): 2 de professor; 1 de professor + 1 técnico ou científico; 2 de profissional de saúde com profissão regulamentada. Estabilidade (art. 41): após 3 anos de efetivo exercício, com avaliação especial de desempenho. O estável só perde o cargo por sentença judicial transitada em julgado, processo administrativo com ampla defesa ou avaliação periódica de desempenho. Responsabilidade objetiva (art. 37, §6º): o Estado indeniza danos causados por seus agentes; depois cobra do servidor se ele agiu com dolo ou culpa."}, {"num": "2", "title": "Estrutura da Administração Federal", "html": "<ul>\n<li><strong>Direta:<\/strong> a própria União e seus órgãos (Presidência, ministérios). <strong>Indireta:<\/strong> autarquias, fundações, empresas públicas e sociedades de economia mista.<\/li>\n<li><strong>Descentralização:<\/strong> passa a tarefa para <strong>outra pessoa jurídica<\/strong> (ex.: União cria uma autarquia). <strong>Desconcentração:<\/strong> distribui tarefas <strong>dentro da mesma pessoa jurídica<\/strong>, entre órgãos.<\/li>\n<li>A UFBA é uma <strong>autarquia federal<\/strong>.<\/li>\n<\/ul>", "text": "Direta: a própria União e seus órgãos (Presidência, ministérios). Indireta: autarquias, fundações, empresas públicas e sociedades de economia mista. Descentralização: passa a tarefa para outra pessoa jurídica (ex.: União cria uma autarquia). Desconcentração: distribui tarefas dentro da mesma pessoa jurídica , entre órgãos. A UFBA é uma autarquia federal ."}, {"num": "3", "title": "Agentes públicos", "html": "<p>Espécies: agentes políticos (presidente, parlamentares), servidores estatutários (cargo), empregados públicos (CLT, emprego), temporários (função), militares e particulares em colaboração (mesário, jurado). Investidura é a posse no cargo. O edital também cita atendimento, comunicação, inclusão e acessibilidade: veja os itens 16 e Atendimento ao Público.<\/p>", "text": "Espécies: agentes políticos (presidente, parlamentares), servidores estatutários (cargo), empregados públicos (CLT, emprego), temporários (função), militares e particulares em colaboração (mesário, jurado). Investidura é a posse no cargo. O edital também cita atendimento, comunicação, inclusão e acessibilidade: veja os itens 16 e Atendimento ao Público."}, {"num": "4", "title": "Lei 8.112/1990 (Regime Jurídico)", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tema<\/th>\n<th>O que saber<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Formas de provimento<\/td>\n<td>Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução<\/td>\n<\/tr>\n<tr>\n<td>Prazos de entrada<\/td>\n<td>Posse em até 30 dias da publicação da nomeação; exercício em até 15 dias da posse<\/td>\n<\/tr>\n<tr>\n<td>Vacância<\/td>\n<td>Exoneração, demissão, promoção, readaptação, aposentadoria, posse em cargo inacumulável, falecimento<\/td>\n<\/tr>\n<tr>\n<td>Remoção<\/td>\n<td>Deslocamento do <strong>servidor<\/strong> no mesmo quadro, com ou sem mudança de sede<\/td>\n<\/tr>\n<tr>\n<td>Redistribuição<\/td>\n<td>Deslocamento do <strong>cargo<\/strong> para outro órgão<\/td>\n<\/tr>\n<tr>\n<td>Vantagens<\/td>\n<td>Indenizações (ajuda de custo, diárias, transporte, auxílio-moradia, não se incorporam), gratificações e adicionais<\/td>\n<\/tr>\n<tr>\n<td>Férias<\/td>\n<td>30 dias; acumula no máximo 2 períodos; pode dividir em até 3 etapas<\/td>\n<\/tr>\n<tr>\n<td>Licenças<\/td>\n<td>Doença em pessoa da família, afastamento do cônjuge, serviço militar, atividade política, capacitação (até 3 meses a cada 5 anos), interesses particulares (até 3 anos, sem remuneração), mandato classista<\/td>\n<\/tr>\n<tr>\n<td>Penalidades<\/td>\n<td>Advertência, suspensão (até 90 dias), demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão ou função comissionada<\/td>\n<\/tr>\n<tr>\n<td>Prescrição<\/td>\n<td>5 anos (demissão, cassação, destituição), 2 anos (suspensão), 180 dias (advertência)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Sindicância x PAD.<\/strong><\/p>\n<ul>\n<li>Sindicância: até 30 dias, prorrogável por igual. Pode terminar em arquivamento, advertência, suspensão de até 30 dias ou abertura de PAD.<\/li>\n<li>PAD: comissão de 3 servidores estáveis; prazo de 60 dias, prorrogável por igual. Fases: instauração, inquérito (instrução, defesa, relatório) e julgamento (20 dias).<\/li>\n<li>Rito sumário para: acumulação ilegal, abandono de cargo (mais de 30 dias seguidos) e inassiduidade habitual (60 dias intercalados em 12 meses).<\/li>\n<li>Responsabilidades civil, penal e administrativa são independentes. Absolvição criminal por inexistência do fato ou negativa de autoria afasta a administrativa.<\/li>\n<\/ul>", "text": "Tema O que saber Formas de provimento Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução Prazos de entrada Posse em até 30 dias da publicação da nomeação; exercício em até 15 dias da posse Vacância Exoneração, demissão, promoção, readaptação, aposentadoria, posse em cargo inacumulável, falecimento Remoção Deslocamento do servidor no mesmo quadro, com ou sem mudança de sede Redistribuição Deslocamento do cargo para outro órgão Vantagens Indenizações (ajuda de custo, diárias, transporte, auxílio-moradia, não se incorporam), gratificações e adicionais Férias 30 dias; acumula no máximo 2 períodos; pode dividir em até 3 etapas Licenças Doença em pessoa da família, afastamento do cônjuge, serviço militar, atividade política, capacitação (até 3 meses a cada 5 anos), interesses particulares (até 3 anos, sem remuneração), mandato classista Penalidades Advertência, suspensão (até 90 dias), demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão ou função comissionada Prescrição 5 anos (demissão, cassação, destituição), 2 anos (suspensão), 180 dias (advertência) Sindicância x PAD. Sindicância: até 30 dias, prorrogável por igual. Pode terminar em arquivamento, advertência, suspensão de até 30 dias ou abertura de PAD. PAD: comissão de 3 servidores estáveis; prazo de 60 dias, prorrogável por igual. Fases: instauração, inquérito (instrução, defesa, relatório) e julgamento (20 dias). Rito sumário para: acumulação ilegal, abandono de cargo (mais de 30 dias seguidos) e inassiduidade habitual (60 dias intercalados em 12 meses). Responsabilidades civil, penal e administrativa são independentes. Absolvição criminal por inexistência do fato ou negativa de autoria afasta a administrativa."}, {"num": "5", "title": "Ética no Serviço Público", "html": "<ul>\n<li><strong>Decreto 1.171/1994<\/strong> (Código de Ética): deveres como cortesia, assiduidade, zelo; vedações como usar o cargo para favorecimento ou receber presentes. A única pena que a Comissão de Ética aplica é a <strong>censura<\/strong>.<\/li>\n<li><strong>Decreto 6.029/2007<\/strong> (Sistema de Gestão da Ética): Comissão de Ética Pública (CEP) no topo e comissões de ética em cada órgão. O procedimento corre em sigilo até a conclusão.<\/li>\n<\/ul>", "text": "Decreto 1.171/1994 (Código de Ética): deveres como cortesia, assiduidade, zelo; vedações como usar o cargo para favorecimento ou receber presentes. A única pena que a Comissão de Ética aplica é a censura . Decreto 6.029/2007 (Sistema de Gestão da Ética): Comissão de Ética Pública (CEP) no topo e comissões de ética em cada órgão. O procedimento corre em sigilo até a conclusão."}, {"num": "6", "title": "Improbidade Administrativa (Lei 8.429/1992, reformada pela Lei 14.230/2021)", "html": "<ul>\n<li>Desde a reforma, <strong>toda improbidade exige dolo<\/strong> (intenção). Erro culposo não é mais improbidade.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Exemplo<\/th>\n<th>Suspensão dos direitos políticos<\/th>\n<th>Proibição de contratar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Enriquecimento ilícito (art. 9)<\/td>\n<td>Receber propina<\/td>\n<td>Até 14 anos<\/td>\n<td>Até 14 anos<\/td>\n<\/tr>\n<tr>\n<td>Lesão ao erário (art. 10)<\/td>\n<td>Facilitar desvio de verba<\/td>\n<td>Até 12 anos<\/td>\n<td>Até 12 anos<\/td>\n<\/tr>\n<tr>\n<td>Violação de princípios (art. 11)<\/td>\n<td>Revelar segredo do cargo<\/td>\n<td>Não há<\/td>\n<td>Até 4 anos<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Outras sanções: perda dos bens acrescidos, ressarcimento, perda da função e multa. Prescrição: 8 anos.<\/p>", "text": "Desde a reforma, toda improbidade exige dolo (intenção). Erro culposo não é mais improbidade. Tipo Exemplo Suspensão dos direitos políticos Proibição de contratar Enriquecimento ilícito (art. 9) Receber propina Até 14 anos Até 14 anos Lesão ao erário (art. 10) Facilitar desvio de verba Até 12 anos Até 12 anos Violação de princípios (art. 11) Revelar segredo do cargo Não há Até 4 anos Outras sanções: perda dos bens acrescidos, ressarcimento, perda da função e multa. Prescrição: 8 anos."}, {"num": "7", "title": "Processo Administrativo Federal (Lei 9.784/1999)", "html": "<ul>\n<li>Princípios: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público, eficiência.<\/li>\n<li><strong>Não se delegam (CE-NO-RE):<\/strong> Competência Exclusiva, atos NOrmativos, decisão de REcursos.<\/li>\n<li><strong>Prazos:<\/strong> decisão em até 30 dias após a instrução (prorrogável por mais 30); recurso em 10 dias; a autoridade pode reconsiderar em 5 dias, senão envia ao superior; no máximo 3 instâncias.<\/li>\n<li><strong>Anulação:<\/strong> ato ilegal. <strong>Revogação:<\/strong> ato legal, mas inconveniente ou inoportuno. Anular ato favorável ao cidadão decai em 5 anos, salvo má-fé.<\/li>\n<\/ul>", "text": "Princípios: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público, eficiência. Não se delegam (CE-NO-RE): Competência Exclusiva, atos NOrmativos, decisão de REcursos. Prazos: decisão em até 30 dias após a instrução (prorrogável por mais 30); recurso em 10 dias; a autoridade pode reconsiderar em 5 dias, senão envia ao superior; no máximo 3 instâncias. Anulação: ato ilegal. Revogação: ato legal, mas inconveniente ou inoportuno. Anular ato favorável ao cidadão decai em 5 anos, salvo má-fé."}, {"num": "8", "title": "Lei de Acesso à Informação (Lei 12.527/2011 e Dec. 7.724/2012)", "html": "<ul>\n<li>Acesso é a regra; sigilo é a exceção. O pedido não precisa de justificativa.<\/li>\n<li><strong>Transparência ativa:<\/strong> o órgão divulga sem ninguém pedir. <strong>Passiva:<\/strong> responde a pedidos.<\/li>\n<li>Resposta imediata ou em até 20 dias, prorrogável por mais 10. Recurso em 10 dias.<\/li>\n<li>Sigilo: ultrassecreta 25 anos (prorrogável uma vez), secreta 15 anos, reservada 5 anos. Informações pessoais: acesso restrito por até 100 anos.<\/li>\n<\/ul>", "text": "Acesso é a regra; sigilo é a exceção. O pedido não precisa de justificativa. Transparência ativa: o órgão divulga sem ninguém pedir. Passiva: responde a pedidos. Resposta imediata ou em até 20 dias, prorrogável por mais 10. Recurso em 10 dias. Sigilo: ultrassecreta 25 anos (prorrogável uma vez), secreta 15 anos, reservada 5 anos. Informações pessoais: acesso restrito por até 100 anos."}, {"num": "9", "title": "LGPD (Lei 13.709/2018)", "html": "<ul>\n<li><strong>Dado pessoal:<\/strong> identifica ou pode identificar alguém. <strong>Sensível:<\/strong> origem racial, religião, opinião política, saúde, vida sexual, genético, biométrico. <strong>Anonimizado:<\/strong> não identifica mais ninguém.<\/li>\n<li><strong>Personagens:<\/strong> titular (dono do dado), controlador (decide sobre o tratamento), operador (trata em nome do controlador), encarregado (canal com titulares e ANPD).<\/li>\n<li><strong>Bases legais:<\/strong> consentimento é só uma delas. O poder público trata dados principalmente para cumprir obrigação legal e executar políticas públicas, sem precisar de consentimento.<\/li>\n<li>Incidentes de segurança devem ser comunicados à ANPD e ao titular.<\/li>\n<li>LGPD e LAI convivem: transparência sobre a gestão pública, proteção sobre dados pessoais.<\/li>\n<\/ul>", "text": "Dado pessoal: identifica ou pode identificar alguém. Sensível: origem racial, religião, opinião política, saúde, vida sexual, genético, biométrico. Anonimizado: não identifica mais ninguém. Personagens: titular (dono do dado), controlador (decide sobre o tratamento), operador (trata em nome do controlador), encarregado (canal com titulares e ANPD). Bases legais: consentimento é só uma delas. O poder público trata dados principalmente para cumprir obrigação legal e executar políticas públicas, sem precisar de consentimento. Incidentes de segurança devem ser comunicados à ANPD e ao titular. LGPD e LAI convivem: transparência sobre a gestão pública, proteção sobre dados pessoais."}, {"num": "10", "title": "Licitações (Lei 14.133/2021)", "html": "<p>Visto em detalhe na seção de Conhecimentos Específicos, item 7.<\/p>", "text": "Visto em detalhe na seção de Conhecimentos Específicos, item 7."}, {"num": "11", "title": "Governança e integridade", "html": "<ul>\n<li>Governança pública: liderança, estratégia e controle para entregar resultados ao cidadão. Envolve gestão de riscos, controles internos, integridade e <strong>accountability<\/strong> (prestar contas e ser responsabilizado).<\/li>\n<li><strong>Decreto 9.830/2019:<\/strong> regulamenta a LINDB. Decisões devem considerar as consequências práticas. O agente público só responde pessoalmente por suas decisões em caso de <strong>dolo ou erro grosseiro<\/strong>.<\/li>\n<\/ul>", "text": "Governança pública: liderança, estratégia e controle para entregar resultados ao cidadão. Envolve gestão de riscos, controles internos, integridade e accountability (prestar contas e ser responsabilizado). Decreto 9.830/2019: regulamenta a LINDB. Decisões devem considerar as consequências práticas. O agente público só responde pessoalmente por suas decisões em caso de dolo ou erro grosseiro ."}, {"num": "12", "title": "Governo Digital (Lei 14.129/2021)", "html": "<p>Serviços públicos digitais e simples (gov.br). O Estado não deve exigir do cidadão documento que já tem. O CPF basta para identificar o cidadão. Defende dados abertos, interoperabilidade entre sistemas e segurança da informação.<\/p>", "text": "Serviços públicos digitais e simples (gov.br). O Estado não deve exigir do cidadão documento que já tem. O CPF basta para identificar o cidadão. Defende dados abertos, interoperabilidade entre sistemas e segurança da informação."}, {"num": "13", "title": "Gestão documental (Lei 8.159/1991)", "html": "<ul>\n<li>Gestão de documentos = produção, tramitação, uso, avaliação e arquivamento nas fases corrente e intermediária.<\/li>\n<li>Documentos permanentes são inalienáveis e imprescritíveis.<\/li>\n<li>Eliminar documento público exige autorização da instituição arquivística pública. O CONARQ define a política nacional. Mais detalhes em Arquivologia.<\/li>\n<\/ul>", "text": "Gestão de documentos = produção, tramitação, uso, avaliação e arquivamento nas fases corrente e intermediária. Documentos permanentes são inalienáveis e imprescritíveis. Eliminar documento público exige autorização da instituição arquivística pública. O CONARQ define a política nacional. Mais detalhes em Arquivologia."}, {"num": "14", "title": "Materiais e patrimônio", "html": "<ul>\n<li><strong>Material de consumo<\/strong> se gasta com o uso (papel, caneta); fica no almoxarifado. <strong>Material permanente<\/strong> dura mais de 2 anos (mesa, computador); recebe plaqueta de tombamento e entra no patrimônio.<\/li>\n<li><strong>Inventário:<\/strong> conferência física dos bens (anual, na mudança de responsável, eventual).<\/li>\n<\/ul>", "text": "Material de consumo se gasta com o uso (papel, caneta); fica no almoxarifado. Material permanente dura mais de 2 anos (mesa, computador); recebe plaqueta de tombamento e entra no patrimônio. Inventário: conferência física dos bens (anual, na mudança de responsável, eventual)."}, {"num": "15", "title": "Sustentabilidade (A3P)", "html": "<p>A Agenda Ambiental na Administração Pública é um programa do Ministério do Meio Ambiente. Eixos: uso racional de recursos, gestão de resíduos, qualidade de vida no trabalho, sensibilização e capacitação, compras públicas sustentáveis e construções sustentáveis.<\/p>", "text": "A Agenda Ambiental na Administração Pública é um programa do Ministério do Meio Ambiente. Eixos: uso racional de recursos, gestão de resíduos, qualidade de vida no trabalho, sensibilização e capacitação, compras públicas sustentáveis e construções sustentáveis."}, {"num": "16", "title": "Atendimento e Carta de Serviços", "html": "<p>A Lei 13.460/2017 (Código de Defesa do Usuário do Serviço Público) obriga cada órgão a ter uma <strong>Carta de Serviços ao Usuário<\/strong>: quais serviços presta, requisitos, prazos e canais. O usuário tem direito a atendimento respeitoso, acessível e com presunção de boa-fé. Reclamações vão à ouvidoria.<\/p>", "text": "A Lei 13.460/2017 (Código de Defesa do Usuário do Serviço Público) obriga cada órgão a ter uma Carta de Serviços ao Usuário : quais serviços presta, requisitos, prazos e canais. O usuário tem direito a atendimento respeitoso, acessível e com presunção de boa-fé. Reclamações vão à ouvidoria."}, {"num": "17", "title": "Segurança da informação no trabalho", "html": "<p>Bloqueie a tela ao sair (Win+L), não compartilhe senhas, use o e-mail institucional só para o trabalho, desconfie de links e anexos, proteja documentos com dados pessoais. Veja também Informática, itens 10 a 12.<\/p>", "text": "Bloqueie a tela ao sair (Win+L), não compartilhe senhas, use o e-mail institucional só para o trabalho, desconfie de links e anexos, proteja documentos com dados pessoais. Veja também Informática, itens 10 a 12."}, {"num": "18", "title": "Redação oficial", "html": "<p>Mesmo conteúdo de Língua Portuguesa, item 11.<\/p>", "text": "Mesmo conteúdo de Língua Portuguesa, item 11."}, {"num": "19", "title": "Instituições Federais de Ensino Superior", "html": "<ul>\n<li>As universidades têm autonomia didático-científica, administrativa e de gestão financeira e patrimonial (CF, art. 207).<\/li>\n<li>Obedecem à indissociabilidade entre ensino, pesquisa e extensão.<\/li>\n<li>São geridas por reitor e órgãos colegiados (conselhos superiores). O reitor é nomeado pelo Presidente da República a partir de lista tríplice.<\/li>\n<\/ul>", "text": "As universidades têm autonomia didático-científica, administrativa e de gestão financeira e patrimonial (CF, art. 207). Obedecem à indissociabilidade entre ensino, pesquisa e extensão. São geridas por reitor e órgãos colegiados (conselhos superiores). O reitor é nomeado pelo Presidente da República a partir de lista tríplice."}, {"num": "20", "title": "Estatuto e Regimento Geral da UFBA", "html": "<p>Não resumi este item para não arriscar erro em detalhes específicos da UFBA. Leia o documento oficial em <a target=\"_blank\" rel=\"noopener\" href=\"https://www.ufba.br/arquivos/estatuto-e-regimento-geral\">ufba.br/arquivos/estatuto-e-regimento-geral<\/a>, focando nos órgãos da universidade e suas competências.<\/p>", "text": "Não resumi este item para não arriscar erro em detalhes específicos da UFBA. Leia o documento oficial em ufba.br/arquivos/estatuto-e-regimento-geral , focando nos órgãos da universidade e suas competências."}], "quiz": [{"q": "A validade de um concurso público, segundo a CF/88, é de:", "opts": ["Até 1 ano, improrrogável", "Até 2 anos, prorrogável uma vez por igual período", "Até 4 anos", "Até 2 anos, prorrogável duas vezes"], "a": 1, "exp": "CF, art. 37, III: até 2 anos, prorrogável uma vez por igual período."}, {"q": "O servidor nomeado por concurso adquire estabilidade após:", "opts": ["2 anos de exercício", "3 anos de efetivo exercício e avaliação especial de desempenho", "5 anos de exercício", "A posse"], "a": 1, "exp": "CF, art. 41: 3 anos de efetivo exercício, com avaliação especial de desempenho."}, {"q": "Pela Lei 8.112, o prazo para a posse é de:", "opts": ["15 dias da posse", "30 dias da publicação do ato de nomeação", "60 dias da homologação", "10 dias da nomeação"], "a": 1, "exp": "Posse em até 30 dias da publicação da nomeação; exercício em até 15 dias da posse."}, {"q": "Pela LAI, o órgão deve responder ao pedido de informação em até:", "opts": ["10 dias", "20 dias, prorrogáveis por mais 10", "30 dias, prorrogáveis por mais 30", "5 dias úteis"], "a": 1, "exp": "Resposta imediata ou em até 20 dias, prorrogáveis por mais 10, com justificativa."}, {"q": "Depois da reforma de 2021, a improbidade administrativa exige:", "opts": ["Culpa ou dolo", "Apenas culpa grave", "Dolo", "Prejuízo acima de 100 salários"], "a": 2, "exp": "A Lei 14.230/2021 passou a exigir dolo em todas as modalidades de improbidade."}, {"q": "Pela Lei 9.784, NÃO pode ser objeto de delegação:", "opts": ["Assinatura de ofícios", "Decisão de recursos administrativos", "Instrução de processos", "Atendimento ao público"], "a": 1, "exp": "Não se delegam: atos normativos, decisão de recursos e matérias de competência exclusiva."}]}, {"id": "direito-adm", "nome": "Direito Administrativo e Licitações", "bloco": "Específico", "lead": "Este bloco aprofunda o que você viu em Administração Públic
