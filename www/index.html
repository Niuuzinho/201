a. A Lei 14.133 é o ponto mais cobrado.", "topics": [{"num": "1", "title": "Estado, governo e Administração Pública", "html": "<ul>\n<li><strong>Estado:<\/strong> povo + território + governo soberano. <strong>Poderes:<\/strong> Legislativo, Executivo e Judiciário. Cada um tem função típica (o Legislativo legisla) e atípicas (o Legislativo também administra seus servidores).<\/li>\n<li><strong>Governo<\/strong> decide as políticas; <strong>Administração<\/strong> executa.<\/li>\n<li>Sentido <strong>subjetivo<\/strong> (quem): órgãos, entidades e agentes. Sentido <strong>objetivo<\/strong> (o quê): a atividade administrativa.<\/li>\n<li><strong>Fim:<\/strong> o interesse público.<\/li>\n<li><strong>Princípios-base:<\/strong> supremacia do interesse público e indisponibilidade do interesse público. Além do LIMPE: razoabilidade, proporcionalidade, motivação, continuidade, segurança jurídica e <strong>autotutela<\/strong> (a Administração anula seus atos ilegais e revoga os inconvenientes, Súmula 473 do STF).<\/li>\n<\/ul>", "text": "Estado: povo + território + governo soberano. Poderes: Legislativo, Executivo e Judiciário. Cada um tem função típica (o Legislativo legisla) e atípicas (o Legislativo também administra seus servidores). Governo decide as políticas; Administração executa. Sentido subjetivo (quem): órgãos, entidades e agentes. Sentido objetivo (o quê): a atividade administrativa. Fim: o interesse público. Princípios-base: supremacia do interesse público e indisponibilidade do interesse público. Além do LIMPE: razoabilidade, proporcionalidade, motivação, continuidade, segurança jurídica e autotutela (a Administração anula seus atos ilegais e revoga os inconvenientes, Súmula 473 do STF)."}, {"num": "2", "title": "Organização administrativa da União", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Entidade<\/th>\n<th>Natureza<\/th>\n<th>Como nasce<\/th>\n<th>Exemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Autarquia<\/td>\n<td>Pessoa jurídica de direito público<\/td>\n<td>Criada por lei<\/td>\n<td>INSS, UFBA, Banco Central<\/td>\n<\/tr>\n<tr>\n<td>Fundação pública<\/td>\n<td>Direito público ou privado<\/td>\n<td>Criada ou autorizada por lei<\/td>\n<td>IBGE, Funai<\/td>\n<\/tr>\n<tr>\n<td>Empresa pública<\/td>\n<td>Direito privado; capital 100% público; qualquer forma societária<\/td>\n<td>Autorizada por lei<\/td>\n<td>Caixa, Correios<\/td>\n<\/tr>\n<tr>\n<td>Sociedade de economia mista<\/td>\n<td>Direito privado; sempre S.A.; maioria do capital votante é pública<\/td>\n<td>Autorizada por lei<\/td>\n<td>Banco do Brasil, Petrobras<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A administração direta são os órgãos da própria União (Presidência e ministérios). Órgão não tem personalidade jurídica; entidade tem.<\/p>", "text": "Entidade Natureza Como nasce Exemplos Autarquia Pessoa jurídica de direito público Criada por lei INSS, UFBA, Banco Central Fundação pública Direito público ou privado Criada ou autorizada por lei IBGE, Funai Empresa pública Direito privado; capital 100% público; qualquer forma societária Autorizada por lei Caixa, Correios Sociedade de economia mista Direito privado; sempre S.A.; maioria do capital votante é pública Autorizada por lei Banco do Brasil, Petrobras A administração direta são os órgãos da própria União (Presidência e ministérios). Órgão não tem personalidade jurídica; entidade tem."}, {"num": "3", "title": "Agentes públicos", "html": "<ul>\n<li><strong>Cargo:<\/strong> ocupado por servidor estatutário. <strong>Emprego:<\/strong> ocupado por empregado público (CLT). <strong>Função:<\/strong> atribuição sem cargo (temporários, função de confiança).<\/li>\n<li><strong>Deveres:<\/strong> poder-dever de agir, eficiência, probidade e prestação de contas.<\/li>\n<li><strong>Prerrogativas:<\/strong> os poderes administrativos (item 4) existem para cumprir o interesse público, não para benefício pessoal.<\/li>\n<\/ul>", "text": "Cargo: ocupado por servidor estatutário. Emprego: ocupado por empregado público (CLT). Função: atribuição sem cargo (temporários, função de confiança). Deveres: poder-dever de agir, eficiência, probidade e prestação de contas. Prerrogativas: os poderes administrativos (item 4) existem para cumprir o interesse público, não para benefício pessoal."}, {"num": "4", "title": "Poderes administrativos", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Poder<\/th>\n<th>O que é<\/th>\n<th>Exemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hierárquico<\/td>\n<td>Organizar, dar ordens, fiscalizar, delegar e avocar dentro da estrutura<\/td>\n<td>Chefe revisa ato do subordinado<\/td>\n<\/tr>\n<tr>\n<td>Disciplinar<\/td>\n<td>Punir servidores e quem tem vínculo especial com a Administração<\/td>\n<td>Suspensão após PAD; multa a empresa contratada<\/td>\n<\/tr>\n<tr>\n<td>Regulamentar<\/td>\n<td>Editar decretos para a fiel execução da lei, sem criar direitos novos<\/td>\n<td>Decreto que regulamenta uma lei<\/td>\n<\/tr>\n<tr>\n<td>De polícia<\/td>\n<td>Limitar liberdade e propriedade em favor da coletividade<\/td>\n<td>Multa de trânsito, fiscalização sanitária<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Atributos do poder de polícia: discricionariedade, autoexecutoriedade e coercibilidade.<\/li>\n<li><strong>Abuso de poder<\/strong> tem duas formas: <strong>excesso<\/strong> (age além da sua competência) e <strong>desvio de finalidade<\/strong> (age dentro da competência, mas para outro fim).<\/li>\n<\/ul>", "text": "Poder O que é Exemplo Hierárquico Organizar, dar ordens, fiscalizar, delegar e avocar dentro da estrutura Chefe revisa ato do subordinado Disciplinar Punir servidores e quem tem vínculo especial com a Administração Suspensão após PAD; multa a empresa contratada Regulamentar Editar decretos para a fiel execução da lei, sem criar direitos novos Decreto que regulamenta uma lei De polícia Limitar liberdade e propriedade em favor da coletividade Multa de trânsito, fiscalização sanitária Atributos do poder de polícia: discricionariedade, autoexecutoriedade e coercibilidade. Abuso de poder tem duas formas: excesso (age além da sua competência) e desvio de finalidade (age dentro da competência, mas para outro fim)."}, {"num": "5", "title": "Serviços públicos", "html": "<ul>\n<li><strong>Conceito:<\/strong> atividade prestada pelo Estado, ou por quem ele delega, para atender necessidades da coletividade.<\/li>\n<li><strong>Princípios (serviço adequado, Lei 8.987):<\/strong> regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e modicidade das tarifas.<\/li>\n<li><strong>Classificação:<\/strong> <em>uti universi<\/em> ou gerais (iluminação pública, não dá para medir o uso individual) e <em>uti singuli<\/em> ou individuais (água, energia, medidos por usuário).<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Delegação<\/th>\n<th>Instrumento<\/th>\n<th>Para quem<\/th>\n<th>Característica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Concessão<\/td>\n<td>Contrato, após licitação (concorrência ou diálogo competitivo)<\/td>\n<td>Pessoa jurídica ou consórcio<\/td>\n<td>Prazo determinado, mais estável<\/td>\n<\/tr>\n<tr>\n<td>Permissão<\/td>\n<td>Contrato de adesão, após licitação<\/td>\n<td>Pessoa física ou jurídica<\/td>\n<td>Precária<\/td>\n<\/tr>\n<tr>\n<td>Autorização<\/td>\n<td>Ato unilateral e discricionário<\/td>\n<td>Pessoa física ou jurídica<\/td>\n<td>Precária, sem licitação<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Conceito: atividade prestada pelo Estado, ou por quem ele delega, para atender necessidades da coletividade. Princípios (serviço adequado, Lei 8.987): regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e modicidade das tarifas. Classificação: uti universi ou gerais (iluminação pública, não dá para medir o uso individual) e uti singuli ou individuais (água, energia, medidos por usuário). Delegação Instrumento Para quem Característica Concessão Contrato, após licitação (concorrência ou diálogo competitivo) Pessoa jurídica ou consórcio Prazo determinado, mais estável Permissão Contrato de adesão, após licitação Pessoa física ou jurídica Precária Autorização Ato unilateral e discricionário Pessoa física ou jurídica Precária, sem licitação"}, {"num": "6", "title": "Controle e responsabilidade do Estado", "html": "<ul>\n<li><strong>Controle administrativo:<\/strong> a própria Administração revisa seus atos (autotutela, controle interno).<\/li>\n<li><strong>Controle legislativo:<\/strong> o Congresso fiscaliza, com auxílio do TCU.<\/li>\n<li><strong>Controle judicial:<\/strong> o Judiciário analisa a legalidade, não o mérito (conveniência e oportunidade).<\/li>\n<li><strong>Responsabilidade civil:<\/strong> objetiva, pela teoria do risco administrativo. A vítima prova só a conduta, o dano e o nexo entre eles. Excludentes: culpa exclusiva da vítima, caso fortuito ou força maior, fato de terceiro.<\/li>\n<li>O Estado cobra o servidor em <strong>ação regressiva<\/strong>, só se ele agiu com dolo ou culpa. Em caso de omissão, a regra majoritária é a responsabilidade subjetiva (falha do serviço).<\/li>\n<\/ul>", "text": "Controle administrativo: a própria Administração revisa seus atos (autotutela, controle interno). Controle legislativo: o Congresso fiscaliza, com auxílio do TCU. Controle judicial: o Judiciário analisa a legalidade, não o mérito (conveniência e oportunidade). Responsabilidade civil: objetiva, pela teoria do risco administrativo. A vítima prova só a conduta, o dano e o nexo entre eles. Excludentes: culpa exclusiva da vítima, caso fortuito ou força maior, fato de terceiro. O Estado cobra o servidor em ação regressiva , só se ele agiu com dolo ou culpa. Em caso de omissão, a regra majoritária é a responsabilidade subjetiva (falha do serviço)."}, {"num": "7", "title": "Licitações (Lei 14.133/2021)", "html": "<p><strong>Conceito e obrigatoriedade.<\/strong> Licitação é o procedimento para escolher a proposta mais vantajosa. Obras, serviços, compras e alienações precisam de licitação, salvo exceções da lei (CF, art. 37, XXI).<\/p>\n<p><strong>Objetivos (art. 11):<\/strong> proposta mais vantajosa (inclusive considerando o ciclo de vida do objeto), isonomia e justa competição, evitar sobrepreço e superfaturamento, incentivar inovação e desenvolvimento sustentável.<\/p>\n<p><strong>Princípios (art. 5):<\/strong> além do LIMPE, planejamento, transparência, segregação de funções, vinculação ao edital, julgamento objetivo, competitividade, celeridade, economicidade e desenvolvimento nacional sustentável, entre outros.<\/p>\n<p><strong>Fases (art. 17), em ordem:<\/strong><\/p>\n<ol>\n<li>Preparatória (planejamento, estudo técnico preliminar, termo de referência)<\/li>\n<li>Divulgação do edital<\/li>\n<li>Apresentação de propostas e lances<\/li>\n<li>Julgamento<\/li>\n<li>Habilitação (como regra, depois do julgamento)<\/li>\n<li>Recursal<\/li>\n<li>Homologação<\/li>\n<\/ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Modalidade<\/th>\n<th>Quando usar<\/th>\n<th>Critério de julgamento<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pregão<\/td>\n<td>Bens e serviços comuns (inclusive serviços comuns de engenharia)<\/td>\n<td>Menor preço ou maior desconto<\/td>\n<\/tr>\n<tr>\n<td>Concorrência<\/td>\n<td>Bens e serviços especiais, obras e serviços de engenharia<\/td>\n<td>Menor preço, maior desconto, melhor técnica, técnica e preço, maior retorno econômico<\/td>\n<\/tr>\n<tr>\n<td>Concurso<\/td>\n<td>Trabalho técnico, científico ou artístico<\/td>\n<td>Melhor técnica ou conteúdo artístico (prêmio)<\/td>\n<\/tr>\n<tr>\n<td>Leilão<\/td>\n<td>Venda de bens<\/td>\n<td>Maior lance<\/td>\n<\/tr>\n<tr>\n<td>Diálogo competitivo<\/td>\n<td>Contratações complexas ou inovadoras<\/td>\n<td>Definido após o diálogo com os licitantes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Tomada de preços e convite <strong>não existem mais<\/strong>. É <strong>vedado<\/strong> criar outras modalidades ou combinar as existentes.<\/li>\n<li><strong>Inexigibilidade (art. 74):<\/strong> a competição é inviável. Ex.: fornecedor exclusivo, artista consagrado, serviço técnico de notória especialização, credenciamento.<\/li>\n<li><strong>Dispensa (art. 75):<\/strong> a competição é possível, mas a lei libera. Ex.: valores baixos (originalmente até R$ 100 mil para obras e engenharia e R$ 50 mil para o resto, atualizados todo ano por decreto), emergência, licitação deserta.<\/li>\n<li><strong>Revogação:<\/strong> por interesse público, com fato superveniente. <strong>Anulação (invalidação):<\/strong> por ilegalidade. Ambas exigem manifestação prévia dos interessados.<\/li>\n<li><strong>Desistência:<\/strong> a proposta vincula o licitante. Não manter a proposta sem motivo justo é infração punível.<\/li>\n<li><strong>Controle (art. 169), 3 linhas de defesa:<\/strong> 1ª) servidores e agentes de contratação; 2ª) assessoria jurídica e controle interno do órgão; 3ª) órgão central de controle interno (CGU) e tribunal de contas.<\/li>\n<li><strong>Sanções:<\/strong> advertência, multa, impedimento de licitar (até 3 anos, no ente que puniu) e declaração de inidoneidade (3 a 6 anos, em todos os entes).<\/li>\n<\/ul>", "text": "Conceito e obrigatoriedade. Licitação é o procedimento para escolher a proposta mais vantajosa. Obras, serviços, compras e alienações precisam de licitação, salvo exceções da lei (CF, art. 37, XXI). Objetivos (art. 11): proposta mais vantajosa (inclusive considerando o ciclo de vida do objeto), isonomia e justa competição, evitar sobrepreço e superfaturamento, incentivar inovação e desenvolvimento sustentável. Princípios (art. 5): além do LIMPE, planejamento, transparência, segregação de funções, vinculação ao edital, julgamento objetivo, competitividade, celeridade, economicidade e desenvolvimento nacional sustentável, entre outros. Fases (art. 17), em ordem: Preparatória (planejamento, estudo técnico preliminar, termo de referência) Divulgação do edital Apresentação de propostas e lances Julgamento Habilitação (como regra, depois do julgamento) Recursal Homologação Modalidade Quando usar Critério de julgamento Pregão Bens e serviços comuns (inclusive serviços comuns de engenharia) Menor preço ou maior desconto Concorrência Bens e serviços especiais, obras e serviços de engenharia Menor preço, maior desconto, melhor técnica, técnica e preço, maior retorno econômico Concurso Trabalho técnico, científico ou artístico Melhor técnica ou conteúdo artístico (prêmio) Leilão Venda de bens Maior lance Diálogo competitivo Contratações complexas ou inovadoras Definido após o diálogo com os licitantes Tomada de preços e convite não existem mais . É vedado criar outras modalidades ou combinar as existentes. Inexigibilidade (art. 74): a competição é inviável. Ex.: fornecedor exclusivo, artista consagrado, serviço técnico de notória especialização, credenciamento. Dispensa (art. 75): a competição é possível, mas a lei libera. Ex.: valores baixos (originalmente até R$ 100 mil para obras e engenharia e R$ 50 mil para o resto, atualizados todo ano por decreto), emergência, licitação deserta. Revogação: por interesse público, com fato superveniente. Anulação (invalidação): por ilegalidade. Ambas exigem manifestação prévia dos interessados. Desistência: a proposta vincula o licitante. Não manter a proposta sem motivo justo é infração punível. Controle (art. 169), 3 linhas de defesa: 1ª) servidores e agentes de contratação; 2ª) assessoria jurídica e controle interno do órgão; 3ª) órgão central de controle interno (CGU) e tribunal de contas. Sanções: advertência, multa, impedimento de licitar (até 3 anos, no ente que puniu) e declaração de inidoneidade (3 a 6 anos, em todos os entes)."}], "quiz": [{"q": "A UFBA, quanto à natureza jurídica, é:", "opts": ["Empresa pública", "Órgão da administração direta", "Autarquia federal", "Sociedade de economia mista"], "a": 2, "exp": "Universidades federais como a UFBA são autarquias: pessoas jurídicas de direito público criadas por lei."}, {"q": "O agente age dentro da sua competência, mas para atingir um fim diferente do previsto em lei. Isso é:", "opts": ["Excesso de poder", "Desvio de finalidade", "Poder discricionário", "Autotutela"], "a": 1, "exp": "Desvio de finalidade: competência certa, fim errado. Excesso: agir além da competência."}, {"q": "Qual modalidade de licitação NÃO existe mais na Lei 14.133?", "opts": ["Pregão", "Diálogo competitivo", "Tomada de preços", "Leilão"], "a": 2, "exp": "Tomada de preços e convite foram extintos. É vedado criar novas modalidades."}, {"q": "No pregão, o critério de julgamento é:", "opts": ["Melhor técnica", "Menor preço ou maior desconto", "Maior lance", "Técnica e preço"], "a": 1, "exp": "O pregão serve para bens e serviços comuns e julga por menor preço ou maior desconto."}, {"q": "A responsabilidade civil do Estado por danos causados por seus agentes é, em regra:", "opts": ["Subjetiva", "Objetiva", "Inexistente", "Só criminal"], "a": 1, "exp": "É objetiva (risco administrativo). O Estado depois cobra do agente se houve dolo ou culpa."}]}, {"id": "administracao", "nome": "Noções de Administração", "bloco": "Específico", "lead": "Estruturas, PODC, processos, qualidade e projetos. Decore as classificações: são as mais cobradas.", "topics": [{"num": "1", "title": "Organizações formais", "html": "<p>A estrutura formal é a do organograma; a informal surge das relações entre as pessoas.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Estrutura<\/th>\n<th>Característica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Linear<\/td>\n<td>Hierarquia rígida; cada um tem um só chefe (unidade de comando)<\/td>\n<\/tr>\n<tr>\n<td>Funcional<\/td>\n<td>Especialistas mandam na sua área; subordinação a vários chefes<\/td>\n<\/tr>\n<tr>\n<td>Linha-staff<\/td>\n<td>A linha executa e decide; o staff só assessora<\/td>\n<\/tr>\n<tr>\n<td>Matricial<\/td>\n<td>Dupla subordinação: chefe da função + chefe do projeto<\/td>\n<\/tr>\n<tr>\n<td>Por projetos<\/td>\n<td>Equipes temporárias montadas por projeto<\/td>\n<\/tr>\n<tr>\n<td>Em rede<\/td>\n<td>Unidades independentes ligadas por parcerias<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Departamentalização<\/strong> (critério para agrupar atividades): funcional (por área: RH, finanças), por produto ou serviço, geográfica, por clientela, por processo, por projeto, matricial.<\/p>", "text": "A estrutura formal é a do organograma; a informal surge das relações entre as pessoas. Estrutura Característica Linear Hierarquia rígida; cada um tem um só chefe (unidade de comando) Funcional Especialistas mandam na sua área; subordinação a vários chefes Linha-staff A linha executa e decide; o staff só assessora Matricial Dupla subordinação: chefe da função + chefe do projeto Por projetos Equipes temporárias montadas por projeto Em rede Unidades independentes ligadas por parcerias Departamentalização (critério para agrupar atividades): funcional (por área: RH, finanças), por produto ou serviço, geográfica, por clientela, por processo, por projeto, matricial."}, {"num": "2", "title": "Processo organizacional (PODC)", "html": "<ul>\n<li><strong>Planejamento:<\/strong> define objetivos. Estratégico (longo prazo, cúpula), tático (médio prazo, gerência), operacional (curto prazo, execução).<\/li>\n<li><strong>Organização:<\/strong> distribui tarefas e recursos.<\/li>\n<li><strong>Direção:<\/strong> lidera, comunica e motiva.<\/li>\n<li><strong>Controle e avaliação:<\/strong> compara o resultado com o padrão e corrige desvios.<\/li>\n<\/ul>", "text": "Planejamento: define objetivos. Estratégico (longo prazo, cúpula), tático (médio prazo, gerência), operacional (curto prazo, execução). Organização: distribui tarefas e recursos. Direção: lidera, comunica e motiva. Controle e avaliação: compara o resultado com o padrão e corrige desvios."}, {"num": "3", "title": "Gestão de processos", "html": "<p>Processo é um conjunto de atividades que transforma entradas em saídas de valor para o cliente. Mapeia-se a situação atual (<em>as is<\/em>), desenha-se a ideal (<em>to be<\/em>) e implanta-se a melhoria. Ferramentas: fluxograma e BPMN.<\/p>", "text": "Processo é um conjunto de atividades que transforma entradas em saídas de valor para o cliente. Mapeia-se a situação atual ( as is ), desenha-se a ideal ( to be ) e implanta-se a melhoria. Ferramentas: fluxograma e BPMN."}, {"num": "4", "title": "Gestão da qualidade", "html": "<ul>\n<li><strong>PDCA:<\/strong> Plan (planejar), Do (executar), Check (verificar), Act (agir corretivamente). É um ciclo contínuo.<\/li>\n<li><strong>Ishikawa<\/strong> (espinha de peixe): organiza causas de um problema (método, mão de obra, máquina, material, meio ambiente, medida).<\/li>\n<li><strong>Pareto:<\/strong> 80% dos problemas vêm de 20% das causas.<\/li>\n<li><strong>5W2H:<\/strong> What, Why, Where, When, Who, How, How much. Serve para plano de ação.<\/li>\n<li><strong>5S:<\/strong> Seiri (utilização/descarte), Seiton (organização), Seiso (limpeza), Seiketsu (padronização), Shitsuke (disciplina).<\/li>\n<\/ul>", "text": "PDCA: Plan (planejar), Do (executar), Check (verificar), Act (agir corretivamente). É um ciclo contínuo. Ishikawa (espinha de peixe): organiza causas de um problema (método, mão de obra, máquina, material, meio ambiente, medida). Pareto: 80% dos problemas vêm de 20% das causas. 5W2H: What, Why, Where, When, Who, How, How much. Serve para plano de ação. 5S: Seiri (utilização/descarte), Seiton (organização), Seiso (limpeza), Seiketsu (padronização), Shitsuke (disciplina)."}, {"num": "5", "title": "Gestão de projetos", "html": "<p>Projeto é temporário e gera resultado único; operação é rotina. Grupos de processos (PMBOK): iniciação, planejamento, execução, monitoramento e controle, encerramento. Restrição tripla: escopo, tempo e custo (afetam a qualidade). Cronograma visual: gráfico de Gantt.<\/p>", "text": "Projeto é temporário e gera resultado único; operação é rotina. Grupos de processos (PMBOK): iniciação, planejamento, execução, monitoramento e controle, encerramento. Restrição tripla: escopo, tempo e custo (afetam a qualidade). Cronograma visual: gráfico de Gantt."}], "quiz": [{"q": "No ciclo PDCA, a letra C corresponde a:", "opts": ["Controlar", "Corrigir", "Verificar (Check)", "Comunicar"], "a": 2, "exp": "Plan, Do, Check, Act: planejar, executar, verificar e agir corretivamente."}, {"q": "A estrutura organizacional com dupla subordinação (chefe da função e chefe do projeto) é a:", "opts": ["Linear", "Matricial", "Linha-staff", "Em rede"], "a": 1, "exp": "Na matricial, o funcionário responde à área funcional e ao projeto ao mesmo tempo."}, {"q": "O planejamento tático é feito:", "opts": ["Pela cúpula, a longo prazo", "Pela gerência, a médio prazo", "Pela execução, a curto prazo", "Por consultores externos"], "a": 1, "exp": "Estratégico: cúpula, longo prazo. Tático: gerência, médio prazo. Operacional: execução, curto prazo."}, {"q": "A ferramenta 5W2H serve principalmente para:", "opts": ["Mapear causas de um problema", "Montar um plano de ação", "Priorizar problemas pelo 80/20", "Organizar o ambiente de trabalho"], "a": 1, "exp": "5W2H detalha o que, por que, onde, quando, quem, como e quanto custa: é um plano de ação."}]}, {"id": "gestao-pessoas", "nome": "Gestão de Pessoas", "bloco": "Específico", "lead": "Processos de gestão de pessoas e teorias de motivação e liderança. Teorias com nome de autor caem muito.", "topics": [{"num": "1", "title": "Conceitos", "html": "<p>Pessoas são vistas como parceiras e recurso estratégico, não só custo. A gestão de pessoas se relaciona com todos os outros sistemas da organização.<\/p>", "text": "Pessoas são vistas como parceiras e recurso estratégico, não só custo. A gestão de pessoas se relaciona com todos os outros sistemas da organização."}, {"num": "2", "title": "Função do órgão de gestão de pessoas", "html": "<p>(processos segundo Chiavenato):<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Processo<\/th>\n<th>O que inclui<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agregar<\/td>\n<td>Recrutamento e seleção<\/td>\n<\/tr>\n<tr>\n<td>Aplicar<\/td>\n<td>Desenho de cargos, avaliação de desempenho<\/td>\n<\/tr>\n<tr>\n<td>Recompensar<\/td>\n<td>Remuneração e benefícios<\/td>\n<\/tr>\n<tr>\n<td>Desenvolver<\/td>\n<td>Treinamento e capacitação<\/td>\n<\/tr>\n<tr>\n<td>Manter<\/td>\n<td>Segurança, saúde, qualidade de vida<\/td>\n<\/tr>\n<tr>\n<td>Monitorar<\/td>\n<td>Banco de dados e sistemas de informações gerenciais (no governo federal: SIAPE, SouGov)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "(processos segundo Chiavenato): Processo O que inclui Agregar Recrutamento e seleção Aplicar Desenho de cargos, avaliação de desempenho Recompensar Remuneração e benefícios Desenvolver Treinamento e capacitação Manter Segurança, saúde, qualidade de vida Monitorar Banco de dados e sistemas de informações gerenciais (no governo federal: SIAPE, SouGov)"}, {"num": "3", "title": "Comportamento organizacional", "html": "<p>A relação indivíduo-organização é uma troca: a pessoa contribui e espera recompensas (contrato psicológico).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Teoria de motivação<\/th>\n<th>Ideia central<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Maslow<\/td>\n<td>Pirâmide de necessidades: fisiológicas, segurança, sociais, estima, autorrealização<\/td>\n<\/tr>\n<tr>\n<td>Herzberg<\/td>\n<td>Fatores higiênicos (salário, ambiente) só evitam insatisfação; fatores motivacionais (reconhecimento, responsabilidade) geram satisfação<\/td>\n<\/tr>\n<tr>\n<td>McGregor<\/td>\n<td>Teoria X: pessoas evitam trabalho e precisam de controle. Teoria Y: pessoas se motivam e assumem responsabilidade<\/td>\n<\/tr>\n<tr>\n<td>McClelland<\/td>\n<td>Necessidades de realização, poder e afiliação<\/td>\n<\/tr>\n<tr>\n<td>Vroom<\/td>\n<td>Motivação depende da expectativa de que o esforço trará uma recompensa desejada<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Liderança.<\/strong><\/p>\n<ul>\n<li>Estilos clássicos: autocrático (líder decide sozinho), democrático (decide com o grupo), liberal ou <em>laissez-faire<\/em> (grupo decide sozinho).<\/li>\n<li><strong>Situacional (Hersey-Blanchard):<\/strong> o estilo muda conforme a maturidade do liderado: determinar, persuadir, compartilhar, delegar.<\/li>\n<li><strong>Transacional<\/strong> troca recompensa por desempenho; <strong>transformacional<\/strong> inspira e muda valores da equipe.<\/li>\n<\/ul>", "text": "A relação indivíduo-organização é uma troca: a pessoa contribui e espera recompensas (contrato psicológico). Teoria de motivação Ideia central Maslow Pirâmide de necessidades: fisiológicas, segurança, sociais, estima, autorrealização Herzberg Fatores higiênicos (salário, ambiente) só evitam insatisfação; fatores motivacionais (reconhecimento, responsabilidade) geram satisfação McGregor Teoria X: pessoas evitam trabalho e precisam de controle. Teoria Y: pessoas se motivam e assumem responsabilidade McClelland Necessidades de realização, poder e afiliação Vroom Motivação depende da expectativa de que o esforço trará uma recompensa desejada Liderança. Estilos clássicos: autocrático (líder decide sozinho), democrático (decide com o grupo), liberal ou laissez-faire (grupo decide sozinho). Situacional (Hersey-Blanchard): o estilo muda conforme a maturidade do liderado: determinar, persuadir, compartilhar, delegar. Transacional troca recompensa por desempenho; transformacional inspira e muda valores da equipe."}], "quiz": [{"q": "Para Herzberg, o salário é um fator:", "opts": ["Motivacional", "Higiênico", "De autorrealização", "De afiliação"], "a": 1, "exp": "Fatores higiênicos (salário, ambiente) só evitam insatisfação. Os motivacionais geram satisfação."}, {"q": "A Teoria Y de McGregor parte do pressuposto de que as pessoas:", "opts": ["Evitam o trabalho", "Precisam de controle rígido", "Se motivam e assumem responsabilidade", "Só trabalham por dinheiro"], "a": 2, "exp": "Teoria X: pessoas evitam trabalho. Teoria Y: pessoas se motivam e buscam responsabilidade."}, {"q": "Recrutamento e seleção pertencem a qual processo de gestão de pessoas?", "opts": ["Agregar", "Aplicar", "Manter", "Monitorar"], "a": 0, "exp": "Agregar = trazer pessoas para a organização (recrutar e selecionar)."}, {"q": "Na liderança situacional, o estilo do líder varia conforme:", "opts": ["O tamanho da equipe", "A maturidade do liderado", "O orçamento", "O cargo do líder"], "a": 1, "exp": "Hersey-Blanchard: determinar, persuadir, compartilhar ou delegar, conforme a maturidade."}]}, {"id": "materiais", "nome": "Recursos Materiais", "bloco": "Específico", "lead": "Classificação, estoques, compras e armazenagem. Curva ABC e ponto de pedido são clássicos de prova.", "topics": [{"num": "1-2", "title": "Classificação de materiais", "html": "<p>Uma boa classificação é abrangente, flexível e prática.<\/p>\n<ul>\n<li>Tipos: por demanda, criticidade, perecibilidade, periculosidade, dificuldade de aquisição, possibilidade de fazer ou comprar, mercado fornecedor.<\/li>\n<li><strong>Curva ABC (por valor):<\/strong> A = poucos itens (cerca de 20%) que concentram a maior parte do valor (cerca de 80%); C = muitos itens de pouco valor; B = intermediário.<\/li>\n<li><strong>XYZ (por criticidade):<\/strong> Z = imprescindível, sem substituto; Y = importante, mas substituível; X = baixa criticidade.<\/li>\n<\/ul>", "text": "Uma boa classificação é abrangente, flexível e prática. Tipos: por demanda, criticidade, perecibilidade, periculosidade, dificuldade de aquisição, possibilidade de fazer ou comprar, mercado fornecedor. Curva ABC (por valor): A = poucos itens (cerca de 20%) que concentram a maior parte do valor (cerca de 80%); C = muitos itens de pouco valor; B = intermediário. XYZ (por criticidade): Z = imprescindível, sem substituto; Y = importante, mas substituível; X = baixa criticidade."}, {"num": "3", "title": "Gestão de estoques", "html": "<ul>\n<li><strong>Estoque mínimo (de segurança):<\/strong> reserva contra atrasos e picos de consumo.<\/li>\n<li><strong>Ponto de pedido:<\/strong> consumo médio × tempo de reposição + estoque mínimo. Quando o estoque chega a esse nível, compra-se.<\/li>\n<li><strong>Giro de estoque:<\/strong> consumo ÷ estoque médio. Quanto maior, melhor.<\/li>\n<li>Avaliação: PEPS (primeiro que entra, primeiro que sai), UEPS (último que entra, primeiro que sai), custo médio. <strong>Just in time:<\/strong> comprar só quando precisa, estoque perto de zero.<\/li>\n<\/ul>", "text": "Estoque mínimo (de segurança): reserva contra atrasos e picos de consumo. Ponto de pedido: consumo médio × tempo de reposição + estoque mínimo. Quando o estoque chega a esse nível, compra-se. Giro de estoque: consumo ÷ estoque médio. Quanto maior, melhor. Avaliação: PEPS (primeiro que entra, primeiro que sai), UEPS (último que entra, primeiro que sai), custo médio. Just in time: comprar só quando precisa, estoque perto de zero."}, {"num": "4-6", "title": "Compras, modalidades e fornecedores", "html": "<p>No setor público, compras seguem a Lei 14.133 (licitação ou contratação direta, ver item 7 do bloco anterior). Compras podem ser centralizadas ou descentralizadas, normais ou de urgência. O <strong>cadastro de fornecedores<\/strong> registra empresas habilitadas; no governo federal é o <strong>SICAF<\/strong>.<\/p>", "text": "No setor público, compras seguem a Lei 14.133 (licitação ou contratação direta, ver item 7 do bloco anterior). Compras podem ser centralizadas ou descentralizadas, normais ou de urgência. O cadastro de fornecedores registra empresas habilitadas; no governo federal é o SICAF ."}, {"num": "7-10", "title": "Recebimento, entrada, conferência e armazenagem", "html": "<ul>\n<li><strong>Recebimento provisório:<\/strong> confere quantidade e aspecto. <strong>Definitivo:<\/strong> confere qualidade e especificação, e dá o aceite.<\/li>\n<li><strong>Entrada:<\/strong> registro no sistema com base na nota fiscal e na nota de empenho.<\/li>\n<li><strong>Conferência:<\/strong> quantitativa (quanto chegou) e qualitativa (se está conforme o pedido).<\/li>\n<li><strong>Critérios de armazenagem:<\/strong> respeitar PEPS; pesados embaixo; perigosos e inflamáveis separados; frágeis protegidos; itens de maior saída perto da porta.<\/li>\n<li><strong>Técnicas:<\/strong> carga unitária (paletes), estantes, porta-paletes, empilhamento, caixas e gavetas.<\/li>\n<\/ul>", "text": "Recebimento provisório: confere quantidade e aspecto. Definitivo: confere qualidade e especificação, e dá o aceite. Entrada: registro no sistema com base na nota fiscal e na nota de empenho. Conferência: quantitativa (quanto chegou) e qualitativa (se está conforme o pedido). Critérios de armazenagem: respeitar PEPS; pesados embaixo; perigosos e inflamáveis separados; frágeis protegidos; itens de maior saída perto da porta. Técnicas: carga unitária (paletes), estantes, porta-paletes, empilhamento, caixas e gavetas."}], "quiz": [{"q": "Na curva ABC, os itens da classe A são:", "opts": ["Muitos itens de pouco valor", "Poucos itens que concentram a maior parte do valor", "Itens sem substituto", "Itens perecíveis"], "a": 1, "exp": "Classe A: cerca de 20% dos itens e 80% do valor. Classe C: muitos itens de pouco valor."}, {"q": "O ponto de pedido é calculado por:", "opts": ["Estoque máximo − estoque mínimo", "Consumo médio × tempo de reposição + estoque mínimo", "Consumo ÷ estoque médio", "Estoque mínimo × 2"], "a": 1, "exp": "Quando o estoque cai a esse nível, faz-se o pedido de compra."}, {"q": "PEPS significa:", "opts": ["Primeiro que entra, primeiro que sai", "Primeiro que entra, por último que sai", "Preço de estoque por saída", "Pedido emergencial por solicitação"], "a": 0, "exp": "PEPS: o material mais antigo sai primeiro. UEPS: o último que entra sai primeiro."}, {"q": "No recebimento definitivo de material, verifica-se:", "opts": ["Apenas a quantidade", "Qualidade e especificação, com o aceite", "Somente a nota fiscal", "O preço de mercado"], "a": 1, "exp": "Provisório: quantidade e aspecto. Definitivo: qualidade, especificação e aceite."}]}, {"id": "arquivologia", "nome": "Arquivologia", "bloco": "Específico", "lead": "A teoria das três idades e a tabela de temporalidade são o coração da matéria.", "topics": [{"num": "1", "title": "Conceitos fundamentais", "html": "<p>Arquivo é o conjunto de documentos produzidos ou recebidos por um órgão no exercício de suas atividades, em qualquer suporte. Biblioteca reúne obras por interesse cultural; arquivo nasce da atividade do órgão.<\/p>\n<ul>\n<li><strong>Proveniência (respeito aos fundos):<\/strong> não misturar documentos de origens diferentes.<\/li>\n<li><strong>Organicidade:<\/strong> os documentos refletem a estrutura e as funções de quem os produziu.<\/li>\n<li><strong>Unicidade:<\/strong> cada documento é único no seu contexto.<\/li>\n<li><strong>Indivisibilidade:<\/strong> o fundo não deve ser dividido. <strong>Cumulatividade:<\/strong> o arquivo cresce naturalmente.<\/li>\n<\/ul>", "text": "Arquivo é o conjunto de documentos produzidos ou recebidos por um órgão no exercício de suas atividades, em qualquer suporte. Biblioteca reúne obras por interesse cultural; arquivo nasce da atividade do órgão. Proveniência (respeito aos fundos): não misturar documentos de origens diferentes. Organicidade: os documentos refletem a estrutura e as funções de quem os produziu. Unicidade: cada documento é único no seu contexto. Indivisibilidade: o fundo não deve ser dividido. Cumulatividade: o arquivo cresce naturalmente."}, {"num": "2", "title": "Gestão de documentos (Lei 8.159)", "html": "<p>Produção, tramitação, uso, avaliação e arquivamento nas fases corrente e intermediária, para eliminar o que não serve e recolher o que tem valor permanente.<\/p>", "text": "Produção, tramitação, uso, avaliação e arquivamento nas fases corrente e intermediária, para eliminar o que não serve e recolher o que tem valor permanente."}, {"num": "3", "title": "Diagnóstico", "html": "<p>Levantamento da situação dos arquivos antes de qualquer intervenção: volume, estado de conservação, organização, espaço e condições ambientais.<\/p>", "text": "Levantamento da situação dos arquivos antes de qualquer intervenção: volume, estado de conservação, organização, espaço e condições ambientais."}, {"num": "4 e 7", "title": "Teoria das três idades", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Idade<\/th>\n<th>Uso<\/th>\n<th>Onde fica<\/th>\n<th>Destino<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Corrente<\/td>\n<td>Frequente, documento em trâmite<\/td>\n<td>Perto de quem produziu<\/td>\n<td>Transferência para o intermediário<\/td>\n<\/tr>\n<tr>\n<td>Intermediário<\/td>\n<td>Esporádico, aguardando prazo legal<\/td>\n<td>Depósito central<\/td>\n<td>Eliminação ou recolhimento ao permanente<\/td>\n<\/tr>\n<tr>\n<td>Permanente<\/td>\n<td>Valor histórico ou probatório<\/td>\n<td>Arquivo permanente<\/td>\n<td>Guarda definitiva, nunca eliminado<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Valor primário:<\/strong> administrativo, legal, fiscal (interessa a quem produziu). <strong>Valor secundário:<\/strong> histórico e informativo (interessa à sociedade).<\/li>\n<li><strong>Transferência:<\/strong> corrente → intermediário. <strong>Recolhimento:<\/strong> → permanente.<\/li>\n<li><strong>No permanente:<\/strong> arranjo (organização em fundos e séries) e descrição (instrumentos de pesquisa: guia, inventário, catálogo, repertório, índice).<\/li>\n<\/ul>", "text": "Idade Uso Onde fica Destino Corrente Frequente, documento em trâmite Perto de quem produziu Transferência para o intermediário Intermediário Esporádico, aguardando prazo legal Depósito central Eliminação ou recolhimento ao permanente Permanente Valor histórico ou probatório Arquivo permanente Guarda definitiva, nunca eliminado Valor primário: administrativo, legal, fiscal (interessa a quem produziu). Valor secundário: histórico e informativo (interessa à sociedade). Transferência: corrente → intermediário. Recolhimento: → permanente. No permanente: arranjo (organização em fundos e séries) e descrição (instrumentos de pesquisa: guia, inventário, catálogo, repertório, índice)."}, {"num": "5", "title": "Protocolo", "html": "<p>Setor que recebe, registra, classifica, distribui, controla a tramitação e expede documentos. No governo federal, o processo recebe um Número Único de Protocolo (NUP).<\/p>", "text": "Setor que recebe, registra, classifica, distribui, controla a tramitação e expede documentos. No governo federal, o processo recebe um Número Único de Protocolo (NUP)."}, {"num": "6", "title": "Avaliação", "html": "<p>Analisa os documentos e define prazos de guarda e destinação, registrados na <strong>Tabela de Temporalidade e Destinação (TTD)<\/strong>. O <strong>plano de classificação<\/strong> organiza documentos por função e assunto.<\/p>\n<ul>\n<li>Métodos de arquivamento: alfabético, geográfico (diretos, sem índice), numérico simples, cronológico, por assunto (alguns precisam de índice, por isso são indiretos).<\/li>\n<\/ul>", "text": "Analisa os documentos e define prazos de guarda e destinação, registrados na Tabela de Temporalidade e Destinação (TTD) . O plano de classificação organiza documentos por função e assunto. Métodos de arquivamento: alfabético, geográfico (diretos, sem índice), numérico simples, cronológico, por assunto (alguns precisam de índice, por isso são indiretos)."}, {"num": "8", "title": "Tipologias e suportes", "html": "<ul>\n<li><strong>Espécie<\/strong> é a forma do documento (ata, ofício, relatório). <strong>Tipo<\/strong> é a espécie + a atividade (ata de reunião do Conselho).<\/li>\n<li><strong>Suporte<\/strong> é o material: papel, filme, meio magnético, óptico, digital.<\/li>\n<li><strong>Gênero:<\/strong> textual, iconográfico (fotos, desenhos), cartográfico, sonoro, audiovisual, micrografado, digital.<\/li>\n<\/ul>", "text": "Espécie é a forma do documento (ata, ofício, relatório). Tipo é a espécie + a atividade (ata de reunião do Conselho). Suporte é o material: papel, filme, meio magnético, óptico, digital. Gênero: textual, iconográfico (fotos, desenhos), cartográfico, sonoro, audiovisual, micrografado, digital."}, {"num": "9", "title": "Microfilmagem", "html": "<p>Lei 5.433/1968 e Decreto 1.799/1996: o microfilme tem valor legal. O original pode ser eliminado depois de microfilmado, <strong>exceto<\/strong> os de valor permanente. Formatos: rolo, jaqueta, microficha, cartão-janela.<\/p>", "text": "Lei 5.433/1968 e Decreto 1.799/1996: o microfilme tem valor legal. O original pode ser eliminado depois de microfilmado, exceto os de valor permanente. Formatos: rolo, jaqueta, microficha, cartão-janela."}, {"num": "10", "title": "Automação", "html": "<p>GED (gerenciamento eletrônico de documentos), digitalização com valor legal (Lei 12.682/2012 e Decreto 10.278/2020) e sistemas eletrônicos de processo, como o SEI em muitos órgãos federais.<\/p>", "text": "GED (gerenciamento eletrônico de documentos), digitalização com valor legal (Lei 12.682/2012 e Decreto 10.278/2020) e sistemas eletrônicos de processo, como o SEI em muitos órgãos federais."}, {"num": "11", "title": "Preservação, conservação e restauração", "html": "<ul>\n<li><strong>Preservação:<\/strong> ações amplas e preventivas (política, ambiente, temperatura e umidade estáveis, pouca luz, controle de pragas).<\/li>\n<li><strong>Conservação:<\/strong> cuidado direto para estabilizar o documento (higienização, caixas adequadas, tirar clipes metálicos).<\/li>\n<li><strong>Restauração:<\/strong> intervenção para recuperar documento já danificado.<\/li>\n<li>Inimigos: umidade, calor, luz, poeira, insetos, fungos e acidez do papel.<\/li>\n<\/ul>", "text": "Preservação: ações amplas e preventivas (política, ambiente, temperatura e umidade estáveis, pouca luz, controle de pragas). Conservação: cuidado direto para estabilizar o documento (higienização, caixas adequadas, tirar clipes metálicos). Restauração: intervenção para recuperar documento já danificado. Inimigos: umidade, calor, luz, poeira, insetos, fungos e acidez do papel."}], "quiz": [{"q": "A passagem de documentos para o arquivo permanente chama-se:", "opts": ["Transferência", "Recolhimento", "Eliminação", "Arranjo"], "a": 1, "exp": "Transferência: corrente para intermediário. Recolhimento: para o permanente."}, {"q": "O instrumento que define prazos de guarda e destinação dos documentos é:", "opts": ["Plano de classificação", "Tabela de Temporalidade e Destinação (TTD)", "Inventário", "Protocolo"], "a": 1, "exp": "A TTD resulta da avaliação e registra prazos de guarda e destinação final."}, {"q": "Documentos de valor permanente:", "opts": ["Podem ser eliminados após microfilmagem", "Nunca são eliminados", "Ficam no arquivo corrente", "São eliminados após 5 anos"], "a": 1, "exp": "Permanentes são guardados para sempre, inclusive depois de microfilmados."}, {"q": "O valor secundário de um documento é:", "opts": ["Administrativo", "Fiscal", "Histórico e informativo", "Legal"], "a": 2, "exp": "Primário interessa a quem produziu; secundário interessa à sociedade (histórico)."}, {"q": "O método alfabético de arquivamento é:", "opts": ["Indireto", "Direto", "Numérico", "Cronológico"], "a": 1, "exp": "Alfabético e geográfico são diretos: dispensam índice para a busca."}]}, {"id": "atendimento", "nome": "Atendimento ao Público", "bloco": "Específico", "lead": "Mais intuitivo, mas a banca cobra o significado exato de cada atributo.", "topics": [{"num": "1", "title": "Qualidade no atendimento", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Atributo<\/th>\n<th>Significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Comunicabilidade<\/td>\n<td>Falar de forma clara, sem gírias ou termos técnicos<\/td>\n<\/tr>\n<tr>\n<td>Apresentação<\/td>\n<td>Postura e aparência adequadas ao ambiente<\/td>\n<\/tr>\n<tr>\n<td>Atenção<\/td>\n<td>Ouvir o cidadão com foco, sem se distrair<\/td>\n<\/tr>\n<tr>\n<td>Cortesia<\/td>\n<td>Educação e respeito<\/td>\n<\/tr>\n<tr>\n<td>Interesse<\/td>\n<td>Mostrar vontade real de resolver<\/td>\n<\/tr>\n<tr>\n<td>Presteza<\/td>\n<td>Disposição e rapidez em ajudar<\/td>\n<\/tr>\n<tr>\n<td>Eficiência<\/td>\n<td>Resolver bem, com o mínimo de recursos e tempo<\/td>\n<\/tr>\n<tr>\n<td>Tolerância<\/td>\n<td>Paciência, inclusive com quem está alterado<\/td>\n<\/tr>\n<tr>\n<td>Discrição<\/td>\n<td>Sigilo e reserva sobre o que ouve<\/td>\n<\/tr>\n<tr>\n<td>Conduta<\/td>\n<td>Comportamento ético e profissional<\/td>\n<\/tr>\n<tr>\n<td>Objetividade<\/td>\n<td>Ir direto ao ponto, sem rodeios<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "text": "Atributo Significa Comunicabilidade Falar de forma clara, sem gírias ou termos técnicos Apresentação Postura e aparência adequadas ao ambiente Atenção Ouvir o cidadão com foco, sem se distrair Cortesia Educação e respeito Interesse Mostrar vontade real de resolver Presteza Disposição e rapidez em ajudar Eficiência Resolver bem, com o mínimo de recursos e tempo Tolerância Paciência, inclusive com quem está alterado Discrição Sigilo e reserva sobre o que ouve Conduta Comportamento ético e profissional Objetividade Ir direto ao ponto, sem rodeios"}, {"num": "2", "title": "Trabalho em equipe", "html": "<ul>\n<li><strong>Grupo<\/strong> é um conjunto de pessoas; <strong>equipe<\/strong> tem objetivo comum, interdependência e responsabilidade compartilhada.<\/li>\n<li><strong>Comportamento receptivo:<\/strong> aberto a ouvir e mudar. <strong>Defensivo:<\/strong> justifica-se, ataca ou se fecha.<\/li>\n<li><strong>Empatia:<\/strong> colocar-se no lugar do outro (diferente de simpatia, que é afinidade).<\/li>\n<li>O servidor representa o órgão: a imagem que passa forma a <strong>opinião pública<\/strong> sobre a instituição.<\/li>\n<li>Feedback eficaz é específico, descritivo (não julga a pessoa) e dado no momento certo.<\/li>\n<\/ul>", "text": "Grupo é um conjunto de pessoas; equipe tem objetivo comum, interdependência e responsabilidade compartilhada. Comportamento receptivo: aberto a ouvir e mudar. Defensivo: justifica-se, ataca ou se fecha. Empatia: colocar-se no lugar do outro (diferente de simpatia, que é afinidade). O servidor representa o órgão: a imagem que passa forma a opinião pública sobre a instituição. Feedback eficaz é específico, descritivo (não julga a pessoa) e dado no momento certo."}, {"num": "3", "title": "Postura profissional e relações interpessoais", "html": "<p>Ética, sigilo, pontualidade, linguagem adequada, não julgar o cidadão. Atendimento prioritário (Lei 10.048/2000): pessoas com deficiência, idosos com 60 anos ou mais, gestantes, lactantes, pessoas com criança de colo e obesos.<\/p>", "text": "Ética, sigilo, pontualidade, linguagem adequada, não julgar o cidadão. Atendimento prioritário (Lei 10.048/2000): pessoas com deficiência, idosos com 60 anos ou mais, gestantes, lactantes, pessoas com criança de colo e obesos."}, {"num": "4", "title": "Comunicação", "html": "<ul>\n<li>Elementos: emissor, mensagem, canal, código, receptor e feedback. <strong>Ruído<\/strong> é tudo que atrapalha a mensagem.<\/li>\n<li>Barreiras: ruído físico, jargão, filtragem (passar só parte da informação), percepção seletiva, emoções.<\/li>\n<li><strong>Escuta ativa:<\/strong> ouvir sem interromper, confirmar o que entendeu.<\/li>\n<li>Comunicação verbal (palavras) e não verbal (gestos, tom de voz, expressão facial) devem estar coerentes.<\/li>\n<\/ul>", "text": "Elementos: emissor, mensagem, canal, código, receptor e feedback. Ruído é tudo que atrapalha a mensagem. Barreiras: ruído físico, jargão, filtragem (passar só parte da informação), percepção seletiva, emoções. Escuta ativa: ouvir sem interromper, confirmar o que entendeu. Comunicação verbal (palavras) e não verbal (gestos, tom de voz, expressão facial) devem estar coerentes."}], "quiz": [{"q": "No atendimento, \"discrição\" significa:", "opts": ["Rapidez", "Sigilo e reserva sobre o que se ouve", "Ir direto ao ponto", "Paciência com o cidadão"], "a": 1, "exp": "Discrição é reserva. Rapidez é presteza; ir direto ao ponto é objetividade."}, {"q": "Empatia é:", "opts": ["Ter afinidade com alguém", "Colocar-se no lugar do outro", "Concordar com o cidadão", "Falar sem jargões"], "a": 1, "exp": "Empatia é se colocar no lugar do outro. Simpatia é afinidade."}, {"q": "Na comunicação, \"ruído\" é:", "opts": ["O canal usado", "Tudo que atrapalha a mensagem", "A resposta do receptor", "O código da mensagem"], "a": 1, "exp": "Ruído é qualquer interferência: barulho, jargão, distração, emoções."}, {"q": "Pela Lei 10.048/2000, idosos têm atendimento prioritário a partir de:", "opts": ["55 anos", "60 anos", "65 anos", "70 anos"], "a": 1, "exp": "Idosos com 60 anos ou mais estão entre os públicos com atendimento prioritário."}]}];
const BY = Object.fromEntries(DATA.map(m => [m.id, m]));
const TOTAL = DATA.reduce((s, m) => s + m.topics.length, 0);

const store = {
  get(k, d) { try { const v = localStorage.getItem('c201.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) {
    try { localStorage.setItem('c201.' + k, JSON.stringify(v)); } catch (e) {}
    if (SYNCED.includes(k)) { try { localStorage.setItem('c201.updatedAt', String(Date.now())); } catch (e) {} scheduleCloud(); }
  }
};
const SYNCED = ['done', 'last', 'lastSeen', 'quiz'];
let cloudRef = null, writing = false, again = false, wt = null, applying = false;
let done = new Set(store.get('done', []));
let last = store.get('last', {});        // { materiaId: topicIndex }
let lastSeen = store.get('lastSeen', null); // { m, t }
let fs = store.get('fs', 1.0625);
let quizState = store.get('quiz', {}); // respostas do teste, por matéria

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const key = (m, i) => m + ':' + i;
const countDone = m => BY[m].topics.reduce((s, _, i) => s + (done.has(key(m, i)) ? 1 : 0), 0);
const allDone = () => DATA.reduce((s, m) => s + countDone(m.id), 0);
const tabVar = id => `var(--t-${id})`;

function saveDone() { store.set('done', [...done]); }
function applyFs() { document.documentElement.style.setProperty('--read-size', fs + 'rem'); }
applyFs();

/* ---------- Índice lateral ---------- */
function renderNav(current) {
  for (const [gid, bloco] of [['#navComum', 'Comum'], ['#navEsp', 'Específico']]) {
    const g = $(gid);
    g.querySelectorAll('.navitem').forEach(n => n.remove());
    DATA.filter(m => m.bloco === bloco).forEach(m => {
      const n = countDone(m.id), t = m.topics.length;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'navitem';
      if (current === m.id) b.setAttribute('aria-current', 'page');
      b.innerHTML = `<span class="dot" style="--tab:${tabVar(m.id)}"></span><span class="nm">${esc(m.nome)}</span><span class="ct${n === t ? ' full' : ''}">${n}/${t}</span>`;
      b.onclick = () => go(m.id);
      g.appendChild(b);
    });
  }
  $('#navHome').toggleAttribute('aria-current', current === 'inicio');
  if (current === 'inicio') $('#navHome').setAttribute('aria-current', 'page');
  $('#navHomeCt').textContent = `${allDone()}/${TOTAL}`;
}

/* ---------- Matéria ---------- */
function renderMateria(mid, ti) {
  const m = BY[mid];
  if (ti === undefined) ti = last[mid] ?? 0;
  const isQuiz = ti === 'quiz';
  if (!isQuiz) { ti = Math.max(0, Math.min(m.topics.length - 1, +ti || 0)); last[mid] = ti; store.set('last', last); lastSeen = { m: mid, t: ti }; store.set('lastSeen', lastSeen); }
  const pills = m.topics.map((t, i) =>
    `<button type="button" class="pill${done.has(key(mid, i)) ? ' done' : ''}" data-i="${i}" aria-current="${!isQuiz && i === ti}" title="${esc(t.title)}">${esc(t.num)}</button>`).join('')
    + `<button type="button" class="pill quiz" data-i="quiz" aria-current="${isQuiz}">Teste rápido</button>`;
  const d = countDone(mid);
  let body;
  if (isQuiz) body = quizHtml(m);
  else {
    const t = m.topics[ti], isDone = done.has(key(mid, ti));
    const hasNext = ti < m.topics.length - 1;
    body = `<article class="sheet" style="--tab:${tabVar(mid)}">
      <div class="kicker"><span class="eyebrow">Tópico ${esc(t.num)} · ${ti + 1} de ${m.topics.length}</span><span class="eyebrow">${esc(m.nome)}</span></div>
      <h2>${esc(t.title)}</h2>
      <div class="read">${t.html}</div>
      <div class="sheetfoot">
        <button class="btn ${isDone ? 'done' : 'ghost'}" type="button" id="doneBtn" aria-pressed="${isDone}">${isDone ? '✓ Estudado' : 'Marcar como estudado'}</button>
        <div class="nav">
          <button class="btn ghost" type="button" id="prevBtn" ${ti === 0 ? 'disabled' : ''}>← Anterior</button>
          <button class="btn primary" type="button" id="nextBtn">${hasNext ? 'Próximo →' : 'Fazer o teste →'}</button>
        </div>
      </div></article>`;
  }
  $('#main').innerHTML = `
    <section class="mhead" style="--tab:${tabVar(mid)}">
      <span class="tabchip">Conhecimento ${m.bloco.toLowerCase()} · ${d}/${m.topics.length} estudados</span>
      <h1>${esc(m.nome)}</h1>
      ${m.lead ? `<p>${esc(m.lead)}</p>` : ''}
    </section>
    <nav class="pills" aria-label="Tópicos">${pills}</nav>
    ${body}`;
  document.querySelectorAll('.pill').forEach(p => p.onclick = () => go(mid, p.dataset.i === 'quiz' ? 'quiz' : +p.dataset.i));
  if (isQuiz) { bindQuiz(m); return; }
  $('#doneBtn').onclick = () => { const k = key(mid, ti); done.has(k) ? done.delete(k) : done.add(k); saveDone(); renderNav(mid); renderMateria(mid, ti); };
  $('#prevBtn').onclick = () => go(mid, ti - 1);
  $('#nextBtn').onclick = () => {
    done.add(key(mid, ti)); saveDone();
    go(mid, ti < m.topics.length - 1 ? ti + 1 : 'quiz');
  };
}

/* ---------- Teste rápido ---------- */
function quizHtml(m) {
  const st = quizState[m.id] || (quizState[m.id] = {});
  const answered = Object.keys(st).length, right = Object.entries(st).filter(([i, a]) => m.quiz[i].a === a).length;
  const L = 'ABCD';
  const qs = m.quiz.map((q, i) => {
    const a = st[i];
    const opts = q.opts.map((o, j) => {
      let cls = '';
      if (a !== undefined) { if (j === q.a) cls = ' right'; else if (j === a) cls = ' wrong'; }
      return `<button type="button" class="opt${cls}" data-q="${i}" data-o="${j}" ${a !== undefined ? 'disabled' : ''}><span>${L[j]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    const exp = a === undefined ? '' : `<p class="exp">${a === q.a ? '<b class="r">Certo.</b>' : '<b class="w">Não foi dessa vez.</b>'} ${esc(q.exp)}</p>`;
    return `<div class="q"><p class="stem"><b>${String(i + 1).padStart(2, '0')}</b>${esc(q.q)}</p><div class="opts">${opts}</div>${exp}</div>`;
  }).join('');
  return `<article class="sheet">
    <div class="score"><h2>Teste rápido</h2><span class="eyebrow">${answered ? `${right} de ${answered} acertos` : `${m.quiz.length} questões`}</span></div>
    <div class="qlist">${qs}</div>
    <div class="sheetfoot"><button class="btn ghost" type="button" id="resetQuiz">Refazer o teste</button>
      <div class="nav"><button class="btn primary" type="button" id="backTop">Voltar ao primeiro tópico</button></div></div>
  </article>`;
}
function bindQuiz(m) {
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    quizState[m.id][b.dataset.q] = +b.dataset.o;
    store.set('quiz', quizState);
    const y = window.scrollY; renderMateria(m.id, 'quiz'); window.scrollTo(0, y);
  });
  $('#resetQuiz').onclick = () => { quizState[m.id] = {}; store.set('quiz', quizState); renderMateria(m.id, 'quiz'); };
  $('#backTop').onclick = () => go(m.id, 0);
}

/* ---------- Busca ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const INDEX = [];
DATA.forEach(m => m.topics.forEach((t, i) => INDEX.push({ m: m.id, i, t, hay: norm(t.title + ' ' + t.text) })));
function renderSearch(q) {
  const nq = norm(q.trim());
  const hits = nq.length < 2 ? [] : INDEX.filter(x => x.hay.includes(nq));
  const snip = x => {
    const p = norm(x.t.text).indexOf(nq);
    if (p < 0) return esc(x.t.text.slice(0, 140)) + '…';
    const s = Math.max(0, p - 60), e = Math.min(x.t.text.length, p + nq.length + 90);
    return (s ? '…' : '') + esc(x.t.text.slice(s, p)) + '<mark>' + esc(x.t.text.slice(p, p + nq.length)) + '</mark>' + esc(x.t.text.slice(p + nq.length, e)) + (e < x.t.text.length ? '…' : '');
  };
  $('#main').innerHTML = `<section class="mhead"><span class="eyebrow">Busca</span><h1>“${esc(q.trim())}”</h1>
    <p>${hits.length ? `${hits.length} tópico${hits.length > 1 ? 's' : ''} encontrado${hits.length > 1 ? 's' : ''}.` : ''}</p></section>
    <div class="results">${hits.length ? hits.map(x => `<button type="button" class="hit" data-m="${x.m}" data-i="${x.i}" style="--tab:${tabVar(x.m)}">
      <span class="where"><i></i>${esc(BY[x.m].nome)} · tópico ${esc(x.t.num)}</span><b>${esc(x.t.title)}</b><p>${snip(x)}</p></button>`).join('')
      : `<p class="empty">${nq.length < 2 ? 'Digite pelo menos 2 letras.' : 'Nada encontrado. Tente outra palavra, como “prazo”, “lei” ou “estoque”.'}</p>`}</div>`;
  document.querySelectorAll('.hit').forEach(h => h.onclick = () => { $('#q').value = ''; go(h.dataset.m, +h.dataset.i); });
  renderNav(null);
}

/* ---------- Conta GitHub: login por código e progresso num Gist secreto ---------- */
const CFG = window.APP_CONFIG || {};
const APP_VERSION = window.APP_VERSION || 'dev';
const GIST_FILE = 'caderno-201-progresso.json';
const GIST_DESC = 'Caderno 201 · progresso (não apague)';
const CAP = window.Capacitor;
const isNative = !!CAP && ((CAP.isNativePlatform && CAP.isNativePlatform()) || (CAP.getPlatform && CAP.getPlatform() !== 'web'));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let auth = store.get('auth', null); // { token, login, avatar, gistId }
let loginRun = 0;

function saveAuth() { try { localStorage.setItem('c201.auth', JSON.stringify(auth)); } catch (e) {} }
// No app, abre links no navegador do celular (aba do Chrome). Se o plugin falhar,
// navegar para um site externo também faz o Capacitor abrir o navegador.
function openExternal(url) {
  if (!isNative) { window.open(url, '_blank', 'noopener'); return; }
  let p = null;
  try {
    if (CAP.Plugins && CAP.Plugins.Browser && CAP.Plugins.Browser.open) p = CAP.Plugins.Browser.open({ url });
    else if (CAP.registerPlugin) p = CAP.registerPlugin('Browser').open({ url });
  } catch (e) { p = null; }
  if (p && p.catch) p.catch(() => { location.href = url; });
  else if (!p) location.href = url;
}
function setSync(state, text) { const s = $('#sync'); if (!s) return; s.dataset.state = state; $('#syncText').textContent = text; }
function renderAccount() {
  const on = !!(auth && auth.token);
  $('#who').hidden = !on; $('#pitch').hidden = on;
  $('#loginBtn').hidden = on; $('#logoutBtn').hidden = !on; $('#syncBtn').hidden = !on;
  if (on) { $('#login').textContent = '@' + (auth.login || 'github'); if (auth.avatar) $('#avatar').src = auth.avatar; }
  if (!CFG.clientId) { $('#loginBtn').disabled = true; $('#pitch').textContent = 'O login com GitHub ainda não foi configurado nesta versão. Seu progresso fica salvo neste aparelho.'; }
}

async function gh(path, opts = {}) {
  const headers = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (auth && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, { ...opts, headers, cache: 'no-store' });
  if (r.status === 401) { const e = new Error('auth'); e.code = 'auth'; throw e; }
  if (!r.ok) { const e = new Error('http ' + r.status); e.code = 'http'; e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}

function localState() {
  let u = 0; try { u = +localStorage.getItem('c201.updatedAt') || 0; } catch (e) {}
  return { done: [...done].sort(), last, lastSeen, quiz: quizState, updatedAt: u };
}
function applyRemote(r) {
  applying = true;
  done = new Set(Array.isArray(r.done) ? r.done : []);
  last = r.last || {}; lastSeen = r.lastSeen || null; quizState = r.quiz || {};
  try {
    localStorage.setItem('c201.done', JSON.stringify([...done]));
    localStorage.setItem('c201.last', JSON.stringify(last));
    localStorage.setItem('c201.lastSeen', JSON.stringify(lastSeen));
    localStorage.setItem('c201.quiz', JSON.stringify(quizState));
    localStorage.setItem('c201.updatedAt', String(r.updatedAt || Date.now()));
  } catch (e) {}
  applying = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

async function findGist() {
  if (auth.gistId) return auth.gistId;
  for (let page = 1; page <= 5; page++) {
    const list = await gh('/gists?per_page=100&page=' + page);
    const g = list.find(x => x.files && x.files[GIST_FILE]);
    if (g) return g.id;
    if (list.length < 100) break;
  }
  return null;
}
async function pullRemote() {
  const id = await findGist();
  if (!id) return null;
  let g;
  try { g = await gh('/gists/' + id); }
  catch (e) { if (e.status === 404) { auth.gistId = null; saveAuth(); return null; } throw e; }
  auth.gistId = id; saveAuth();
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let content = f.content;
  if (f.truncated) content = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  try { return JSON.parse(content); } catch (e) { return null; }
}
async function pushRemote() {
  const body = { description: GIST_DESC, files: { [GIST_FILE]: { content: JSON.stringify(localState(), null, 1) } } };
  if (auth.gistId) {
    try { await gh('/gists/' + auth.gistId, { method: 'PATCH', body: JSON.stringify(body) }); return; }
    catch (e) { if (e.status !== 404) throw e; auth.gistId = null; }
  }
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ ...body, public: false }) });
  auth.gistId = g.id; saveAuth();
}

const OK_TEXT = 'Progresso salvo no GitHub';
function syncError(e) {
  if (e && e.code === 'auth') { logout(); setSync('err', 'Sessão expirada. Entre de novo.'); return; }
  setSync('err', navigator.onLine === false ? 'Sem internet. Salvo no aparelho e envio depois.' : 'Não consegui falar com o GitHub. Salvo no aparelho.');
}
function scheduleCloud() {
  if (!auth || !auth.token || applying) return;
  setSync('saving', 'Salvando…');
  clearTimeout(wt); wt = setTimeout(flush, 2000);
}
async function flush() {
  if (!auth || !auth.token) return;
  if (writing) { again = true; return; }
  writing = true;
  try { await pushRemote(); setSync('ok', OK_TEXT); } catch (e) { syncError(e); }
  writing = false;
  if (again) { again = false; flush(); }
}
let syncing = false;
async function syncNow() {
  if (!auth || !auth.token || syncing) return;
  syncing = true; setSync('saving', 'Sincronizando…');
  try {
    const r = await pullRemote();
    const loc = localState();
    let synced = false; try { synced = localStorage.getItem('c201.syncedAs') === auth.login; } catch (e) {}
    if (!r) await pushRemote();
    else if (!synced) {
      // primeira vez desta conta neste aparelho: junta o que havia aqui com o que está no GitHub
      const merged = { done: [...new Set([...(r.done || []), ...loc.done])].sort(),
        last: Object.assign({}, r.last, loc.last), lastSeen: loc.lastSeen || r.lastSeen || null,
        quiz: Object.assign({}, r.quiz, loc.quiz), updatedAt: Date.now() };
      applyRemote(merged); await pushRemote();
    } else if ((r.updatedAt || 0) > loc.updatedAt) applyRemote(r);
    else if ((r.updatedAt || 0) < loc.updatedAt) await pushRemote();
    try { localStorage.setItem('c201.syncedAs', auth.login); } catch (e) {}
    setSync('ok', OK_TEXT);
  } catch (e) { syncError(e); }
  syncing = false;
}

async function startLogin() {
  if (!CFG.clientId) return;
  const run = ++loginRun;
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Preparando o código…</h2></article>`;
  closeMenu(); window.scrollTo(0, 0);
  let d;
  try {
    const r = await fetch('https://github.com/login/device/code', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify({ client_id: CFG.clientId, scope: 'gist' }) });
    d = await r.json();
    if (!d.user_code) throw new Error(d.error || 'sem código');
  } catch (e) {
    $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Não consegui começar o login</h2>
      <p class="read">${isNative ? 'Confira sua internet e tente de novo.' : 'O login com GitHub funciona no app para Android. No navegador, o progresso fica salvo só neste aparelho.'}</p>
      <div class="sheetfoot"><button class="btn ghost" type="button" id="lgBack">Voltar</button></div></article>`;
    $('#lgBack').onclick = () => render();
    return;
  }
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Digite este código no GitHub</h2>
    <div class="code" id="ucode">${esc(d.user_code)}</div>
    <ol class="steps"><li>Toque em <b>Copiar e abrir o GitHub</b>.</li><li>Cole o código na página que abrir e toque em <b>Continue</b>, depois em <b>Authorize</b>.</li><li>Volte para este app. O login termina sozinho.</li></ol>
    <p class="exp" id="lgStatus">Esperando você autorizar no GitHub…</p>
    <div class="sheetfoot"><button class="btn ghost" type="button" id="lgCancel">Cancelar</button><div class="nav"><button class="btn primary" type="button" id="lgOpen">Copiar e abrir o GitHub</button></div></div></article>`;
  $('#lgCancel').onclick = () => { loginRun++; render(); };
  $('#lgOpen').onclick = async () => {
    try { await navigator.clipboard.writeText(d.user_code); } catch (e) { const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents($('#ucode')); s.removeAllRanges(); s.addRange(rg); }
    openExternal(d.verification_uri || 'https://github.com/login/device');
  };
  let interval = (d.interval || 5) * 1000;
  const until = Date.now() + (d.expires_in || 900) * 1000;
  while (run === loginRun && Date.now() < until) {
    await sleep(interval);
    if (run !== loginRun) return;
    let j;
    try {
      const r = await fetch('https://github.com/login/oauth/access_token', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: CFG.clientId, device_code: d.device_code, grant_type: 'urn:ietf:params:oauth:grant-type:device_code' }) });
      j = await r.json();
    } catch (e) { continue; }
    if (j.access_token) {
      auth = { token: j.access_token, login: '', avatar: '', gistId: null };
      try { const u = await gh('/user'); auth.login = u.login; auth.avatar = u.avatar_url; } catch (e) {}
      saveAuth(); renderAccount(); render(); await syncNow(); return;
    }
    if (j.error === 'authorization_pending') continue;
    if (j.error === 'slow_down') { interval += 5000; continue; }
    const msg = j.error === 'access_denied' ? 'Você cancelou a autorização no GitHub.' : j.error === 'expired_token' ? 'O código expirou.' : 'O GitHub recusou o login (' + esc(j.error || 'erro') + ').';
    const st = $('#lgStatus'); if (st) st.innerHTML = msg + ' Toque em Cancelar e tente de novo.';
    return;
  }
  const st = $('#lgStatus'); if (st && run === loginRun) st.textContent = 'O código expirou. Toque em Cancelar e tente de novo.';
}
function logout() {
  auth = null; try { localStorage.removeItem('c201.auth'); } catch (e) {}
  renderAccount();
}
$('#loginBtn').onclick = startLogin;
$('#logoutBtn').onclick = () => { logout(); setSync('wait', ''); };
$('#syncBtn').onclick = syncNow;
renderAccount();
if (auth && auth.token) { setSync('ok', OK_TEXT); syncNow(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncNow(); } else if (wt) { clearTimeout(wt); flush(); } });
window.addEventListener('online', () => syncNow());

/* ---------- Atualizações pelo GitHub Releases ---------- */
const cmpVer = (a, b) => { const pa = a.split('.').map(Number), pb = b.split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; } return 0; };
$('#appVer').textContent = APP_VERSION;
let apkUrl = null;
async function checkUpdate(silent) {
  const t = $('#updText');
  if (!CFG.repo) { if (!silent) t.textContent = 'Repositório não configurado.'; return; }
  if (!silent) t.textContent = 'Procurando versão nova…';
  try {
    const r = await fetch(`https://api.github.com/repos/${CFG.repo}/releases/latest`, { headers: { 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
    if (r.status === 404) { if (!silent) t.textContent = 'Nenhuma versão publicada ainda.'; return; }
    if (!r.ok) throw new Error(r.status);
    const rel = await r.json();
    const latest = String(rel.tag_name || '').replace(/^v/, '');
    const apk = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
    if (APP_VERSION !== 'dev' && latest && apk && cmpVer(latest, APP_VERSION) > 0) {
      apkUrl = apk.browser_download_url;
      t.textContent = `Versão ${latest} disponível.`;
      $('#updGet').hidden = false;
    } else if (!silent) { t.textContent = 'Você já está na versão mais recente.'; $('#updGet').hidden = true; }
  } catch (e) { if (!silent) t.textContent = 'Não consegui verificar agora. Confira a internet.'; }
}
$('#updBtn').onclick = () => checkUpdate(false);
$('#updGet').onclick = () => { if (apkUrl) { openExternal(apkUrl); $('#updText').textContent = 'Abra o arquivo baixado e toque em Instalar. Seu progresso continua.'; } };
if (isNative) checkUpdate(true);
</script>
