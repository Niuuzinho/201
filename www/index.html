ica penalidade que ela aplica é a censura (a falta mais grave vai à instância disciplinar). Decreto 6.029/2007 (Sistema de Gestão da Ética do Poder Executivo Federal) Comissão de Ética Pública (CEP) no topo, ligada à Presidência, e comissões de ética em cada órgão e entidade, integradas por três membros com mandato. Funções: orientar, receber denúncias, apurar, aplicar censura, propor aperfeiçoamentos. O procedimento corre em sigilo até a conclusão. A Lei 12.813/2013 trata do conflito de interesses no exercício de cargo do Poder Executivo federal. O Código de Conduta da Alta Administração Federal estabelece regras para ministros e dirigentes. Cai em prova: censura é a única pena da comissão de ética. Ela é aplicada por comissão de ética , não por processo administrativo disciplinar."}, {"num": "6", "title": "Improbidade Administrativa (Lei 8.429/1992, reformada pela Lei 14.230/2021)", "html": "<p>Improbidade é o ato <strong>desonesto<\/strong> de agente público (ou de quem o ajuda) contra a Administração. Não é crime: é ilícito civil e político, apurado em ação civil própria.<\/p>\n<ul>\n<li>Desde a reforma de 2021, <strong>toda improbidade exige dolo<\/strong> (intenção). Erro culposo, simples ilegalidade ou má gestão <strong>não<\/strong> configuram improbidade. A <strong>tipificação passou a ser taxativa<\/strong> (lista fechada nos arts. 9, 10 e 11).<\/li>\n<li><strong>Sujeito ativo:<\/strong> agente público e quem induz, concorre ou se beneficia (inclusive particulares). <strong>Sujeito passivo:<\/strong> a administração direta e indireta e entidades que recebem recursos públicos.<\/li>\n<li><strong>Prazo de prescrição:<\/strong> <strong>8 anos<\/strong>, contados do fato ou, nos atos permanentes, da cessação da permanência (a reforma uniformizou o prazo). Há <strong>prescrição intercorrente<\/strong> de 4 anos durante o processo.<\/li>\n<li><strong>Acordo de não persecução cível:<\/strong> passou a ser admitido, com ressarcimento do dano.<\/li>\n<li><strong>Quem propõe a ação:<\/strong> o <strong>Ministério Público<\/strong> e, segundo o STF, também a pessoa jurídica lesada.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Exemplo<\/th>\n<th>Suspensão dos direitos políticos<\/th>\n<th>Proibição de contratar<\/th>\n<th>Outras sanções<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Enriquecimento ilícito (art. 9)<\/td>\n<td>Receber propina<\/td>\n<td>Até 14 anos<\/td>\n<td>Até 14 anos<\/td>\n<td>Perda dos bens acrescidos, perda da função, multa igual ao acréscimo<\/td>\n<\/tr>\n<tr>\n<td>Lesão ao erário (art. 10)<\/td>\n<td>Facilitar desvio de verba<\/td>\n<td>Até 12 anos<\/td>\n<td>Até 12 anos<\/td>\n<td>Ressarcimento integral, perda da função, multa igual ao dano<\/td>\n<\/tr>\n<tr>\n<td>Violação de princípios (art. 11)<\/td>\n<td>Revelar segredo do cargo<\/td>\n<td>Não há<\/td>\n<td>Até 4 anos<\/td>\n<td>Multa civil (até 24 vezes a remuneração)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>As hipóteses do art. 11 são <strong>taxativas<\/strong> (lista fechada): revelar fato sigiloso, frustrar a licitude de concurso, deixar de prestar contas quando obrigado, nepotismo, entre outras.<\/li>\n<li><strong>Indisponibilidade de bens<\/strong> e <strong>ressarcimento<\/strong> são medidas para garantir o dano.<\/li>\n<li>As sanções devem ser <strong>proporcionais<\/strong> à gravidade e podem ser aplicadas de forma isolada ou cumulativa.<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> o que mudou em 2021: <strong>dolo<\/strong> obrigatório, rol <strong>taxativo<\/strong> do art. 11, prazo de prescrição de <strong>8 anos<\/strong>, fim da sanção de suspensão de direitos políticos no art. 11, e possibilidade de acordo.<\/p>\n<\/blockquote>", "text": "Improbidade é o ato desonesto de agente público (ou de quem o ajuda) contra a Administração. Não é crime: é ilícito civil e político, apurado em ação civil própria. Desde a reforma de 2021, toda improbidade exige dolo (intenção). Erro culposo, simples ilegalidade ou má gestão não configuram improbidade. A tipificação passou a ser taxativa (lista fechada nos arts. 9, 10 e 11). Sujeito ativo: agente público e quem induz, concorre ou se beneficia (inclusive particulares). Sujeito passivo: a administração direta e indireta e entidades que recebem recursos públicos. Prazo de prescrição: 8 anos , contados do fato ou, nos atos permanentes, da cessação da permanência (a reforma uniformizou o prazo). Há prescrição intercorrente de 4 anos durante o processo. Acordo de não persecução cível: passou a ser admitido, com ressarcimento do dano. Quem propõe a ação: o Ministério Público e, segundo o STF, também a pessoa jurídica lesada. Tipo Exemplo Suspensão dos direitos políticos Proibição de contratar Outras sanções Enriquecimento ilícito (art. 9) Receber propina Até 14 anos Até 14 anos Perda dos bens acrescidos, perda da função, multa igual ao acréscimo Lesão ao erário (art. 10) Facilitar desvio de verba Até 12 anos Até 12 anos Ressarcimento integral, perda da função, multa igual ao dano Violação de princípios (art. 11) Revelar segredo do cargo Não há Até 4 anos Multa civil (até 24 vezes a remuneração) As hipóteses do art. 11 são taxativas (lista fechada): revelar fato sigiloso, frustrar a licitude de concurso, deixar de prestar contas quando obrigado, nepotismo, entre outras. Indisponibilidade de bens e ressarcimento são medidas para garantir o dano. As sanções devem ser proporcionais à gravidade e podem ser aplicadas de forma isolada ou cumulativa. Cai em prova: o que mudou em 2021: dolo obrigatório, rol taxativo do art. 11, prazo de prescrição de 8 anos , fim da sanção de suspensão de direitos políticos no art. 11, e possibilidade de acordo."}, {"num": "7", "title": "Processo Administrativo Federal (Lei 9.784/1999)", "html": "<p>Regula o processo na <strong>Administração Federal direta e indireta<\/strong>, em especial para proteger os direitos dos administrados e o melhor cumprimento dos fins da Administração.<\/p>\n<ul>\n<li><strong>Princípios:<\/strong> legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.<\/li>\n<li><strong>Critérios de atuação:<\/strong> objetividade, adequação entre meios e fins, divulgação oficial dos atos, <strong>proibição de cobrança de despesas processuais<\/strong> (salvo previsão legal), interpretação da norma que melhor garanta o fim público, <strong>proibição de aplicação retroativa de nova interpretação<\/strong>.<\/li>\n<li><strong>Direitos do administrado:<\/strong> ser tratado com respeito, ter ciência da tramitação, formular alegações, <strong>fazer-se assistir por advogado<\/strong> (facultativo, salvo exigência legal).<\/li>\n<li><strong>Início:<\/strong> de ofício ou a pedido do interessado. A forma é simples; não exige formalismos além dos necessários.<\/li>\n<li><strong>Competência:<\/strong> irrenunciável, mas pode ser <strong>delegada<\/strong> (e avocada, excepcionalmente). <strong>Não se delegam (CE-NO-RE):<\/strong> <strong>C<\/strong>ompetência <strong>E<\/strong>xclusiva, atos <strong>NO<\/strong>rmativos, decisão de <strong>RE<\/strong>cursos.<\/li>\n<li><strong>Impedimento<\/strong> (situações objetivas: ter interesse direto, ser parente) e <strong>suspeição<\/strong> (amizade íntima ou inimizade) afastam o servidor do processo.<\/li>\n<li><strong>Prazos:<\/strong> decisão em até <strong>30 dias após a instrução<\/strong> (prorrogável por mais 30, motivadamente); <strong>recurso em 10 dias<\/strong>; a autoridade pode <strong>reconsiderar em 5 dias<\/strong>, senão envia ao superior; no máximo <strong>3 instâncias<\/strong>. Os atos do processo realizam-se em <strong>5 dias<\/strong>, salvo motivo de força maior.<\/li>\n<li><strong>Motivação:<\/strong> obrigatória para atos que neguem, limitem ou afetem direitos, imponham sanções ou decidam recursos.<\/li>\n<li><strong>Anulação:<\/strong> ato ilegal. <strong>Revogação:<\/strong> ato legal, mas inconveniente ou inoportuno (a Administração pode revogar por motivo de conveniência). O direito de anular atos <strong>favoráveis<\/strong> ao cidadão decai em <strong>5 anos<\/strong>, salvo <strong>má-fé<\/strong>.<\/li>\n<li><strong>Convalidação:<\/strong> defeito sanável, sem prejuízo, pode ser corrigido.<\/li>\n<li><strong>Recurso:<\/strong> em regra sem exigência de <strong>caução<\/strong>; o recurso administrativo pode agravar a situação do recorrente (<strong>reformatio in pejus<\/strong>) só após ele ser ouvido.<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> \"CE-NO-RE\" lembra o que <strong>não<\/strong> pode ser delegado. \"30 + 30\" é o tempo para decidir, \"10 e 5\" é recurso e reconsideração.<\/p>\n<\/blockquote>", "text": "Regula o processo na Administração Federal direta e indireta , em especial para proteger os direitos dos administrados e o melhor cumprimento dos fins da Administração. Princípios: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência. Critérios de atuação: objetividade, adequação entre meios e fins, divulgação oficial dos atos, proibição de cobrança de despesas processuais (salvo previsão legal), interpretação da norma que melhor garanta o fim público, proibição de aplicação retroativa de nova interpretação . Direitos do administrado: ser tratado com respeito, ter ciência da tramitação, formular alegações, fazer-se assistir por advogado (facultativo, salvo exigência legal). Início: de ofício ou a pedido do interessado. A forma é simples; não exige formalismos além dos necessários. Competência: irrenunciável, mas pode ser delegada (e avocada, excepcionalmente). Não se delegam (CE-NO-RE): C ompetência E xclusiva, atos NO rmativos, decisão de RE cursos. Impedimento (situações objetivas: ter interesse direto, ser parente) e suspeição (amizade íntima ou inimizade) afastam o servidor do processo. Prazos: decisão em até 30 dias após a instrução (prorrogável por mais 30, motivadamente); recurso em 10 dias ; a autoridade pode reconsiderar em 5 dias , senão envia ao superior; no máximo 3 instâncias . Os atos do processo realizam-se em 5 dias , salvo motivo de força maior. Motivação: obrigatória para atos que neguem, limitem ou afetem direitos, imponham sanções ou decidam recursos. Anulação: ato ilegal. Revogação: ato legal, mas inconveniente ou inoportuno (a Administração pode revogar por motivo de conveniência). O direito de anular atos favoráveis ao cidadão decai em 5 anos , salvo má-fé . Convalidação: defeito sanável, sem prejuízo, pode ser corrigido. Recurso: em regra sem exigência de caução ; o recurso administrativo pode agravar a situação do recorrente ( reformatio in pejus ) só após ele ser ouvido. Macete: \"CE-NO-RE\" lembra o que não pode ser delegado. \"30 + 30\" é o tempo para decidir, \"10 e 5\" é recurso e reconsideração."}, {"num": "8", "title": "Lei de Acesso à Informação (Lei 12.527/2011 e Dec. 7.724/2012)", "html": "<ul>\n<li><strong>Regra:<\/strong> o acesso é a regra; o sigilo é a exceção. O pedido <strong>não precisa de justificativa<\/strong>, mas exige a identificação do requerente e a especificação da informação.<\/li>\n<li><strong>Quem se submete:<\/strong> órgãos públicos de todos os poderes e entes, e entidades privadas sem fins lucrativos que recebam recursos públicos (quanto a esses recursos).<\/li>\n<li><strong>Transparência ativa:<\/strong> o órgão divulga sem ninguém pedir (estrutura, despesas, licitações, contatos). <strong>Transparência passiva:<\/strong> responde a pedidos, por meio do <strong>Serviço de Informação ao Cidadão (SIC)<\/strong> e da plataforma <strong>Fala.BR<\/strong>.<\/li>\n<li><strong>Prazo:<\/strong> resposta <strong>imediata<\/strong> ou em até <strong>20 dias, prorrogáveis por mais 10<\/strong>, com justificativa. A negativa deve ser <strong>motivada<\/strong>. O serviço de busca é <strong>gratuito<\/strong>, salvo custo da reprodução dos documentos.<\/li>\n<li><strong>Recurso:<\/strong> em 10 dias, à autoridade hierarquicamente superior; depois ao dirigente máximo; no Executivo federal, a <strong>CGU<\/strong> e, por fim, a <strong>Comissão Mista de Reavaliação de Informações (CMRI)<\/strong>.<\/li>\n<li><strong>Classificação do sigilo:<\/strong> <strong>ultrassecreta 25 anos<\/strong> (prorrogável uma vez), <strong>secreta 15 anos<\/strong>, <strong>reservada 5 anos<\/strong>. Informações pessoais: acesso restrito por até <strong>100 anos<\/strong>, independentemente de classificação.<\/li>\n<li><strong>Não há sigilo<\/strong> para informações necessárias à tutela de direitos fundamentais ou a apurar violações de direitos humanos por agentes públicos.<\/li>\n<li><strong>Quem classifica:<\/strong> a ultrassecreta, só Presidente, Vice-Presidente, ministros, comandantes militares e chefes de missões no exterior; a secreta, também dirigentes de autarquias, fundações, empresas públicas e sociedades de economia mista; a reservada, essas autoridades e as que a regulamentação delegar.<\/li>\n<\/ul>", "text": "Regra: o acesso é a regra; o sigilo é a exceção. O pedido não precisa de justificativa , mas exige a identificação do requerente e a especificação da informação. Quem se submete: órgãos públicos de todos os poderes e entes, e entidades privadas sem fins lucrativos que recebam recursos públicos (quanto a esses recursos). Transparência ativa: o órgão divulga sem ninguém pedir (estrutura, despesas, licitações, contatos). Transparência passiva: responde a pedidos, por meio do Serviço de Informação ao Cidadão (SIC) e da plataforma Fala.BR . Prazo: resposta imediata ou em até 20 dias, prorrogáveis por mais 10 , com justificativa. A negativa deve ser motivada . O serviço de busca é gratuito , salvo custo da reprodução dos documentos. Recurso: em 10 dias, à autoridade hierarquicamente superior; depois ao dirigente máximo; no Executivo federal, a CGU e, por fim, a Comissão Mista de Reavaliação de Informações (CMRI) . Classificação do sigilo: ultrassecreta 25 anos (prorrogável uma vez), secreta 15 anos , reservada 5 anos . Informações pessoais: acesso restrito por até 100 anos , independentemente de classificação. Não há sigilo para informações necessárias à tutela de direitos fundamentais ou a apurar violações de direitos humanos por agentes públicos. Quem classifica: a ultrassecreta, só Presidente, Vice-Presidente, ministros, comandantes militares e chefes de missões no exterior; a secreta, também dirigentes de autarquias, fundações, empresas públicas e sociedades de economia mista; a reservada, essas autoridades e as que a regulamentação delegar."}, {"num": "9", "title": "LGPD (Lei 13.709/2018)", "html": "<p>A Lei Geral de Proteção de Dados Pessoais regula o <strong>tratamento de dados pessoais<\/strong> (coleta, uso, armazenamento, compartilhamento, eliminação) por pessoas físicas e jurídicas, públicas e privadas.<\/p>\n<ul>\n<li><strong>Dado pessoal:<\/strong> informação relacionada a pessoa natural identificada ou identificável (nome, CPF, e-mail). <strong>Dado sensível:<\/strong> origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dado genético ou biométrico. <strong>Anonimizado:<\/strong> não permite identificar o titular.<\/li>\n<li><strong>Personagens:<\/strong> <strong>titular<\/strong> (dono do dado), <strong>controlador<\/strong> (decide sobre o tratamento), <strong>operador<\/strong> (trata em nome do controlador), <strong>encarregado/DPO<\/strong> (canal com titulares e ANPD), <strong>ANPD<\/strong> (Autoridade Nacional de Proteção de Dados).<\/li>\n<li><strong>Princípios:<\/strong> finalidade, adequação, necessidade (mínimo necessário), livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação, responsabilização e prestação de contas.<\/li>\n<li><strong>Bases legais (art. 7):<\/strong> consentimento, obrigação legal ou regulatória, execução de políticas públicas, estudos por órgão de pesquisa, execução de contrato, exercício de direitos em processo, proteção da vida, tutela da saúde, <strong>legítimo interesse<\/strong> e proteção do crédito. <strong>O consentimento é só uma das bases.<\/strong> O poder público trata dados principalmente para cumprir obrigação legal e executar políticas públicas, <strong>sem<\/strong> precisar de consentimento.<\/li>\n<li><strong>Direitos do titular:<\/strong> confirmação da existência do tratamento, acesso, correção, anonimização ou eliminação, portabilidade, informação sobre compartilhamento, e revogação do consentimento.<\/li>\n<li><strong>Segurança:<\/strong> medidas técnicas e administrativas. <strong>Incidente<\/strong> de segurança deve ser comunicado à ANPD e ao titular, em prazo razoável.<\/li>\n<li><strong>Sanções (ANPD):<\/strong> advertência, multa simples (até 2% do faturamento, limitada a R$ 50 milhões por infração), multa diária, publicização da infração, bloqueio ou eliminação dos dados. As multas <strong>não se aplicam<\/strong> a órgãos públicos.<\/li>\n<li><strong>Poder público<\/strong> (capítulo próprio): trata dados para finalidade pública, com transparência (informa as hipóteses, a finalidade e os procedimentos).<\/li>\n<li>LGPD e LAI convivem: transparência sobre a gestão pública; proteção sobre os dados pessoais.<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> consentimento <strong>não<\/strong> é a única base legal. O controlador <strong>decide<\/strong>; o operador <strong>executa<\/strong> em nome do controlador; o encarregado <strong>comunica<\/strong> (titular e ANPD).<\/p>\n<\/blockquote>", "text": "A Lei Geral de Proteção de Dados Pessoais regula o tratamento de dados pessoais (coleta, uso, armazenamento, compartilhamento, eliminação) por pessoas físicas e jurídicas, públicas e privadas. Dado pessoal: informação relacionada a pessoa natural identificada ou identificável (nome, CPF, e-mail). Dado sensível: origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dado genético ou biométrico. Anonimizado: não permite identificar o titular. Personagens: titular (dono do dado), controlador (decide sobre o tratamento), operador (trata em nome do controlador), encarregado/DPO (canal com titulares e ANPD), ANPD (Autoridade Nacional de Proteção de Dados). Princípios: finalidade, adequação, necessidade (mínimo necessário), livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação, responsabilização e prestação de contas. Bases legais (art. 7): consentimento, obrigação legal ou regulatória, execução de políticas públicas, estudos por órgão de pesquisa, execução de contrato, exercício de direitos em processo, proteção da vida, tutela da saúde, legítimo interesse e proteção do crédito. O consentimento é só uma das bases. O poder público trata dados principalmente para cumprir obrigação legal e executar políticas públicas, sem precisar de consentimento. Direitos do titular: confirmação da existência do tratamento, acesso, correção, anonimização ou eliminação, portabilidade, informação sobre compartilhamento, e revogação do consentimento. Segurança: medidas técnicas e administrativas. Incidente de segurança deve ser comunicado à ANPD e ao titular, em prazo razoável. Sanções (ANPD): advertência, multa simples (até 2% do faturamento, limitada a R$ 50 milhões por infração), multa diária, publicização da infração, bloqueio ou eliminação dos dados. As multas não se aplicam a órgãos públicos. Poder público (capítulo próprio): trata dados para finalidade pública, com transparência (informa as hipóteses, a finalidade e os procedimentos). LGPD e LAI convivem: transparência sobre a gestão pública; proteção sobre os dados pessoais. Cai em prova: consentimento não é a única base legal. O controlador decide ; o operador executa em nome do controlador; o encarregado comunica (titular e ANPD)."}, {"num": "10", "title": "Licitações e Contratos (Lei 14.133/2021)", "html": "<p>As modalidades, fases e regras de licitação estão em detalhe na seção de Conhecimentos Específicos, item 7. Aqui, o essencial sobre <strong>contratos<\/strong>:<\/p>\n<ul>\n<li><strong>Formalização:<\/strong> o contrato administrativo é escrito, com <strong>cláusulas necessárias<\/strong> (objeto, preço, prazos, garantias, responsabilidades, fiscalização). A <strong>nota de empenho<\/strong> reserva o dinheiro; o contrato é obrigatório, salvo exceções.<\/li>\n<li><strong>Prerrogativas da Administração<\/strong> (cláusulas exorbitantes): alterar unilateralmente o contrato (acréscimos e supressões de até <strong>25%<\/strong> do valor inicial, e <strong>50%<\/strong> em reforma de edifício ou equipamento), rescindir unilateralmente, fiscalizar, aplicar sanções, ocupar provisoriamente bens.<\/li>\n<li><strong>Equilíbrio econômico-financeiro:<\/strong> deve ser mantido; reajuste, repactuação e revisão corrigem os preços.<\/li>\n<li><strong>Garantia:<\/strong> até <strong>5%<\/strong> do valor do contrato (até 10% em obras e serviços de grande vulto, em casos de alta complexidade). Modalidades: caução, seguro-garantia, fiança bancária.<\/li>\n<li><strong>Fiscalização:<\/strong> cada contrato tem um <strong>gestor<\/strong> e um <strong>fiscal<\/strong>; a lei exige <strong>segregação de funções<\/strong>.<\/li>\n<li><strong>Recebimento do objeto:<\/strong> provisório (pelo fiscal) e definitivo (por servidor ou comissão, após verificar a conformidade).<\/li>\n<li><strong>Duração:<\/strong> em regra até 5 anos para serviços e fornecimento contínuos, prorrogável até 10; contratos de aluguel e de tecnologia podem ter prazos maiores.<\/li>\n<li><strong>Extinção:<\/strong> término do prazo, rescisão (por culpa, por interesse público) ou anulação. <strong>Sanções<\/strong> aplicáveis ao contratado: advertência, multa, impedimento de licitar e declaração de inidoneidade.<\/li>\n<li><strong>Portal Nacional de Contratações Públicas (PNCP):<\/strong> divulgação obrigatória de licitações e contratos.<\/li>\n<\/ul>", "text": "As modalidades, fases e regras de licitação estão em detalhe na seção de Conhecimentos Específicos, item 7. Aqui, o essencial sobre contratos : Formalização: o contrato administrativo é escrito, com cláusulas necessárias (objeto, preço, prazos, garantias, responsabilidades, fiscalização). A nota de empenho reserva o dinheiro; o contrato é obrigatório, salvo exceções. Prerrogativas da Administração (cláusulas exorbitantes): alterar unilateralmente o contrato (acréscimos e supressões de até 25% do valor inicial, e 50% em reforma de edifício ou equipamento), rescindir unilateralmente, fiscalizar, aplicar sanções, ocupar provisoriamente bens. Equilíbrio econômico-financeiro: deve ser mantido; reajuste, repactuação e revisão corrigem os preços. Garantia: até 5% do valor do contrato (até 10% em obras e serviços de grande vulto, em casos de alta complexidade). Modalidades: caução, seguro-garantia, fiança bancária. Fiscalização: cada contrato tem um gestor e um fiscal ; a lei exige segregação de funções . Recebimento do objeto: provisório (pelo fiscal) e definitivo (por servidor ou comissão, após verificar a conformidade). Duração: em regra até 5 anos para serviços e fornecimento contínuos, prorrogável até 10; contratos de aluguel e de tecnologia podem ter prazos maiores. Extinção: término do prazo, rescisão (por culpa, por interesse público) ou anulação. Sanções aplicáveis ao contratado: advertência, multa, impedimento de licitar e declaração de inidoneidade. Portal Nacional de Contratações Públicas (PNCP): divulgação obrigatória de licitações e contratos."}, {"num": "11", "title": "Governança e integridade (Decreto 9.830/2019)", "html": "<ul>\n<li><strong>Governança pública<\/strong> é o conjunto de <strong>liderança, estratégia e controle<\/strong> para avaliar, direcionar e monitorar a gestão e entregar resultados ao cidadão. <strong>Decreto 9.203/2017<\/strong> estabelece a política de governança da administração federal: <strong>capacidade de resposta, integridade, confiabilidade, melhoria regulatória, prestação de contas e responsabilidade, transparência<\/strong>.<\/li>\n<li><strong>Instrumentos:<\/strong> gestão de riscos, controles internos, programas de <strong>integridade (compliance)<\/strong>, <strong>ouvidoria<\/strong>, auditoria interna, <strong>accountability<\/strong> (prestar contas e ser responsabilizado).<\/li>\n<li><strong>Lei Anticorrupção (12.846/2013):<\/strong> responsabiliza <strong>objetivamente<\/strong> a <strong>pessoa jurídica<\/strong> por atos contra a Administração (administrativa e civilmente).<\/li>\n<li><strong>Decreto 9.830/2019:<\/strong> regulamenta os arts. 20 a 30 da <strong>LINDB<\/strong> (Lei de Introdução às Normas do Direito Brasileiro). Decisões devem considerar as <strong>consequências práticas<\/strong>. O agente só responde pessoalmente por suas decisões em caso de <strong>dolo ou erro grosseiro<\/strong>.<\/li>\n<li><strong>Três linhas de defesa:<\/strong> gestão operacional, controles internos e auditoria interna.<\/li>\n<\/ul>", "text": "Governança pública é o conjunto de liderança, estratégia e controle para avaliar, direcionar e monitorar a gestão e entregar resultados ao cidadão. Decreto 9.203/2017 estabelece a política de governança da administração federal: capacidade de resposta, integridade, confiabilidade, melhoria regulatória, prestação de contas e responsabilidade, transparência . Instrumentos: gestão de riscos, controles internos, programas de integridade (compliance) , ouvidoria , auditoria interna, accountability (prestar contas e ser responsabilizado). Lei Anticorrupção (12.846/2013): responsabiliza objetivamente a pessoa jurídica por atos contra a Administração (administrativa e civilmente). Decreto 9.830/2019: regulamenta os arts. 20 a 30 da LINDB (Lei de Introdução às Normas do Direito Brasileiro). Decisões devem considerar as consequências práticas . O agente só responde pessoalmente por suas decisões em caso de dolo ou erro grosseiro . Três linhas de defesa: gestão operacional, controles internos e auditoria interna."}, {"num": "12", "title": "Governo Digital (Lei 14.129/2021)", "html": "<ul>\n<li><strong>Princípios e diretrizes:<\/strong> desburocratização, modernização, simplificação, <strong>transparência<\/strong>, foco no usuário, <strong>serviços públicos digitais<\/strong> por padrão e <strong>acessíveis<\/strong>, uso de dados e de tecnologia.<\/li>\n<li><strong>gov.br:<\/strong> plataforma única de acesso, com <strong>conta única<\/strong> e níveis de confiabilidade (bronze, prata e ouro).<\/li>\n<li>O Estado <strong>não deve exigir do cidadão<\/strong> documento ou informação que ele já tenha fornecido ou que conste de base de dados oficial. O <strong>CPF<\/strong> basta para identificar o cidadão perante os órgãos.<\/li>\n<li><strong>Dados abertos:<\/strong> informação pública disponível em formato aberto, legível por máquina. <strong>Interoperabilidade:<\/strong> os sistemas se comunicam.<\/li>\n<li><strong>Segurança da informação<\/strong> e proteção de dados são condição para o serviço digital (veja LGPD).<\/li>\n<li><strong>Carta de Serviços<\/strong> e canais digitais de atendimento; <strong>avaliação<\/strong> pelo usuário.<\/li>\n<\/ul>", "text": "Princípios e diretrizes: desburocratização, modernização, simplificação, transparência , foco no usuário, serviços públicos digitais por padrão e acessíveis , uso de dados e de tecnologia. gov.br: plataforma única de acesso, com conta única e níveis de confiabilidade (bronze, prata e ouro). O Estado não deve exigir do cidadão documento ou informação que ele já tenha fornecido ou que conste de base de dados oficial. O CPF basta para identificar o cidadão perante os órgãos. Dados abertos: informação pública disponível em formato aberto, legível por máquina. Interoperabilidade: os sistemas se comunicam. Segurança da informação e proteção de dados são condição para o serviço digital (veja LGPD). Carta de Serviços e canais digitais de atendimento; avaliação pelo usuário."}, {"num": "13", "title": "Gestão documental (Lei 8.159/1991)", "html": "<ul>\n<li><strong>Conceito:<\/strong> <strong>gestão de documentos<\/strong> é o conjunto de procedimentos para <strong>produção, tramitação, uso, avaliação e arquivamento<\/strong> em fase corrente e intermediária, visando à eliminação ou ao recolhimento ao arquivo permanente.<\/li>\n<li><strong>Arquivos públicos:<\/strong> conjuntos de documentos produzidos e recebidos por órgãos e entidades públicas, em decorrência de suas atividades. São <strong>dever do poder público<\/strong>, que deve garantir o acesso.<\/li>\n<li><strong>Documentos permanentes<\/strong> são <strong>inalienáveis e imprescritíveis<\/strong>. <strong>Eliminar<\/strong> documento público exige <strong>autorização<\/strong> da instituição arquivística pública. A <strong>Tabela de Temporalidade<\/strong> orienta a eliminação.<\/li>\n<li><strong>Conarq<\/strong> (Conselho Nacional de Arquivos) define a política nacional de arquivos e orienta o <strong>SINAR<\/strong> (Sistema Nacional de Arquivos). Mais detalhes em Arquivologia.<\/li>\n<li><strong>Acesso:<\/strong> os documentos públicos são acessíveis, com exceção dos sigilosos (regulados pela LAI).<\/li>\n<\/ul>", "text": "Conceito: gestão de documentos é o conjunto de procedimentos para produção, tramitação, uso, avaliação e arquivamento em fase corrente e intermediária, visando à eliminação ou ao recolhimento ao arquivo permanente. Arquivos públicos: conjuntos de documentos produzidos e recebidos por órgãos e entidades públicas, em decorrência de suas atividades. São dever do poder público , que deve garantir o acesso. Documentos permanentes são inalienáveis e imprescritíveis . Eliminar documento público exige autorização da instituição arquivística pública. A Tabela de Temporalidade orienta a eliminação. Conarq (Conselho Nacional de Arquivos) define a política nacional de arquivos e orienta o SINAR (Sistema Nacional de Arquivos). Mais detalhes em Arquivologia. Acesso: os documentos públicos são acessíveis, com exceção dos sigilosos (regulados pela LAI)."}, {"num": "14", "title": "Recursos materiais e patrimônio", "html": "<ul>\n<li><strong>Material de consumo<\/strong> se gasta com o uso (papel, caneta); fica no almoxarifado. <strong>Material permanente<\/strong> dura mais de <strong>2 anos<\/strong>, tem custo relevante (mesa, computador); recebe <strong>plaqueta de tombamento<\/strong> e entra no patrimônio.<\/li>\n<li><strong>Bens públicos<\/strong> (Código Civil): de <strong>uso comum<\/strong> do povo (ruas, praças), de <strong>uso especial<\/strong> (prédios de repartições) e <strong>dominicais<\/strong> (sem destinação específica, patrimônio disponível). Em regra são <strong>inalienáveis<\/strong> enquanto afetados; <strong>impenhoráveis; imprescritíveis<\/strong> (não se adquirem por usucapião).<\/li>\n<li><strong>Inventário:<\/strong> conferência física dos bens. Tipos: inicial, anual, de transferência de responsabilidade (quando muda o responsável), de extinção e eventual.<\/li>\n<li><strong>Termo de responsabilidade:<\/strong> o servidor que recebe o bem assina e responde por ele. <strong>Baixa:<\/strong> retirada do bem do patrimônio (doação, venda, inservibilidade, desaparecimento). <strong>Cessão, doação, permuta e alienação<\/strong> seguem normas e, em regra, licitação.<\/li>\n<li><strong>Depreciação:<\/strong> perda de valor ao longo do uso. <strong>Gestão de estoques<\/strong> em Recursos Materiais (matéria específica).<\/li>\n<\/ul>", "text": "Material de consumo se gasta com o uso (papel, caneta); fica no almoxarifado. Material permanente dura mais de 2 anos , tem custo relevante (mesa, computador); recebe plaqueta de tombamento e entra no patrimônio. Bens públicos (Código Civil): de uso comum do povo (ruas, praças), de uso especial (prédios de repartições) e dominicais (sem destinação específica, patrimônio disponível). Em regra são inalienáveis enquanto afetados; impenhoráveis; imprescritíveis (não se adquirem por usucapião). Inventário: conferência física dos bens. Tipos: inicial, anual, de transferência de responsabilidade (quando muda o responsável), de extinção e eventual. Termo de responsabilidade: o servidor que recebe o bem assina e responde por ele. Baixa: retirada do bem do patrimônio (doação, venda, inservibilidade, desaparecimento). Cessão, doação, permuta e alienação seguem normas e, em regra, licitação. Depreciação: perda de valor ao longo do uso. Gestão de estoques em Recursos Materiais (matéria específica)."}, {"num": "15", "title": "Sustentabilidade (A3P)", "html": "<p>A <strong>Agenda Ambiental na Administração Pública (A3P)<\/strong> é um programa do <strong>Ministério do Meio Ambiente<\/strong>, de adesão voluntária, que orienta órgãos públicos a adotar práticas sustentáveis.<\/p>\n<ul>\n<li><strong>Eixos temáticos:<\/strong> uso racional dos recursos naturais e bens públicos (água, energia, papel); gestão adequada dos resíduos gerados; qualidade de vida no ambiente de trabalho; sensibilização e capacitação dos servidores; <strong>compras e licitações sustentáveis<\/strong>; construções, reformas e ampliações sustentáveis.<\/li>\n<li><strong>Os 5 Rs:<\/strong> repensar, recusar, reduzir, reutilizar, reciclar.<\/li>\n<li><strong>Coleta seletiva solidária:<\/strong> resíduos recicláveis descartados pelos órgãos são encaminhados a cooperativas de catadores.<\/li>\n<li><strong>Desenvolvimento nacional sustentável<\/strong> é também <strong>princípio e objetivo das licitações<\/strong> (Lei 14.133).<\/li>\n<li>Tripé da sustentabilidade: ambiental, social e econômico.<\/li>\n<\/ul>", "text": "A Agenda Ambiental na Administração Pública (A3P) é um programa do Ministério do Meio Ambiente , de adesão voluntária, que orienta órgãos públicos a adotar práticas sustentáveis. Eixos temáticos: uso racional dos recursos naturais e bens públicos (água, energia, papel); gestão adequada dos resíduos gerados; qualidade de vida no ambiente de trabalho; sensibilização e capacitação dos servidores; compras e licitações sustentáveis ; construções, reformas e ampliações sustentáveis. Os 5 Rs: repensar, recusar, reduzir, reutilizar, reciclar. Coleta seletiva solidária: resíduos recicláveis descartados pelos órgãos são encaminhados a cooperativas de catadores. Desenvolvimento nacional sustentável é também princípio e objetivo das licitações (Lei 14.133). Tripé da sustentabilidade: ambiental, social e econômico."}, {"num": "16", "title": "Atendimento e Carta de Serviços", "html": "<p>A <strong>Lei 13.460/2017<\/strong> (Código de Defesa do Usuário do Serviço Público) vale para serviços públicos prestados direta ou indiretamente.<\/p>\n<ul>\n<li><strong>Direitos do usuário:<\/strong> atendimento <strong>respeitoso, acessível, com urbanidade<\/strong>; <strong>presunção de boa-fé<\/strong>; atendimento por <strong>ordem de chegada<\/strong> (ressalvadas as prioridades); igualdade; prestação adequada e eficiente; <strong>informação<\/strong> clara; proteção de dados pessoais. <strong>Deveres:<\/strong> prestar informações verdadeiras, colaborar, utilizar o serviço de forma adequada.<\/li>\n<li><strong>Carta de Serviços ao Usuário:<\/strong> cada órgão deve publicar quais serviços presta, <strong>como acessá-los, requisitos, prazos e canais<\/strong>, e os compromissos de qualidade.<\/li>\n<li><strong>Ouvidorias:<\/strong> recebem reclamações, sugestões, elogios e denúncias; a resposta deve ser conclusiva em até 30 dias, prorrogável uma vez. Há também <strong>conselhos de usuários<\/strong>.<\/li>\n<li><strong>Avaliação continuada<\/strong> do serviço e <strong>pesquisas de satisfação<\/strong> são obrigatórias.<\/li>\n<li><strong>Decreto 9.094/2017<\/strong> (simplificação): dispensa <strong>reconhecimento de firma<\/strong> e <strong>autenticação de cópia<\/strong> (o servidor confere com o original) e proíbe exigir comprovação de fato já constante de base de dados do governo.<\/li>\n<li>Veja também <strong>Atendimento ao Público<\/strong> (matéria específica) e a <strong>Lei 10.048/2000<\/strong> (prioridades).<\/li>\n<\/ul>", "text": "A Lei 13.460/2017 (Código de Defesa do Usuário do Serviço Público) vale para serviços públicos prestados direta ou indiretamente. Direitos do usuário: atendimento respeitoso, acessível, com urbanidade ; presunção de boa-fé ; atendimento por ordem de chegada (ressalvadas as prioridades); igualdade; prestação adequada e eficiente; informação clara; proteção de dados pessoais. Deveres: prestar informações verdadeiras, colaborar, utilizar o serviço de forma adequada. Carta de Serviços ao Usuário: cada órgão deve publicar quais serviços presta, como acessá-los, requisitos, prazos e canais , e os compromissos de qualidade. Ouvidorias: recebem reclamações, sugestões, elogios e denúncias; a resposta deve ser conclusiva em até 30 dias, prorrogável uma vez. Há também conselhos de usuários . Avaliação continuada do serviço e pesquisas de satisfação são obrigatórias. Decreto 9.094/2017 (simplificação): dispensa reconhecimento de firma e autenticação de cópia (o servidor confere com o original) e proíbe exigir comprovação de fato já constante de base de dados do governo. Veja também Atendimento ao Público (matéria específica) e a Lei 10.048/2000 (prioridades)."}, {"num": "17", "title": "Segurança da informação no trabalho", "html": "<ul>\n<li><strong>Política de Segurança da Informação (PSI)<\/strong> define o que é permitido. A política nacional é regulada por decreto (Política Nacional de Segurança da Informação).<\/li>\n<li><strong>Boas práticas:<\/strong> bloquear a tela ao sair (Win+L); <strong>mesa limpa e tela limpa<\/strong> (não deixar papéis ou telas expostos); não compartilhar senhas; usar e-mail institucional só para o trabalho; desconfiar de links e anexos; proteger documentos com dados pessoais; fazer backup; usar redes confiáveis.<\/li>\n<li><strong>Classificação da informação:<\/strong> pública, interna, restrita, sigilosa. <strong>Sigilo<\/strong> é dever do servidor (Lei 8.112, art. 116).<\/li>\n<li><strong>Incidentes:<\/strong> comunicar imediatamente a área de segurança. <strong>Engenharia social<\/strong> é a principal porta de entrada.<\/li>\n<li>Veja também Informática, itens 10 a 12, e <strong>LGPD<\/strong>.<\/li>\n<\/ul>", "text": "Política de Segurança da Informação (PSI) define o que é permitido. A política nacional é regulada por decreto (Política Nacional de Segurança da Informação). Boas práticas: bloquear a tela ao sair (Win+L); mesa limpa e tela limpa (não deixar papéis ou telas expostos); não compartilhar senhas; usar e-mail institucional só para o trabalho; desconfiar de links e anexos; proteger documentos com dados pessoais; fazer backup; usar redes confiáveis. Classificação da informação: pública, interna, restrita, sigilosa. Sigilo é dever do servidor (Lei 8.112, art. 116). Incidentes: comunicar imediatamente a área de segurança. Engenharia social é a principal porta de entrada. Veja também Informática, itens 10 a 12, e LGPD ."}, {"num": "18", "title": "Redação oficial", "html": "<p>O conteúdo é o mesmo de <strong>Língua Portuguesa, item 11<\/strong>, e aparece <strong>duas vezes no edital<\/strong>, por isso merece atenção redobrada. Revise especialmente:<\/p>\n<ul>\n<li>Atributos: clareza, objetividade, impessoalidade, formalidade, concisão, coesão, coerência e padronização.<\/li>\n<li>O <strong>padrão ofício<\/strong> (aviso e memorando viraram ofício na 3ª edição do Manual).<\/li>\n<li>Fechos: \"Respeitosamente\" (superior) e \"Atenciosamente\" (igual ou inferior).<\/li>\n<li>Pronomes de tratamento: Vossa Excelência, Vossa Magnificência (reitor), Vossa Senhoria.<\/li>\n<li>Verbo e possessivo na <strong>3ª pessoa<\/strong> com pronomes de tratamento.<\/li>\n<\/ul>", "text": "O conteúdo é o mesmo de Língua Portuguesa, item 11 , e aparece duas vezes no edital , por isso merece atenção redobrada. Revise especialmente: Atributos: clareza, objetividade, impessoalidade, formalidade, concisão, coesão, coerência e padronização. O padrão ofício (aviso e memorando viraram ofício na 3ª edição do Manual). Fechos: \"Respeitosamente\" (superior) e \"Atenciosamente\" (igual ou inferior). Pronomes de tratamento: Vossa Excelência, Vossa Magnificência (reitor), Vossa Senhoria. Verbo e possessivo na 3ª pessoa com pronomes de tratamento."}, {"num": "19", "title": "Instituições Federais de Ensino Superior", "html": "<ul>\n<li>A <strong>CF (art. 207)<\/strong> garante às universidades <strong>autonomia didático-científica, administrativa e de gestão financeira e patrimonial<\/strong>, e obediência à <strong>indissociabilidade entre ensino, pesquisa e extensão<\/strong>.<\/li>\n<li><strong>LDB (Lei 9.394/1996):<\/strong> organiza a educação nacional; universidades têm produção intelectual institucionalizada, um terço do corpo docente com mestrado ou doutorado e um terço em tempo integral.<\/li>\n<li><strong>Gestão:<\/strong> reitor e órgãos colegiados (conselhos superiores). O <strong>reitor<\/strong> é nomeado pelo <strong>Presidente da República<\/strong>, a partir de <strong>lista tríplice<\/strong>, escolhida em consulta à comunidade universitária.<\/li>\n<li><strong>PCCTAE (Lei 11.091/2005):<\/strong> plano de carreira dos cargos técnico-administrativos em educação. Os cargos se dividem em <strong>níveis de classificação<\/strong> (A a E); o <strong>Assistente em Administração<\/strong> é de <strong>nível D<\/strong>. Há <strong>progressão por capacitação profissional<\/strong> e <strong>progressão por mérito<\/strong>, além do <strong>incentivo à qualificação<\/strong>.<\/li>\n<li><strong>PDI<\/strong> (Plano de Desenvolvimento Institucional) e <strong>SINAES<\/strong> (avaliação do ensino superior) orientam o planejamento e a qualidade.<\/li>\n<li><strong>Ensino, pesquisa e extensão:<\/strong> o <strong>tripé<\/strong> das universidades. Fundamentos de autonomia e de gestão democrática.<\/li>\n<\/ul>", "text": "A CF (art. 207) garante às universidades autonomia didático-científica, administrativa e de gestão financeira e patrimonial , e obediência à indissociabilidade entre ensino, pesquisa e extensão . LDB (Lei 9.394/1996): organiza a educação nacional; universidades têm produção intelectual institucionalizada, um terço do corpo docente com mestrado ou doutorado e um terço em tempo integral. Gestão: reitor e órgãos colegiados (conselhos superiores). O reitor é nomeado pelo Presidente da República , a partir de lista tríplice , escolhida em consulta à comunidade universitária. PCCTAE (Lei 11.091/2005): plano de carreira dos cargos técnico-administrativos em educação. Os cargos se dividem em níveis de classificação (A a E); o Assistente em Administração é de nível D . Há progressão por capacitação profissional e progressão por mérito , além do incentivo à qualificação . PDI (Plano de Desenvolvimento Institucional) e SINAES (avaliação do ensino superior) orientam o planejamento e a qualidade. Ensino, pesquisa e extensão: o tripé das universidades. Fundamentos de autonomia e de gestão democrática."}, {"num": "20", "title": "Estatuto e Regimento Geral da UFBA", "html": "<p>A UFBA é uma <strong>autarquia federal<\/strong>, vinculada ao Ministério da Educação, com sede em <strong>Salvador<\/strong>, e criada em <strong>1946<\/strong>. Os pontos abaixo são o essencial para estudar; <strong>confira o texto oficial<\/strong>, que é a fonte da prova, no <a target=\"_blank\" rel=\"noopener\" href=\"https://www.ufba.br/arquivos/estatuto-e-regimento-geral\">Estatuto e Regimento Geral<\/a>.<\/p>\n<ul>\n<li><strong>Estatuto<\/strong> é o documento básico da universidade (organização, princípios, órgãos). <strong>Regimento Geral<\/strong> detalha o funcionamento. Ambos obedecem à Constituição, à LDB e às leis federais.<\/li>\n<li><strong>Órgãos colegiados superiores<\/strong> (nomes a conferir): <strong>Conselho Universitário (CONSUNI)<\/strong>, órgão máximo de deliberação; <strong>Conselho Acadêmico de Ensino<\/strong>; <strong>Conselho Acadêmico de Pesquisa e Extensão<\/strong>; <strong>Conselho de Curadores<\/strong>, que fiscaliza a gestão financeira.<\/li>\n<li><strong>Reitoria:<\/strong> órgão executivo superior, dirigido pelo <strong>reitor<\/strong>, auxiliado por pró-reitorias.<\/li>\n<li><strong>Unidades universitárias:<\/strong> faculdades, escolas e institutos, com departamentos e colegiados de curso. <strong>Órgãos suplementares<\/strong> apoiam as atividades (bibliotecas, museus, hospital universitário, editora).<\/li>\n<li>O que <strong>estudar no documento:<\/strong> quem toma cada decisão, a composição dos conselhos, as atribuições do reitor, a estrutura das unidades, a autonomia e os princípios.<\/li>\n<\/ul>", "text": "A UFBA é uma autarquia federal , vinculada ao Ministério da Educação, com sede em Salvador , e criada em 1946 . Os pontos abaixo são o essencial para estudar; confira o texto oficial , que é a fonte da prova, no Estatuto e Regimento Geral . Estatuto é o documento básico da universidade (organização, princípios, órgãos). Regimento Geral detalha o funcionamento. Ambos obedecem à Constituição, à LDB e às leis federais. Órgãos colegiados superiores (nomes a conferir): Conselho Universitário (CONSUNI) , órgão máximo de deliberação; Conselho Acadêmico de Ensino ; Conselho Acadêmico de Pesquisa e Extensão ; Conselho de Curadores , que fiscaliza a gestão financeira. Reitoria: órgão executivo superior, dirigido pelo reitor , auxiliado por pró-reitorias. Unidades universitárias: faculdades, escolas e institutos, com departamentos e colegiados de curso. Órgãos suplementares apoiam as atividades (bibliotecas, museus, hospital universitário, editora). O que estudar no documento: quem toma cada decisão, a composição dos conselhos, as atribuições do reitor, a estrutura das unidades, a autonomia e os princípios."}], "quiz": [{"q": "A validade de um concurso público, segundo a CF/88, é de:", "opts": ["Até 1 ano, improrrogável", "Até 2 anos, prorrogável uma vez por igual período", "Até 4 anos", "Até 2 anos, prorrogável duas vezes"], "a": 1, "exp": "CF, art. 37, III: até 2 anos, prorrogável uma vez por igual período."}, {"q": "O servidor nomeado por concurso adquire estabilidade após:", "opts": ["2 anos de exercício", "3 anos de efetivo exercício e avaliação especial de desempenho", "5 anos de exercício", "A posse"], "a": 1, "exp": "CF, art. 41: 3 anos de efetivo exercício, com avaliação especial de desempenho."}, {"q": "Pela Lei 8.112, o prazo para a posse é de:", "opts": ["15 dias da posse", "30 dias da publicação do ato de nomeação", "60 dias da homologação", "10 dias da nomeação"], "a": 1, "exp": "Posse em até 30 dias da publicação da nomeação; exercício em até 15 dias da posse."}, {"q": "Pela LAI, o órgão deve responder ao pedido de informação em até:", "opts": ["10 dias", "20 dias, prorrogáveis por mais 10", "30 dias, prorrogáveis por mais 30", "5 dias úteis"], "a": 1, "exp": "Resposta imediata ou em até 20 dias, prorrogáveis por mais 10, com justificativa."}, {"q": "Depois da reforma de 2021, a improbidade administrativa exige:", "opts": ["Culpa ou dolo", "Apenas culpa grave", "Dolo", "Prejuízo acima de 100 salários"], "a": 2, "exp": "A Lei 14.230/2021 passou a exigir dolo em todas as modalidades de improbidade."}, {"q": "Pela Lei 9.784, NÃO pode ser objeto de delegação:", "opts": ["Assinatura de ofícios", "Decisão de recursos administrativos", "Instrução de processos", "Atendimento ao público"], "a": 1, "exp": "Não se delegam: atos normativos, decisão de recursos e matérias de competência exclusiva."}, {"q": "O ato que concede ao servidor a mudança de cargo por limitação física compatível chama-se:", "opts": ["Reversão", "Readaptação", "Recondução", "Aproveitamento"], "a": 1, "exp": "Readaptação: investidura em cargo compatível com limitação física ou mental."}, {"q": "Quanto ao prazo, as penas de suspensão prescrevem em:", "opts": ["180 dias", "2 anos", "5 anos", "8 anos"], "a": 1, "exp": "Lei 8.112: 5 anos (demissão), 2 anos (suspensão) e 180 dias (advertência)."}, {"q": "Na LGPD, o agente que decide sobre o tratamento dos dados pessoais é o:", "opts": ["Operador", "Titular", "Controlador", "Encarregado"], "a": 2, "exp": "O controlador toma as decisões; o operador trata em nome dele; o encarregado faz a comunicação."}, {"q": "A única penalidade que a Comissão de Ética pode aplicar é a:", "opts": ["Suspensão", "Advertência", "Censura", "Demissão"], "a": 2, "exp": "Pelo Decreto 1.171, a comissão de ética aplica apenas a censura."}, {"q": "Pela LAI, uma informação classificada como secreta tem sigilo de:", "opts": ["5 anos", "15 anos", "25 anos", "100 anos"], "a": 1, "exp": "Reservada 5 anos, secreta 15 anos, ultrassecreta 25 anos."}, {"q": "A Agenda Ambiental na Administração Pública (A3P) é um programa do:", "opts": ["Ministério da Educação", "Ministério do Meio Ambiente", "TCU", "CONARQ"], "a": 1, "exp": "A A3P é do Ministério do Meio Ambiente e orienta práticas sustentáveis nos órgãos públicos."}, {"q": "Qual destas funções só pode ser ocupada por servidor efetivo?", "opts": ["Cargo em comissão", "Função de confiança", "Contrato temporário", "Mandato eletivo"], "a": 1, "exp": "Função de confiança: só servidor efetivo. Cargo em comissão: livre nomeação."}, {"q": "No processo administrativo federal, o prazo para recorrer é de:", "opts": ["5 dias", "10 dias", "20 dias", "30 dias"], "a": 1, "exp": "Lei 9.784: recurso em 10 dias; a autoridade pode reconsiderar em 5 dias."}]}, {"id": "direito-adm", "nome": "Direito Administrativo e Licitações", "bloco": "Específico", "lead": "Este bloco aprofunda o que você viu em Administração Pública. A Lei 14.133 é o ponto mais cobrado: se sobrar pouco tempo, priorize o item 7.", "topics": [{"num": "1", "title": "Estado, governo e Administração Pública", "html": "<ul>\n<li><strong>Estado:<\/strong> povo + território + governo soberano. <strong>Poderes:<\/strong> Legislativo, Executivo e Judiciário, independentes e harmônicos. Cada um tem função <strong>típica<\/strong> (o Legislativo legisla) e <strong>atípicas<\/strong> (o Legislativo também administra seus servidores; o Judiciário também administra).<\/li>\n<li><strong>Governo<\/strong> decide as políticas e define as prioridades (função política); <strong>Administração<\/strong> executa (função administrativa).<\/li>\n<li><strong>Sentido subjetivo<\/strong> (quem): órgãos, entidades e agentes. <strong>Sentido objetivo<\/strong> (o quê): a atividade administrativa de satisfazer o interesse público.<\/li>\n<li><strong>Fim:<\/strong> o <strong>interesse público<\/strong>.<\/li>\n<li><strong>Direito Administrativo:<\/strong> ramo do direito público que disciplina a atuação da Administração. Suas <strong>fontes:<\/strong> a lei (principal), a jurisprudência, a doutrina e os costumes. Não existe um código único.<\/li>\n<li><strong>Regime jurídico-administrativo:<\/strong> baseia-se em dois princípios fundamentais: <strong>supremacia do interesse público sobre o privado<\/strong> (a Administração tem prerrogativas, como as cláusulas exorbitantes) e <strong>indisponibilidade do interesse público<\/strong> (o agente não pode dispor do que é da coletividade: precisa de lei).<\/li>\n<li><strong>Outros princípios:<\/strong> além do LIMPE (legalidade, impessoalidade, moralidade, publicidade, eficiência): <strong>razoabilidade, proporcionalidade, motivação, continuidade do serviço público, segurança jurídica, finalidade<\/strong> e <strong>autotutela<\/strong> (a Administração anula seus atos ilegais e revoga os inconvenientes, <strong>Súmula 473 do STF<\/strong>).<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> \"Supremacia\" dá prerrogativas à Administração (poderes especiais). \"Indisponibilidade\" impõe limites a ela (só faz o que a lei manda).<\/p>\n<\/blockquote>", "text": "Estado: povo + território + governo soberano. Poderes: Legislativo, Executivo e Judiciário, independentes e harmônicos. Cada um tem função típica (o Legislativo legisla) e atípicas (o Legislativo também administra seus servidores; o Judiciário também administra). Governo decide as políticas e define as prioridades (função política); Administração executa (função administrativa). Sentido subjetivo (quem): órgãos, entidades e agentes. Sentido objetivo (o quê): a atividade administrativa de satisfazer o interesse público. Fim: o interesse público . Direito Administrativo: ramo do direito público que disciplina a atuação da Administração. Suas fontes: a lei (principal), a jurisprudência, a doutrina e os costumes. Não existe um código único. Regime jurídico-administrativo: baseia-se em dois princípios fundamentais: supremacia do interesse público sobre o privado (a Administração tem prerrogativas, como as cláusulas exorbitantes) e indisponibilidade do interesse público (o agente não pode dispor do que é da coletividade: precisa de lei). Outros princípios: além do LIMPE (legalidade, impessoalidade, moralidade, publicidade, eficiência): razoabilidade, proporcionalidade, motivação, continuidade do serviço público, segurança jurídica, finalidade e autotutela (a Administração anula seus atos ilegais e revoga os inconvenientes, Súmula 473 do STF ). Macete: \"Supremacia\" dá prerrogativas à Administração (poderes especiais). \"Indisponibilidade\" impõe limites a ela (só faz o que a lei manda)."}, {"num": "2", "title": "Organização administrativa da União", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Entidade<\/th>\n<th>Natureza<\/th>\n<th>Como nasce<\/th>\n<th>Exemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Autarquia<\/td>\n<td>Pessoa jurídica de direito público<\/td>\n<td>Criada por lei<\/td>\n<td>INSS, UFBA, Banco Central<\/td>\n<\/tr>\n<tr>\n<td>Fundação pública<\/td>\n<td>Direito público ou privado<\/td>\n<td>Criada ou autorizada por lei<\/td>\n<td>IBGE, Funai<\/td>\n<\/tr>\n<tr>\n<td>Empresa pública<\/td>\n<td>Direito privado; capital 100% público; qualquer forma societária<\/td>\n<td>Autorizada por lei<\/td>\n<td>Caixa, Correios<\/td>\n<\/tr>\n<tr>\n<td>Sociedade de economia mista<\/td>\n<td>Direito privado; sempre S.A.; maioria do capital votante é pública<\/td>\n<td>Autorizada por lei<\/td>\n<td>Banco do Brasil, Petrobras<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Administração direta:<\/strong> os órgãos da própria União (Presidência e ministérios). <strong>Órgão<\/strong> não tem personalidade jurídica; <strong>entidade<\/strong> tem. <strong>Órgão<\/strong> é um centro de competência; <strong>agente<\/strong> é a pessoa que o ocupa.<\/li>\n<li><strong>Criação:<\/strong> a autarquia é <strong>criada<\/strong> diretamente por lei. Fundação, empresa pública e sociedade de economia mista têm a <strong>criação autorizada<\/strong> por lei, com registro posterior dos atos constitutivos.<\/li>\n<li><strong>Controle:<\/strong> não há hierarquia, mas <strong>supervisão ministerial<\/strong> (controle finalístico, também chamado de tutela): verifica se a entidade cumpre os seus fins.<\/li>\n<li><strong>Regime de pessoal:<\/strong> autarquias e fundações públicas de direito público: <strong>servidores estatutários<\/strong>; empresas estatais: empregados públicos (CLT, com concurso).<\/li>\n<li><strong>Bens e privilégios:<\/strong> os bens das autarquias são públicos (impenhoráveis); as dívidas se pagam por <strong>precatório<\/strong>.<\/li>\n<li><strong>Responsabilidade:<\/strong> objetiva (art. 37, §6º, CF). Empresas estatais que explorem atividade econômica seguem o regime das empresas privadas.<\/li>\n<\/ul>", "text": "Entidade Natureza Como nasce Exemplos Autarquia Pessoa jurídica de direito público Criada por lei INSS, UFBA, Banco Central Fundação pública Direito público ou privado Criada ou autorizada por lei IBGE, Funai Empresa pública Direito privado; capital 100% público; qualquer forma societária Autorizada por lei Caixa, Correios Sociedade de economia mista Direito privado; sempre S.A.; maioria do capital votante é pública Autorizada por lei Banco do Brasil, Petrobras Administração direta: os órgãos da própria União (Presidência e ministérios). Órgão não tem personalidade jurídica; entidade tem. Órgão é um centro de competência; agente é a pessoa que o ocupa. Criação: a autarquia é criada diretamente por lei. Fundação, empresa pública e sociedade de economia mista têm a criação autorizada por lei, com registro posterior dos atos constitutivos. Controle: não há hierarquia, mas supervisão ministerial (controle finalístico, também chamado de tutela): verifica se a entidade cumpre os seus fins. Regime de pessoal: autarquias e fundações públicas de direito público: servidores estatutários ; empresas estatais: empregados públicos (CLT, com concurso). Bens e privilégios: os bens das autarquias são públicos (impenhoráveis); as dívidas se pagam por precatório . Responsabilidade: objetiva (art. 37, §6º, CF). Empresas estatais que explorem atividade econômica seguem o regime das empresas privadas."}, {"num": "3", "title": "Agentes públicos", "html": "<ul>\n<li><strong>Cargo:<\/strong> ocupado por servidor estatutário. <strong>Emprego:<\/strong> ocupado por empregado público (CLT). <strong>Função:<\/strong> atribuição sem cargo (temporários, função de confiança).<\/li>\n<li><strong>Classificação ampla:<\/strong> agentes políticos (autoridades eleitas ou de alta escala), <strong>servidores públicos<\/strong> (estatutários, empregados e temporários), <strong>militares<\/strong>, <strong>particulares em colaboração<\/strong> (por delegação, por requisição, voluntários).<\/li>\n<li><strong>Deveres:<\/strong> poder-dever de agir, <strong>eficiência, probidade, prestação de contas, obediência hierárquica<\/strong> (exceto ordem manifestamente ilegal) e <strong>dever de sigilo<\/strong>.<\/li>\n<li><strong>Prerrogativas:<\/strong> os poderes administrativos (item 4) existem para cumprir o interesse público, não para benefício pessoal.<\/li>\n<li><strong>Responsabilização do agente:<\/strong> administrativa, civil e penal, independentes entre si.<\/li>\n<li><strong>Improbidade<\/strong> (item 6 de Administração Pública) e <strong>abuso de autoridade<\/strong> (Lei 13.869/2019) são sanções ao desvio.<\/li>\n<li><strong>Estabilidade, concurso, acumulação:<\/strong> veja Administração Pública, itens 1 e 3. Esse tema aparece <strong>duas vezes<\/strong> no edital.<\/li>\n<\/ul>", "text": "Cargo: ocupado por servidor estatutário. Emprego: ocupado por empregado público (CLT). Função: atribuição sem cargo (temporários, função de confiança). Classificação ampla: agentes políticos (autoridades eleitas ou de alta escala), servidores públicos (estatutários, empregados e temporários), militares , particulares em colaboração (por delegação, por requisição, voluntários). Deveres: poder-dever de agir, eficiência, probidade, prestação de contas, obediência hierárquica (exceto ordem manifestamente ilegal) e dever de sigilo . Prerrogativas: os poderes administrativos (item 4) existem para cumprir o interesse público, não para benefício pessoal. Responsabilização do agente: administrativa, civil e penal, independentes entre si. Improbidade (item 6 de Administração Pública) e abuso de autoridade (Lei 13.869/2019) são sanções ao desvio. Estabilidade, concurso, acumulação: veja Administração Pública, itens 1 e 3. Esse tema aparece duas vezes no edital."}, {"num": "4", "title": "Poderes administrativos", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Poder<\/th>\n<th>O que é<\/th>\n<th>Exemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hierárquico<\/td>\n<td>Organizar, dar ordens, fiscalizar, delegar e avocar dentro da estrutura<\/td>\n<td>Chefe revisa ato do subordinado<\/td>\n<\/tr>\n<tr>\n<td>Disciplinar<\/td>\n<td>Punir servidores e quem tem vínculo especial com a Administração<\/td>\n<td>Suspensão após PAD; multa a empresa contratada<\/td>\n<\/tr>\n<tr>\n<td>Regulamentar<\/td>\n<td>Editar decretos para a fiel execução da lei, sem criar direitos novos<\/td>\n<td>Decreto que regulamenta uma lei<\/td>\n<\/tr>\n<tr>\n<td>De polícia<\/td>\n<td>Limitar liberdade e propriedade em favor da coletividade<\/td>\n<td>Multa de trânsito, fiscalização sanitária<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Hierárquico:<\/strong> ordenar, coordenar, controlar, corrigir, <strong>delegar<\/strong> (transferir parte da competência) e <strong>avocar<\/strong> (chamar para si, de modo excepcional). Não há hierarquia entre os Poderes nem entre administração direta e indireta.<\/li>\n<li><strong>Disciplinar<\/strong> é <strong>vinculado em parte<\/strong>: a Administração <strong>deve<\/strong> apurar, mas escolhe, com discricionariedade, a penalidade adequada, motivadamente.<\/li>\n<li><strong>Regulamentar:<\/strong> exercido por <strong>decreto<\/strong> do chefe do Executivo. Não pode <strong>inovar<\/strong> o ordenamento (decreto autônomo só nos casos do art. 84, VI, CF).<\/li>\n<li><strong>Atributos do poder de polícia:<\/strong> <strong>discricionariedade<\/strong> (em regra), <strong>autoexecutoriedade<\/strong> (age sem ir ao juiz, em regra) e <strong>coercibilidade<\/strong> (impõe a medida, inclusive pela força). Pode ser <strong>preventivo ou repressivo<\/strong>.<\/li>\n<li><strong>Atos administrativos:<\/strong> requisitos (<strong>competência, finalidade, forma, motivo, objeto<\/strong>). <strong>Vinculado:<\/strong> a lei não deixa escolha. <strong>Discricionário:<\/strong> há margem de conveniência e oportunidade (<strong>mérito<\/strong>), mas dentro da lei.<\/li>\n<li><strong>Abuso de poder<\/strong> tem duas formas: <strong>excesso<\/strong> (age além da sua competência) e <strong>desvio de finalidade<\/strong> (age dentro da competência, mas para outro fim).<\/li>\n<li><strong>Remédios contra o abuso:<\/strong> mandado de segurança, habeas corpus, habeas data, ação popular.<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> <strong>competência<\/strong> e <strong>finalidade<\/strong> são sempre <strong>vinculadas<\/strong>. O que pode ser discricionário é o <strong>motivo<\/strong> e o <strong>objeto<\/strong>.<\/p>\n<\/blockquote>", "text": "Poder O que é Exemplo Hierárquico Organizar, dar ordens, fiscalizar, delegar e avocar dentro da estrutura Chefe revisa ato do subordinado Disciplinar Punir servidores e quem tem vínculo especial com a Administração Suspensão após PAD; multa a empresa contratada Regulamentar Editar decretos para a fiel execução da lei, sem criar direitos novos Decreto que regulamenta uma lei De polícia Limitar liberdade e propriedade em favor da coletividade Multa de trânsito, fiscalização sanitária Hierárquico: ordenar, coordenar, controlar, corrigir, delegar (transferir parte da competência) e avocar (chamar para si, de modo excepcional). Não há hierarquia entre os Poderes nem entre administração direta e indireta. Disciplinar é vinculado em parte : a Administração deve apurar, mas escolhe, com discricionariedade, a penalidade adequada, motivadamente. Regulamentar: exercido por decreto do chefe do Executivo. Não pode inovar o ordenamento (decreto autônomo só nos casos do art. 84, VI, CF). Atributos do poder de polícia: discricionariedade (em regra), autoexecutoriedade (age sem ir ao juiz, em regra) e coercibilidade (impõe a medida, inclusive pela força). Pode ser preventivo ou repressivo . Atos administrativos: requisitos ( competência, finalidade, forma, motivo, objeto ). Vinculado: a lei não deixa escolha. Discricionário: há margem de conveniência e oportunidade ( mérito ), mas dentro da lei. Abuso de poder tem duas formas: excesso (age além da sua competência) e desvio de finalidade (age dentro da competência, mas para outro fim). Remédios contra o abuso: mandado de segurança, habeas corpus, habeas data, ação popular. Cai em prova: competência e finalidade são sempre vinculadas . O que pode ser discricionário é o motivo e o objeto ."}, {"num": "5", "title": "Serviços públicos", "html": "<ul>\n<li><strong>Conceito:<\/strong> atividade prestada pelo Estado, ou por quem ele delega, para atender necessidades da coletividade, sob regime de direito público. É um <strong>dever<\/strong> do Estado.<\/li>\n<li><strong>Princípios (serviço adequado, Lei 8.987/1995):<\/strong> regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e <strong>modicidade das tarifas<\/strong>.<\/li>\n<li><strong>Classificação:<\/strong> <em>uti universi<\/em> ou gerais (iluminação pública, segurança; não dá para medir o uso individual) e <em>uti singuli<\/em> ou individuais (água, energia, transporte; medidos por usuário). <strong>Próprios<\/strong> (só o Estado) e <strong>impróprios<\/strong> (de utilidade pública).<\/li>\n<li><strong>Titularidade × execução:<\/strong> o Estado é o <strong>titular<\/strong>, mas pode <strong>delegar a execução<\/strong>.<\/li>\n<li><strong>Interrupção:<\/strong> em situação de emergência ou, com <strong>aviso prévio<\/strong>, por razões técnicas ou de segurança, ou por <strong>inadimplência do usuário<\/strong>. A exceção são serviços <strong>essenciais<\/strong> (usos ligados à vida, saúde).<\/li>\n<li><strong>Tarifa:<\/strong> preço público pago pelo usuário. <strong>Taxa<\/strong> é tributo (serviço público específico e divisível).<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Delegação<\/th>\n<th>Instrumento<\/th>\n<th>Para quem<\/th>\n<th>Característica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Concessão<\/td>\n<td>Contrato, após licitação (concorrência ou diálogo competitivo)<\/td>\n<td>Pessoa jurídica ou consórcio<\/td>\n<td>Prazo determinado, mais estável<\/td>\n<\/tr>\n<tr>\n<td>Permissão<\/td>\n<td>Contrato de adesão, após licitação<\/td>\n<td>Pessoa física ou jurídica<\/td>\n<td>Precária<\/td>\n<\/tr>\n<tr>\n<td>Autorização<\/td>\n<td>Ato unilateral e discricionário<\/td>\n<td>Pessoa física ou jurídica<\/td>\n<td>Precária, sem licitação<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Concessão comum<\/strong> (tarifa paga pelo usuário) e <strong>PPP<\/strong> (parceria público-privada: patrocinada ou administrativa; contrapartida do poder público; Lei 11.079/2004). <strong>Concessão<\/strong> e <strong>permissão<\/strong> são feitas por contrato; <strong>autorização<\/strong> é ato.<\/li>\n<li><strong>Reversão:<\/strong> devolução dos bens ao poder concedente no fim do contrato. <strong>Encampação:<\/strong> retomada do serviço durante o contrato por interesse público, com <strong>indenização prévia<\/strong>.<\/li>\n<\/ul>", "text": "Conceito: atividade prestada pelo Estado, ou por quem ele delega, para atender necessidades da coletividade, sob regime de direito público. É um dever do Estado. Princípios (serviço adequado, Lei 8.987/1995): regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e modicidade das tarifas . Classificação: uti universi ou gerais (iluminação pública, segurança; não dá para medir o uso individual) e uti singuli ou individuais (água, energia, transporte; medidos por usuário). Próprios (só o Estado) e impróprios (de utilidade pública). Titularidade × execução: o Estado é o titular , mas pode delegar a execução . Interrupção: em situação de emergência ou, com aviso prévio , por razões técnicas ou de segurança, ou por inadimplência do usuário . A exceção são serviços essenciais (usos ligados à vida, saúde). Tarifa: preço público pago pelo usuário. Taxa é tributo (serviço público específico e divisível). Delegação Instrumento Para quem Característica Concessão Contrato, após licitação (concorrência ou diálogo competitivo) Pessoa jurídica ou consórcio Prazo determinado, mais estável Permissão Contrato de adesão, após licitação Pessoa física ou jurídica Precária Autorização Ato unilateral e discricionário Pessoa física ou jurídica Precária, sem licitação Concessão comum (tarifa paga pelo usuário) e PPP (parceria público-privada: patrocinada ou administrativa; contrapartida do poder público; Lei 11.079/2004). Concessão e permissão são feitas por contrato; autorização é ato. Reversão: devolução dos bens ao poder concedente no fim do contrato. Encampação: retomada do serviço durante o contrato por interesse público, com indenização prévia ."}, {"num": "6", "title": "Controle e responsabilidade civil do Estado", "html": "<h4>Controle da Administração<\/h4>\n<ul>\n<li><strong>Controle administrativo:<\/strong> a própria Administração revisa seus atos (<strong>autotutela<\/strong>, <strong>controle interno<\/strong>), de ofício ou por provocação. Pode anular ilegais e revogar inconvenientes.<\/li>\n<li><strong>Controle legislativo:<\/strong> o Congresso fiscaliza, com auxílio do <strong>TCU<\/strong> (tribunal de contas), que julga as contas dos administradores. Também <strong>CPIs<\/strong> e fiscalização dos atos do Executivo.<\/li>\n<li><strong>Controle judicial:<\/strong> o Judiciário analisa a <strong>legalidade<\/strong>, não o <strong>mérito<\/strong> (conveniência e oportunidade).<\/li>\n<li><strong>Momento:<\/strong> prévio, concomitante e posterior. <strong>Interno<\/strong> × <strong>externo<\/strong>; de <strong>legalidade<\/strong> × de <strong>mérito<\/strong>.<\/li>\n<li><strong>Instrumentos:<\/strong> recurso administrativo, direito de petição, mandado de segurança, habeas data, ação popular, ação civil pública.<\/li>\n<\/ul>\n<h4>Responsabilidade civil do Estado<\/h4>\n<ul>\n<li><strong>Regra geral:<\/strong> <strong>objetiva<\/strong>, pela teoria do <strong>risco administrativo<\/strong>. A vítima prova só <strong>conduta, dano e nexo causal<\/strong>; não precisa provar culpa. Aplica-se a pessoas jurídicas de direito público e às de direito privado <strong>prestadoras de serviço público<\/strong>.<\/li>\n<li><strong>Excludentes<\/strong> (rompem o nexo): culpa exclusiva da vítima, caso fortuito ou força maior, fato de terceiro. <strong>Atenuante:<\/strong> culpa concorrente da vítima, que reduz a indenização.<\/li>\n<li><strong>Teoria do risco integral:<\/strong> não admite excludentes; aplica-se a casos específicos (dano nuclear, ambiental).<\/li>\n<li><strong>Ação regressiva:<\/strong> o Estado cobra do servidor apenas se ele agiu com <strong>dolo ou culpa<\/strong>. O lesado não pode processar diretamente o servidor segundo o STF: a ação é contra o Estado.<\/li>\n<li><strong>Omissão:<\/strong> a regra majoritária é a responsabilidade <strong>subjetiva<\/strong> (falha do serviço ou <em>faute du service<\/em>), salvo omissão específica.<\/li>\n<li><strong>Prescrição:<\/strong> em regra <strong>5 anos<\/strong> para o lesado cobrar do Estado.<\/li>\n<\/ul>", "text": "Controle da Administração Controle administrativo: a própria Administração revisa seus atos ( autotutela , controle interno ), de ofício ou por provocação. Pode anular ilegais e revogar inconvenientes. Controle legislativo: o Congresso fiscaliza, com auxílio do TCU (tribunal de contas), que julga as contas dos administradores. Também CPIs e fiscalização dos atos do Executivo. Controle judicial: o Judiciário analisa a legalidade , não o mérito (conveniência e oportunidade). Momento: prévio, concomitante e posterior. Interno × externo ; de legalidade × de mérito . Instrumentos: recurso administrativo, direito de petição, mandado de segurança, habeas data, ação popular, ação civil pública. Responsabilidade civil do Estado Regra geral: objetiva , pela teoria do risco administrativo . A vítima prova só conduta, dano e nexo causal ; não precisa provar culpa. Aplica-se a pessoas jurídicas de direito público e às de direito privado prestadoras de serviço público . Excludentes (rompem o nexo): culpa exclusiva da vítima, caso fortuito ou força maior, fato de terceiro. Atenuante: culpa concorrente da vítima, que reduz a indenização. Teoria do risco integral: não admite excludentes; aplica-se a casos específicos (dano nuclear, ambiental). Ação regressiva: o Estado cobra do servidor apenas se ele agiu com dolo ou culpa . O lesado não pode processar diretamente o servidor segundo o STF: a ação é contra o Estado. Omissão: a regra majoritária é a responsabilidade subjetiva (falha do serviço ou faute du service ), salvo omissão específica. Prescrição: em regra 5 anos para o lesado cobrar do Estado."}, {"num": "7", "title": "Licitações (Lei 14.133/2021)", "html": "<p>A <strong>Nova Lei de Licitações e Contratos<\/strong> substitui a Lei 8.666/1993, a Lei do Pregão (10.520/2002) e o RDC. Vale para a administração direta, autarquias e fundações de todos os entes.<\/p>\n<h4>Conceito, objetivos e princípios<\/h4>\n<ul>\n<li><strong>Licitação:<\/strong> procedimento para escolher a <strong>proposta mais vantajosa<\/strong>. Obras, serviços, compras e alienações precisam de licitação, salvo as exceções da lei (CF, art. 37, XXI).<\/li>\n<li><strong>Objetivos (art. 11):<\/strong> proposta mais vantajosa (considerando o <strong>ciclo de vida<\/strong> do objeto), <strong>isonomia e justa competição<\/strong>, evitar <strong>sobrepreço e superfaturamento<\/strong>, incentivar a <strong>inovação<\/strong> e o <strong>desenvolvimento nacional sustentável<\/strong>.<\/li>\n<li><strong>Princípios (art. 5):<\/strong> além do LIMPE: <strong>planejamento, transparência, segregação de funções, vinculação ao edital, julgamento objetivo, competitividade, celeridade, economicidade e desenvolvimento nacional sustentável<\/strong>, entre outros.<\/li>\n<li><strong>Agentes:<\/strong> <strong>agente de contratação<\/strong> (servidor, conduz a licitação; no pregão, o <strong>pregoeiro<\/strong>), <strong>comissão de contratação<\/strong>, <strong>autoridade competente<\/strong>, fiscais e gestores. A lei pede <strong>segregação de funções<\/strong> (quem pede não decide, não fiscaliza).<\/li>\n<li><strong>Portal Nacional de Contratações Públicas (PNCP):<\/strong> divulgação obrigatória dos atos. A <strong>forma eletrônica<\/strong> é a regra.<\/li>\n<\/ul>\n<h4>Fases (art. 17), em ordem<\/h4>\n<ol>\n<li><strong>Preparatória:<\/strong> planejamento, <strong>estudo técnico preliminar (ETP)<\/strong>, <strong>termo de referência<\/strong>, pesquisa de preços, matriz de riscos<\/li>\n<li><strong>Divulgação do edital<\/strong><\/li>\n<li><strong>Apresentação de propostas e lances<\/strong><\/li>\n<li><strong>Julgamento<\/strong><\/li>\n<li><strong>Habilitação<\/strong> (como regra, <strong>depois<\/strong> do julgamento; pode vir antes, por decisão motivada)<\/li>\n<li><strong>Recursal<\/strong><\/li>\n<li><strong>Homologação<\/strong> (autoridade confirma o procedimento e <strong>adjudica<\/strong> o objeto ao vencedor)<\/li>\n<\/ol>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> \"Preparar, Divulgar, Propor, Julgar, Habilitar, Recorrer, Homologar\". A mudança de ordem em relação à lei antiga: o <strong>julgamento vem antes da habilitação<\/strong>.<\/p>\n<\/blockquote>\n<h4>Modalidades (art. 28)<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Modalidade<\/th>\n<th>Quando usar<\/th>\n<th>Critério de julgamento<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pregão<\/td>\n<td>Bens e serviços <strong>comuns<\/strong> (inclusive serviços comuns de engenharia)<\/td>\n<td>Menor preço ou maior desconto<\/td>\n<\/tr>\n<tr>\n<td>Concorrência<\/td>\n<td>Bens e serviços especiais, obras e serviços de engenharia<\/td>\n<td>Menor preço, maior desconto, melhor técnica, técnica e preço, maior retorno econômico<\/td>\n<\/tr>\n<tr>\n<td>Concurso<\/td>\n<td>Trabalho técnico, científico ou artístico<\/td>\n<td>Melhor técnica ou conteúdo artístico (prêmio)<\/td>\n<\/tr>\n<tr>\n<td>Leilão<\/td>\n<td><strong>Venda<\/strong> de bens<\/td>\n<td>Maior lance<\/td>\n<\/tr>\n<tr>\n<td>Diálogo competitivo<\/td>\n<td>Contratações complexas ou inovadoras<\/td>\n<td>Definido após o diálogo com os licitantes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Tomada de preços<\/strong> e <strong>convite não existem mais.<\/strong> É <strong>vedado<\/strong> criar outras modalidades ou combinar as existentes.<\/li>\n<li><strong>Pregão<\/strong> não se usa para serviços técnicos especializados de natureza predominantemente intelectual nem para obras (salvo serviços comuns de engenharia).<\/li>\n<li><strong>Modos de disputa:<\/strong> aberto, fechado ou combinados. <strong>Registro de preços (SRP):<\/strong> <strong>ata<\/strong> com validade de 1 ano, prorrogável por mais 1; qualquer órgão pode aderir (\"carona\") nos termos da lei.<\/li>\n<li><strong>Instrumentos auxiliares:<\/strong> credenciamento, pré-qualificação, procedimento de manifestação de interesse, registro cadastral.<\/li>\n<\/ul>\n<h4>Contratação direta<\/h4>\n<ul>\n<li><strong>Inexigibilidade (art. 74):<\/strong> a competição é <strong>inviável<\/strong>. Ex.: fornecedor <strong>exclusivo<\/strong>, <strong>artista consagrado<\/strong>, serviço técnico de <strong>notória especialização<\/strong>, credenciamento.<\/li>\n<li><strong>Dispensa (art. 75):<\/strong> a competição <strong>é possível<\/strong>, mas a lei <strong>libera<\/strong>. Ex.: valores baixos (originalmente até R$ 100 mil para obras e engenharia e R$ 50 mil para os demais, atualizados todo ano por decreto), <strong>emergência<\/strong>, licitação <strong>deserta<\/strong>, <strong>fracassada<\/strong> (nova licitação com os mesmos termos), calamidade.<\/li>\n<li><strong>Fracionamento ilegal<\/strong> da despesa para fugir da licitação é proibido (a lei exige somar os valores de mesmo objeto).<\/li>\n<li><strong>Contratação direta indevida:<\/strong> o <strong>agente e o contratado<\/strong> respondem solidariamente pelo dano ao erário (e o contratado fica impedido).<\/li>\n<\/ul>\n<h4>Fim do procedimento<\/h4>\n<ul>\n<li><strong>Revogação:<\/strong> por <strong>interesse público<\/strong>, com fato superveniente. <strong>Anulação (invalidação):<\/strong> por <strong>ilegalidade<\/strong>. Ambas exigem <strong>manifestação prévia dos interessados<\/strong> (contraditório).<\/li>\n<li><strong>Desistência:<\/strong> a proposta <strong>vincula<\/strong> o licitante. Não manter a proposta sem motivo justo é infração punível.<\/li>\n<li><strong>Recursos:<\/strong> em geral 3 dias úteis (pregão e concorrência), com <strong>pedido de reconsideração<\/strong>.<\/li>\n<li><strong>Impugnação ao edital:<\/strong> por qualquer pessoa, até 3 dias úteis antes da abertura das propostas.<\/li>\n<\/ul>\n<h4>Controle e sanções<\/h4>\n<ul>\n<li><strong>Controle (art. 169), 3 linhas de defesa:<\/strong> 1ª) servidores e agentes de contratação; 2ª) assessoria jurídica e controle interno do órgão; 3ª) órgão central de controle interno (CGU) e <strong>tribunal de contas<\/strong>.<\/li>\n<li><strong>Sanções:<\/strong> <strong>advertência<\/strong>, <strong>multa<\/strong>, <strong>impedimento de licitar<\/strong> e contratar (até 3 anos, no ente que puniu) e <strong>declaração de inidoneidade<\/strong> (3 a 6 anos, em todos os entes). Aplicadas após processo com ampla defesa; a inidoneidade é de competência exclusiva da autoridade máxima do órgão ou entidade.<\/li>\n<li><strong>Crimes em licitações<\/strong> passaram a constar do Código Penal (arts. 337-E a 337-P).<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> serviços <strong>comuns<\/strong> e bens <strong>comuns<\/strong> = pregão; <strong>obras e serviços especiais de engenharia<\/strong> = concorrência; <strong>venda de bens<\/strong> = leilão. <strong>Tomada de preços e convite<\/strong> foram extintos. A <strong>habilitação<\/strong> vem, em regra, <strong>depois<\/strong> do julgamento.<\/p>\n<\/blockquote>", "text": "A Nova Lei de Licitações e Contratos substitui a Lei 8.666/1993, a Lei do Pregão (10.520/2002) e o RDC. Vale para a administração direta, autarquias e fundações de todos os entes. Conceito, objetivos e princípios Licitação: procedimento para escolher a proposta mais vantajosa . Obras, serviços, compras e alienações precisam de licitação, salvo as exceções da lei (CF, art. 37, XX
