h>Vocativo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vossa Excelência<\/td>\n<td>Altas autoridades (Presidente, ministros, parlamentares, juízes, governadores)<\/td>\n<td>\"Senhor + cargo\" (ex.: Senhor Ministro); \"Excelentíssimo Senhor\" só para chefes de Poder<\/td>\n<\/tr>\n<tr>\n<td>Vossa Magnificência<\/td>\n<td>Reitores de universidade<\/td>\n<td>\"Magnífico Reitor\"<\/td>\n<\/tr>\n<tr>\n<td>Vossa Senhoria<\/td>\n<td>Demais autoridades e particulares<\/td>\n<td>\"Senhor + cargo\" ou \"Senhor + nome\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>Outros pontos cobrados<\/h4>\n<ul>\n<li><strong>Siglas e abreviaturas:<\/strong> na primeira vez, escreve-se por extenso seguido da sigla entre parênteses. Datas por extenso no cabeçalho (ex.: Salvador, 5 de março de 2026).<\/li>\n<li><strong>Correio eletrônico (e-mail)<\/strong> institucional pode ter valor documental; use assunto claro e linguagem formal.<\/li>\n<li><strong>Mensagem<\/strong> é o documento usado pelo Presidente da República para comunicar-se com o Congresso Nacional. <strong>Exposição de motivos<\/strong> é dirigida ao Presidente por ministro, para propor ato normativo ou informar algo importante.<\/li>\n<li><strong>Ata<\/strong> registra reuniões (sem rasuras; erros corrigidos com \"digo\" ou \"em tempo\"). <strong>Requerimento<\/strong> é o pedido a uma autoridade. <strong>Relatório<\/strong> descreve atividades. <strong>Parecer<\/strong> é opinião técnica ou jurídica.<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> \"Respeitosamente\" para superior, \"Atenciosamente\" para igual ou inferior. Reitor = Vossa <strong>Magnificência<\/strong>. Doutor <strong>não<\/strong> é pronome de tratamento. Aviso e memorando = ofício.<\/p>\n<\/blockquote>", "text": "Comunicação escrita do poder público. Segue o Manual de Redação da Presidência da República (3ª edição) . Atributos (o que um texto oficial precisa ter) Clareza, precisão, objetividade, concisão, coesão, coerência, impessoalidade , formalidade e padronização (uso da norma culta). A impessoalidade impede marcas pessoais: o texto fala em nome do órgão, não do servidor. Evite gírias, regionalismos e estrangeirismos desnecessários. Padrão ofício Na 3ª edição, aviso e memorando deixaram de ser espécies separadas. Todos seguem o \"padrão ofício\" e se chamam ofício . Outras espécies: mensagem , telegrama , e-mail , exposição de motivos , portaria , requerimento , ata , relatório , parecer , despacho . Estrutura do ofício: identificação (Ofício nº 123/2026/SIGLA), local e data, destinatário (nome e cargo), assunto (resumo em uma linha), texto (introdução, desenvolvimento, conclusão), fecho, assinatura (nome e cargo). Texto: a introdução apresenta o motivo; o desenvolvimento detalha; a conclusão fecha. Parágrafos numerados quando longos. Fechos: apenas dois. \" Respeitosamente \" para autoridades superiores; \" Atenciosamente \" para mesma hierarquia ou inferior. Forma de tratamento no texto: verbo e possessivo na 3ª pessoa (\"Vossa Excelência sabe que seu pedido...\"). O adjetivo concorda com o sexo da pessoa (\"Vossa Excelência está atento \" para homem, \" atenta \" para mulher). A 3ª edição aboliu \"Digníssimo\" e \"Ilustríssimo\". \"Doutor\" não é pronome de tratamento: é título acadêmico. Pronome Para quem Vocativo Vossa Excelência Altas autoridades (Presidente, ministros, parlamentares, juízes, governadores) \"Senhor + cargo\" (ex.: Senhor Ministro); \"Excelentíssimo Senhor\" só para chefes de Poder Vossa Magnificência Reitores de universidade \"Magnífico Reitor\" Vossa Senhoria Demais autoridades e particulares \"Senhor + cargo\" ou \"Senhor + nome\" Outros pontos cobrados Siglas e abreviaturas: na primeira vez, escreve-se por extenso seguido da sigla entre parênteses. Datas por extenso no cabeçalho (ex.: Salvador, 5 de março de 2026). Correio eletrônico (e-mail) institucional pode ter valor documental; use assunto claro e linguagem formal. Mensagem é o documento usado pelo Presidente da República para comunicar-se com o Congresso Nacional. Exposição de motivos é dirigida ao Presidente por ministro, para propor ato normativo ou informar algo importante. Ata registra reuniões (sem rasuras; erros corrigidos com \"digo\" ou \"em tempo\"). Requerimento é o pedido a uma autoridade. Relatório descreve atividades. Parecer é opinião técnica ou jurídica. Cai em prova: \"Respeitosamente\" para superior, \"Atenciosamente\" para igual ou inferior. Reitor = Vossa Magnificência . Doutor não é pronome de tratamento. Aviso e memorando = ofício."}], "quiz": [{"q": "Em \"___ muitas pessoas na fila\", qual forma está de acordo com a norma culta?", "opts": ["Haviam", "Havia", "Houveram", "Haverão"], "a": 1, "exp": "No sentido de existir, \"haver\" é impessoal e fica sempre no singular."}, {"q": "Em qual frase a crase está correta?", "opts": ["Fui à pé até o prédio.", "Refiro-me à você.", "A reunião começa às 14h.", "Ele começou à chover."], "a": 2, "exp": "Há crase na indicação de horas. Não há antes de masculino, de pronome pessoal nem de verbo."}, {"q": "Em \"Embora estivesse cansado, terminou o relatório\", a conjunção \"embora\" expressa:", "opts": ["Causa", "Concessão", "Conclusão", "Condição"], "a": 1, "exp": "Embora, ainda que e mesmo que são conjunções concessivas."}, {"q": "Na Redação Oficial, o fecho para autoridade de hierarquia superior é:", "opts": ["Atenciosamente", "Cordialmente", "Respeitosamente", "Saudações"], "a": 2, "exp": "\"Respeitosamente\" para superiores; \"Atenciosamente\" para mesma hierarquia ou inferior."}, {"q": "O pronome de tratamento usado para reitores de universidade é:", "opts": ["Vossa Excelência", "Vossa Senhoria", "Vossa Magnificência", "Vossa Eminência"], "a": 2, "exp": "Reitores recebem \"Vossa Magnificência\", com o vocativo \"Magnífico Reitor\"."}, {"q": "Qual alternativa está correta quanto à concordância?", "opts": ["Fazem dois anos que ele saiu.", "Faz dois anos que ele saiu.", "Fazem-se dois anos que ele saiu.", "Foi feito dois anos que ele saiu."], "a": 1, "exp": "\"Fazer\" indicando tempo decorrido é impessoal e fica no singular."}, {"q": "Em \"Assisti ao filme ontem\", o verbo assistir tem o sentido de:", "opts": ["Ajudar", "Ver", "Morar", "Estar presente sem ver"], "a": 1, "exp": "Assistir no sentido de ver pede a preposição \"a\". No sentido de ajudar, não pede preposição."}, {"q": "Qual a classificação do \"se\" em \"Vendem-se casas\"?", "opts": ["Índice de indeterminação do sujeito", "Pronome apassivador", "Pronome reflexivo", "Conjunção condicional"], "a": 1, "exp": "É a passiva sintética: o verbo concorda com o sujeito (\"casas\"), por isso \"vendem-se\"."}, {"q": "Assinale a frase em que o pronome oblíquo está bem colocado:", "opts": ["Me disse a verdade.", "Não disse-me nada.", "Nada me disse.", "Disse-me-ia a verdade, ontem."], "a": 2, "exp": "A palavra negativa ou indefinida (nada) atrai o pronome: próclise. Não se começa frase com oblíquo átono."}, {"q": "A palavra \"porque\" está corretamente empregada em:", "opts": ["Não sei porque ele faltou.", "Por que você faltou?", "Ele faltou por que estava doente.", "Gostaria de saber o por que."], "a": 1, "exp": "\"Por que\" (separado) abre pergunta. \"Porque\" explica; \"o porquê\" é substantivo."}, {"q": "Os termos \"eminente\" e \"iminente\" são:", "opts": ["Sinônimos", "Antônimos", "Parônimos", "Homógrafos"], "a": 2, "exp": "Parônimos: parecidos na forma, diferentes no sentido. Eminente = notável; iminente = prestes a acontecer."}, {"q": "Na redação oficial, o verbo que acompanha \"Vossa Excelência\" fica:", "opts": ["Na 2ª pessoa", "Na 3ª pessoa", "Na 1ª pessoa", "Em qualquer pessoa"], "a": 1, "exp": "Pronomes de tratamento levam verbo e possessivo na 3ª pessoa."}, {"q": "Qual destas palavras recebe acento por ser proparoxítona?", "opts": ["Fácil", "Música", "Armazém", "Café"], "a": 1, "exp": "Música é proparoxítona (mú-si-ca). Fácil é paroxítona em l; armazém e café são oxítonas."}]}, {"id": "informatica", "nome": "Noções de Informática", "bloco": "Comum", "lead": "A prova cobra uso prático: atalhos, Excel, e-mail e segurança são os pontos que mais caem. Estude praticando no computador: quem já usou o atalho acerta a questão sem decorar.", "topics": [{"num": "1", "title": "Conceitos básicos", "html": "<ul>\n<li><strong>Hardware<\/strong> é a parte física (teclado, monitor, processador). <strong>Software<\/strong> são os programas.<ul>\n<li><strong>Básico:<\/strong> sistema operacional (Windows, Linux, Android). <strong>Aplicativo:<\/strong> Word, navegador. <strong>Utilitário:<\/strong> antivírus, compactador, backup.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Componentes:<\/strong> <strong>CPU<\/strong> (processador) executa as instruções; <strong>placa-mãe<\/strong> liga tudo; <strong>fonte<\/strong> alimenta; <strong>placa de vídeo<\/strong> processa imagem.<\/li>\n<li><strong>Memória RAM<\/strong> é temporária e rápida (apaga ao desligar). <strong>ROM/BIOS<\/strong> é permanente e guarda a inicialização. <strong>Cache<\/strong> é uma memória muito rápida dentro ou perto do processador.<\/li>\n<li><strong>Armazenamento:<\/strong> HD (disco magnético, mais barato), <strong>SSD<\/strong> (flash, mais rápido e sem partes móveis), pen drive, cartão de memória, CD/DVD.<\/li>\n<li><strong>Periféricos:<\/strong> de entrada (teclado, mouse, scanner), de saída (monitor, impressora, caixas de som) e de entrada e saída (monitor touch, impressora multifuncional).<\/li>\n<li><strong>Unidades:<\/strong> bit &lt; byte (8 bits) &lt; KB &lt; MB &lt; GB &lt; TB &lt; PB. Cada degrau vale 1024 do anterior (na base binária). <strong>Velocidade de internet<\/strong> usa bits (Mbps); <strong>tamanho de arquivo<\/strong> usa bytes (MB).<\/li>\n<li><strong>Sistema de numeração:<\/strong> o computador trabalha em binário (0 e 1).<\/li>\n<li><strong>Tipos de computador:<\/strong> desktop, notebook, tablet, smartphone, servidor, mainframe.<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> \"RAM esquece, SSD guarda\". Se desliga e some, é RAM. Se desliga e fica, é armazenamento.<\/p>\n<\/blockquote>", "text": "Hardware é a parte física (teclado, monitor, processador). Software são os programas. Básico: sistema operacional (Windows, Linux, Android). Aplicativo: Word, navegador. Utilitário: antivírus, compactador, backup. Componentes: CPU (processador) executa as instruções; placa-mãe liga tudo; fonte alimenta; placa de vídeo processa imagem. Memória RAM é temporária e rápida (apaga ao desligar). ROM/BIOS é permanente e guarda a inicialização. Cache é uma memória muito rápida dentro ou perto do processador. Armazenamento: HD (disco magnético, mais barato), SSD (flash, mais rápido e sem partes móveis), pen drive, cartão de memória, CD/DVD. Periféricos: de entrada (teclado, mouse, scanner), de saída (monitor, impressora, caixas de som) e de entrada e saída (monitor touch, impressora multifuncional). Unidades: bit < byte (8 bits) < KB < MB < GB < TB < PB. Cada degrau vale 1024 do anterior (na base binária). Velocidade de internet usa bits (Mbps); tamanho de arquivo usa bytes (MB). Sistema de numeração: o computador trabalha em binário (0 e 1). Tipos de computador: desktop, notebook, tablet, smartphone, servidor, mainframe. Macete: \"RAM esquece, SSD guarda\". Se desliga e some, é RAM. Se desliga e fica, é armazenamento."}, {"num": "2", "title": "Windows 10 e posteriores", "html": "<ul>\n<li><strong>Partes:<\/strong> área de trabalho, menu Iniciar, barra de tarefas, Explorador de Arquivos, Configurações, Painel de Controle, Central de Ações (notificações).<\/li>\n<li><strong>Janelas:<\/strong> minimizar, maximizar (ou restaurar) e fechar. Arrastar para a borda encaixa a janela (<strong>Snap<\/strong>).<\/li>\n<li><strong>Lixeira:<\/strong> Delete manda para a lixeira; <strong>Shift+Delete<\/strong> apaga direto. Arquivos de pen drive, de rede e muito grandes não vão para a lixeira.<\/li>\n<li><strong>Tipos de conta:<\/strong> administrador e padrão (usuário comum, sem poder instalar programas para todos).<\/li>\n<li><strong>Ferramentas:<\/strong> Gerenciador de Tarefas (encerra programas travados), Windows Defender/Segurança do Windows (antivírus e firewall), Windows Update, Backup, Restauração do Sistema, Desfragmentador (só para HD), Limpeza de Disco.<\/li>\n<li><strong>Áreas de trabalho virtuais:<\/strong> Win+Tab; <strong>Cortana/Pesquisa<\/strong> na barra de tarefas.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Atalho<\/th>\n<th>Função<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Win+E<\/td>\n<td>Abre o Explorador de Arquivos<\/td>\n<\/tr>\n<tr>\n<td>Win+D<\/td>\n<td>Mostra a área de trabalho<\/td>\n<\/tr>\n<tr>\n<td>Win+L<\/td>\n<td>Bloqueia o computador<\/td>\n<\/tr>\n<tr>\n<td>Win+V<\/td>\n<td>Histórico da área de transferência<\/td>\n<\/tr>\n<tr>\n<td>Win+Shift+S<\/td>\n<td>Captura de parte da tela<\/td>\n<\/tr>\n<tr>\n<td>Win+I<\/td>\n<td>Abre as Configurações<\/td>\n<\/tr>\n<tr>\n<td>Win+R<\/td>\n<td>Abre a janela Executar<\/td>\n<\/tr>\n<tr>\n<td>Alt+Tab<\/td>\n<td>Alterna entre janelas<\/td>\n<\/tr>\n<tr>\n<td>Alt+F4<\/td>\n<td>Fecha a janela ativa<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+Shift+Esc<\/td>\n<td>Gerenciador de Tarefas<\/td>\n<\/tr>\n<tr>\n<td>F2<\/td>\n<td>Renomeia o arquivo selecionado<\/td>\n<\/tr>\n<tr>\n<td>F5<\/td>\n<td>Atualiza a janela<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+C / X / V / Z / Y<\/td>\n<td>Copiar / recortar / colar / desfazer / refazer<\/td>\n<\/tr>\n<tr>\n<td>Print Screen<\/td>\n<td>Captura a tela inteira<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"warn\">\n<p><strong>Atenção:<\/strong> Ctrl+Alt+Del abre uma tela com opções (bloquear, trocar usuário, sair, Gerenciador de Tarefas). Ctrl+Shift+Esc vai direto ao Gerenciador.<\/p>\n<\/blockquote>", "text": "Partes: área de trabalho, menu Iniciar, barra de tarefas, Explorador de Arquivos, Configurações, Painel de Controle, Central de Ações (notificações). Janelas: minimizar, maximizar (ou restaurar) e fechar. Arrastar para a borda encaixa a janela ( Snap ). Lixeira: Delete manda para a lixeira; Shift+Delete apaga direto. Arquivos de pen drive, de rede e muito grandes não vão para a lixeira. Tipos de conta: administrador e padrão (usuário comum, sem poder instalar programas para todos). Ferramentas: Gerenciador de Tarefas (encerra programas travados), Windows Defender/Segurança do Windows (antivírus e firewall), Windows Update, Backup, Restauração do Sistema, Desfragmentador (só para HD), Limpeza de Disco. Áreas de trabalho virtuais: Win+Tab; Cortana/Pesquisa na barra de tarefas. Atalho Função Win+E Abre o Explorador de Arquivos Win+D Mostra a área de trabalho Win+L Bloqueia o computador Win+V Histórico da área de transferência Win+Shift+S Captura de parte da tela Win+I Abre as Configurações Win+R Abre a janela Executar Alt+Tab Alterna entre janelas Alt+F4 Fecha a janela ativa Ctrl+Shift+Esc Gerenciador de Tarefas F2 Renomeia o arquivo selecionado F5 Atualiza a janela Ctrl+C / X / V / Z / Y Copiar / recortar / colar / desfazer / refazer Print Screen Captura a tela inteira Atenção: Ctrl+Alt+Del abre uma tela com opções (bloquear, trocar usuário, sair, Gerenciador de Tarefas). Ctrl+Shift+Esc vai direto ao Gerenciador."}, {"num": "3", "title": "Organização de arquivos e pastas", "html": "<ul>\n<li><strong>Caminho (path):<\/strong> C:\\Usuários\\Ana\\Documentos\\relatorio.docx. O nome do arquivo vem depois da última barra; a <strong>extensão<\/strong> (.docx) diz o tipo.<\/li>\n<li><strong>Extensões:<\/strong> .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .pdf (documento portátil), .txt (texto simples), .zip e .rar (compactado), .exe (executável), .jpg e .png (imagem), .mp3 (áudio), .mp4 (vídeo), .csv (tabela em texto).<\/li>\n<li><strong>Mover x copiar:<\/strong> arrastar na <strong>mesma unidade<\/strong> move; para <strong>outra unidade<\/strong> copia. Ctrl+arrastar força cópia; Shift+arrastar força mover.<\/li>\n<li><strong>Nome de arquivo<\/strong> não pode ter \\ / : * ? \" &lt; &gt; |.<\/li>\n<li><strong>Atributos:<\/strong> somente leitura, oculto. <strong>Propriedades<\/strong> (clique direito) mostram tamanho, data e atributos.<\/li>\n<li><strong>Compactação:<\/strong> reduz o tamanho e junta vários arquivos em um (zip). Dá para proteger com senha.<\/li>\n<li><strong>Biblioteca<\/strong> e <strong>Acesso rápido<\/strong> reúnem pastas frequentes. <strong>Atalho<\/strong> é um ponteiro: apagar o atalho <strong>não<\/strong> apaga o arquivo original.<\/li>\n<li><strong>Formatação:<\/strong> NTFS (padrão do Windows), FAT32 (pen drives e cartões, limite de 4 GB por arquivo), exFAT.<\/li>\n<\/ul>", "text": "Caminho (path): C:\\Usuários\\Ana\\Documentos\\relatorio.docx. O nome do arquivo vem depois da última barra; a extensão (.docx) diz o tipo. Extensões: .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .pdf (documento portátil), .txt (texto simples), .zip e .rar (compactado), .exe (executável), .jpg e .png (imagem), .mp3 (áudio), .mp4 (vídeo), .csv (tabela em texto). Mover x copiar: arrastar na mesma unidade move; para outra unidade copia. Ctrl+arrastar força cópia; Shift+arrastar força mover. Nome de arquivo não pode ter \\ / : * ? \" < > |. Atributos: somente leitura, oculto. Propriedades (clique direito) mostram tamanho, data e atributos. Compactação: reduz o tamanho e junta vários arquivos em um (zip). Dá para proteger com senha. Biblioteca e Acesso rápido reúnem pastas frequentes. Atalho é um ponteiro: apagar o atalho não apaga o arquivo original. Formatação: NTFS (padrão do Windows), FAT32 (pen drives e cartões, limite de 4 GB por arquivo), exFAT."}, {"num": "4", "title": "Office 365 ou versões recentes", "html": "<h4>Word (versão em português)<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Atalho<\/th>\n<th>Função<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ctrl+N / Ctrl+I / Ctrl+S<\/td>\n<td>Negrito / itálico / sublinhado<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+B<\/td>\n<td>Salvar<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+O<\/td>\n<td>Novo documento<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+A<\/td>\n<td>Abrir<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+P<\/td>\n<td>Imprimir<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+L<\/td>\n<td>Localizar<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+U<\/td>\n<td>Substituir<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+T<\/td>\n<td>Selecionar tudo<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+Q / Ctrl+E / Ctrl+G / Ctrl+J<\/td>\n<td>Alinhar à esquerda / centralizar / alinhar à direita / justificar<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+Enter<\/td>\n<td>Quebra de página<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"warn\">\n<p><strong>Atenção:<\/strong> esses atalhos são da versão em <strong>português<\/strong>. No Word em inglês, Ctrl+B é negrito e Ctrl+S é salvar. A prova costuma avisar qual versão usa.<\/p>\n<\/blockquote>\n<ul>\n<li><strong>Guias:<\/strong> Arquivo, Página Inicial, Inserir, Design, Layout, Referências, Correspondências, Revisão, Exibir.<\/li>\n<li><strong>Formatação:<\/strong> fonte, parágrafo (alinhamento, espaçamento, recuo), estilos (títulos), marcadores e numeração.<\/li>\n<li><strong>Recursos:<\/strong> sumário automático (usa os estilos de título), quebra de página (Ctrl+Enter), cabeçalho e rodapé, controle de alterações, comentários, mala direta (Correspondências), ortografia e gramática (F7).<\/li>\n<\/ul>\n<h4>Excel<\/h4>\n<ul>\n<li>Toda fórmula começa com <strong>=<\/strong>. O operador <strong>&amp;<\/strong> junta textos (=A1&amp;B1). Ordem das operações: parênteses, potência, multiplicação e divisão, soma e subtração.<\/li>\n<li><strong>Referência relativa<\/strong> (A1) muda ao copiar; <strong>absoluta<\/strong> ($A$1) não muda; <strong>mista<\/strong> ($A1 ou A$1) trava só a coluna ou só a linha. F4 alterna entre elas.<\/li>\n<li>Uma <strong>pasta de trabalho<\/strong> tem várias <strong>planilhas<\/strong>. A célula é a interseção de coluna (letra) e linha (número).<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Função<\/th>\n<th>O que faz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>=SOMA(A1:A5)<\/td>\n<td>Soma o intervalo<\/td>\n<\/tr>\n<tr>\n<td>=MÉDIA(A1:A5)<\/td>\n<td>Média<\/td>\n<\/tr>\n<tr>\n<td>=MÁXIMO / =MÍNIMO<\/td>\n<td>Maior / menor valor<\/td>\n<\/tr>\n<tr>\n<td>=MAIOR(A1:A5;2) / =MENOR<\/td>\n<td>2º maior / menor valor<\/td>\n<\/tr>\n<tr>\n<td>=CONT.NÚM<\/td>\n<td>Conta células com número<\/td>\n<\/tr>\n<tr>\n<td>=CONT.VALORES<\/td>\n<td>Conta células não vazias<\/td>\n<\/tr>\n<tr>\n<td>=CONT.SE(A1:A5;\"&gt;10\")<\/td>\n<td>Conta as que atendem à condição<\/td>\n<\/tr>\n<tr>\n<td>=SOMASE(A1:A5;\"&gt;10\";B1:B5)<\/td>\n<td>Soma as que atendem à condição<\/td>\n<\/tr>\n<tr>\n<td>=SE(A1&gt;=7;\"Aprovado\";\"Reprovado\")<\/td>\n<td>Testa uma condição<\/td>\n<\/tr>\n<tr>\n<td>=E() / =OU()<\/td>\n<td>Combina condições<\/td>\n<\/tr>\n<tr>\n<td>=PROCV(valor;tabela;coluna;0)<\/td>\n<td>Busca um valor na vertical (0 = valor exato)<\/td>\n<\/tr>\n<tr>\n<td>=HOJE() / =AGORA()<\/td>\n<td>Data atual / data e hora atuais<\/td>\n<\/tr>\n<tr>\n<td>=ARRED(x;2)<\/td>\n<td>Arredonda para 2 casas<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Erros comuns: <strong>#DIV/0!<\/strong> (divisão por zero), <strong>#VALOR!<\/strong> (tipo errado), <strong>#REF!<\/strong> (célula apagada), <strong>#NOME?<\/strong> (função escrita errado), <strong>#N/D<\/strong> (valor não encontrado), <strong>####<\/strong> (coluna estreita demais).<\/p>\n<ul>\n<li><strong>Gráficos:<\/strong> colunas, barras, linhas, pizza (partes de um todo), dispersão. <strong>Filtro<\/strong> e <strong>classificação<\/strong> organizam dados. <strong>Formatação condicional<\/strong> destaca células por regra. <strong>Tabela dinâmica<\/strong> resume grandes tabelas.<\/li>\n<\/ul>\n<h4>PowerPoint<\/h4>\n<ul>\n<li><strong>F5<\/strong> inicia do primeiro slide; <strong>Shift+F5<\/strong> do slide atual. <strong>Transição<\/strong> é o efeito entre slides; <strong>animação<\/strong> é o efeito em objetos dentro do slide. <strong>Slide mestre<\/strong> define o padrão visual de todos.<\/li>\n<li><strong>Modos de exibição:<\/strong> normal, classificação de slides, anotações, leitura, apresentação.<\/li>\n<\/ul>", "text": "Word (versão em português) Atalho Função Ctrl+N / Ctrl+I / Ctrl+S Negrito / itálico / sublinhado Ctrl+B Salvar Ctrl+O Novo documento Ctrl+A Abrir Ctrl+P Imprimir Ctrl+L Localizar Ctrl+U Substituir Ctrl+T Selecionar tudo Ctrl+Q / Ctrl+E / Ctrl+G / Ctrl+J Alinhar à esquerda / centralizar / alinhar à direita / justificar Ctrl+Enter Quebra de página Atenção: esses atalhos são da versão em português . No Word em inglês, Ctrl+B é negrito e Ctrl+S é salvar. A prova costuma avisar qual versão usa. Guias: Arquivo, Página Inicial, Inserir, Design, Layout, Referências, Correspondências, Revisão, Exibir. Formatação: fonte, parágrafo (alinhamento, espaçamento, recuo), estilos (títulos), marcadores e numeração. Recursos: sumário automático (usa os estilos de título), quebra de página (Ctrl+Enter), cabeçalho e rodapé, controle de alterações, comentários, mala direta (Correspondências), ortografia e gramática (F7). Excel Toda fórmula começa com = . O operador & junta textos (=A1&B1). Ordem das operações: parênteses, potência, multiplicação e divisão, soma e subtração. Referência relativa (A1) muda ao copiar; absoluta ($A$1) não muda; mista ($A1 ou A$1) trava só a coluna ou só a linha. F4 alterna entre elas. Uma pasta de trabalho tem várias planilhas . A célula é a interseção de coluna (letra) e linha (número). Função O que faz =SOMA(A1:A5) Soma o intervalo =MÉDIA(A1:A5) Média =MÁXIMO / =MÍNIMO Maior / menor valor =MAIOR(A1:A5;2) / =MENOR 2º maior / menor valor =CONT.NÚM Conta células com número =CONT.VALORES Conta células não vazias =CONT.SE(A1:A5;\">10\") Conta as que atendem à condição =SOMASE(A1:A5;\">10\";B1:B5) Soma as que atendem à condição =SE(A1>=7;\"Aprovado\";\"Reprovado\") Testa uma condição =E() / =OU() Combina condições =PROCV(valor;tabela;coluna;0) Busca um valor na vertical (0 = valor exato) =HOJE() / =AGORA() Data atual / data e hora atuais =ARRED(x;2) Arredonda para 2 casas Erros comuns: #DIV/0! (divisão por zero), #VALOR! (tipo errado), #REF! (célula apagada), #NOME? (função escrita errado), #N/D (valor não encontrado), #### (coluna estreita demais). Gráficos: colunas, barras, linhas, pizza (partes de um todo), dispersão. Filtro e classificação organizam dados. Formatação condicional destaca células por regra. Tabela dinâmica resume grandes tabelas. PowerPoint F5 inicia do primeiro slide; Shift+F5 do slide atual. Transição é o efeito entre slides; animação é o efeito em objetos dentro do slide. Slide mestre define o padrão visual de todos. Modos de exibição: normal, classificação de slides, anotações, leitura, apresentação."}, {"num": "5", "title": "E-mail e Outlook", "html": "<ul>\n<li><strong>Para:<\/strong> destinatário principal. <strong>Cc:<\/strong> cópia que todos veem. <strong>Cco:<\/strong> cópia oculta, ninguém vê quem está nela.<\/li>\n<li><strong>Responder<\/strong> não leva anexos; <strong>encaminhar<\/strong> leva. <strong>Responder a todos<\/strong> inclui todos do Para e do Cc (mas <strong>não<\/strong> quem estava em Cco).<\/li>\n<li><strong>Pastas padrão:<\/strong> Caixa de Entrada, Enviados, Rascunhos, Itens Excluídos, Lixo Eletrônico (spam).<\/li>\n<li><strong>Protocolos:<\/strong> <strong>SMTP<\/strong> envia; <strong>POP3<\/strong> baixa e (por padrão) tira do servidor; <strong>IMAP<\/strong> sincroniza e mantém no servidor, ótimo para vários dispositivos.<\/li>\n<li><strong>Webmail:<\/strong> e-mail acessado pelo navegador (Gmail, Outlook.com). <strong>Cliente de e-mail:<\/strong> programa instalado (Outlook, Thunderbird).<\/li>\n<li>O Outlook tem <strong>calendário, contatos, tarefas, regras<\/strong> (mover mensagens automaticamente) e <strong>assinatura<\/strong>. Colaboração online: Teams, OneDrive, SharePoint, Google Drive.<\/li>\n<li><strong>Boa prática:<\/strong> conferir remetente e anexos antes de abrir; não clicar em links suspeitos.<\/li>\n<\/ul>", "text": "Para: destinatário principal. Cc: cópia que todos veem. Cco: cópia oculta, ninguém vê quem está nela. Responder não leva anexos; encaminhar leva. Responder a todos inclui todos do Para e do Cc (mas não quem estava em Cco). Pastas padrão: Caixa de Entrada, Enviados, Rascunhos, Itens Excluídos, Lixo Eletrônico (spam). Protocolos: SMTP envia; POP3 baixa e (por padrão) tira do servidor; IMAP sincroniza e mantém no servidor, ótimo para vários dispositivos. Webmail: e-mail acessado pelo navegador (Gmail, Outlook.com). Cliente de e-mail: programa instalado (Outlook, Thunderbird). O Outlook tem calendário, contatos, tarefas, regras (mover mensagens automaticamente) e assinatura . Colaboração online: Teams, OneDrive, SharePoint, Google Drive. Boa prática: conferir remetente e anexos antes de abrir; não clicar em links suspeitos."}, {"num": "6", "title": "Internet e intranet", "html": "<ul>\n<li><strong>Internet:<\/strong> rede pública mundial. <strong>Intranet:<\/strong> rede interna da organização, com as mesmas tecnologias da internet. <strong>Extranet:<\/strong> parte da intranet aberta a parceiros externos.<\/li>\n<li><strong>Navegadores:<\/strong> Chrome, Edge, Firefox, Safari. <strong>Cookies<\/strong> guardam preferências e login; <strong>cache<\/strong> guarda cópias para carregar mais rápido.<\/li>\n<li><strong>HTTP<\/strong> é o protocolo da web; <strong>HTTPS<\/strong> é a versão criptografada (cadeado). <strong>URL<\/strong> é o endereço completo; <strong>DNS<\/strong> traduz nomes em endereços IP; <strong>IP<\/strong> identifica cada dispositivo na rede.<\/li>\n<li><strong>Navegação anônima<\/strong> não salva histórico nem cookies no computador, mas <strong>não<\/strong> esconde você do provedor ou da empresa.<\/li>\n<li><strong>Atalhos de navegador:<\/strong> Ctrl+T nova aba; Ctrl+Shift+T reabre aba fechada; Ctrl+W fecha a aba; Ctrl+H histórico; Ctrl+D favoritar; Ctrl+J downloads; F5 atualiza; Ctrl+Shift+N janela anônima (Chrome e Edge); Ctrl+Shift+P (Firefox).<\/li>\n<li><strong>Download<\/strong> é baixar da internet para o computador; <strong>upload<\/strong> é enviar do computador para a internet.<\/li>\n<li><strong>Tipos de conexão:<\/strong> fibra óptica, cabo, 4G e 5G, Wi-Fi (rede sem fio local) e Bluetooth (curta distância).<\/li>\n<\/ul>", "text": "Internet: rede pública mundial. Intranet: rede interna da organização, com as mesmas tecnologias da internet. Extranet: parte da intranet aberta a parceiros externos. Navegadores: Chrome, Edge, Firefox, Safari. Cookies guardam preferências e login; cache guarda cópias para carregar mais rápido. HTTP é o protocolo da web; HTTPS é a versão criptografada (cadeado). URL é o endereço completo; DNS traduz nomes em endereços IP; IP identifica cada dispositivo na rede. Navegação anônima não salva histórico nem cookies no computador, mas não esconde você do provedor ou da empresa. Atalhos de navegador: Ctrl+T nova aba; Ctrl+Shift+T reabre aba fechada; Ctrl+W fecha a aba; Ctrl+H histórico; Ctrl+D favoritar; Ctrl+J downloads; F5 atualiza; Ctrl+Shift+N janela anônima (Chrome e Edge); Ctrl+Shift+P (Firefox). Download é baixar da internet para o computador; upload é enviar do computador para a internet. Tipos de conexão: fibra óptica, cabo, 4G e 5G, Wi-Fi (rede sem fio local) e Bluetooth (curta distância)."}, {"num": "7", "title": "Ferramentas de busca", "html": "<p>Os operadores do Google valem na prova de Informática:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Operador<\/th>\n<th>Exemplo<\/th>\n<th>Efeito<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"aspas\"<\/td>\n<td>\"lei 8.112\"<\/td>\n<td>Frase exata<\/td>\n<\/tr>\n<tr>\n<td>-<\/td>\n<td>concurso -2024<\/td>\n<td>Exclui o termo<\/td>\n<\/tr>\n<tr>\n<td>site:<\/td>\n<td>site:ufba.br edital<\/td>\n<td>Só naquele site<\/td>\n<\/tr>\n<tr>\n<td>filetype:<\/td>\n<td>edital filetype:pdf<\/td>\n<td>Só aquele tipo de arquivo<\/td>\n<\/tr>\n<tr>\n<td>OR<\/td>\n<td>UFBA OR UFRB<\/td>\n<td>Um ou outro<\/td>\n<\/tr>\n<tr>\n<td>*<\/td>\n<td>\"como fazer * de bolo\"<\/td>\n<td>Curinga para palavra desconhecida<\/td>\n<\/tr>\n<tr>\n<td>intitle:<\/td>\n<td>intitle:edital<\/td>\n<td>Termo no título<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>A busca por imagem e por voz também existe. Resultados patrocinados aparecem marcados como anúncio.<\/li>\n<li><strong>Boas práticas:<\/strong> usar termos específicos, conferir a fonte e a data dos resultados.<\/li>\n<\/ul>", "text": "Os operadores do Google valem na prova de Informática: Operador Exemplo Efeito \"aspas\" \"lei 8.112\" Frase exata - concurso -2024 Exclui o termo site: site:ufba.br edital Só naquele site filetype: edital filetype:pdf Só aquele tipo de arquivo OR UFBA OR UFRB Um ou outro * \"como fazer * de bolo\" Curinga para palavra desconhecida intitle: intitle:edital Termo no título A busca por imagem e por voz também existe. Resultados patrocinados aparecem marcados como anúncio. Boas práticas: usar termos específicos, conferir a fonte e a data dos resultados."}, {"num": "8", "title": "Computação em nuvem", "html": "<p>Arquivos e programas ficam em <strong>servidores na internet<\/strong>, não no seu computador. Exemplos: OneDrive, Google Drive, Dropbox, iCloud.<\/p>\n<ul>\n<li><strong>Vantagens:<\/strong> acesso de qualquer lugar, edição simultânea, compartilhamento com permissão de ver, comentar ou editar, cópia de segurança automática, menor custo de infraestrutura.<\/li>\n<li><strong>Desvantagens:<\/strong> depende de internet; preocupações de privacidade e de quem hospeda os dados.<\/li>\n<li><strong>Modelos de serviço:<\/strong> <strong>SaaS<\/strong> (software pronto, ex.: Gmail, Office 365), <strong>PaaS<\/strong> (plataforma para desenvolver), <strong>IaaS<\/strong> (infraestrutura alugada: servidores, rede, armazenamento).<\/li>\n<li><strong>Modelos de implantação:<\/strong> nuvem pública, privada e híbrida.<\/li>\n<li><strong>Sincronização:<\/strong> o arquivo local e o da nuvem ficam iguais. Apagar em um pode apagar no outro (confira a lixeira da nuvem).<\/li>\n<\/ul>", "text": "Arquivos e programas ficam em servidores na internet , não no seu computador. Exemplos: OneDrive, Google Drive, Dropbox, iCloud. Vantagens: acesso de qualquer lugar, edição simultânea, compartilhamento com permissão de ver, comentar ou editar, cópia de segurança automática, menor custo de infraestrutura. Desvantagens: depende de internet; preocupações de privacidade e de quem hospeda os dados. Modelos de serviço: SaaS (software pronto, ex.: Gmail, Office 365), PaaS (plataforma para desenvolver), IaaS (infraestrutura alugada: servidores, rede, armazenamento). Modelos de implantação: nuvem pública, privada e híbrida. Sincronização: o arquivo local e o da nuvem ficam iguais. Apagar em um pode apagar no outro (confira a lixeira da nuvem)."}, {"num": "9", "title": "Redes de computadores", "html": "<ul>\n<li><strong>Abrangência:<\/strong> <strong>PAN<\/strong> (pessoal, Bluetooth), <strong>LAN<\/strong> (local, um prédio), <strong>MAN<\/strong> (cidade), <strong>WAN<\/strong> (longa distância; a internet é a maior).<\/li>\n<li><strong>Topologias:<\/strong> estrela (todos ligados a um ponto central, a mais comum), barramento, anel, malha.<\/li>\n<li><strong>Equipamentos:<\/strong> <strong>roteador<\/strong> (liga redes diferentes e distribui a internet), <strong>switch<\/strong> (liga computadores na rede local), <strong>hub<\/strong> (repete o sinal para todos, obsoleto), <strong>modem<\/strong> (converte o sinal da operadora), <strong>access point<\/strong> (ponto de acesso Wi-Fi).<\/li>\n<li><strong>Meios:<\/strong> cabo de par trançado (RJ-45), fibra óptica (luz, mais rápida), ondas de rádio (Wi-Fi).<\/li>\n<li><strong>Protocolos:<\/strong> <strong>TCP/IP<\/strong> (base da internet), <strong>DHCP<\/strong> (distribui endereços IP automaticamente), <strong>FTP<\/strong> (transferir arquivos), <strong>HTTP/HTTPS<\/strong> (web), <strong>SMTP, POP3, IMAP<\/strong> (e-mail).<\/li>\n<li><strong>Recursos compartilhados:<\/strong> pastas, impressoras e conexão. <strong>Wi-Fi<\/strong> seguro usa WPA2 ou WPA3 (evite redes abertas).<\/li>\n<\/ul>", "text": "Abrangência: PAN (pessoal, Bluetooth), LAN (local, um prédio), MAN (cidade), WAN (longa distância; a internet é a maior). Topologias: estrela (todos ligados a um ponto central, a mais comum), barramento, anel, malha. Equipamentos: roteador (liga redes diferentes e distribui a internet), switch (liga computadores na rede local), hub (repete o sinal para todos, obsoleto), modem (converte o sinal da operadora), access point (ponto de acesso Wi-Fi). Meios: cabo de par trançado (RJ-45), fibra óptica (luz, mais rápida), ondas de rádio (Wi-Fi). Protocolos: TCP/IP (base da internet), DHCP (distribui endereços IP automaticamente), FTP (transferir arquivos), HTTP/HTTPS (web), SMTP, POP3, IMAP (e-mail). Recursos compartilhados: pastas, impressoras e conexão. Wi-Fi seguro usa WPA2 ou WPA3 (evite redes abertas)."}, {"num": "10", "title": "Segurança da informação", "html": "<ul>\n<li><strong>Pilares (CIDA):<\/strong> <strong>C<\/strong>onfidencialidade (só quem pode acessa), <strong>I<\/strong>ntegridade (não foi alterado), <strong>D<\/strong>isponibilidade (está acessível quando precisa), mais <strong>A<\/strong>utenticidade (quem diz ser é quem é) e não repúdio.<\/li>\n<li><strong>Senha forte:<\/strong> longa, misturando letras, números e símbolos, sem dados pessoais e sem reaproveitar em vários sites. Gerenciadores de senha ajudam.<\/li>\n<li><strong>Autenticação em dois fatores (2FA):<\/strong> combina algo que você <strong>sabe<\/strong> (senha), <strong>tem<\/strong> (celular, token) ou <strong>é<\/strong> (digital, rosto).<\/li>\n<li><strong>Criptografia:<\/strong> transforma o dado em código ilegível sem a chave. <strong>Simétrica<\/strong> usa a mesma chave para cifrar e decifrar; <strong>assimétrica<\/strong> usa um par (pública e privada).<\/li>\n<li><strong>Assinatura digital:<\/strong> garante autenticidade e integridade (não é o mesmo que criptografar). <strong>Certificado digital<\/strong> identifica pessoa ou site.<\/li>\n<li><strong>Engenharia social:<\/strong> enganar pessoas para obter dados. <strong>Phishing:<\/strong> e-mail ou site falso que imita um real para roubar dados. <strong>Spam:<\/strong> mensagem em massa não solicitada.<\/li>\n<li><strong>Backup<\/strong> protege a <strong>disponibilidade<\/strong> (item 12).<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> confidencialidade ≠ integridade. Se o dado vazou, quebrou a confidencialidade. Se foi alterado, quebrou a integridade. Se saiu do ar, quebrou a disponibilidade.<\/p>\n<\/blockquote>", "text": "Pilares (CIDA): C onfidencialidade (só quem pode acessa), I ntegridade (não foi alterado), D isponibilidade (está acessível quando precisa), mais A utenticidade (quem diz ser é quem é) e não repúdio. Senha forte: longa, misturando letras, números e símbolos, sem dados pessoais e sem reaproveitar em vários sites. Gerenciadores de senha ajudam. Autenticação em dois fatores (2FA): combina algo que você sabe (senha), tem (celular, token) ou é (digital, rosto). Criptografia: transforma o dado em código ilegível sem a chave. Simétrica usa a mesma chave para cifrar e decifrar; assimétrica usa um par (pública e privada). Assinatura digital: garante autenticidade e integridade (não é o mesmo que criptografar). Certificado digital identifica pessoa ou site. Engenharia social: enganar pessoas para obter dados. Phishing: e-mail ou site falso que imita um real para roubar dados. Spam: mensagem em massa não solicitada. Backup protege a disponibilidade (item 12). Cai em prova: confidencialidade ≠ integridade. Se o dado vazou, quebrou a confidencialidade. Se foi alterado, quebrou a integridade. Se saiu do ar, quebrou a disponibilidade."}, {"num": "11", "title": "Ameaças virtuais", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Praga<\/th>\n<th>Como age<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vírus<\/td>\n<td>Infecta arquivos e precisa ser executado para agir<\/td>\n<\/tr>\n<tr>\n<td>Worm<\/td>\n<td>Se espalha sozinho pela rede, sem precisar de execução<\/td>\n<\/tr>\n<tr>\n<td>Cavalo de Troia (trojan)<\/td>\n<td>Vem disfarçado de programa legítimo e abre acesso ao invasor<\/td>\n<\/tr>\n<tr>\n<td>Ransomware<\/td>\n<td>Criptografa os arquivos e pede resgate<\/td>\n<\/tr>\n<tr>\n<td>Spyware / keylogger<\/td>\n<td>Espiona; o keylogger grava o que você digita<\/td>\n<\/tr>\n<tr>\n<td>Adware<\/td>\n<td>Exibe propaganda indesejada<\/td>\n<\/tr>\n<tr>\n<td>Backdoor<\/td>\n<td>Abre porta para acesso remoto do invasor<\/td>\n<\/tr>\n<tr>\n<td>Bot / botnet<\/td>\n<td>Máquina controlada remotamente / rede delas<\/td>\n<\/tr>\n<tr>\n<td>Rootkit<\/td>\n<td>Esconde a presença do invasor no sistema<\/td>\n<\/tr>\n<tr>\n<td>Ataque DoS / DDoS<\/td>\n<td>Sobrecarrega um serviço para tirá-lo do ar (DDoS parte de muitas máquinas)<\/td>\n<\/tr>\n<tr>\n<td>Pharming<\/td>\n<td>Redireciona o usuário a um site falso (envenena o DNS)<\/td>\n<\/tr>\n<tr>\n<td>Sniffer<\/td>\n<td>Captura o tráfego da rede<\/td>\n<\/tr>\n<tr>\n<td>Força bruta<\/td>\n<td>Testa muitas senhas até acertar<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Phishing<\/strong> engana a pessoa; <strong>pharming<\/strong> engana o sistema (mesmo digitando o endereço certo, vai para o site falso).<\/li>\n<li><strong>Malware<\/strong> é o nome geral de programas maliciosos.<\/li>\n<\/ul>", "text": "Praga Como age Vírus Infecta arquivos e precisa ser executado para agir Worm Se espalha sozinho pela rede, sem precisar de execução Cavalo de Troia (trojan) Vem disfarçado de programa legítimo e abre acesso ao invasor Ransomware Criptografa os arquivos e pede resgate Spyware / keylogger Espiona; o keylogger grava o que você digita Adware Exibe propaganda indesejada Backdoor Abre porta para acesso remoto do invasor Bot / botnet Máquina controlada remotamente / rede delas Rootkit Esconde a presença do invasor no sistema Ataque DoS / DDoS Sobrecarrega um serviço para tirá-lo do ar (DDoS parte de muitas máquinas) Pharming Redireciona o usuário a um site falso (envenena o DNS) Sniffer Captura o tráfego da rede Força bruta Testa muitas senhas até acertar Phishing engana a pessoa; pharming engana o sistema (mesmo digitando o endereço certo, vai para o site falso). Malware é o nome geral de programas maliciosos."}, {"num": "12", "title": "Antivírus, firewall e backup", "html": "<ul>\n<li><strong>Antivírus<\/strong> detecta e remove pragas (por assinatura e por comportamento). Precisa estar atualizado. <strong>Firewall<\/strong> filtra o tráfego da rede, permitindo ou bloqueando conexões; <strong>não<\/strong> é antivírus e não limpa vírus.<\/li>\n<li><strong>Atualizações<\/strong> do sistema e dos programas corrigem falhas de segurança.<\/li>\n<li><strong>VPN:<\/strong> cria um túnel criptografado pela internet.<\/li>\n<li><strong>Tipos de backup:<\/strong><ul>\n<li><strong>Completo (full):<\/strong> copia tudo.<\/li>\n<li><strong>Incremental:<\/strong> só o que mudou desde o último backup de <strong>qualquer tipo<\/strong> (rápido de fazer, lento de restaurar: precisa do completo e de todos os incrementais).<\/li>\n<li><strong>Diferencial:<\/strong> o que mudou desde o último <strong>completo<\/strong> (restaura com o completo + o último diferencial).<\/li>\n<li><strong>Cópia (cópia simples):<\/strong> copia sem alterar o marcador de arquivos já copiados.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Regra 3-2-1:<\/strong> 3 cópias, em 2 mídias diferentes, 1 fora do local.<\/li>\n<li><strong>Atributo de arquivamento:<\/strong> o completo e o incremental o desmarcam; o diferencial não.<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> diferencial = \"diferença até o completo\" (cresce a cada dia). Incremental = \"só o incremento de hoje\" (pequeno, mas precisa da cadeia toda).<\/p>\n<\/blockquote>", "text": "Antivírus detecta e remove pragas (por assinatura e por comportamento). Precisa estar atualizado. Firewall filtra o tráfego da rede, permitindo ou bloqueando conexões; não é antivírus e não limpa vírus. Atualizações do sistema e dos programas corrigem falhas de segurança. VPN: cria um túnel criptografado pela internet. Tipos de backup: Completo (full): copia tudo. Incremental: só o que mudou desde o último backup de qualquer tipo (rápido de fazer, lento de restaurar: precisa do completo e de todos os incrementais). Diferencial: o que mudou desde o último completo (restaura com o completo + o último diferencial). Cópia (cópia simples): copia sem alterar o marcador de arquivos já copiados. Regra 3-2-1: 3 cópias, em 2 mídias diferentes, 1 fora do local. Atributo de arquivamento: o completo e o incremental o desmarcam; o diferencial não. Macete: diferencial = \"diferença até o completo\" (cresce a cada dia). Incremental = \"só o incremento de hoje\" (pequeno, mas precisa da cadeia toda)."}], "quiz": [{"q": "O campo \"Cco\" de um e-mail serve para:", "opts": ["Enviar cópia que todos os destinatários veem", "Enviar cópia oculta", "Encaminhar com anexos", "Confirmar leitura"], "a": 1, "exp": "Cco é cópia oculta: os outros destinatários não veem quem está nesse campo."}, {"q": "No Excel, o que acontece com a referência $A$1 ao copiar a fórmula para outra célula?", "opts": ["Muda a coluna", "Muda a linha", "Não muda", "Vira #REF!"], "a": 2, "exp": "O cifrão trava coluna e linha. $A$1 é referência absoluta."}, {"q": "Qual praga se espalha sozinha pela rede, sem precisar ser executada pelo usuário?", "opts": ["Vírus", "Worm", "Cavalo de Troia", "Adware"], "a": 1, "exp": "O worm se propaga sozinho. O vírus precisa que o arquivo infectado seja executado."}, {"q": "O backup incremental copia:", "opts": ["Todos os arquivos", "O que mudou desde o último backup completo", "O que mudou desde o último backup de qualquer tipo", "Só arquivos do sistema"], "a": 2, "exp": "Incremental: desde o último backup de qualquer tipo. Diferencial: desde o último completo."}, {"q": "O atalho Win+L no Windows:", "opts": ["Abre o Explorador de Arquivos", "Bloqueia o computador", "Mostra a área de trabalho", "Abre o Gerenciador de Tarefas"], "a": 1, "exp": "Win+L bloqueia a tela. Win+E abre o Explorador e Win+D mostra a área de trabalho."}, {"q": "No Excel, qual função conta apenas as células que contêm números?", "opts": ["=CONT.VALORES", "=CONT.NÚM", "=SOMA", "=CONT.SE"], "a": 1, "exp": "CONT.NÚM conta números. CONT.VALORES conta qualquer célula não vazia."}, {"q": "O protocolo de e-mail que mantém as mensagens no servidor e sincroniza vários aparelhos é o:", "opts": ["SMTP", "POP3", "IMAP", "FTP"], "a": 2, "exp": "IMAP sincroniza e mantém no servidor. POP3 baixa e, em geral, tira do servidor. SMTP envia."}, {"q": "Um programa que criptografa os arquivos e exige pagamento para liberá-los é um:", "opts": ["Spyware", "Worm", "Ransomware", "Adware"], "a": 2, "exp": "Ransomware sequestra os dados por criptografia e pede resgate."}, {"q": "Qual dispositivo liga redes diferentes e distribui a conexão com a internet?", "opts": ["Switch", "Hub", "Roteador", "Placa de som"], "a": 2, "exp": "O roteador liga redes. O switch liga computadores dentro da mesma rede local."}, {"q": "Para apagar um arquivo sem enviá-lo à Lixeira, usa-se:", "opts": ["Ctrl+Delete", "Shift+Delete", "Alt+Delete", "Ctrl+Z"], "a": 1, "exp": "Shift+Delete exclui direto, sem passar pela Lixeira."}, {"q": "O backup que copia só o que mudou desde o último backup COMPLETO é o:", "opts": ["Incremental", "Diferencial", "Diário", "Espelhado"], "a": 1, "exp": "Diferencial: desde o último completo. Incremental: desde o último de qualquer tipo."}, {"q": "A tentativa de enganar o usuário com um site falso para roubar dados é o:", "opts": ["Phishing", "DDoS", "Backdoor", "Rootkit"], "a": 0, "exp": "Phishing imita e-mails e sites reais para capturar dados da vítima."}, {"q": "Na computação em nuvem, o modelo SaaS corresponde a:", "opts": ["Infraestrutura alugada", "Plataforma para desenvolver", "Software pronto, usado pela internet", "Rede local privada"], "a": 2, "exp": "SaaS = software como serviço (ex.: e-mail e Office pela internet)."}]}, {"id": "adm-publica", "nome": "Administração Pública", "bloco": "Comum", "lead": "É a matéria mais longa do edital. Priorize Lei 8.112, CF/88, Lei 14.133, LAI e LGPD, que costumam render mais questões. Vários itens são a base do que você verá de novo em Direito Administrativo e em Arquivologia.", "topics": [{"num": "1", "title": "Administração Pública na CF/88 (arts. 37 a 43)", "html": "<h4>Princípios (art. 37, caput)<\/h4>\n<ul>\n<li><strong>LIMPE:<\/strong> <strong>L<\/strong>egalidade (o servidor só faz o que a lei permite; o particular pode fazer tudo que a lei não proíbe), <strong>I<\/strong>mpessoalidade (sem favorecimento ou perseguição; os atos são do órgão, não do agente), <strong>M<\/strong>oralidade (ética e boa-fé), <strong>P<\/strong>ublicidade (transparência dos atos), <strong>E<\/strong>ficiência (resultado com bom uso dos recursos; incluído pela EC 19/1998).<\/li>\n<li><strong>Publicidade oficial<\/strong> (art. 37, §1º): deve ter caráter educativo, informativo ou de orientação social, <strong>sem<\/strong> nomes, símbolos ou imagens que promovam autoridades ou servidores.<\/li>\n<\/ul>\n<h4>Acesso a cargos e concurso<\/h4>\n<ul>\n<li>Cargos, empregos e funções são acessíveis aos brasileiros que preencham os requisitos da lei e <strong>também aos estrangeiros<\/strong>, na forma da lei (art. 37, I).<\/li>\n<li>Investidura em cargo ou emprego público exige <strong>concurso público<\/strong> de provas ou de provas e títulos, salvo cargos em comissão de livre nomeação e exoneração (art. 37, II).<\/li>\n<li><strong>Validade do concurso:<\/strong> até 2 anos, <strong>prorrogável uma vez<\/strong> por igual período (art. 37, III). Aprovado dentro do prazo tem <strong>prioridade<\/strong> na convocação sobre novos concursados (art. 37, IV).<\/li>\n<li><strong>Reserva de vagas<\/strong> para pessoas com deficiência (art. 37, VIII). Também existe política de cotas raciais em concursos federais (Lei 12.990/2014 e legislação posterior).<\/li>\n<\/ul>\n<h4>Cargos em comissão, funções de confiança e contratação temporária<\/h4>\n<ul>\n<li><strong>Cargo em comissão:<\/strong> livre nomeação e exoneração; pode ser ocupado por quem não é servidor, dentro de percentuais legais.<\/li>\n<li><strong>Função de confiança:<\/strong> só para servidor efetivo. Ambos só para <strong>direção, chefia e assessoramento<\/strong> (art. 37, V).<\/li>\n<li><strong>Contratação temporária<\/strong> (art. 37, IX): por tempo determinado, para necessidade temporária de excepcional interesse público (ex.: professor substituto).<\/li>\n<\/ul>\n<h4>Direitos e regras de remuneração<\/h4>\n<ul>\n<li><strong>Sindicalização<\/strong> é garantida (art. 37, VI). <strong>Greve<\/strong> nos termos e limites de lei específica (art. 37, VII).<\/li>\n<li><strong>Teto:<\/strong> nenhuma remuneração pode superar o <strong>subsídio dos Ministros do STF<\/strong> (art. 37, XI).<\/li>\n<li>É <strong>vedada a vinculação ou equiparação<\/strong> de remuneração entre cargos (art. 37, XIII).<\/li>\n<li><strong>Remuneração<\/strong> só se fixa ou altera por <strong>lei específica<\/strong>.<\/li>\n<\/ul>\n<h4>Acumulação de cargos<\/h4>\n<p><strong>Regra: proibida.<\/strong> Exceções (se houver compatibilidade de horários e respeitado o teto): (a) dois cargos de professor; (b) um de professor com outro técnico ou científico; (c) dois cargos ou empregos privativos de profissionais de saúde com profissões regulamentadas. Vale também para empregos e funções, e para autarquias, fundações, empresas públicas e sociedades de economia mista.<\/p>\n<h4>Servidor eleito (art. 38)<\/h4>\n<ul>\n<li>Mandato eletivo <strong>federal, estadual ou distrital:<\/strong> afastado do cargo.<\/li>\n<li><strong>Prefeito:<\/strong> afastado, podendo optar pela remuneração.<\/li>\n<li><strong>Vereador:<\/strong> se houver compatibilidade de horários, acumula; senão, afasta-se.<\/li>\n<\/ul>\n<h4>Estabilidade (art. 41)<\/h4>\n<ul>\n<li>Adquire-se após <strong>3 anos de efetivo exercício<\/strong>, <strong>e<\/strong> depende de <strong>avaliação especial de desempenho<\/strong> por comissão instituída para essa finalidade.<\/li>\n<li>O servidor estável só perde o cargo por: <strong>sentença judicial transitada em julgado<\/strong>; <strong>processo administrativo<\/strong> com ampla defesa; <strong>avaliação periódica de desempenho<\/strong>, na forma de lei complementar, com ampla defesa.<\/li>\n<li>Se a demissão for invalidada, o servidor é <strong>reintegrado<\/strong>. Se o cargo for extinto, ele fica em <strong>disponibilidade<\/strong> com remuneração proporcional.<\/li>\n<li><strong>Estabilidade<\/strong> (proteção contra demissão) é diferente de <strong>efetividade<\/strong> (característica do cargo concursado, desde a posse) e de <strong>vitaliciedade<\/strong> (magistrados, membros do Ministério Público e de tribunais de contas).<\/li>\n<\/ul>\n<h4>Responsabilidade civil (art. 37, §6º)<\/h4>\n<p>As pessoas jurídicas de direito público e as de direito privado prestadoras de serviço público respondem <strong>objetivamente<\/strong> pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o <strong>direito de regresso<\/strong> contra o responsável nos casos de <strong>dolo ou culpa<\/strong>.<\/p>\n<h4>Outros artigos do edital<\/h4>\n<ul>\n<li><strong>Art. 39:<\/strong> regime jurídico e planos de carreira dos servidores. <strong>Art. 40:<\/strong> regime próprio de previdência, com idade mínima e contribuição (reforma da EC 103/2019). <strong>Art. 42:<\/strong> militares dos estados e do DF. <strong>Art. 43:<\/strong> ações da União em regiões de desenvolvimento.<\/li>\n<li><strong>Improbidade (art. 37, §4º):<\/strong> suspensão dos direitos políticos, perda da função pública, indisponibilidade dos bens e ressarcimento ao erário, na forma da lei.<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> concurso = 2 anos + 2 anos (uma única prorrogação). Estabilidade = 3 anos <strong>e<\/strong> avaliação especial. Função de confiança = só efetivo. Cargo em comissão = qualquer pessoa. Acumular cargos = só nas exceções com compatibilidade de horários.<\/p>\n<\/blockquote>", "text": "Princípios (art. 37, caput) LIMPE: L egalidade (o servidor só faz o que a lei permite; o particular pode fazer tudo que a lei não proíbe), I mpessoalidade (sem favorecimento ou perseguição; os atos são do órgão, não do agente), M oralidade (ética e boa-fé), P ublicidade (transparência dos atos), E ficiência (resultado com bom uso dos recursos; incluído pela EC 19/1998). Publicidade oficial (art. 37, §1º): deve ter caráter educativo, informativo ou de orientação social, sem nomes, símbolos ou imagens que promovam autoridades ou servidores. Acesso a cargos e concurso Cargos, empregos e funções são acessíveis aos brasileiros que preencham os requisitos da lei e também aos estrangeiros , na forma da lei (art. 37, I). Investidura em cargo ou emprego público exige concurso público de provas ou de provas e títulos, salvo cargos em comissão de livre nomeação e exoneração (art. 37, II). Validade do concurso: até 2 anos, prorrogável uma vez por igual período (art. 37, III). Aprovado dentro do prazo tem prioridade na convocação sobre novos concursados (art. 37, IV). Reserva de vagas para pessoas com deficiência (art. 37, VIII). Também existe política de cotas raciais em concursos federais (Lei 12.990/2014 e legislação posterior). Cargos em comissão, funções de confiança e contratação temporária Cargo em comissão: livre nomeação e exoneração; pode ser ocupado por quem não é servidor, dentro de percentuais legais. Função de confiança: só para servidor efetivo. Ambos só para direção, chefia e assessoramento (art. 37, V). Contratação temporária (art. 37, IX): por tempo determinado, para necessidade temporária de excepcional interesse público (ex.: professor substituto). Direitos e regras de remuneração Sindicalização é garantida (art. 37, VI). Greve nos termos e limites de lei específica (art. 37, VII). Teto: nenhuma remuneração pode superar o subsídio dos Ministros do STF (art. 37, XI). É vedada a vinculação ou equiparação de remuneração entre cargos (art. 37, XIII). Remuneração só se fixa ou altera por lei específica . Acumulação de cargos Regra: proibida. Exceções (se houver compatibilidade de horários e respeitado o teto): (a) dois cargos de professor; (b) um de professor com outro técnico ou científico; (c) dois cargos ou empregos privativos de profissionais de saúde com profissões regulamentadas. Vale também para empregos e funções, e para autarquias, fundações, empresas públicas e sociedades de economia mista. Servidor eleito (art. 38) Mandato eletivo federal, estadual ou distrital: afastado do cargo. Prefeito: afastado, podendo optar pela remuneração. Vereador: se houver compatibilidade de horários, acumula; senão, afasta-se. Estabilidade (art. 41) Adquire-se após 3 anos de efetivo exercício , e depende de avaliação especial de desempenho por comissão instituída para essa finalidade. O servidor estável só perde o cargo por: sentença judicial transitada em julgado ; processo administrativo com ampla defesa; avaliação periódica de desempenho , na forma de lei complementar, com ampla defesa. Se a demissão for invalidada, o servidor é reintegrado . Se o cargo for extinto, ele fica em disponibilidade com remuneração proporcional. Estabilidade (proteção contra demissão) é diferente de efetividade (característica do cargo concursado, desde a posse) e de vitaliciedade (magistrados, membros do Ministério Público e de tribunais de contas). Responsabilidade civil (art. 37, §6º) As pessoas jurídicas de direito público e as de direito privado prestadoras de serviço público respondem objetivamente pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa . Outros artigos do edital Art. 39: regime jurídico e planos de carreira dos servidores. Art. 40: regime próprio de previdência, com idade mínima e contribuição (reforma da EC 103/2019). Art. 42: militares dos estados e do DF. Art. 43: ações da União em regiões de desenvolvimento. Improbidade (art. 37, §4º): suspensão dos direitos políticos, perda da função pública, indisponibilidade dos bens e ressarcimento ao erário, na forma da lei. Cai em prova: concurso = 2 anos + 2 anos (uma única prorrogação). Estabilidade = 3 anos e avaliação especial. Função de confiança = só efetivo. Cargo em comissão = qualquer pessoa. Acumular cargos = só nas exceções com compatibilidade de horários."}, {"num": "2", "title": "Estrutura da Administração Pública Federal", "html": "<p>A organização federal segue o <strong>Decreto-Lei 200/1967<\/strong>.<\/p>\n<ul>\n<li><strong>Administração direta:<\/strong> a própria <strong>União<\/strong>, por meio de seus órgãos: <strong>Presidência da República<\/strong> e <strong>Ministérios<\/strong>. Os órgãos <strong>não têm personalidade jurídica<\/strong>: são partes da União.<\/li>\n<li><strong>Administração indireta:<\/strong> entidades com <strong>personalidade jurídica própria<\/strong>, <strong>vinculadas<\/strong> a um ministério (supervisão ministerial, não subordinação). São: <strong>autarquias<\/strong>, <strong>fundações públicas<\/strong>, <strong>empresas públicas<\/strong> e <strong>sociedades de economia mista<\/strong>.<\/li>\n<li><strong>Descentralização:<\/strong> passa a execução de um serviço a <strong>outra pessoa jurídica<\/strong> (a União cria uma autarquia, ou delega por concessão a particular). <strong>Desconcentração:<\/strong> distribui tarefas <strong>dentro da mesma pessoa jurídica<\/strong>, entre órgãos (um ministério com secretarias).<\/li>\n<li><strong>Hierarquia:<\/strong> existe dentro da mesma pessoa (ordem, fiscalização, delegação, avocação). Entre a administração direta e a indireta existe <strong>vinculação<\/strong> (controle finalístico), não hierarquia.<\/li>\n<li>A <strong>UFBA<\/strong> é uma <strong>autarquia federal<\/strong>, vinculada ao <strong>Ministério da Educação<\/strong>.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Entidade<\/th>\n<th>Natureza<\/th>\n<th>Exemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Autarquia<\/td>\n<td>Direito público; criada por lei<\/td>\n<td>INSS, UFBA, Banco Central<\/td>\n<\/tr>\n<tr>\n<td>Fundação pública<\/td>\n<td>Direito público ou privado<\/td>\n<td>IBGE, Funai<\/td>\n<\/tr>\n<tr>\n<td>Empresa pública<\/td>\n<td>Direito privado; capital 100% público<\/td>\n<td>Caixa, Correios<\/td>\n<\/tr>\n<tr>\n<td>Sociedade de economia mista<\/td>\n<td>Direito privado; S.A.; maioria do capital votante público<\/td>\n<td>Banco do Brasil, Petrobras<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Agências reguladoras<\/strong> (Anatel, Aneel, Anvisa) são autarquias em regime especial, com maior autonomia.<\/li>\n<li><strong>Poderes da União:<\/strong> Legislativo, Executivo e Judiciário, independentes e harmônicos entre si. O <strong>Presidente da República<\/strong> é chefe de Estado e de governo, auxiliado pelos <strong>Ministros de Estado<\/strong>.<\/li>\n<\/ul>", "text": "A organização federal segue o Decreto-Lei 200/1967 . Administração direta: a própria União , por meio de seus órgãos: Presidência da República e Ministérios . Os órgãos não têm personalidade jurídica : são partes da União. Administração indireta: entidades com personalidade jurídica própria , vinculadas a um ministério (supervisão ministerial, não subordinação). São: autarquias , fundações públicas , empresas públicas e sociedades de economia mista . Descentralização: passa a execução de um serviço a outra pessoa jurídica (a União cria uma autarquia, ou delega por concessão a particular). Desconcentração: distribui tarefas dentro da mesma pessoa jurídica , entre órgãos (um ministério com secretarias). Hierarquia: existe dentro da mesma pessoa (ordem, fiscalização, delegação, avocação). Entre a administração direta e a indireta existe vinculação (controle finalístico), não hierarquia. A UFBA é uma autarquia federal , vinculada ao Ministério da Educação . Entidade Natureza Exemplos Autarquia Direito público; criada por lei INSS, UFBA, Banco Central Fundação pública Direito público ou privado IBGE, Funai Empresa pública Direito privado; capital 100% público Caixa, Correios Sociedade de economia mista Direito privado; S.A.; maioria do capital votante público Banco do Brasil, Petrobras Agências reguladoras (Anatel, Aneel, Anvisa) são autarquias em regime especial, com maior autonomia. Poderes da União: Legislativo, Executivo e Judiciário, independentes e harmônicos entre si. O Presidente da República é chefe de Estado e de governo, auxiliado pelos Ministros de Estado ."}, {"num": "3", "title": "Agentes públicos", "html": "<p><strong>Agente público<\/strong> é todo aquele que exerce função pública, ainda que temporária ou sem remuneração.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Espécie<\/th>\n<th>Quem é<\/th>\n<th>Vínculo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agentes políticos<\/td>\n<td>Presidente, governadores, prefeitos, ministros, parlamentares<\/td>\n<td>Mandato ou cargo de natureza política<\/td>\n<\/tr>\n<tr>\n<td>Servidores estatutários<\/td>\n<td>Ocupam <strong>cargo<\/strong> público<\/td>\n<td>Estatuto (Lei 8.112 na União)<\/td>\n<\/tr>\n<tr>\n<td>Empregados públicos<\/td>\n<td>Ocupam <strong>emprego<\/strong> público<\/td>\n<td>CLT (empresas públicas, sociedades de economia mista)<\/td>\n<\/tr>\n<tr>\n<td>Temporários<\/td>\n<td>Exercem <strong>função<\/strong> por tempo determinado<\/td>\n<td>Contrato administrativo especial<\/td>\n<\/tr>\n<tr>\n<td>Militares<\/td>\n<td>Forças Armadas, polícias e bombeiros militares<\/td>\n<td>Regime próprio<\/td>\n<\/tr>\n<tr>\n<td>Particulares em colaboração<\/td>\n<td>Mesário, jurado, concessionário, tabelião<\/td>\n<td>Sem vínculo funcional<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Cargo:<\/strong> posição na estrutura, criada por lei, com atribuições e denominação próprias. <strong>Emprego:<\/strong> vínculo celetista. <strong>Função:<\/strong> conjunto de atribuições (de confiança ou temporária).<\/li>\n<li><strong>Investidura:<\/strong> nomeação, <strong>posse<\/strong> e <strong>exercício<\/strong>. A posse é o ato em que se assume o cargo; o exercício é o início do trabalho.<\/li>\n<li><strong>Direitos e deveres<\/strong> do servidor federal estão na Lei 8.112 (item 4).<\/li>\n<li>O edital também cita <strong>atendimento, comunicação, inclusão e acessibilidade<\/strong>: veja o item 16 e a matéria Atendimento ao Público.<\/li>\n<\/ul>", "text": "Agente público é todo aquele que exerce função pública, ainda que temporária ou sem remuneração. Espécie Quem é Vínculo Agentes políticos Presidente, governadores, prefeitos, ministros, parlamentares Mandato ou cargo de natureza política Servidores estatutários Ocupam cargo público Estatuto (Lei 8.112 na União) Empregados públicos Ocupam emprego público CLT (empresas públicas, sociedades de economia mista) Temporários Exercem função por tempo determinado Contrato administrativo especial Militares Forças Armadas, polícias e bombeiros militares Regime próprio Particulares em colaboração Mesário, jurado, concessionário, tabelião Sem vínculo funcional Cargo: posição na estrutura, criada por lei, com atribuições e denominação próprias. Emprego: vínculo celetista. Função: conjunto de atribuições (de confiança ou temporária). Investidura: nomeação, posse e exercício . A posse é o ato em que se assume o cargo; o exercício é o início do trabalho. Direitos e deveres do servidor federal estão na Lei 8.112 (item 4). O edital também cita atendimento, comunicação, inclusão e acessibilidade : veja o item 16 e a matéria Atendimento ao Público."}, {"num": "4", "title": "Lei 8.112/1990 (Regime Jurídico dos Servidores Federais)", "html": "<h4>Provimento e ingresso<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tema<\/th>\n<th>O que saber<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Requisitos<\/td>\n<td>Nacionalidade brasileira (ou estrangeiro, na forma da lei), idade mínima de 18 anos, gozo dos direitos políticos, quitação eleitoral e militar, escolaridade e aptidão física e mental<\/td>\n<\/tr>\n<tr>\n<td>Formas de provimento<\/td>\n<td>Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução<\/td>\n<\/tr>\n<tr>\n<td>Prazos de entrada<\/td>\n<td><strong>Posse<\/strong> em até <strong>30 dias<\/strong> da publicação da nomeação; <strong>exercício<\/strong> em até <strong>15 dias<\/strong> da posse<\/td>\n<\/tr>\n<tr>\n<td>Estágio probatório<\/td>\n<td>24 meses na lei, mas a CF (art. 41) e a AGU entendem <strong>36 meses<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Jornada<\/td>\n<td>40 horas semanais e 8 horas diárias, em regra<\/td>\n<\/tr>\n<tr>\n<td>Vacância<\/td>\n<td>Exoneração, demissão, promoção, readaptação, aposentadoria, posse em cargo inacumulável, falecimento<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Nomeação:<\/strong> em caráter efetivo (concurso) ou comissão. <strong>Promoção:<\/strong> passagem a cargo de maior complexidade (na carreira do técnico-administrativo chama-se progressão). <strong>Readaptação:<\/strong> investidura em cargo compatível com limitação física ou mental do servidor. <strong>Reversão:<\/strong> retorno do aposentado. <strong>Aproveitamento:<\/strong> retorno do servidor em disponibilidade. <strong>Reintegração:<\/strong> retorno por demissão invalidada. <strong>Recondução:<\/strong> retorno ao cargo anterior (inabilitado em estágio probatório de outro cargo, ou reintegração do ocupante anterior).<\/li>\n<li><strong>Remoção:<\/strong> deslocamento do <strong>servidor<\/strong> no mesmo quadro, com ou sem mudança de sede. <strong>Redistribuição:<\/strong> deslocamento do <strong>cargo<\/strong> para outro órgão.<\/li>\n<\/ul>\n<h4>Direitos e vantagens<\/h4>\n<ul>\n<li><strong>Vencimento<\/strong> é o valor básico; <strong>remuneração<\/strong> é vencimento mais vantagens. <strong>Indenizações<\/strong> (ajuda de custo, diárias, transporte, auxílio-moradia) <strong>não se incorporam<\/strong> ao vencimento. <strong>Gratificações e adicionais:<\/strong> natalina (13º), adicional de férias (1/3), adicional noturno (25% sobre a hora diurna, das 22h às 5h), serviço extraordinário (mínimo de 50%), insalubridade, periculosidade e atividades penosas.<\/li>\n<li><strong>Férias:<\/strong> 30 dias por ano; acumula no máximo <strong>2 períodos<\/strong> (por necessidade do serviço); pode dividir em até <strong>3 etapas<\/strong>.<\/li>\n<li><strong>Licenças:<\/strong> doença em pessoa da família, afastamento do cônjuge, serviço militar, atividade política, capacitação (até <strong>3 meses a cada 5 anos<\/strong>), interesses particulares (até <strong>3 anos<\/strong>, sem remuneração), mandato classista. <strong>Licença-maternidade:<\/strong> 120 dias (prorrogável por mais 60). <strong>Licença-paternidade:<\/strong> 5 dias (ampliável).<\/li>\n<li><strong>Afastamentos:<\/strong> para servir a outro órgão, mandato eletivo, estudo no exterior, participação em programa de pós-graduação.<\/li>\n<li><strong>Concessões<\/strong> (sem prejuízo da remuneração): doação de sangue (1 dia), alistamento eleitoral (2 dias), casamento e luto (8 dias).<\/li>\n<\/ul>\n<h4>Deveres e proibições<\/h4>\n<ul>\n<li><strong>Deveres (art. 116):<\/strong> exercer com <strong>zelo e dedicação<\/strong> as atribuições; ser <strong>leal<\/strong> às instituições; observar as normas; cumprir ordens superiores, <strong>exceto as manifestamente ilegais<\/strong>; atender com presteza; levar ao conhecimento da autoridade as irregularidades; zelar pela economia do material; guardar <strong>sigilo<\/strong>; manter conduta compatível com a moralidade; ser <strong>assíduo e pontual<\/strong>; tratar as pessoas com <strong>urbanidade<\/strong>; representar contra ilegalidade.<\/li>\n<li><strong>Proibições (art. 117):<\/strong> ausentar-se do serviço sem autorização; retirar documento da repartição sem permissão; recusar fé a documentos públicos; opor resistência injustificada ao andamento; promover manifestação de apreço ou desapreço no local de trabalho; valer-se do cargo para obter proveito pessoal; <strong>receber propina<\/strong>; <strong>participar de gerência ou administração de empresa privada<\/strong> (exceto como acionista ou cotista); atuar como procurador de interesses privados na repartição; manter sob sua chefia imediata cônjuge ou parente até o segundo grau.<\/li>\n<\/ul>\n<h4>Penalidades e prescrição<\/h4>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Penalidade<\/th>\n<th>Aplicação típica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Advertência<\/td>\n<td>Infrações leves, por escrito<\/td>\n<\/tr>\n<tr>\n<td>Suspensão (até 90 dias)<\/td>\n<td>Reincidência em falta punida com advertência ou outras violações; pode ser convertida em multa<\/td>\n<\/tr>\n<tr>\n<td>Demissão<\/td>\n<td>Casos graves do art. 132 (crime contra a Administração, improbidade, corrupção, abandono de cargo, inassiduidade habitual, acumulação ilegal, revelação de segredo etc.)<\/td>\n<\/tr>\n<tr>\n<td>Cassação de aposentadoria ou disponibilidade<\/td>\n<td>Se o inativo praticou, na ativa, falta punível com demissão<\/td>\n<\/tr>\n<tr>\n<td>Destituição de cargo em comissão ou função comissionada<\/td>\n<td>Quando a infração seria punível com suspensão ou demissão<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Prescrição:<\/strong> <strong>5 anos<\/strong> (demissão, cassação, destituição), <strong>2 anos<\/strong> (suspensão), <strong>180 dias<\/strong> (advertência), contados da data em que a Administração teve ciência do fato. A abertura de PAD interrompe.<\/li>\n<li><strong>Seguridade:<\/strong> a Lei também trata de aposentadorias, pensões, auxílio-reclusão e assistência (hoje boa parte vem do regime próprio e da reforma da previdência).<\/li>\n<\/ul>\n<h4>Sindicância x PAD<\/h4>\n<ul>\n<li><strong>Sindicância:<\/strong> investiga indícios; até 30 dias, prorrogável por igual período. Pode terminar em arquivamento, advertência, suspensão de até <strong>30 dias<\/strong> ou abertura de <strong>PAD<\/strong> (processo administrativo disciplinar).<\/li>\n<li><strong>PAD:<\/strong> conduzido por <strong>comissão de 3 servidores estáveis<\/strong>, com presidente de cargo igual ou superior ao do acusado. Prazo de <strong>60 dias, prorrogável por igual período<\/strong>. Fases: <strong>instauração, inquérito<\/strong> (instrução, defesa, relatório) e <strong>julgamento<\/strong> (20 dias).<\/li>\n<li><strong>Rito sumário<\/strong> para: acumulação ilegal de cargos, abandono de cargo (mais de <strong>30 dias<\/strong> seguidos de ausência) e inassiduidade habitual (<strong>60 dias<\/strong> intercalados no período de 12 meses).<\/li>\n<li><strong>Independência das instâncias:<\/strong> responsabilidades <strong>civil, penal e administrativa<\/strong> são independentes. Absolvição criminal por <strong>inexistência do fato<\/strong> ou <strong>negativa de autoria<\/strong> afasta a administrativa.<\/li>\n<li><strong>Revisão do processo:<\/strong> a qualquer tempo, se surgirem fatos novos. Não pode agravar a penalidade.<\/li>\n<\/ul>\n<blockquote class=\"tip\">\n<p><strong>Macete:<\/strong> \"30-15\" para entrar (posse em 30 dias, exercício em 15). \"5-2-180\" para prescrever (demissão 5 anos, suspensão 2 anos, advertência 180 dias).<\/p>\n<\/blockquote>", "text": "Provimento e ingresso Tema O que saber Requisitos Nacionalidade brasileira (ou estrangeiro, na forma da lei), idade mínima de 18 anos, gozo dos direitos políticos, quitação eleitoral e militar, escolaridade e aptidão física e mental Formas de provimento Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução Prazos de entrada Posse em até 30 dias da publicação da nomeação; exercício em até 15 dias da posse Estágio probatório 24 meses na lei, mas a CF (art. 41) e a AGU entendem 36 meses Jornada 40 horas semanais e 8 horas diárias, em regra Vacância Exoneração, demissão, promoção, readaptação, aposentadoria, posse em cargo inacumulável, falecimento Nomeação: em caráter efetivo (concurso) ou comissão. Promoção: passagem a cargo de maior complexidade (na carreira do técnico-administrativo chama-se progressão). Readaptação: investidura em cargo compatível com limitação física ou mental do servidor. Reversão: retorno do aposentado. Aproveitamento: retorno do servidor em disponibilidade. Reintegração: retorno por demissão invalidada. Recondução: retorno ao cargo anterior (inabilitado em estágio probatório de outro cargo, ou reintegração do ocupante anterior). Remoção: deslocamento do servidor no mesmo quadro, com ou sem mudança de sede. Redistribuição: deslocamento do cargo para outro órgão. Direitos e vantagens Vencimento é o valor básico; remuneração é vencimento mais vantagens. Indenizações (ajuda de custo, diárias, transporte, auxílio-moradia) não se incorporam ao vencimento. Gratificações e adicionais: natalina (13º), adicional de férias (1/3), adicional noturno (25% sobre a hora diurna, das 22h às 5h), serviço extraordinário (mínimo de 50%), insalubridade, periculosidade e atividades penosas. Férias: 30 dias por ano; acumula no máximo 2 períodos (por necessidade do serviço); pode dividir em até 3 etapas . Licenças: doença em pessoa da família, afastamento do cônjuge, serviço militar, atividade política, capacitação (até 3 meses a cada 5 anos ), interesses particulares (até 3 anos , sem remuneração), mandato classista. Licença-maternidade: 120 dias (prorrogável por mais 60). Licença-paternidade: 5 dias (ampliável). Afastamentos: para servir a outro órgão, mandato eletivo, estudo no exterior, participação em programa de pós-graduação. Concessões (sem prejuízo da remuneração): doação de sangue (1 dia), alistamento eleitoral (2 dias), casamento e luto (8 dias). Deveres e proibições Deveres (art. 116): exercer com zelo e dedicação as atribuições; ser leal às instituições; observar as normas; cumprir ordens superiores, exceto as manifestamente ilegais ; atender com presteza; levar ao conhecimento da autoridade as irregularidades; zelar pela economia do material; guardar sigilo ; manter conduta compatível com a moralidade; ser assíduo e pontual ; tratar as pessoas com urbanidade ; representar contra ilegalidade. Proibições (art. 117): ausentar-se do serviço sem autorização; retirar documento da repartição sem permissão; recusar fé a documentos públicos; opor resistência injustificada ao andamento; promover manifestação de apreço ou desapreço no local de trabalho; valer-se do cargo para obter proveito pessoal; receber propina ; participar de gerência ou administração de empresa privada (exceto como acionista ou cotista); atuar como procurador de interesses privados na repartição; manter sob sua chefia imediata cônjuge ou parente até o segundo grau. Penalidades e prescrição Penalidade Aplicação típica Advertência Infrações leves, por escrito Suspensão (até 90 dias) Reincidência em falta punida com advertência ou outras violações; pode ser convertida em multa Demissão Casos graves do art. 132 (crime contra a Administração, improbidade, corrupção, abandono de cargo, inassiduidade habitual, acumulação ilegal, revelação de segredo etc.) Cassação de aposentadoria ou disponibilidade Se o inativo praticou, na ativa, falta punível com demissão Destituição de cargo em comissão ou função comissionada Quando a infração seria punível com suspensão ou demissão Prescrição: 5 anos (demissão, cassação, destituição), 2 anos (suspensão), 180 dias (advertência), contados da data em que a Administração teve ciência do fato. A abertura de PAD interrompe. Seguridade: a Lei também trata de aposentadorias, pensões, auxílio-reclusão e assistência (hoje boa parte vem do regime próprio e da reforma da previdência). Sindicância x PAD Sindicância: investiga indícios; até 30 dias, prorrogável por igual período. Pode terminar em arquivamento, advertência, suspensão de até 30 dias ou abertura de PAD (processo administrativo disciplinar). PAD: conduzido por comissão de 3 servidores estáveis , com presidente de cargo igual ou superior ao do acusado. Prazo de 60 dias, prorrogável por igual período . Fases: instauração, inquérito (instrução, defesa, relatório) e julgamento (20 dias). Rito sumário para: acumulação ilegal de cargos, abandono de cargo (mais de 30 dias seguidos de ausência) e inassiduidade habitual ( 60 dias intercalados no período de 12 meses). Independência das instâncias: responsabilidades civil, penal e administrativa são independentes. Absolvição criminal por inexistência do fato ou negativa de autoria afasta a administrativa. Revisão do processo: a qualquer tempo, se surgirem fatos novos. Não pode agravar a penalidade. Macete: \"30-15\" para entrar (posse em 30 dias, exercício em 15). \"5-2-180\" para prescrever (demissão 5 anos, suspensão 2 anos, advertência 180 dias)."}, {"num": "5", "title": "Ética no Serviço Público", "html": "<h4>Decreto 1.171/1994 (Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal)<\/h4>\n<ul>\n<li><strong>Regras deontológicas:<\/strong> o servidor deve ter <strong>dignidade, decoro, zelo e eficácia<\/strong>; a moralidade distingue o honesto do desonesto e o bem do mal; a remuneração é paga pelo povo, e é dever do servidor trabalhar com <strong>eficiência<\/strong>.<\/li>\n<li><strong>Deveres:<\/strong> cortesia, assiduidade, zelo, presteza, urbanidade, lealdade; manter-se atualizado; ser probo, reto, leal; comunicar irregularidades.<\/li>\n<li><strong>Vedações:<\/strong> usar o cargo ou função para <strong>favorecimento<\/strong>; receber <strong>presentes<\/strong> ou vantagens de quem tenha interesse; alterar ou deturpar o teor de documentos; deixar de utilizar os avanços técnicos; fazer uso de informação privilegiada.<\/li>\n<li><strong>Comissão de Ética<\/strong> em cada órgão. A <strong>única penalidade<\/strong> que ela aplica é a <strong>censura<\/strong> (a falta mais grave vai à instância disciplinar).<\/li>\n<\/ul>\n<h4>Decreto 6.029/2007 (Sistema de Gestão da Ética do Poder Executivo Federal)<\/h4>\n<ul>\n<li><strong>Comissão de Ética Pública (CEP)<\/strong> no topo, ligada à Presidência, e <strong>comissões de ética<\/strong> em cada órgão e entidade, integradas por <strong>três membros<\/strong> com mandato.<\/li>\n<li>Funções: orientar, receber denúncias, apurar, aplicar censura, propor aperfeiçoamentos. O procedimento corre em <strong>sigilo<\/strong> até a conclusão.<\/li>\n<li>A <strong>Lei 12.813/2013<\/strong> trata do <strong>conflito de interesses<\/strong> no exercício de cargo do Poder Executivo federal. O <strong>Código de Conduta da Alta Administração Federal<\/strong> estabelece regras para ministros e dirigentes.<\/li>\n<\/ul>\n<blockquote class=\"exam\">\n<p><strong>Cai em prova:<\/strong> censura é a <strong>única<\/strong> pena da comissão de ética. Ela é aplicada por <strong>comissão de ética<\/strong>, não por processo administrativo disciplinar.<\/p>\n<\/blockquote>", "text": "Decreto 1.171/1994 (Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal) Regras deontológicas: o servidor deve ter dignidade, decoro, zelo e eficácia ; a moralidade distingue o honesto do desonesto e o bem do mal; a remuneração é paga pelo povo, e é dever do servidor trabalhar com eficiência . Deveres: cortesia, assiduidade, zelo, presteza, urbanidade, lealdade; manter-se atualizado; ser probo, reto, leal; comunicar irregularidades. Vedações: usar o cargo ou função para favorecimento ; receber presentes ou vantagens de quem tenha interesse; alterar ou deturpar o teor de documentos; deixar de utilizar os avanços técnicos; fazer uso de informação privilegiada. Comissão de Ética em cada órgão. A ún
