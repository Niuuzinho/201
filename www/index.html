r, dar retorno . Lei 13.460/2017: direitos do usuário (veja Administração Pública, item 16). Inclusão e acessibilidade: atender a todos com igualdade, adaptando o atendimento a pessoas com deficiência. A Lei 13.146/2015 (Estatuto da Pessoa com Deficiência), o Decreto 5.296/2004 (acessibilidade) e a Lei 10.436/2002 ( Libras ) são referências. Use linguagem acessível, ofereça cadeira ou ajuda se necessário, fale com a pessoa (não com o acompanhante) e pergunte como ajudar."}, {"num": "2", "title": "Trabalho em equipe", "html": "<ul>\n<li><strong>Grupo<\/strong> é um conjunto de pessoas; <strong>equipe<\/strong> tem <strong>objetivo comum, interdependência e responsabilidade compartilhada<\/strong>. Sinergia: o resultado da equipe é maior que a soma das partes.<\/li>\n<li><strong>Comportamento receptivo:<\/strong> aberto a ouvir e mudar. <strong>Defensivo:<\/strong> justifica-se, ataca ou se fecha. <strong>Assertivo:<\/strong> expressa-se com clareza e respeito (o ideal). <strong>Passivo<\/strong> e <strong>agressivo<\/strong> são os extremos.<\/li>\n<li><strong>Empatia:<\/strong> colocar-se no lugar do outro (diferente de <strong>simpatia<\/strong>, que é afinidade).<\/li>\n<li>O servidor representa o órgão: a imagem que passa forma a <strong>opinião pública<\/strong> sobre a instituição.<\/li>\n<li><strong>Feedback eficaz:<\/strong> específico, descritivo (não julga a pessoa), <strong>dado no momento certo<\/strong> e voltado à melhoria.<\/li>\n<li><strong>Conflitos:<\/strong> gerenciar com diálogo, foco no problema e não na pessoa. <strong>Cooperação<\/strong> × <strong>competição<\/strong>.<\/li>\n<li><strong>Clima organizacional<\/strong> positivo favorece o atendimento.<\/li>\n<\/ul>", "text": "Grupo é um conjunto de pessoas; equipe tem objetivo comum, interdependência e responsabilidade compartilhada . Sinergia: o resultado da equipe é maior que a soma das partes. Comportamento receptivo: aberto a ouvir e mudar. Defensivo: justifica-se, ataca ou se fecha. Assertivo: expressa-se com clareza e respeito (o ideal). Passivo e agressivo são os extremos. Empatia: colocar-se no lugar do outro (diferente de simpatia , que é afinidade). O servidor representa o órgão: a imagem que passa forma a opinião pública sobre a instituição. Feedback eficaz: específico, descritivo (não julga a pessoa), dado no momento certo e voltado à melhoria. Conflitos: gerenciar com diálogo, foco no problema e não na pessoa. Cooperação × competição . Clima organizacional positivo favorece o atendimento."}, {"num": "3", "title": "Postura profissional e relações interpessoais", "html": "<ul>\n<li><strong>Princípios:<\/strong> ética, sigilo, pontualidade, linguagem adequada, <strong>não julgar o cidadão<\/strong>, imparcialidade, <strong>urbanidade<\/strong> e respeito.<\/li>\n<li><strong>Apresentação pessoal:<\/strong> limpa, adequada ao ambiente de trabalho; postura ereta e contato visual.<\/li>\n<li><strong>Atendimento prioritário (Lei 10.048/2000):<\/strong> pessoas com <strong>deficiência<\/strong>, <strong>idosos com 60 anos ou mais<\/strong>, <strong>gestantes<\/strong>, <strong>lactantes<\/strong>, pessoas <strong>com criança de colo<\/strong> e <strong>obesos<\/strong>. Prioridade especial para os <strong>idosos com 80 anos ou mais<\/strong> (Estatuto da Pessoa Idosa).<\/li>\n<li><strong>Relações interpessoais:<\/strong> cordialidade, escuta, respeito às diferenças. Evite <strong>preconceito, discriminação e assédio<\/strong> (moral e sexual).<\/li>\n<li><strong>Etiqueta profissional:<\/strong> tratar por \"senhor/senhora\", agradecer, evitar conversas paralelas durante o atendimento, <strong>não usar celular<\/strong> no atendimento.<\/li>\n<\/ul>", "text": "Princípios: ética, sigilo, pontualidade, linguagem adequada, não julgar o cidadão , imparcialidade, urbanidade e respeito. Apresentação pessoal: limpa, adequada ao ambiente de trabalho; postura ereta e contato visual. Atendimento prioritário (Lei 10.048/2000): pessoas com deficiência , idosos com /* ---------- Teste rápido ---------- */
function quizHtml(m) {
  const st = quizState[m.id] || (quizState[m.id] = {});
  const answered = Object.keys(st).length, right = Object.entries(st).filter(([i, a]) => m.quiz[i].a === a).length;
  const L = 'ABCD';
  const qs = m.quiz.map((q, i) => {
    const a = st[i];
    const opts = q.opts.map((o, j) => {
      let cls = '';
      if (a !== undefined) { if (j === q.a) cls = ' right'; else if (j === a) cls = ' wrong'; }
      return `<button type="button" class="opt${cls}" data-q="${i}" data-o="${j}" ${a !== undefined ? 'disabled' : ''}><span>${L[j]}</span><span>${esc(o)}</span></button>`;
    }).join('');

    return `<div class="q"><p class="stem"><b>${String(i + 1).padStart(2, '0')}</b>${esc(q.q)}</p><div class="opts">${opts}</div>${exp}</div>`;
  }).join('');
  return `<article class="sheet">

}
function bindQuiz(m) {

}

/* ---------- Simulado misto ---------- */
let sim = null;
function newSim() {
  const pool = [];
  DATA.forEach(m => m.quiz.forEach((q, i) => pool.push({ m: m.id, i, q })));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  sim = { qs: pool.slice(0, Math.min(20, pool.length)), ans: {} };
}
function renderSimulado() {
  if (!sim) newSim();
  const L = 'ABCD', n = sim.qs.length;
  const answered = Object.keys(sim.ans).length;
  const right = Object.entries(sim.ans).filter(([i, a]) => sim.qs[i].q.a === a).length;
  const qs = sim.qs.map((x, i) => {
    const a = sim.ans[i];
    const opts = x.q.opts.map((o, j) => {
      let cls = '';
      if (a !== undefined) { if (j === x.q.a) cls = ' right'; else if (j === a) cls = ' wrong'; }
      return `<button type="button" class="opt${cls}" data-sq="${i}" data-o="${j}" ${a !== undefined ? 'disabled' : ''}><span>${L[j]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    const exp = a === undefined ? '' : `<p class="exp">${a === x.q.a ? '<b class="r">Certo.</b>' : '<b class="w">Não foi dessa vez.</b>'} ${esc(x.q.exp)}</p>`;
    return `<div class="q"><p class="stem"><b>${String(i + 1).padStart(2, '0')}</b>${esc(x.q.q)}</p><span class="tabchip" style="--tab:${tabVar(x.m)};align-self:flex-start">${esc(BY[x.m].nome)}</span><div class="opts">${opts}</div>${exp}</div>`;
  }).join('');
  let resumo = '';
  if (answered === n) {
    const by = {};
    sim.qs.forEach((x, i) => { const o = by[x.m] || (by[x.m] = { t: 0, r: 0 }); o.t++; if (sim.ans[i] === x.q.a) o.r++; });
    resumo = `<div class="card"><h2>Resultado: ${right} de ${n} (${Math.round(right / n * 100)}%)</h2>
      <p>${Object.entries(by).map(([id, o]) => `${esc(BY[id].nome)}: ${o.r}/${o.t}`).join(' · ')}</p></div>`;
  }
  $('#main').innerHTML = `<section class="mhead"><span class="tabchip" style="--tab:var(--accent);color:var(--accent-ink)">Simulado</span><h1>Simulado misto</h1>
    <p>${n} questões sorteadas de todas as matérias. ${answered ? `${right} de ${answered} acertos até agora.` : 'Responda e veja o gabarito na hora.'}</p></section>
    ${resumo}
    <article class="sheet"><div class="qlist">${qs}</div>
      <div class="sheetfoot"><button class="btn ghost" type="button" id="simNew">Novo simulado</button><div class="nav"><button class="btn primary" type="button" id="simHome">Voltar ao início</button></div></div></article>`;
  document.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => {
    sim.ans[b.dataset.sq] = +b.dataset.o; markDay();
    const y = window.scrollY; renderSimulado(); window.scrollTo(0, y);
  });
  $('#simNew').onclick = () => { newSim(); renderSimulado(); window.scrollTo(0, 0); };
  $('#simHome').onclick = () => go('inicio');
}

/* ---------- Busca ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const INDEX = [];
DATA.forEach(m => m.topics.forEach((t, i) => INDEX.push({ m: m.id, i, t, hay: norm(t.title + ' ' + t.text) })));
function renderSearch(q) {
  const nq = norm(q.trim());
  const hits = nq.length < 2 ? [] : INDEX.filter(x => x.hay.includes(nq));
  const snip = x => {
    const p = norm(x.t.text).indexOf(nq);
    if (p < 0) return esc(x.t.text.slice(0, 140)) + '…';
    const s = Math.max(0, p - 60), e = Math.min(x.t.text.length, p + nq.length + 90);
    return (s ? '…' : '') + esc(x.t.text.slice(s, p)) + '<mark>' + esc(x.t.text.slice(p, p + nq.length)) + '</mark>' + esc(x.t.text.slice(p + nq.length, e)) + (e < x.t.text.length ? '…' : '');
  };
  $('#main').innerHTML = `<section class="mhead"><span class="eyebrow">Busca</span><h1>“${esc(q.trim())}”</h1>
    <p>${hits.length ? `${hits.length} tópico${hits.length > 1 ? 's' : ''} encontrado${hits.length > 1 ? 's' : ''}.` : ''}</p></section>
    <div class="results">${hits.length ? hits.map(x => `<button type="button" class="hit" data-m="${x.m}" data-i="${x.i}" style="--tab:${tabVar(x.m)}">
      <span class="where"><i></i>${esc(BY[x.m].nome)} · tópico ${esc(x.t.num)}</span><b>${esc(x.t.title)}</b><p>${snip(x)}</p></button>`).join('')
      : `<p class="empty">${nq.length < 2 ? 'Digite pelo menos 2 letras.' : 'Nada encontrado. Tente outra palavra, como “prazo”, “lei” ou “estoque”.'}</p>`}</div>`;
  document.querySelectorAll('.hit').forEach(h => h.onclick = () => { $('#q').value = ''; go(h.dataset.m, +h.dataset.i); });
  renderNav(null);
}

/* ---------- Conta GitHub: login por código e progresso num Gist secreto ---------- */
const CFG = window.APP_CONFIG || {};
const APP_VERSION = window.APP_VERSION || 'dev';
const GIST_FILE = 'caderno-201-progresso.json';
const GIST_DESC = 'Caderno 201 · progresso (não apague)';
const CAP = window.Capacitor;
const isNative = !!CAP && ((CAP.isNativePlatform && CAP.isNativePlatform()) || (CAP.getPlatform && CAP.getPlatform() !== 'web'));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let auth = store.get('auth', null); // { token, login, avatar, gistId }
let loginRun = 0;

function saveAuth() { try { localStorage.setItem('c201.auth', JSON.stringify(auth)); } catch (e) {} }
// No app, abre links no navegador do celular (aba do Chrome). Se o plugin falhar,
// navegar para um site externo também faz o Capacitor abrir o navegador.
function openExternal(url) {
  if (!isNative) { window.open(url, '_blank', 'noopener'); return; }
  let p = null;
  try {
    if (CAP.Plugins && CAP.Plugins.Browser && CAP.Plugins.Browser.open) p = CAP.Plugins.Browser.open({ url });
    else if (CAP.registerPlugin) p = CAP.registerPlugin('Browser').open({ url });
  } catch (e) { p = null; }
  if (p && p.catch) p.catch(() => { location.href = url; });
  else if (!p) location.href = url;
}
function setSync(state, text) { const s = $('#sync'); if (!s) return; s.dataset.state = state; $('#syncText').textContent = text; }
function renderAccount() {
  const on = !!(auth && auth.token);
  $('#who').hidden = !on; $('#pitch').hidden = on;
  $('#loginBtn').hidden = on; $('#logoutBtn').hidden = !on; $('#syncBtn').hidden = !on;
  if (on) { $('#login').textContent = '@' + (auth.login || 'github'); if (auth.avatar) $('#avatar').src = auth.avatar; }
  if (isNative && !CFG.clientId) { $('#loginBtn').disabled = true; $('#pitch').textContent = 'O login com GitHub ainda não foi configurado nesta versão. Seu progresso fica salvo neste aparelho.'; }
  else if (!isNative && !on) $('#pitch').textContent = 'Entre com o GitHub para ver aqui o mesmo progresso do app do celular.';
}

async function gh(path, opts = {}) {
  const headers = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (auth && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, { ...opts, headers, cache: 'no-store' });
  if (r.status === 401) { const e = new Error('auth'); e.code = 'auth'; throw e; }
  if (!r.ok) { const e = new Error('http ' + r.status); e.code = 'http'; e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}

function localState() {
  let u = 0; try { u = +localStorage.getItem('c201.updatedAt') || 0; } catch (e) {}
  return { done: [...done].sort(), fav: [...fav].sort(), last, lastSeen, quiz: quizState, updatedAt: u };
}
function applyRemote(r) {
  applying = true;
  done = new Set(Array.isArray(r.done) ? r.done : []);
  last = r.last || {}; lastSeen = r.lastSeen || null; quizState = r.quiz || {};
  fav = new Set(Array.isArray(r.fav) ? r.fav : []);
  try {
    localStorage.setItem('c201.done', JSON.stringify([...done]));
    localStorage.setItem('c201.last', JSON.stringify(last));
    localStorage.setItem('c201.lastSeen', JSON.stringify(lastSeen));
    localStorage.setItem('c201.quiz', JSON.stringify(quizState));
    localStorage.setItem('c201.fav', JSON.stringify([...fav]));
    localStorage.setItem('c201.updatedAt', String(r.updatedAt || Date.now()));
  } catch (e) {}
  applying = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

async function findGist() {
  if (auth.gistId) return auth.gistId;
  for (let page = 1; page <= 5; page++) {
    const list = await gh('/gists?per_page=100&page=' + page);
    const g = list.find(x => x.files && x.files[GIST_FILE]);
    if (g) return g.id;
    if (list.length < 100) break;
  }
  return null;
}
async function pullRemote() {
  const id = await findGist();
  if (!id) return null;
  let g;
  try { g = await gh('/gists/' + id); }
  catch (e) { if (e.status === 404) { auth.gistId = null; saveAuth(); return null; } throw e; }
  auth.gistId = id; saveAuth();
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let content = f.content;
  if (f.truncated) content = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  try { return JSON.parse(content); } catch (e) { return null; }
}
async function pushRemote() {
  const body = { description: GIST_DESC, files: { [GIST_FILE]: { content: JSON.stringify(localState(), null, 1) } } };
  if (auth.gistId) {
    try { await gh('/gists/' + auth.gistId, { method: 'PATCH', body: JSON.stringify(body) }); return; }
    catch (e) { if (e.status !== 404) throw e; auth.gistId = null; }
  }
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ ...body, public: false }) });
  auth.gistId = g.id; saveAuth();
}

const OK_TEXT = 'Progresso salvo no GitHub';
function syncError(e) {
  if (e && e.code === 'auth') { logout(); setSync('err', 'Sessão expirada. Entre de novo.'); return; }
  setSync('err', navigator.onLine === false ? 'Sem internet. Salvo no aparelho e envio depois.' : 'Não consegui falar com o GitHub. Salvo no aparelho.');
}
function scheduleCloud() {
  if (!auth || !auth.token || applying) return;
  setSync('saving', 'Salvando…');
  clearTimeout(wt); wt = setTimeout(flush, 2000);
}
async function flush() {
  if (!auth || !auth.token) return;
  if (writing) { again = true; return; }
  writing = true;
  try { await pushRemote(); setSync('ok', OK_TEXT); } catch (e) { syncError(e); }
  writing = false;
  if (again) { again = false; flush(); }
}
let syncing = false;
async function syncNow() {
  if (!auth || !auth.token || syncing) return;
  syncing = true; setSync('saving', 'Sincronizando…');
  try {
    const r = await pullRemote();
    const loc = localState();
    let synced = false; try { synced = localStorage.getItem('c201.syncedAs') === auth.login; } catch (e) {}
    if (!r) await pushRemote();
    else if (!synced) {
      // primeira vez desta conta neste aparelho: junta o que havia aqui com o que está no GitHub
      const merged = { done: [...new Set([...(r.done || []), ...loc.done])].sort(), fav: [...new Set([...(r.fav || []), ...loc.fav])].sort(),
        last: Object.assign({}, r.last, loc.last), lastSeen: loc.lastSeen || r.lastSeen || null,
        quiz: Object.assign({}, r.quiz, loc.quiz), updatedAt: Date.now() };
      applyRemote(merged); await pushRemote();
    } else if ((r.updatedAt || 0) > loc.updatedAt) applyRemote(r);
    else if ((r.updatedAt || 0) < loc.updatedAt) await pushRemote();
    try { localStorage.setItem('c201.syncedAs', auth.login); } catch (e) {}
    setSync('ok', OK_TEXT);
  } catch (e) { syncError(e); }
  syncing = false;
}

async function finishLogin(token) {
  auth = { token, login: '', avatar: '', gistId: null };
  const u = await gh('/user');
  auth.login = u.login; auth.avatar = u.avatar_url;
  saveAuth(); renderAccount(); render(); await syncNow();
}

// No navegador o GitHub não permite o login por código, então a pessoa cola um token com permissão "gist".
function startTokenLogin() {
  closeMenu(); window.scrollTo(0, 0);
  const url = 'https://github.com/settings/tokens/new?scopes=gist&description=' + encodeURIComponent('Caderno 201 (navegador)');
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub no navegador</span><h2>Cole um token do GitHub</h2>
    <ol class="steps">
      <li>Clique em <b>Criar token no GitHub</b>. A página já abre com a permissão certa (<b>gist</b>) marcada.</li>
      <li>Em <b>Expiration</b>, escolha <b>No expiration</b> (ou uma data longa).</li>
      <li>Desça até o fim e clique em <b>Generate token</b>. Copie o código que começa com <code>ghp_</code>.</li>
      <li>Cole aqui embaixo e clique em <b>Entrar</b>.</li>
    </ol>
    <div class="search"><input id="tokIn" type="password" placeholder="ghp_…" autocomplete="off" aria-label="Token do GitHub" style="padding-left:12px"></div>
    <p class="exp" id="tokStatus">O token fica guardado só neste navegador e dá acesso apenas aos seus gists, não aos repositórios.</p>
    <div class="sheetfoot"><button class="btn ghost" type="button" id="tokBack">Cancelar</button>
      <div class="nav"><a class="btn ghost" href="${url}" target="_blank" rel="noopener">Criar token no GitHub</a><button class="btn primary" type="button" id="tokGo">Entrar</button></div></div></article>`;
  $('#tokBack').onclick = () => render();
  $('#tokGo').onclick = async () => {
    const t = $('#tokIn').value.trim();
    if (!t) { $('#tokStatus').textContent = 'Cole o token antes de entrar.'; return; }
    $('#tokStatus').textContent = 'Conferindo com o GitHub…';
    try {
      const r = await fetch('https://api.github.com/user', { headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + t }, cache: 'no-store' });
      if (r.status === 401) { $('#tokStatus').textContent = 'O GitHub não aceitou esse token. Confira se copiou inteiro.'; return; }
      const sc = r.headers.get('x-oauth-scopes');
      if (sc !== null && !/\bgist\b/.test(sc)) { $('#tokStatus').textContent = 'Esse token não tem a permissão "gist". Crie outro pelo botão acima.'; return; }
      if (!r.ok) throw new Error(r.status);
      await finishLogin(t);
    } catch (e) { $('#tokStatus').textContent = 'Não consegui falar com o GitHub. Confira a internet e tente de novo.'; }
  };
}

async function startLogin() {
  if (!isNative) { startTokenLogin(); return; }
  if (!CFG.clientId) return;
  const run = ++loginRun;
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Preparando o código…</h2></article>`;
  closeMenu(); window.scrollTo(0, 0);
  let d;
  try {
    const r = await fetch('https://github.com/login/device/code', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify({ client_id: CFG.clientId, scope: 'gist' }) });
    d = await r.json();
    if (!d.user_code) throw new Error(d.error || 'sem código');
  } catch (e) {
    $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Não consegui começar o login</h2>
      <p class="read">${isNative ? 'Confira sua internet e tente de novo.' : 'O login com GitHub funciona no app para Android. No navegador, o progresso fica salvo só neste aparelho.'}</p>
      <div class="sheetfoot"><button class="btn ghost" type="button" id="lgBack">Voltar</button></div></article>`;
    $('#lgBack').onclick = () => render();
    return;
  }
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Digite este código no GitHub</h2>
    <div class="code" id="ucode">${esc(d.user_code)}</div>
    <ol class="steps"><li>Toque em <b>Copiar e abrir o GitHub</b>.</li><li>Cole o código na página que abrir e toque em <b>Continue</b>, depois em <b>Authorize</b>.</li><li>Volte para este app. O login termina sozinho.</li></ol>
    <p class="exp" id="lgStatus">Esperando você autorizar no GitHub…</p>
    <div class="sheetfoot"><button class="btn ghost" type="button" id="lgCancel">Cancelar</button><div class="nav"><button class="btn primary" type="button" id="lgOpen">Copiar e abrir o GitHub</button></div></div></article>`;
  $('#lgCancel').onclick = () => { loginRun++; render(); };
  $('#lgOpen').onclick = async () => {
    try { await navigator.clipboard.writeText(d.user_code); } catch (e) { const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents($('#ucode')); s.removeAllRanges(); s.addRange(rg); }
    openExternal(d.verification_uri || 'https://github.com/login/device');
  };
  let interval = (d.interval || 5) * 1000;
  const until = Date.now() + (d.expires_in || 900) * 1000;
  while (run === loginRun && Date.now() < until) {
    await sleep(interval);
    if (run !== loginRun) return;
    let j;
    try {
      const r = await fetch('https://github.com/login/oauth/access_token', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: CFG.clientId, device_code: d.device_code, grant_type: 'urn:ietf:params:oauth:grant-type:device_code' }) });
      j = await r.json();
    } catch (e) { continue; }
    if (j.access_token) {
      try { await finishLogin(j.access_token); } catch (e) { saveAuth(); renderAccount(); render(); }
      return;
    }
    if (j.error === 'authorization_pending') continue;
    if (j.error === 'slow_down') { interval += 5000; continue; }
    const msg = j.error === 'access_denied' ? 'Você cancelou a autorização no GitHub.' : j.error === 'expired_token' ? 'O código expirou.' : 'O GitHub recusou o login (' + esc(j.error || 'erro') + ').';
    const st = $('#lgStatus'); if (st) st.innerHTML = msg + ' Toque em Cancelar e tente de novo.';
    return;
  }
  const st = $('#lgStatus'); if (st && run === loginRun) st.textContent = 'O código expirou. Toque em Cancelar e tente de novo.';
}
function logout() {
  auth = null; try { localStorage.removeItem('c201.auth'); } catch (e) {}
  renderAccount();
}
$('#loginBtn').onclick = startLogin;
$('#logoutBtn').onclick = () => { logout(); setSync('wait', ''); };
$('#syncBtn').onclick = syncNow;
renderAccount();
if (auth && auth.token) { setSync('ok', OK_TEXT); syncNow(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncNow(); } else if (wt) { clearTimeout(wt); flush(); } });
window.addEventListener('online', () => syncNow());

/* ---------- Atualizações pelo GitHub Releases ---------- */
const cmpVer = (a, b) => { const pa = a.split('.').map(Number), pb = b.split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; } return 0; };
$('#appVer').textContent = APP_VERSION === 'dev' ? 'web' : 'v' + APP_VERSION;
let toastT;
function toast(msg) { const e = $('#toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 4200); }
// k: idle | busy | ok | new | err
let upd = { k: 'idle', msg: '', latest: '', apkUrl: '', page: '', notes: '', err: '', at: 0 };
function renderUpd() {
  const hasNew = upd.k === 'new';
  ['#cfgDot', '#cfgDot2'].forEach(s => { const e = $(s); if (e) e.hidden = !hasNew; });
  const el = $('#updCard'); if (!el) return;
  const ic = { idle: 'i', busy: '<span class="spin">↻</span>', ok: '✓', new: '↓', err: '!' }[upd.k];
  const ver = APP_VERSION === 'dev' ? 'web' : APP_VERSION;
  const when = upd.at ? ` Verificado às ${new Date(upd.at).toTimeString().slice(0, 5)}.` : '';
  let status;
  if (!isNative) status = `<div class="status" data-k="ok"><span class="ic">✓</span><div>Você está usando a versão web, que é sempre a mais recente.${CFG.repo ? ` Para instalar o app no Android, <a href="https://github.com/${esc(CFG.repo)}/releases/latest" target="_blank" rel="noopener" style="color:var(--accent)">baixe o APK</a>.` : ''}</div></div>`;
  else status = `<div class="status" data-k="${upd.k}"><span class="ic">${ic}</span><div>${esc(upd.msg || 'Toque em "Procurar atualização" para ver se há uma versão nova.')}${upd.k === 'ok' || upd.k === 'new' ? esc(when) : ''}
    ${upd.k === 'new' && upd.notes ? `<pre>${esc(upd.notes)}</pre>` : ''}${upd.k === 'err' && upd.err ? `<pre>${esc(upd.err)}</pre>` : ''}</div></div>`;
  el.innerHTML = `<div class="row2"><span>Versão instalada</span><b>${esc(ver)}</b></div>${status}
    ${isNative ? `<div class="btnrow"><button class="btn ${hasNew ? 'ghost' : 'primary'}" type="button" id="updCheck" ${upd.k === 'busy' ? 'disabled' : ''}>${upd.k === 'busy' ? 'Procurando…' : 'Procurar atualização'}</button>
      ${hasNew ? '<button class="btn primary" type="button" id="updGet">Baixar e instalar</button>' : ''}
      ${hasNew && upd.page ? '<button class="btn ghost" type="button" id="updPage">Abrir página da versão</button>' : ''}</div>
      ${hasNew ? '<p>Depois de baixar, abra o arquivo e toque em Instalar. Seu progresso continua.</p>' : ''}` : ''}`;
  const c = $('#updCheck'); if (c) c.onclick = () => checkUpdate(true);
  const g = $('#updGet'); if (g) g.onclick = () => { openExternal(upd.apkUrl); toast('Baixando… abra o arquivo quando terminar.'); };
  const p = $('#updPage'); if (p) p.onclick = () => openExternal(upd.page);
}
async function fetchRelease() {
  const url = `https://api.github.com/repos/${CFG.repo}/releases/latest`, hdr = { 'Accept': 'application/vnd.github+json' };
  try {
    const ctl = window.AbortController ? new AbortController() : null;
    const t = setTimeout(() => ctl && ctl.abort(), 15000);
    try {
      const r = await fetch(url, { headers: hdr, cache: 'no-store', signal: ctl ? ctl.signal : undefined });
      return { status: r.status, data: r.ok ? await r.json() : null };
    } finally { clearTimeout(t); }
  } catch (e) {
    // plano B no app: usa direto o plugin de rede do Capacitor
    const H = CAP && CAP.Plugins && CAP.Plugins.CapacitorHttp;
    if (isNative && H && H.get) { const r = await H.get({ url, headers: hdr }); return { status: r.status, data: r.status === 200 ? r.data : null }; }
    throw e;
  }
}
async function checkUpdate(manual) {
  if (upd.k === 'busy') return;
  if (!CFG.repo) { upd = { ...upd, k: 'err', msg: 'Repositório não configurado.' }; renderUpd(); return; }
  const before = upd; upd = { ...upd, k: 'busy', msg: 'Procurando versão nova…', err: '' }; renderUpd();
  try {
    const r = await fetchRelease();
    if (r.status === 404) upd = { k: 'ok', msg: 'Nenhuma versão publicada ainda.', at: Date.now() };
    else if (!r.data) throw new Error('O GitHub respondeu com o código ' + r.status);
    else {
      const rel = r.data, latest = String(rel.tag_name || '').replace(/^v/, '');
      const apk = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
      if (APP_VERSION !== 'dev' && latest && apk && cmpVer(latest, APP_VERSION) > 0)
        upd = { k: 'new', msg: `Versão ${latest} disponível (você tem a ${APP_VERSION}).`, latest, apkUrl: apk.browser_download_url, page: rel.html_url || '', notes: String(rel.body || '').trim().slice(0, 600), at: Date.now() };
      else upd = { k: 'ok', msg: `Você já está na versão mais recente (${APP_VERSION}).`, at: Date.now() };
    }
  } catch (e) {
    upd = { k: 'err', msg: 'Não consegui verificar agora. Confira a internet e tente de novo.', err: String((e && e.message) || e), at: 0 };
    if (!manual) upd = before.k === 'busy' ? { ...before, k: 'idle' } : before;
  }
  renderUpd();
  if (manual) toast(upd.msg);
}
if (isNative) checkUpdate(false);
renderUpd();

const h0 = (location.hash || '').slice(1);
route = BY[h0] || h0 === 'config' ? { v: h0 } : { v: 'inicio' };
render();


/* ---------- Botões da barra e do menu ---------- */
$('#navCfg').onclick = () => go('config');
$('#navSim').onclick = () => { if (!sim) newSim(); go('simulado'); };
$('#topCfg').onclick = () => go('config');
$('#topSearch').onclick = () => { openMenu(); setTimeout(() => $('#q').focus(), 260); };

/* deslizar para os lados troca de tópico (sem marcar como estudado) */
let tx = 0, ty = 0;
$('#main').addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
$('#main').addEventListener('touchend', e => {
  if (!BY[route.v] || route.t === 'quiz' || e.target.closest('.tbl, input, textarea')) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 90 || Math.abs(dx) < Math.abs(dy) * 2) return;
  const m = BY[route.v], ti = last[route.v] ?? 0;
  if (dx < 0 && ti < m.topics.length - 1) go(route.v, ti + 1);
  else if (dx > 0 && ti > 0) go(route.v, ti - 1);
}, { passive: true });
</script>
