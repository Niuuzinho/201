<title>Caderno do Cargo 201</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('c201.prefs') || '{}'), t = p.theme || 'auto';
    if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    if (p.font) document.documentElement.dataset.font = p.font;
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: fichário de estudo. Índice com abas coloridas à esquerda, folha de leitura à direita, um tópico por vez. */
:root {
  --paper: #F3F5F8;
  --sheet: #FFFFFF;
  --ink: #18202F;
  --muted: #5A6476;
  --line: #DCE1E9;
  --soft: #E9EDF3;
  --accent: #2446C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FB;
  --hl: rgba(255, 210, 0, .5);
  --ok: #157A4E;
  --ok-soft: #DDF3E7;
  --bad: #B83D12;
  --bad-soft: #FBE6DC;
  --tab-ink: #18202F;
  --t-portugues: #FFD3A6;
  --t-informatica: #A9E4F5;
  --t-adm-publica: #C9BCFF;
  --t-direito-adm: #FFC4C4;
  --t-administracao: #B8EFC6;
  --t-gestao-pessoas: #FDC2DD;
  --t-materiais: #FFE88F;
  --t-arquivologia: #CFE6A0;
  --t-atendimento: #B5D4FF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --read-size: 1.0625rem;
  --read-lh: 1.7;
  --shadow: 0 10px 30px -18px rgba(10, 20, 40, .4);
  --radius: 10px;
}
/* Temas: o JS sempre grava data-theme no <html> (o "automático" vira claro ou escuro conforme o aparelho). */
:root[data-theme="dark"] {
  --paper: #0E121A; --sheet: #161B26; --ink: #E4E8EF; --muted: #9AA3B4; --line: #283041; --soft: #1D2330;
  --accent: #86A2FF; --accent-ink: #0E121A; --accent-soft: #1F2A4A; --hl: rgba(250, 204, 21, .26);
  --ok: #5BD69A; --ok-soft: #12301F; --bad: #FF9A6B; --bad-soft: #3A1E12; color-scheme: dark;
}
:root[data-theme="sepia"] {
  --paper: #F1E7D0; --sheet: #FBF5E6; --ink: #3B2F20; --muted: #7A6A52; --line: #DFD1B1; --soft: #EADDC0;
  --accent: #9A4A12; --accent-ink: #FFF8EA; --accent-soft: #F0DDBB; --hl: rgba(214, 150, 40, .38);
  --ok: #3E7A32; --ok-soft: #E1ECC9; --bad: #A8381A; --bad-soft: #F3D9C6;
}
:root[data-theme="ocean"] {
  --paper: #0A1520; --sheet: #112131; --ink: #DCE8F5; --muted: #8DA5BD; --line: #223649; --soft: #182B3D;
  --accent: #5CC8FF; --accent-ink: #06121C; --accent-soft: #14354D; --hl: rgba(92, 200, 255, .22);
  --ok: #5BD69A; --ok-soft: #123324; --bad: #FF9A6B; --bad-soft: #3A1E12; color-scheme: dark;
}
:root[data-theme="forest"] {
  --paper: #0E1912; --sheet: #15241B; --ink: #E1EEE5; --muted: #94AD9D; --line: #25392D; --soft: #1B2D22;
  --accent: #6EE7A1; --accent-ink: #06150C; --accent-soft: #1C3A29; --hl: rgba(190, 230, 90, .22);
  --ok: #8BE28F; --ok-soft: #173A20; --bad: #FFA17A; --bad-soft: #3A2012; color-scheme: dark;
}
:root[data-theme="amoled"] {
  --paper: #000000; --sheet: #0B0B0C; --ink: #EDEDED; --muted: #9B9B9B; --line: #232325; --soft: #151517;
  --accent: #8AB4FF; --accent-ink: #000; --accent-soft: #14233F; --hl: rgba(250, 204, 21, .26);
  --ok: #5BD69A; --ok-soft: #0D2A1A; --bad: #FF9A6B; --bad-soft: #301810; color-scheme: dark;
}
:root[data-theme="contrast"] {
  --paper: #FFFFFF; --sheet: #FFFFFF; --ink: #000000; --muted: #222222; --line: #000000; --soft: #E7E7E7;
  --accent: #0A2FBF; --accent-ink: #FFFFFF; --accent-soft: #DCE3FF; --hl: rgba(255, 221, 0, .85);
  --ok: #005A2B; --ok-soft: #D4F5E2; --bad: #A21A00; --bad-soft: #FFE1D6;
}
:root[data-font="sans"] { --f-read: "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
:root[data-hl="off"] .read strong { background: none; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-display); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app {
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px;
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}

/* ---------- Índice ---------- */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
.brand small { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand strong { font-weight: 800; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
.search { position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sheet); color: var(--ink); font: inherit; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.navgroup { display: flex; flex-direction: column; gap: 4px; }
.navgroup h3 { margin: 0 0 4px; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.navitem { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.navitem:hover { background: var(--soft); }
.navitem[aria-current="page"] { background: var(--sheet); box-shadow: 0 0 0 1px var(--line); }
.navitem .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--tab); }
.navitem .nm { font-weight: 500; font-size: 14px; line-height: 1.25; }
.navitem .ct { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.navitem .ct.full { color: var(--ok); }
.homebtn { font-weight: 500; }
.sidefoot { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.sync { display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
.sync i { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
.sync[data-state="ok"] i { background: var(--ok); }
.sync[data-state="saving"] i { background: var(--accent); }
.sync[data-state="err"] i { background: var(--bad); }
.account { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius); background: var(--sheet); border: 1px solid var(--line); }
.account .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.account .who > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.account img { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); flex: none; }
.account b { font-size: 15px; overflow-wrap: anywhere; }
.account .sync { font-size: 12.5px; color: var(--muted); }
.account .pitch { margin: 0; font-size: 13.5px; color: var(--muted); }
.account .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.account .btn { padding: 8px 14px; }
.mini { padding: 6px 10px; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
.appbox a { color: var(--accent); }
.appbox { display: flex; flex-direction: column; gap: 8px; }
.appbox .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.code { font-family: var(--f-mono); font-size: clamp(30px, 8vw, 44px); font-weight: 500; letter-spacing: .12em; padding: 14px 18px; border-radius: var(--radius); background: var(--soft); align-self: flex-start; user-select: all; }
.steps { margin: 0; padding-left: 1.3em; font-family: var(--f-read); font-size: var(--read-size); line-height: 1.7; }
.sizectl { display: flex; align-items: center; gap: 6px; }
.sizectl button { width: 32px; height: 28px; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; cursor: pointer; font-weight: 700; }

/* ---------- Barra superior (celular) ---------- */
.topbar { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); max-width: min(92vw, 420px); padding: 12px 16px; border-radius: 10px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.topacts { display: flex; gap: 6px; }
.scrim { display: none; }
.tabbar { display: none; }

/* ---------- Área principal ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h1, h2 { text-wrap: balance; }

/* Início */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.hero h1 { margin: 0; font-weight: 800; font-size: clamp(30px, 4.6vw, 46px); line-height: 1.02; letter-spacing: -.035em; max-width: 18ch; }
.hero p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 16px; }
.meter { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
.meter .big { font-weight: 800; font-size: 28px; letter-spacing: -.02em; }
.bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.continue { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--radius); background: var(--accent-soft); }
.continue div { display: flex; flex-direction: column; min-width: 0; }
.continue b { font-size: 15.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--sheet); border-color: var(--line); color: var(--ink); }
.btn.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn:disabled { opacity: .4; cursor: default; }

.sectionhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 10px; }
.sectionhead h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 16px; }
.folder { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; padding-top: 18px; border-radius: 0 var(--radius) var(--radius) var(--radius); background: var(--sheet); border: 1px solid var(--line); cursor: pointer; text-align: left; margin-top: 14px; transition: transform .15s ease, box-shadow .15s ease; }
.folder::before { content: attr(data-tab); position: absolute; left: -1px; top: -24px; height: 24px; padding: 3px 12px 0; border-radius: 8px 8px 0 0; background: var(--tab); color: var(--tab-ink); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.folder:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -10px rgba(10, 20, 40, .35); }
.folder h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.folder .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.folder .bar { height: 6px; }
.folder .bar > i { background: var(--ink); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.note { padding: 16px 18px; border-radius: var(--radius); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.note h3 { margin: 0; font-size: 15px; font-weight: 700; }
.note p, .note ul { margin: 0; font-family: var(--f-read); font-size: 15px; line-height: 1.6; }
.note ul { padding-left: 18px; }
.note s { color: var(--bad); }
.note ins { text-decoration: none; color: var(--bad); font-weight: 600; }

/* Matéria */
.mhead { display: flex; flex-direction: column; gap: 10px; }
.tabchip { align-self: flex-start; padding: 3px 10px; border-radius: 6px; background: var(--tab); color: var(--tab-ink); font-family: var(--f-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; }
.mhead h1 { margin: 0; font-size: clamp(26px, 3.6vw, 36px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.mhead p { margin: 0; color: var(--muted); max-width: 62ch; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-width: 38px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.pill[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pill.quiz { font-family: var(--f-display); font-weight: 700; }

.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 40px); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sheet .kicker { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sheet h2 { margin: 0; font-size: clamp(22px, 2.8vw, 28px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.read { font-family: var(--f-read); font-size: var(--read-size); line-height: var(--read-lh); max-width: 68ch; min-width: 0; }
.read > * { margin: 0 0 1em; }
.read > *:last-child { margin-bottom: 0; }
.read ul, .read ol { padding-left: 1.3em; }
.read li { margin-bottom: .45em; }
.read li > p { margin: 0; }
.read strong { font-weight: 600; background: linear-gradient(transparent 58%, var(--hl) 58%); padding: 0 1px; }
.read em { font-style: italic; }
.read a { color: var(--accent); }
.read code { font-family: var(--f-mono); font-size: .88em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
.read table { border-collapse: collapse; width: 100%; font-size: .9em; line-height: 1.45; }
.read th { text-align: left; font-family: var(--f-display); font-weight: 700; font-size: .86em; letter-spacing: .02em; background: var(--soft); }
.read th, .read td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.read tr:last-child td { border-bottom: 0; }
.read td:first-child { font-weight: 600; }
.read mark { background: var(--hl); color: inherit; padding: 0 1px; border-radius: 2px; }
.sheetfoot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.sheetfoot .nav { display: flex; gap: 8px; }

/* Quiz */
.qlist { display: flex; flex-direction: column; gap: 22px; }
.q { display: flex; flex-direction: column; gap: 10px; }
.q p.stem { margin: 0; font-family: var(--f-read); font-size: var(--read-size); line-height: 1.55; }
.q p.stem b { font-family: var(--f-mono); font-weight: 500; font-size: .8em; color: var(--muted); margin-right: 6px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 15px; }
.opt span:first-child { font-family: var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.exp { margin: 0; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--soft); }
.exp b.r { color: var(--ok); } .exp b.w { color: var(--bad); }
.score { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }

/* Busca */
.results { display: flex; flex-direction: column; gap: 10px; }
.hit { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--sheet); border: 1px solid var(--line); text-align: left; cursor: pointer; }
.hit:hover { border-color: var(--accent); }
.hit .where { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.hit .where i { width: 10px; height: 10px; border-radius: 3px; background: var(--tab); }
.hit b { font-size: 15.5px; }
.hit p { margin: 0; font-family: var(--f-read); font-size: 14px; color: var(--muted); }
.hit mark { background: var(--hl); color: var(--ink); }
.empty { color: var(--muted); }


/* ---------- Ícones, avisos e destaques ---------- */
.iconbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; cursor: pointer; }
.iconbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot-badge { position: absolute; top: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); border: 2px solid var(--sheet); }
.dot-badge.inline { position: static; display: inline-block; margin-right: 6px; vertical-align: middle; }
.navitem .ct { display: inline-flex; align-items: center; }

/* Caixas dentro do texto (Macete, Cai em prova, Atenção, Exemplo) */
.read blockquote { margin: 0 0 1em; padding: 12px 16px; border-radius: 10px; background: var(--soft); border-left: 4px solid var(--muted); font-size: .96em; line-height: 1.6; }
.read blockquote > *:last-child { margin-bottom: 0; }
.read blockquote p { margin: 0 0 .5em; }
.read blockquote strong:first-child { background: none; font-family: var(--f-display); font-size: .78em; letter-spacing: .07em; text-transform: uppercase; }
.read blockquote.tip { background: var(--ok-soft); border-color: var(--ok); }
.read blockquote.tip strong:first-child { color: var(--ok); }
.read blockquote.exam { background: var(--accent-soft); border-color: var(--accent); }
.read blockquote.exam strong:first-child { color: var(--accent); }
.read blockquote.warn { background: var(--bad-soft); border-color: var(--bad); }
.read blockquote.warn strong:first-child { color: var(--bad); }
.read h4 { font-family: var(--f-display); font-size: 1.02em; font-weight: 800; letter-spacing: -.01em; margin: 1.3em 0 .4em; }
.read h4:first-child { margin-top: 0; }

/* Início renovado */
.hero { position: relative; padding: clamp(20px, 4vw, 34px); border-radius: 18px; background: linear-gradient(135deg, var(--accent-soft), var(--sheet) 70%); border: 1px solid var(--line); box-shadow: var(--shadow); }
.hero h1 { max-width: 20ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--line); }

<script>
const DATA = /*__DATA__*/null;
const BY = Object.fromEntries(DATA.map(m => [m.id, m]));
const TOTAL = DATA.reduce((s, m) => s + m.topics.length, 0);

const store = {
  get(k, d) { try { const v = localStorage.getItem('c201.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) {
    try { localStorage.setItem('c201.' + k, JSON.stringify(v)); } catch (e) {}
    if (SYNCED.includes(k)) { try { localStorage.setItem('c201.updatedAt', String(Date.now())); } catch (e) {} scheduleCloud(); }
  }
};
const SYNCED = ['done', 'last', 'lastSeen', 'quiz', 'fav'];
let cloudRef = null, writing = false, again = false, wt = null, applying = false;
let done = new Set(store.get('done', []));
let last = store.get('last', {});        // { materiaId: topicIndex }
let lastSeen = store.get('lastSeen', null); // { m, t }
let fs = store.get('fs', 1.0625);
let quizState = store.get('quiz', {}); // respostas do teste, por matéria

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const key = (m, i) => m + ':' + i;
const countDone = m => BY[m].topics.reduce((s, _, i) => s + (done.has(key(m, i)) ? 1 : 0), 0);
const allDone = () => DATA.reduce((s, m) => s + countDone(m.id), 0);
const tabVar = id => `var(--t-${id})`;

function saveDone() { store.set('done', [...done]); }
function applyFs() { document.documentElement.style.setProperty('--read-size', fs + 'rem'); }
applyFs();

/* ---------- Preferências: tema, cor, fonte, leitura ---------- */
const THEMES = [
  { id: 'auto', nome: 'Automático', bg: 'linear-gradient(135deg,#F3F5F8 50%,#0E121A 50%)', ink: '#888888', ac: '#2446C4' },
  { id: 'light', nome: 'Claro', bg: '#F3F5F8', ink: '#18202F', ac: '#2446C4' },
  { id: 'sepia', nome: 'Sépia', bg: '#F1E7D0', ink: '#3B2F20', ac: '#9A4A12' },
  { id: 'dark', nome: 'Escuro', bg: '#0E121A', ink: '#E4E8EF', ac: '#86A2FF' },
  { id: 'ocean', nome: 'Oceano', bg: '#0A1520', ink: '#DCE8F5', ac: '#5CC8FF' },
  { id: 'forest', nome: 'Floresta', bg: '#0E1912', ink: '#E1EEE5', ac: '#6EE7A1' },
  { id: 'amoled', nome: 'Preto total', bg: '#000000', ink: '#EDEDED', ac: '#8AB4FF' },
  { id: 'contrast', nome: 'Alto contraste', bg: '#FFFFFF', ink: '#000000', ac: '#0A2FBF' },
];
const DARKS = ['dark', 'ocean', 'forest', 'amoled'];
const ACCENTS = [
  { id: 'azul', nome: 'Azul', l: '#2446C4', d: '#86A2FF' },
  { id: 'violeta', nome: 'Violeta', l: '#6B3FD4', d: '#B79CFF' },
  { id: 'verde', nome: 'Verde', l: '#157A4E', d: '#5BD69A' },
  { id: 'laranja', nome: 'Laranja', l: '#C2540A', d: '#FFA566' },
  { id: 'rosa', nome: 'Rosa', l: '#C2185B', d: '#FF8DB8' },
  { id: 'turquesa', nome: 'Turquesa', l: '#0A7C86', d: '#5AD8E3' },
];
let prefs = Object.assign({ theme: 'auto', accent: '', font: 'serif', lh: 1.7, hl: true, auto: true, exam: '' }, store.get('prefs', {}));
const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const lum = h => { const n = parseInt(h.slice(1), 16); const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
function applyPrefs() {
  const r = document.documentElement;
  const th = prefs.theme === 'auto' ? (darkMQ && darkMQ.matches ? 'dark' : 'light') : prefs.theme;
  r.dataset.theme = th; r.dataset.font = prefs.font; r.dataset.hl = prefs.hl ? 'on' : 'off';
  r.style.setProperty('--read-lh', prefs.lh);
  const acc = ACCENTS.find(a => a.id === prefs.accent);
  if (acc && th !== 'contrast') {
    const c = DARKS.includes(th) ? acc.d : acc.l;
    r.style.setProperty('--accent', c);
    r.style.setProperty('--accent-ink', lum(c) > .4 ? '#0E121A' : '#FFFFFF');
    r.style.setProperty('--accent-soft', `color-mix(in srgb, ${c} 16%, var(--sheet))`);
  } else ['--accent', '--accent-ink', '--accent-soft'].forEach(p => r.style.removeProperty(p));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(r).getPropertyValue('--paper').trim() || '#F3F5F8';
}
function savePrefs() { store.set('prefs', prefs); applyPrefs(); }
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', () => { if (prefs.theme === 'auto') applyPrefs(); });
applyPrefs();

/* sequência de dias estudados e revisão */
let days = store.get('days', []);
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function markDay() { const k = dayKey(new Date()); if (!days.includes(k)) { days.push(k); days = days.slice(-400); store.set('days', days); } }
function streak() {
  const set = new Set(days), d = new Date();
  if (!set.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
let fav = new Set(store.get('fav', []));

/* ---------- Índice lateral ---------- */
function renderNav(current) {
  for (const [gid, bloco] of [['#navComum', 'Comum'], ['#navEsp', 'Específico']]) {
    const g = $(gid);
    g.querySelectorAll('.navitem').forEach(n => n.remove());
    DATA.filter(m => m.bloco === bloco).forEach(m => {
      const n = countDone(m.id), t = m.topics.length;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'navitem';
      if (current === m.id) b.setAttribute('aria-current', 'page');
      b.innerHTML = `<span class="dot" style="--tab:${tabVar(m.id)}"></span><span class="nm">${esc(m.nome)}</span><span class="ct${n === t ? ' full' : ''}">${n}/${t}</span>`;
      b.onclick = () => go(m.id);
      g.appendChild(b);
    });
  }
  [['#tbHome', 'inicio'], ['#tbSim', 'simulado'], ['#tbCfg', 'config']].forEach(([id, v]) => { const e = $(id); if (current === v) e.setAttribute('aria-current', 'page'); else e.removeAttribute('aria-current'); });
  if (BY[current]) $('#tbMenu').setAttribute('aria-current', 'page'); else $('#tbMenu').removeAttribute('aria-current');
  [['#navHome', 'inicio'], ['#navSim', 'simulado'], ['#navCfg', 'config']].forEach(([id, v]) => { const e = $(id); if (current === v) e.setAttribute('aria-current', 'page'); else e.removeAttribute('aria-current'); });
  $('#navHomeCt').textContent = `${allDone()}/${TOTAL}`;
}

/* ---------- Início ---------- */
function quizStats() {
  let a = 0, r = 0;
  DATA.forEach(m => { const st = quizState[m.id] || {}; Object.entries(st).forEach(([i, v]) => { if (m.quiz[i]) { a++; if (m.quiz[i].a === v) r++; } }); });
  return { a, r };
}
function daysToExam() {
  if (!prefs.exam) return null;
  const d = Math.ceil((new Date(prefs.exam + 'T00:00:00') - new Date()) / 864e5);
  return isNaN(d) || d < 0 ? null : d;
}
function renderHome() {
  const n = allDone(), pct = Math.round(n / TOTAL * 100);
  const hr = new Date().getHours(), hi = hr < 5 ? 'Boa madrugada' : hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite';
  const qs = quizStats(), de = daysToExam(), sk = streak();
  let cont = '';
  if (lastSeen && BY[lastSeen.m] && BY[lastSeen.m].topics[lastSeen.t]) {
    const m = BY[lastSeen.m], t = m.topics[lastSeen.t];
    cont = `<div class="continue"><div><span class="eyebrow">Continue de onde parou</span><b>${esc(m.nome)} · ${esc(t.num)}. ${esc(t.title)}</b></div><button class="btn primary" type="button" id="contBtn">Continuar</button></div>`;
  }
  const folder = m => {
    const d = countDone(m.id), t = m.topics.length;
    return `<button class="folder" type="button" data-go="${m.id}" data-tab="${m.bloco}" style="--tab:${tabVar(m.id)}">
      <h3>${esc(m.nome)}</h3>
      <div class="meta"><span>${t} tópicos · ${m.quiz.length} questões</span><span>${d}/${t}</span></div>
      <div class="bar"><i style="width:${Math.round(d / t * 100)}%"></i></div></button>`;
  };
  const favs = [...fav].map(k => { const [m, i] = k.split(':'); return BY[m] && BY[m].topics[+i] ? { m, i: +i, t: BY[m].topics[+i] } : null; }).filter(Boolean);
  const review = favs.length ? `<div class="sectionhead"><h2>Para revisar</h2><span class="eyebrow">${favs.length} marcado${favs.length > 1 ? 's' : ''}</span></div>
    <div class="reviewlist">${favs.slice(0, 8).map(x => `<button type="button" class="hit" data-m="${x.m}" data-i="${x.i}" style="--tab:${tabVar(x.m)}"><span class="where"><i></i>${esc(BY[x.m].nome)} · tópico ${esc(x.t.num)}</span><b>${esc(x.t.title)}</b></button>`).join('')}</div>` : '';
  $('#main').innerHTML = `
    <section class="hero">

/* ---------- Matéria ---------- */
const readMin = t => Math.max(1, Math.round(t.text.split(/\s+/).length / 190));
function renderMateria(mid, ti) {
  const m = BY[mid];
  if (ti === undefined) ti = last[mid] ?? 0;
  const isQuiz = ti === 'quiz';
  if (!isQuiz) { ti = Math.max(0, Math.min(m.topics.length - 1, +ti || 0)); last[mid] = ti; store.set('last', last); lastSeen = { m: mid, t: ti }; store.set('lastSeen', lastSeen); }
  const pills = m.topics.map((t, i) =>
    `<button type="button" class="pill${done.has(key(mid, i)) ? ' done' : ''}" data-i="${i}" aria-current="${!isQuiz && i === ti}" title="${esc(t.title)}">${esc(t.num)}</button>`).join('')
    + `<button type="button" class="pill quiz" data-i="quiz" aria-current="${isQuiz}">Teste rápido</button>`;
  const d = countDone(mid);
  let body;
  if (isQuiz) body = quizHtml(m);
  else {
    const t = m.topics[ti], k = key(mid, ti), isDone = done.has(k), isFav = fav.has(k);
    const hasNext = ti < m.topics.length - 1;
    body = `<article class="sheet" style="--tab:${tabVar(mid)}">
      <div class="kicker"><span class="eyebrow">Tópico ${esc(t.num)} · ${ti + 1} de ${m.topics.length}</span><span class="eyebrow">${readMin(t)} min de leitura</span></div>
      <h2>${esc(t.title)}</h2>
      <div class="read">${t.html}</div>
      <div class="sheetfoot">
        <div class="btnrow">
          <button class="btn ${isDone ? 'done' : 'ghost'}" type="button" id="doneBtn" aria-pressed="${isDone}">${isDone ? '✓ Estudado' : 'Marcar como estudado'}</button>
          <button class="btn fav${isFav ? ' on' : ''}" type="button" id="favBtn" aria-pressed="${isFav}">${isFav ? '★ Na revisão' : '☆ Revisar depois'}</button>
        </div>
        <div class="nav">
          <button class="btn ghost" type="button" id="prevBtn" ${ti === 0 ? 'disabled' : ''}>← Anterior</button>
          <button class="btn primary" type="button" id="nextBtn">${hasNext ? 'Próximo →' : 'Fazer o teste →'}</button>
        </div>
      </div></article>`;
  }
  $('#main').innerHTML = `
    <section class="mhead" style="--tab:${tabVar(mid)}">
      <span class="tabchip">Conhecimento ${m.bloco.toLowerCase()}</span>
      <h1>${esc(m.nome)}</h1>
      ${m.lead ? `<p>${esc(m.lead)}</p>` : ''}
      <div class="msub"><div class="bar"><i style="width:${Math.round(d / m.topics.length * 100)}%"></i></div><span>${d}/${m.topics.length} estudados</span></div>
    </section>
    <nav class="pills" aria-label="Tópicos">${pills}</nav>
    ${body}`;
  document.querySelectorAll('.pill').forEach(p => p.onclick = () => go(mid, p.dataset.i === 'quiz' ? 'quiz' : +p.dataset.i));
  if (isQuiz) { bindQuiz(m); return; }
  $('#doneBtn').onclick = () => { const k = key(mid, ti); done.has(k) ? done.delete(k) : (done.add(k), markDay()); saveDone(); renderNav(mid); renderMateria(mid, ti); };
  $('#favBtn').onclick = () => { const k = key(mid, ti); fav.has(k) ? fav.delete(k) : fav.add(k); store.set('fav', [...fav]); renderMateria(mid, ti); };
  $('#prevBtn').onclick = () => go(mid, ti - 1);
  $('#nextBtn').onclick = () => {
    if (prefs.auto) { done.add(key(mid, ti)); markDay(); saveDone(); }
    go(mid, ti < m.topics.length - 1 ? ti + 1 : 'quiz');
  };
}

/* ---------- Teste rápido ---------- */
function quizHtml(m) {
  const st = quizState[m.id] || (quizState[m.id] = {});
  const answered = Object.keys(st).length, right = Object.entries(st).filter(([i, a]) => m.quiz[i].a === a).length;
  const L = 'ABCD';
  const qs = m.quiz.map((q, i) => {
    const a = st[i];
    const opts = q.opts.map((o, j) => {
      let cls = '';
      if (a !== undefined) { if (j === q.a) cls = ' right'; else if (j === a) cls = ' wrong'; }
      return `<button type="button" class="opt${cls}" data-q="${i}" data-o="${j}" ${a !== undefined ? 'disabled' : ''}><span>${L[j]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    const exp = a === undefined ? '' : `<p class="exp">${a === q.a ? '<b class="r">Certo.</b>' : '<b class="w">Não foi dessa vez.</b>'} ${esc(q.exp)}</p>`;
    return `<div class="q"><p class="stem"><b>${String(i + 1).padStart(2, '0')}</b>${esc(q.q)}</p><div class="opts">${opts}</div>${exp}</div>`;
  }).join('');
  return `<article class="sheet">
    <div class="score"><h2>Teste rápido</h2><span class="eyebrow">${answered ? `${right} de ${answered} acertos` : `${m.quiz.length} questões`}</span></div>
    <div class="qlist">${qs}</div>
    <div class="sheetfoot"><button class="btn ghost" type="button" id="resetQuiz">Refazer o teste</button>
      <div class="nav"><button class="btn primary" type="button" id="backTop">Voltar ao primeiro tópico</button></div></div>
  </article>`;
}
function bindQuiz(m) {
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    quizState[m.id][b.dataset.q] = +b.dataset.o; markDay();
    store.set('quiz', quizState);
    const y = window.scrollY; renderMateria(m.id, 'quiz'); window.scrollTo(0, y);
  });
  $('#resetQuiz').onclick = () => { quizState[m.id] = {}; store.set('quiz', quizState); renderMateria(m.id, 'quiz'); };
  $('#backTop').onclick = () => go(m.id, 0);
}

/* ---------- Simulado misto ---------- */
let sim = null;
function newSim() {
  const pool = [];
  DATA.forEach(m => m.quiz.forEach((q, i) => pool.push({ m: m.id, i, q })));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  sim = { qs: pool.slice(0, Math.min(20, pool.length)), ans: {} };
}
function renderSimulado() {
  if (!sim) newSim();
  const L = 'ABCD', n = sim.qs.length;
  const answered = Object.keys(sim.ans).length;
  const right = Object.entries(sim.ans).filter(([i, a]) => sim.qs[i].q.a === a).length;
  const qs = sim.qs.map((x, i) => {
    const a = sim.ans[i];
    const opts = x.q.opts.map((o, j) => {
      let cls = '';
      if (a !== undefined) { if (j === x.q.a) cls = ' right'; else if (j === a) cls = ' wrong'; }
      return `<button type="button" class="opt${cls}" data-sq="${i}" data-o="${j}" ${a !== undefined ? 'disabled' : ''}><span>${L[j]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    const exp = a === undefined ? '' : `<p class="exp">${a === x.q.a ? '<b class="r">Certo.</b>' : '<b class="w">Não foi dessa vez.</b>'} ${esc(x.q.exp)}</p>`;
    return `<div class="q"><p class="stem"><b>${String(i + 1).padStart(2, '0')}</b>${esc(x.q.q)}</p><span class="tabchip" style="--tab:${tabVar(x.m)};align-self:flex-start">${esc(BY[x.m].nome)}</span><div class="opts">${opts}</div>${exp}</div>`;
  }).join('');
  let resumo = '';
  if (answered === n) {
    const by = {};
    sim.qs.forEach((x, i) => { const o = by[x.m] || (by[x.m] = { t: 0, r: 0 }); o.t++; if (sim.ans[i] === x.q.a) o.r++; });
    resumo = `<div class="card"><h2>Resultado: ${right} de ${n} (${Math.round(right / n * 100)}%)</h2>
      <p>${Object.entries(by).map(([id, o]) => `${esc(BY[id].nome)}: ${o.r}/${o.t}`).join(' · ')}</p></div>`;
  }
  $('#main').innerHTML = `<section class="mhead"><span class="tabchip" style="--tab:var(--accent);color:var(--accent-ink)">Simulado</span><h1>Simulado misto</h1>
    <p>${n} questões sorteadas de todas as matérias. ${answered ? `${right} de ${answered} acertos até agora.` : 'Responda e veja o gabarito na hora.'}</p></section>
    ${resumo}
    <article class="sheet"><div class="qlist">${qs}</div>
      <div class="sheetfoot"><button class="btn ghost" type="button" id="simNew">Novo simulado</button><div class="nav"><button class="btn primary" type="button" id="simHome">Voltar ao início</button></div></div></article>`;
  document.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => {
    sim.ans[b.dataset.sq] = +b.dataset.o; markDay();
    const y = window.scrollY; renderSimulado(); window.scrollTo(0, y);
  });
  $('#simNew').onclick = () => { newSim(); renderSimulado(); window.scrollTo(0, 0); };
  $('#simHome').onclick = () => go('inicio');
}

/* ---------- Busca ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const INDEX = [];
DATA.forEach(m => m.topics.forEach((t, i) => INDEX.push({ m: m.id, i, t, hay: norm(t.title + ' ' + t.text) })));
function renderSearch(q) {
  const nq = norm(q.trim());
  const hits = nq.length < 2 ? [] : INDEX.filter(x => x.hay.includes(nq));
  const snip = x => {
    const p = norm(x.t.text).indexOf(nq);
    if (p < 0) return esc(x.t.text.slice(0, 140)) + '…';
    const s = Math.max(0, p - 60), e = Math.min(x.t.text.length, p + nq.length + 90);
    return (s ? '…' : '') + esc(x.t.text.slice(s, p)) + '<mark>' + esc(x.t.text.slice(p, p + nq.length)) + '</mark>' + esc(x.t.text.slice(p + nq.length, e)) + (e < x.t.text.length ? '…' : '');
  };
  $('#main').innerHTML = `<section class="mhead"><span class="eyebrow">Busca</span><h1>“${esc(q.trim())}”</h1>
    <p>${hits.length ? `${hits.length} tópico${hits.length > 1 ? 's' : ''} encontrado${hits.length > 1 ? 's' : ''}.` : ''}</p></section>
    <div class="results">${hits.length ? hits.map(x => `<button type="button" class="hit" data-m="${x.m}" data-i="${x.i}" style="--tab:${tabVar(x.m)}">
      <span class="where"><i></i>${esc(BY[x.m].nome)} · tópico ${esc(x.t.num)}</span><b>${esc(x.t.title)}</b><p>${snip(x)}</p></button>`).join('')
      : `<p class="empty">${nq.length < 2 ? 'Digite pelo menos 2 letras.' : 'Nada encontrado. Tente outra palavra, como “prazo”, “lei” ou “estoque”.'}</p>`}</div>`;
  document.querySelectorAll('.hit').forEach(h => h.onclick = () => { $('#q').value = ''; go(h.dataset.m, +h.dataset.i); });
  renderNav(null);
}

/* ---------- Navegação ---------- */
let route = { v: 'inicio' };
let menuOpen = false;
const sameRoute = (a, b) => a.v === b.v && String(a.t ?? '') === String(b.t ?? '');
const hashFor = v => '#' + (BY[v] || v === 'config' || v === 'simulado' ? v : 'inicio');
// Cada tela nova entra no histórico, então o botão voltar do celular volta de verdade.
// Trocar de tópico dentro da mesma matéria não cria tela nova.
function go(v, t) {
  const prev = route, st = history.state || {};
  route = { v, t };
  const replace = (BY[v] && prev.v === v) || sameRoute(prev, route) || st.menu;
  try { (replace ? history.replaceState : history.pushState).call(history, { v, t: t ?? null }, '', hashFor(v)); } catch (e) {}
  render(); setMenu(false); window.scrollTo(0, 0);
}
function render() {
  if (BY[route.v]) { renderNav(route.v); renderMateria(route.v, route.t); }
  else if (route.v === 'config') { renderNav('config'); renderConfig(); }
  else if (route.v === 'simulado') { renderNav('simulado'); renderSimulado(); }
  else { renderNav('inicio'); renderHome(); }
}
$('#brand').onclick = () => go('inicio');
$('#navHome').onclick = () => go('inicio');
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => v.trim() ? renderSearch(v) : render(), 120); });

function setMenu(on) { menuOpen = on; $('#side').classList.toggle('open', on); $('#scrim').classList.toggle('open', on); $('#tbMenu').setAttribute('aria-expanded', String(on)); }
// o menu aberto também é uma "tela" do histórico: o botão voltar só o fecha

function closeMenu() { if (!menuOpen) return; if (history.state && history.state.menu) history.back(); else setMenu(false); }
$('#scrim').onclick = closeMenu;
window.addEventListener('popstate', e => {

/* ---------- Conta GitHub: login por código e progresso num Gist secreto ---------- */
const CFG = window.APP_CONFIG || {};
const APP_VERSION = window.APP_VERSION || 'dev';
const GIST_FILE = 'caderno-201-progresso.json';
const GIST_DESC = 'Caderno 201 · progresso (não apague)';
const CAP = window.Capacitor;
const isNative = !!CAP && ((CAP.isNativePlatform && CAP.isNativePlatform()) || (CAP.getPlatform && CAP.getPlatform() !== 'web'));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let auth = store.get('auth', null); // { token, login, avatar, gistId }
let loginRun = 0;

function saveAuth() { try { localStorage.setItem('c201.auth', JSON.stringify(auth)); } catch (e) {} }
// No app, abre links no navegador do celular (aba do Chrome). Se o plugin falhar,
// navegar para um site externo também faz o Capacitor abrir o navegador.
function openExternal(url) {
  if (!isNative) { window.open(url, '_blank', 'noopener'); return; }
  let p = null;
  try {
    if (CAP.Plugins && CAP.Plugins.Browser && CAP.Plugins.Browser.open) p = CAP.Plugins.Browser.open({ url });
    else if (CAP.registerPlugin) p = CAP.registerPlugin('Browser').open({ url });
  } catch (e) { p = null; }
  if (p && p.catch) p.catch(() => { location.href = url; });
  else if (!p) location.href = url;
}
function setSync(state, text) { const s = $('#sync'); if (!s) return; s.dataset.state = state; $('#syncText').textContent = text; }
function renderAccount() {
  const on = !!(auth && auth.token);
  $('#who').hidden = !on; $('#pitch').hidden = on;
  $('#loginBtn').hidden = on; $('#logoutBtn').hidden = !on; $('#syncBtn').hidden = !on;
  if (on) { $('#login').textContent = '@' + (auth.login || 'github'); if (auth.avatar) $('#avatar').src = auth.avatar; }
  if (isNative && !CFG.clientId) { $('#loginBtn').disabled = true; $('#pitch').textContent = 'O login com GitHub ainda não foi configurado nesta versão. Seu progresso fica salvo neste aparelho.'; }
  else if (!isNative && !on) $('#pitch').textContent = 'Entre com o GitHub para ver aqui o mesmo progresso do app do celular.';
}

async function gh(path, opts = {}) {
  const headers = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (auth && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, { ...opts, headers, cache: 'no-store' });
  if (r.status === 401) { const e = new Error('auth'); e.code = 'auth'; throw e; }
  if (!r.ok) { const e = new Error('http ' + r.status); e.code = 'http'; e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}

function localState() {
  let u = 0; try { u = +localStorage.getItem('c201.updatedAt') || 0; } catch (e) {}
  return { done: [...done].sort(), fav: [...fav].sort(), last, lastSeen, quiz: quizState, updatedAt: u };
}
function applyRemote(r) {
  applying = true;
  done = new Set(Array.isArray(r.done) ? r.done : []);
  last = r.last || {}; lastSeen = r.lastSeen || null; quizState = r.quiz || {};
  fav = new Set(Array.isArray(r.fav) ? r.fav : []);
  try {
    localStorage.setItem('c201.done', JSON.stringify([...done]));
    localStorage.setItem('c201.last', JSON.stringify(last));
    localStorage.setItem('c201.lastSeen', JSON.stringify(lastSeen));
    localStorage.setItem('c201.quiz', JSON.stringify(quizState));
    localStorage.setItem('c201.fav', JSON.stringify([...fav]));
    localStorage.setItem('c201.updatedAt', String(r.updatedAt || Date.now()));
  } catch (e) {}
  applying = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

async function findGist() {
  if (auth.gistId) return auth.gistId;
  for (let page = 1; page <= 5; page++) {
    const list = await gh('/gists?per_page=100&page=' + page);
    const g = list.find(x => x.files && x.files[GIST_FILE]);
    if (g) return g.id;
    if (list.length < 100) break;
  }
  return null;
}
async function pullRemote() {
  const id = await findGist();
  if (!id) return null;
  let g;
  try { g = await gh('/gists/' + id); }
  catch (e) { if (e.status === 404) { auth.gistId = null; saveAuth(); return null; } throw e; }
  auth.gistId = id; saveAuth();
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let content = f.content;
  if (f.truncated) content = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  try { return JSON.parse(content); } catch (e) { return null; }
}
async function pushRemote() {
  const body = { description: GIST_DESC, files: { [GIST_FILE]: { content: JSON.stringify(localState(), null, 1) } } };
  if (auth.gistId) {
    try { await gh('/gists/' + auth.gistId, { method: 'PATCH', body: JSON.stringify(body) }); return; }
    catch (e) { if (e.status !== 404) throw e; auth.gistId = null; }
  }
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ ...body, public: false }) });
  auth.gistId = g.id; saveAuth();
}

const OK_TEXT = 'Progresso salvo no GitHub';
function syncError(e) {
  if (e && e.code === 'auth') { logout(); setSync('err', 'Sessão expirada. Entre de novo.'); return; }
  setSync('err', navigator.onLine === false ? 'Sem internet. Salvo no aparelho e envio depois.' : 'Não consegui falar com o GitHub. Salvo no aparelho.');
}
function scheduleCloud() {
  if (!auth || !auth.token || applying) return;
  setSync('saving', 'Salvando…');
  clearTimeout(wt); wt = setTimeout(flush, 2000);
}
async function flush() {
  if (!auth || !auth.token) return;
  if (writing) { again = true; return; }
  writing = true;
  try { await pushRemote(); setSync('ok', OK_TEXT); } catch (e) { syncError(e); }
  writing = false;
  if (again) { again = false; flush(); }
}
let syncing = false;
async function syncNow() {
  if (!auth || !auth.token || syncing) return;
  syncing = true; setSync('saving', 'Sincronizando…');
  try {
    const r = await pullRemote();
    const loc = localState();
    let synced = false; try { synced = localStorage.getItem('c201.syncedAs') === auth.login; } catch (e) {}
    if (!r) await pushRemote();
    else if (!synced) {
      // primeira vez desta conta neste aparelho: junta o que havia aqui com o que está no GitHub
      const merged = { done: [...new Set([...(r.done || []), ...loc.done])].sort(), fav: [...new Set([...(r.fav || []), ...loc.fav])].sort(),
        last: Object.assign({}, r.last, loc.last), lastSeen: loc.lastSeen || r.lastSeen || null,
        quiz: Object.assign({}, r.quiz, loc.quiz), updatedAt: Date.now() };
      applyRemote(merged); await pushRemote();
    } else if ((r.updatedAt || 0) > loc.updatedAt) applyRemote(r);
    else if ((r.updatedAt || 0) < loc.updatedAt) await pushRemote();
    try { localStorage.setItem('c201.syncedAs', auth.login); } catch (e) {}
    setSync('ok', OK_TEXT);
  } catch (e) { syncError(e); }
  syncing = false;
}

async function finishLogin(token) {
  auth = { token, login: '', avatar: '', gistId: null };
  const u = await gh('/user');
  auth.login = u.login; auth.avatar = u.avatar_url;
  saveAuth(); renderAccount(); render(); await syncNow();
}

// No navegador o GitHub não permite o login por código, então a pessoa cola um token com permissão "gist".
function startTokenLogin() {
  closeMenu(); window.scrollTo(0, 0);
  const url = 'https://github.com/settings/tokens/new?scopes=gist&description=' + encodeURIComponent('Caderno 201 (navegador)');
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub no navegador</span><h2>Cole um token do GitHub</h2>
    <ol class="steps">
      <li>Clique em <b>Criar token no GitHub</b>. A página já abre com a permissão certa (<b>gist</b>) marcada.</li>
      <li>Em <b>Expiration</b>, escolha <b>No expiration</b> (ou uma data longa).</li>
      <li>Desça até o fim e clique em <b>Generate token</b>. Copie o código que começa com <code>ghp_</code>.</li>
      <li>Cole aqui embaixo e clique em <b>Entrar</b>.</li>
    </ol>
    <div class="search"><input id="tokIn" type="password" placeholder="ghp_…" autocomplete="off" aria-label="Token do GitHub" style="padding-left:12px"></div>
    <p class="exp" id="tokStatus">O token fica guardado só neste navegador e dá acesso apenas aos seus gists, não aos repositórios.</p>
    <div class="sheetfoot"><button class="btn ghost" type="button" id="tokBack">Cancelar</button>
      <div class="nav"><a class="btn ghost" href="${url}" target="_blank" rel="noopener">Criar token no GitHub</a><button class="btn primary" type="button" id="tokGo">Entrar</button></div></div></article>`;
  $('#tokBack').onclick = () => render();
  $('#tokGo').onclick = async () => {
    const t = $('#tokIn').value.trim();
    if (!t) { $('#tokStatus').textContent = 'Cole o token antes de entrar.'; return; }
    $('#tokStatus').textContent = 'Conferindo com o GitHub…';
    try {
      const r = await fetch('https://api.github.com/user', { headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + t }, cache: 'no-store' });
      if (r.status === 401) { $('#tokStatus').textContent = 'O GitHub não aceitou esse token. Confira se copiou inteiro.'; return; }
      const sc = r.headers.get('x-oauth-scopes');
      if (sc !== null && !/\bgist\b/.test(sc)) { $('#tokStatus').textContent = 'Esse token não tem a permissão "gist". Crie outro pelo botão acima.'; return; }
      if (!r.ok) throw new Error(r.status);
      await finishLogin(t);
    } catch (e) { $('#tokStatus').textContent = 'Não consegui falar com o GitHub. Confira a internet e tente de novo.'; }
  };
}

async function startLogin() {
  if (!isNative) { startTokenLogin(); return; }
  if (!CFG.clientId) return;
  const run = ++loginRun;
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Preparando o código…</h2></article>`;
  closeMenu(); window.scrollTo(0, 0);
  let d;
  try {
    const r = await fetch('https://github.com/login/device/code', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify({ client_id: CFG.clientId, scope: 'gist' }) });
    d = await r.json();
    if (!d.user_code) throw new Error(d.error || 'sem código');
  } catch (e) {
    $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Não consegui começar o login</h2>
      <p class="read">${isNative ? 'Confira sua internet e tente de novo.' : 'O login com GitHub funciona no app para Android. No navegador, o progresso fica salvo só neste aparelho.'}</p>
      <div class="sheetfoot"><button class="btn ghost" type="button" id="lgBack">Voltar</button></div></article>`;
    $('#lgBack').onclick = () => render();
    return;
  }
  $('#main').innerHTML = `<article class="sheet"><span class="eyebrow">Entrar com GitHub</span><h2>Digite este código no GitHub</h2>
    <div class="code" id="ucode">${esc(d.user_code)}</div>
    <ol class="steps"><li>Toque em <b>Copiar e abrir o GitHub</b>.</li><li>Cole o código na página que abrir e toque em <b>Continue</b>, depois em <b>Authorize</b>.</li><li>Volte para este app. O login termina sozinho.</li></ol>
    <p class="exp" id="lgStatus">Esperando você autorizar no GitHub…</p>
    <div class="sheetfoot"><button class="btn ghost" type="button" id="lgCancel">Cancelar</button><div class="nav"><button class="btn primary" type="button" id="lgOpen">Copiar e abrir o GitHub</button></div></div></article>`;
  $('#lgCancel').onclick = () => { loginRun++; render(); };
  $('#lgOpen').onclick = async () => {
    try { await navigator.clipboard.writeText(d.user_code); } catch (e) { const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents($('#ucode')); s.removeAllRanges(); s.addRange(rg); }
    openExternal(d.verification_uri || 'https://github.com/login/device');
  };
  let interval = (d.interval || 5) * 1000;
  const until = Date.now() + (d.expires_in || 900) * 1000;
  while (run === loginRun && Date.now() < until) {
    await sleep(interval);
    if (run !== loginRun) return;
    let j;
    try {
      const r = await fetch('https://github.com/login/oauth/access_token', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: CFG.clientId, device_code: d.device_code, grant_type: 'urn:ietf:params:oauth:grant-type:device_code' }) });
      j = await r.json();
    } catch (e) { continue; }
    if (j.access_token) {
      try { await finishLogin(j.access_token); } catch (e) { saveAuth(); renderAccount(); render(); }
      return;
    }
    if (j.error === 'authorization_pending') continue;
    if (j.error === 'slow_down') { interval += 5000; continue; }
    const msg = j.error === 'access_denied' ? 'Você cancelou a autorização no GitHub.' : j.error === 'expired_token' ? 'O código expirou.' : 'O GitHub recusou o login (' + esc(j.error || 'erro') + ').';
    const st = $('#lgStatus'); if (st) st.innerHTML = msg + ' Toque em Cancelar e tente de novo.';
    return;
  }
  const st = $('#lgStatus'); if (st && run === loginRun) st.textContent = 'O código expirou. Toque em Cancelar e tente de novo.';
}
function logout() {
  auth = null; try { localStorage.removeItem('c201.auth'); } catch (e) {}
  renderAccount();
}
$('#loginBtn').onclick = startLogin;
$('#logoutBtn').onclick = () => { logout(); setSync('wait', ''); };
$('#syncBtn').onclick = syncNow;
renderAccount();
if (auth && auth.token) { setSync('ok', OK_TEXT); syncNow(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncNow(); } else if (wt) { clearTimeout(wt); flush(); } });
window.addEventListener('online', () => syncNow());

/* ---------- Atualizações pelo GitHub Releases ---------- */
const cmpVer = (a, b) => { const pa = a.split('.').map(Number), pb = b.split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; } return 0; };
$('#appVer').textContent = APP_VERSION === 'dev' ? 'web' : 'v' + APP_VERSION;
let toastT;
function toast(msg) { const e = $('#toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 4200); }
// k: idle | busy | ok | new | err
let upd = { k: 'idle', msg: '', latest: '', apkUrl: '', page: '', notes: '', err: '', at: 0 };
function renderUpd() {
  const hasNew = upd.k === 'new';
  ['#cfgDot', '#cfgDot2'].forEach(s => { const e = $(s); if (e) e.hidden = !hasNew; });
  const el = $('#updCard'); if (!el) return;
  const ic = { idle: 'i', busy: '<span class="spin">↻</span>', ok: '✓', new: '↓', err: '!' }[upd.k];
  const ver = APP_VERSION === 'dev' ? 'web' : APP_VERSION;
  const when = upd.at ? ` Verificado às ${new Date(upd.at).toTimeString().slice(0, 5)}.` : '';
  let status;
  if (!isNative) status = `<div class="status" data-k="ok"><span class="ic">✓</span><div>Você está usando a versão web, que é sempre a mais recente.${CFG.repo ? ` Para instalar o app no Android, <a href="https://github.com/${esc(CFG.repo)}/releases/latest" target="_blank" rel="noopener" style="color:var(--accent)">baixe o APK</a>.` : ''}</div></div>`;
  else status = `<div class="status" data-k="${upd.k}"><span class="ic">${ic}</span><div>${esc(upd.msg || 'Toque em "Procurar atualização" para ver se há uma versão nova.')}${upd.k === 'ok' || upd.k === 'new' ? esc(when) : ''}
    ${upd.k === 'new' && upd.notes ? `<pre>${esc(upd.notes)}</pre>` : ''}${upd.k === 'err' && upd.err ? `<pre>${esc(upd.err)}</pre>` : ''}</div></div>`;
  el.innerHTML = `<div class="row2"><span>Versão instalada</span><b>${esc(ver)}</b></div>${status}
    ${isNative ? `<div class="btnrow"><button class="btn ${hasNew ? 'ghost' : 'primary'}" type="button" id="updCheck" ${upd.k === 'busy' ? 'disabled' : ''}>${upd.k === 'busy' ? 'Procurando…' : 'Procurar atualização'}</button>
      ${hasNew ? '<button class="btn primary" type="button" id="updGet">Baixar e instalar</button>' : ''}
      ${hasNew && upd.page ? '<button class="btn ghost" type="button" id="updPage">Abrir página da versão</button>' : ''}</div>
      ${hasNew ? '<p>Depois de baixar, abra o arquivo e toque em Instalar. Seu progresso continua.</p>' : ''}` : ''}`;
  const c = $('#updCheck'); if (c) c.onclick = () => checkUpdate(true);
  const g = $('#updGet'); if (g) g.onclick = () => { openExternal(upd.apkUrl); toast('Baixando… abra o arquivo quando terminar.'); };
  const p = $('#updPage'); if (p) p.onclick = () => openExternal(upd.page);
}
async function fetchRelease() {
  const url = `https://api.github.com/repos/${CFG.repo}/releases/latest`, hdr = { 'Accept': 'application/vnd.github+json' };
  try {
    const ctl = window.AbortController ? new AbortController() : null;
    const t = setTimeout(() => ctl && ctl.abort(), 15000);
    try {
      const r = await fetch(url, { headers: hdr, cache: 'no-store', signal: ctl ? ctl.signal : undefined });
      return { status: r.status, data: r.ok ? await r.json() : null };
    } finally { clearTimeout(t); }
  } catch (e) {
    // plano B no app: usa direto o plugin de rede do Capacitor
    const H = CAP && CAP.Plugins && CAP.Plugins.CapacitorHttp;
    if (isNative && H && H.get) { const r = await H.get({ url, headers: hdr }); return { status: r.status, data: r.status === 200 ? r.data : null }; }
    throw e;
  }
}
async function checkUpdate(manual) {
  if (upd.k === 'busy') return;
  if (!CFG.repo) { upd = { ...upd, k: 'err', msg: 'Repositório não configurado.' }; renderUpd(); return; }
  const before = upd; upd = { ...upd, k: 'busy', msg: 'Procurando versão nova…', err: '' }; renderUpd();
  try {
    const r = await fetchRelease();
    if (r.status === 404) upd = { k: 'ok', msg: 'Nenhuma versão publicada ainda.', at: Date.now() };
    else if (!r.data) throw new Error('O GitHub respondeu com o código ' + r.status);
    else {
      const rel = r.data, latest = String(rel.tag_name || '').replace(/^v/, '');
      const apk = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
      if (APP_VERSION !== 'dev' && latest && apk && cmpVer(latest, APP_VERSION) > 0)
        upd = { k: 'new', msg: `Versão ${latest} disponível (você tem a ${APP_VERSION}).`, latest, apkUrl: apk.browser_download_url, page: rel.html_url || '', notes: String(rel.body || '').trim().slice(0, 600), at: Date.now() };
      else upd = { k: 'ok', msg: `Você já está na versão mais recente (${APP_VERSION}).`, at: Date.now() };
    }
  } catch (e) {
    upd = { k: 'err', msg: 'Não consegui verificar agora. Confira a internet e tente de novo.', err: String((e && e.message) || e), at: 0 };
    if (!manual) upd = before.k === 'busy' ? { ...before, k: 'idle' } : before;
  }
  renderUpd();
  if (manual) toast(upd.msg);
}
if (isNative) checkUpdate(false);
renderUpd();

/* deslizar para os lados troca de tópico (sem marcar como estudado) */
let tx = 0, ty = 0;
$('#main').addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
$('#main').addEventListener('touchend', e => {
  if (!BY[route.v] || route.t === 'quiz' || e.target.closest('.tbl, input, textarea')) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 90 || Math.abs(dx) < Math.abs(dy) * 2) return;
  const m = BY[route.v], ti = last[route.v] ?? 0;
  if (dx < 0 && ti < m.topics.length - 1) go(route.v, ti + 1);
  else if (dx > 0 && ti > 0) go(route.v, ti - 1);
}, { passive: true });
